<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="俄巴底亚书讲义">
<meta name="application-name" content="俄巴底亚书讲义">
<meta name="description" content="俄巴底亚书讲义：全书一章逐节原文解经、讲章逐字稿、教学讲章与321生命应用。">
<title>俄巴底亚书讲义</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 页首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分页 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形图（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清单 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 经文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六层 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 轨迹 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 争议 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分级 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屉 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教学讲义逐字稿（长文阅读）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起来的一问一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三个化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全荧幕模式（讲台／小组）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提词机 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小组 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜寻 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌与启动画面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 画线与领受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗读的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}
.mkp.hl[data-c="brown"]{background:linear-gradient(transparent 62%, var(--hl-brown) 62%)}
.mkp.hl[data-c="charcoal"]{background:linear-gradient(transparent 62%, var(--hl-charcoal) 62%)}
.mknote{display:block}
.mknote{
  border-left:3px solid var(--brass);background:rgba(156,107,24,.08);
  border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0 12px;font-size:calc(var(--fs) * .85);line-height:1.8
}
.mknote[data-c="green"]{border-left-color:var(--hb-green)}

window.__booted = false;
function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);
    else go();
  } catch(e){ go(); }
  function go(){
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => {
        Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
      }).catch(() => location.reload(true));
    else location.reload(true);
  }
}

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"國度就歸耶和華了","sub":"高、兄、國","lv":"A","arc":"高・兄・國","sec":[["1:1--2","聽見信息：起來吧，一同起來與以東爭戰"],["1:3--4","高處的驕傲：誰能將我拉下地去呢"],["1:5--9","隱密處被搜尋：盟友變仇敵，智慧人與勇士都被除滅"],["1:10--14","你不當站在一旁：兄弟遭難的日子"],["1:15--16","耶和華降罰的日子：你怎樣行，他也必照樣向你行"],["1:17--21","錫安山有逃脫的人：國度就歸耶和華了"]],"serm":{"pts":[["你心裡驕傲","1:1--9","誰能將我拉下地去呢"],["你不當站在一旁","1:10--14","你竟站在一旁"],["國度就歸耶和華了","1:15--21","國度就歸耶和華了"]]},"q":"「我只是站在旁邊，我又沒有做甚麼。」這句話，我們都說過，也都被人這樣對待過。兄弟遭難那一天，有人伸手，有人轉頭，有人站在一旁。俄巴底亞書只有一章，卻回答了這個最痛的問題：站在一旁，算不算有份？神的回答分三步：先說驕傲的人心裡說「誰能將我拉下地去」，再說「你竟站在一旁，像與他們同夥」，最後說：「國度就歸耶和華了」。結局不是誰報了仇，是誰是王。","truth":"高處不是保障，旁觀不是中立；神把驕傲的人從高處拉下，把站在一旁的人算作同夥，最後把國度收回自己手裡。","mv":{"t":"必有拯救者上到錫安山，審判以掃山；國度就歸耶和華了。","r":"俄巴底亞書1:21"},"card":["俄巴底亞書只有一章，分三步。1--9節：住在山穴高處、心裡說「誰能將我拉下地去」的以東，被神從那裡拉下來。10--14節：理由是他向兄弟雅各行強暴，遭難的日子站在一旁，像與他們同夥（八個「不當」）。15--21節：耶和華的日子臨近，你怎樣行必照樣受報；錫安山有逃脫的人；最後一句：國度就歸耶和華了。","高處不是保障，旁觀不是中立；結局的主詞，是耶和華（1:3--4；1:11；1:21）。","恩典在這一章是「上去」：驕傲的被拉下，而拯救者「上到錫安山」；逃脫的人有出路（1:17），因為有一位先為我們伸了手。","無己，是不再說「誰能將我拉下去」，而是在高處對神說：「主啊，我的安全是你」；也是不再站在一旁，願意為兄弟伸手。","「你不必住在高處保護自己，也不必站在一旁看別人。回到你的本位，國度是我的。」","這一週，想一位正在遭難的人，今天做一件小事：一通電話、一句問候，或三分鐘的禱告。不站在一旁。","最終整合：\n有一個人，住在山穴裡。\n居所在高處。\n他心裡說：\n誰能將我拉下地去呢？\n\n神說：\n我必從那裡，拉下你來。\n\n他的兄弟遭難那一天，\n他沒有拿刀，\n沒有進城。\n他只是，站在一旁。\n神說：像與他們同夥。\n\n於是「日子」換了主人。\n不再是兄弟的日子，\n是耶和華的日子。\n\n可是這卷書的最後，\n不是刀，\n不是勝利的歌。\n\n是一句歸屬：\n國度，就歸耶和華了。\n\n這就是無己。\n不抓高處，不站旁邊，\n讓耶穌作王，\n讓耶穌得著一切的榮耀。"],"self":"驕傲的定義：離開人的本位，抓住神的權力，想要代替神。俄巴底亞書的驕傲，是住在高處、心裡說「誰能將我拉下地去」：把自己當成自己的保障，也把兄弟放在自己的山後面。","t321":{"k":"耶穌在我們遭難的日子，沒有站在一旁。\\ > 祂從天上下來，進了我們的城門，站在我們這一邊（腓 2:6--8）。\\ > 祂是我們的榜樣：先伸手，後問理由。","g":"讓耶穌作王，是把「我的高處」交給祂（1:3--4）。\\ > 我的職位、積蓄、人脈、資歷，都放回祂的手裡。\\ > 祂作王，我不必自己保護自己，也不必為了自保而站在一旁。","p":"屬神的體系，是一群在彼此遭難的日子伸手的兄弟（1:10--14）。\\ > 神的國度不靠山頭、盟約或疆界立根基（1:7；1:21）。\\ > 我們一同回到本位，讓王作王：這是從生命、關係開始的更新。"},"grp":["【一、破冰】說一個你小時候最想住進去的「高處」（樹屋、頂樓、山上、被窩……）。為甚麼是那裡？","【二、扎心】1:3 以東心裡說：「誰能將我拉下地去呢？」你心裡的「山穴」是甚麼（職位、存款、人脈、屬靈資歷）？只說名稱，不必細節。","【三、福音】1:17「在錫安山必有逃脫的人」。你有沒有一次，是被人伸手拉出來的？那個人是誰？你今天怎麼對祂說謝謝？","【四、行動】1:10--14 有八個「不當」。想一位正在遭難的人，這一週你要用「看、說、走」其中哪一個，向他靠近一步？當場說出名字與時間。（920：他就是你的那個「2」）","【五、代禱】請為每一位曾被人旁觀、被人遺棄的人禱告。有被背叛、被遺棄經歷的人，不需要分享細節，也不需要被要求原諒或堅強。"],"prac":{"main":"這一週，想一位正在遭難的弟兄姊妹，不站在一旁：打一通電話、傳一句問候，或為他禱告三分鐘。","items":["對神：這一週，每天睡前用一分鐘對神說：「主啊，我的安全是你。」","對自己：寫下你的「山穴」是甚麼（職位、存款、人脈、資歷），在旁邊寫一句：「這不是我的神。」","對人：想一位正在遭難的人，今天伸手一次，不問理由。","對生活：看見別人跌倒時，先停一秒，不說「活該」；把這句話換成一句問候。","對使命：在服事中，不用「我們這邊、他們那邊」看人；先看他是兄弟。"]},"safe":["① 把「以東」等同今日某個族群或國家","經文的以東是以掃的後裔，是歷史中的一個民族，也是「驕傲且旁觀」的畫像。","檢驗標準：講章有沒有點名任何現代族群或國家？有，就刪。","② 用 15 節「你怎樣行，他也必照樣向你行」合理化報復","這句話的主詞是耶和華，不是受害者。","檢驗標準：受傷的人聽完，是得到安息，還是得到一把武器？","③ 拿 17--21 節作現代領土或政治主張的根據","這幾節是對被擄之民的安慰。","檢驗標準：講章有沒有把任何地名對到今天的國家或地區？有，就刪。","④ 排時間表、算日子：把「到那日」「耶和華的日子」排進末世日程","經文只說「臨近」。","檢驗標準：講章有沒有出現日期、年份、預測？有，就刪。","⑤ 用「站在一旁」羞辱受創傷、無力、也在逃命的人","11--14 節對的是有能力而不作為、甚至趁機得利的人。","檢驗標準：聽的人裡若有被遺棄過、或自己也無力的人，聽完是被指責，還是被理解？","⑥ 把「站在一旁」講成「不幫忙的人都是同夥」，要人背起所有人的苦難","經文沒有這樣說。","檢驗標準：講章有沒有分辨「有能力而不作為、趁機得利」與「無力、自己也在逃」？","⑦ 把審判講成恐嚇，要人因怕而順服","這卷書先是寫給受傷者的安慰。","檢驗標準：聽完是更愛主、更靠近受難的人，還是更怕世界、更恨敵人？","⑧ 把「雅各家是火、以掃家是碎稭」讀成「我們這一邊贏」","18 節要連同 10--14 節的理由一起讀。","檢驗標準：講章有沒有同時承認「我們」也可能站在以東那一側？","⑨ 把作者、年代、與耶利米書 49 章的關係，講成必須先裁判才能領受","這些議題並陳各家即可。","檢驗標準：聽眾有沒有被告知「不用先解決它們，也可以讀這卷書」？","⑩ 把 16 節的「杯」與「猶大人」當成原文本有的字","這兩個詞是和合本按上下文加的。","檢驗標準：講章有沒有交代，並說明另有不同讀法？","⑪ 把 21 節的「拯救者」直接說成「這是預言基督」","原文是複數，新約也沒有直接引用這節。","檢驗標準：講章用的是「這使我們想起」，還是「這就是預表」？","⑫ 用羅 9:13 把「以掃與雅各」簡化成「神恨惡某些人」","這裡有不同讀法，需要並陳。","檢驗標準：講章有沒有對任何人說「你被神恨惡」？有，就刪。","⑬ 把「無己」講成人必須靠自己做到，卻忘了耶穌先伸手","","檢驗標準：講章有沒有先說福音（祂先為我們伸手），再說我們的回應？"]}],"txt":{"1":["俄巴底亞得了耶和華的默示。論以東說：我從耶和華那裡聽見信息，並有使者被差往列國去，說：起來吧，一同起來與以東爭戰！","我使你－以東在列國中為最小的，被人大大藐視。","住在山穴中、居所在高處的啊，你因狂傲自欺，心裡說：誰能將我拉下地去呢？","你雖如大鷹高飛，在星宿之間搭窩，我必從那裡拉下你來。這是耶和華說的。","盜賊若來在你那裡，或強盜夜間而來－你何竟被剪除－豈不偷竊直到夠了呢？摘葡萄的若來到你那裡，豈不剩下些葡萄呢？","以掃的隱密處何竟被搜尋？他隱藏的寶物何竟被查出？","與你結盟的都送你上路，直到交界；與你和好的欺騙你，且勝過你；與你一同吃飯的設下網羅陷害你；在你心裡毫無聰明。","耶和華說：到那日，我豈不從以東除滅智慧人？從以掃山除滅聰明人？","提幔哪，你的勇士必驚惶，甚至以掃山的人都被殺戮剪除。","因你向兄弟雅各行強暴，羞愧必遮蓋你，你也必永遠斷絕。","當外人擄掠雅各的財物，外邦人進入他的城門，為耶路撒冷拈鬮的日子，你竟站在一旁，像與他們同夥。","你兄弟遭難的日子，你不當瞪眼看著；猶大人被滅的日子，你不當因此歡樂；他們遭難的日子，你不當說狂傲的話。","我民遭災的日子，你不當進他們的城門；他們遭災的日子，你不當瞪眼看著他們受苦；他們遭災的日子，你不當伸手搶他們的財物；","你不當站在岔路口剪除他們中間逃脫的；他們遭難的日子，你不當將他們剩下的人交付仇敵。","耶和華降罰的日子臨近萬國。你怎樣行，他也必照樣向你行；你的報應必歸到你頭上。","你們猶大人在我聖山怎樣喝了苦杯，萬國也必照樣常常地喝；且喝且咽，他們就歸於無有。","在錫安山必有逃脫的人，那山也必成聖；雅各家必得原有的產業。","雅各家必成為大火；約瑟家必為火焰；以掃家必如碎稭；火必將他燒著吞滅。以掃家必無餘剩的。這是耶和華說的。","南地的人必得以掃山；高原的人必得非利士地，也得以法蓮地和撒馬利亞地；便雅憫人必得基列。","在迦南人中被擄的以色列眾人必得地直到撒勒法；在西法拉中被擄的耶路撒冷人必得南地的城邑。","必有拯救者上到錫安山，審判以掃山；國度就歸耶和華了。"]},"blk":{"1":[{"a":1,"z":2,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>חֲז֖וֹן עֹֽבַדְיָ֑ה כֹּֽה אָמַר֩ אֲדֹנָ֨י יְהוִ֜ה לֶאֱד֗וֹם שְׁמוּעָ֨ה שָׁמַ֜עְנוּ מֵאֵ֤ת יְהוָה֙ וְצִיר֙ בַּגּוֹיִ֣ם שֻׁלָּ֔ח ק֛וּמוּ וְנָק֥וּמָה עָלֶיהָ לַמִּלְחָמָֽה הִנֵּ֥ה קָטֹ֛ן נְתַתִּ֖יךָ בַּגּוֹיִ֑ם בָּז֥וּי אַתָּ֖ה מְאֹֽד<\/p><\/blockquote>","lit":"<blockquote><p>「俄巴底亞的異象。主耶和華論以東這樣說：我們從耶和華那裡聽見了一個信息；有一位使者被差往列國：『起來！我們起來攻擊她，與她爭戰！』看哪，我使你在列國中成為最小的；你被大大藐視。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>默示<\/td><td>חֲזוֹן<\/td><td>chazon<\/td><td>H2377<\/td><td>√חזה（看見）<\/td><td>異象、所看見的<\/td><td>★ 不是傳聞，是被叫去「看見」<\/td><\/tr><tr><td>俄巴底亞<\/td><td>עֹבַדְיָה<\/td><td>‘ovadyah<\/td><td>H5662<\/td><td>עֶבֶד（僕人）＋ יָהּ（耶和華）<\/td><td>耶和華的僕人<\/td><td>全書作者只留下這個名字<\/td><\/tr><tr><td>信息<\/td><td>שְׁמוּעָה<\/td><td>shemu‘ah<\/td><td>H8052<\/td><td>√שׁמע（聽）<\/td><td>所聽見的、消息<\/td><td>聽見在先，說話在後<\/td><\/tr><tr><td>使者<\/td><td>צִיר<\/td><td>tsir<\/td><td>H6735<\/td><td>—<\/td><td>使者、傳令的<\/td><td>被差往列國，要召集他們<\/td><\/tr><tr><td>起來<\/td><td>קוּמוּ<\/td><td>qumu<\/td><td>H6965<\/td><td>√קום（起來）<\/td><td>起來（命令式複數）<\/td><td>全章第一個動作，是往上<\/td><\/tr><tr><td>最小<\/td><td>קָטֹן<\/td><td>qaton<\/td><td>H6996<\/td><td>—<\/td><td>小的、微不足道的<\/td><td>神先改的是位置：從列國中的高處，變成最小<\/td><\/tr><tr><td>藐視<\/td><td>בָּזוּי<\/td><td>bazuy<\/td><td>H959<\/td><td>√בזה（輕視）<\/td><td>被輕看的<\/td><td>被動的狀態：這是神所定的結果<\/td><\/tr><\/table>","gram":"<p><strong>① 「我從耶和華那裡聽見信息」——是「我」，還是「我們」？<\/strong><\/p><ul><li>原文 שָׁמַעְנוּ 是<strong>第一人稱複數<\/strong>：「我們聽見了」<\/li><li>和合本譯成單數「我」；耶利米書 49:14 幾乎同一句，原文是單數「我聽見」<\/li><\/ul><p>有人認為「我們」是先知與同聽神話的群體；有人認為是先知書裡常見的口吻；也有人注意到，下一句「起來，我們起來」（וְנָקוּמָה）同樣是「我們」，連成一個聲音。<\/p><p><strong>② 這一句與耶利米書 49 章是甚麼關係？<\/strong>三種讀法：俄巴底亞引用耶利米；耶利米引用俄巴底亞；兩者引用更早的同一個神諭。本講義不裁判（見議題），因為不論先後，這一句都是神的話。<\/p><blockquote><p><strong>最好的理解：<\/strong>這是一句被先知群體共同聽見、共同傳下去的信息。和合本把「主耶和華如此說」濃縮成「論以東說」，意思沒有少。<\/p><\/blockquote>","exp":"<p><strong>全書最短的履歷：一個名字，一個「看見」。<\/strong><\/p><p>舊約有些先知，我們知道他的父親、家鄉，知道他在哪一個王的時候開口。俄巴底亞甚麼都沒有留下，沒有年代，沒有家譜，沒有故事，只有一個名字：俄巴底亞，意思是「耶和華的僕人」。<\/p><p>一個人一生的履歷，縮成兩個字：僕人。這大概是聖經裡最短的一份自傳。<\/p><p>他說他「得了默示」。原文 חָזוֹן 是「看見」：他不是聽人轉述，是被叫去看。他說「我們從耶和華那裡聽見信息」：聽見的，不只他一個人。使者已經被差往列國，說：起來吧，一同起來！<\/p><p>注意這個畫面。審判的第一步，神不是在天上打一個雷，而是差使者去召列國。以東所倚靠的鄰國、盟友、夥伴，現在一起站起來。第 2 節神親口說：「我使你在列國中為最小的。」不是「我要使」，是「我使」，好像在神那裡，事情已經定了。<\/p><p>以東最看重的是甚麼？是自己的位置。這一節先把位置拿走：最小，被人大大藐視。<\/p><p>落地：我們這一生最怕的，常常是被人看小。可是神改變一個人，往往從「位置」開始。一個無己的人，不必等到被人藐視才學會謙卑，他願意現在就站在「僕人」這個位置上。<\/p>"},{"a":3,"z":4,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>זְד֤וֹן לִבְּךָ֙ הִשִּׁיאֶ֔ךָ שֹׁכְנִ֥י בְחַגְוֵי סֶּ֖לַע מְר֣וֹם שִׁבְתּ֑וֹ אֹמֵ֣ר בְּלִבּ֔וֹ מִ֥י יוֹרִדֵ֖נִי אָֽרֶץ אִם תַּגְבִּ֣יהַּ כַּנֶּ֔שֶׁר וְאִם בֵּ֥ין כּֽוֹכָבִ֖ים שִׂ֣ים קִנֶּ֑ךָ מִשָּׁ֥ם אוֹרִֽידְךָ֖ נְאֻם יְהוָֽה<\/p><\/blockquote>","lit":"<blockquote><p>「你心裡的狂傲欺騙了你，你這住在岩縫中、居所在高處的，心裡說：『誰能把我拉下地去？』你即使像鷹一樣高飛，即使把窩安在星宿之間，我也要從那裡把你拉下來。這是耶和華的宣告。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>狂傲<\/td><td>זְדוֹן<\/td><td>zadon<\/td><td>H2087<\/td><td>—<\/td><td>狂妄、放肆<\/td><td>★ 驕傲的名字：它住在「心」裡<\/td><\/tr><tr><td>心<\/td><td>לִבְּךָ<\/td><td>libbekha<\/td><td>H3820<\/td><td>—<\/td><td>心、內在的人<\/td><td>先是「你的心」，後是「他心裡說」<\/td><\/tr><tr><td>自欺<\/td><td>הִשִּׁיאֶךָ<\/td><td>hisshi’ekha<\/td><td>H5377<\/td><td>√נשׁא（欺騙，使動式）<\/td><td>使你受騙<\/td><td>同一個動詞，7 節又出現一次<\/td><\/tr><tr><td>岩縫<\/td><td>חַגְוֵי<\/td><td>chagve<\/td><td>H2288<\/td><td>—<\/td><td>裂縫、石穴<\/td><td>以東的山地天然是堡壘<\/td><\/tr><tr><td>高處<\/td><td>מְרוֹם<\/td><td>marom<\/td><td>H4791<\/td><td>√רום（高）<\/td><td>高處、高位<\/td><td>居所在「高處」：這是他的安全感<\/td><\/tr><tr><td>拉下<\/td><td>יוֹרִדֵנִי<\/td><td>yoridheni<\/td><td>H3381<\/td><td>√ירד（下去）<\/td><td>使下去（使動式）<\/td><td>「誰能使我下去」<\/td><\/tr><tr><td>高飛<\/td><td>תַּגְבִּיהַּ<\/td><td>tagbiah<\/td><td>H1361<\/td><td>√גבה（高）<\/td><td>使自己升高<\/td><td>就算像鷹升到最高<\/td><\/tr><tr><td>星宿<\/td><td>כּוֹכָבִים<\/td><td>kokhavim<\/td><td>H3556<\/td><td>—<\/td><td>星辰<\/td><td>在星宿之間搭窩：連天也不放在眼裡<\/td><\/tr><\/table>","gram":"<p><strong>① 「心裡說」是甚麼意思？<\/strong><\/p><ul><li>「心裡說」（אֹמֵר בְּלִבּוֹ）在聖經裡是一種說話方式：不是對人說，是一個人<strong>對自己的信念<\/strong><\/li><li>詩 14:1「愚頑人心裡說：沒有神」，賽 47:8 與番 2:15「惟有我，除我以外再沒有別的」，都是同一類<\/li><\/ul><p>以東的這句話，像是把自己放在神的位置：沒有人搆得到我。結尾的疑問句「誰能……呢」，是不需要答案的反問，答案他早已替自己答了：沒有人。<\/p><p><strong>② 人稱忽然換了。<\/strong>3 節前半是「你」，後半變成「他」（שִׁבְתּוֹ、בְּלִבּוֹ）。有人看成一種修辭：神轉過頭，讓列國聽見這個人心裡的話。<\/p><p><strong>③ 「山穴」是哪裡？<\/strong>原文是「岩石的裂縫」（סֶלַע 就是「磐石」）。王下 14:7 提到一座以東的城叫「西拉」，原文是同一個字；有人認為這裡暗指它，有人認為只是指以東的岩山地帶。<\/p><blockquote><p><strong>最好的理解：<\/strong>地勢只是舞台，重點在 3 節第一句：「你心裡狂傲欺騙了你」——騙他的不是敵人，是他自己的心。<\/p><\/blockquote>","exp":"<p><strong>「誰能將我拉下地去呢？」——這一句話，是一個人心裡最完整的自述。<\/strong><\/p><p>先看他住的地方：岩縫，山穴，居所在高處。以東的地勢天然是堡壘：岩石陡峭，通路窄，攻上來的人要一個一個爬。從那裡往下看，所有人都小。<\/p><p>可是神說，他的問題不在地勢，在「心」。<\/p><p>原文說：「你心裡的狂傲欺騙了你」（זְדוֹן לִבְּךָ הִשִּׁיאֶךָ）。騙他的不是敵人，是他自己的心。驕傲有一個特別的本事：它先說服自己，再說服別人。住得越高，越相信這裡沒有人拉得下來。<\/p><p>他的心裡話只有一句：「誰能將我拉下地去呢？」這是問句，卻不需要答案，因為他已經替自己答了：沒有人。<\/p><p>神的回答也只有一句：「我必從那裡拉下你來。」「那裡」，就是他最安全的地方。你就是像大鷹高飛，在星宿之間搭窩，那裡也不是神搆不到的。<\/p><p>注意動詞：以東問的是「誰能使我下去」，神用<strong>同一個動詞<\/strong>（יָרַד）回答他。神不是另外找一套話來反駁，祂把他的話原樣還給他。<\/p><p>落地：每個人心裡都有一個「高處」：我的職位、我的積蓄、我的人脈、我的屬靈資歷。人不是被高處毀的，是被那一句「沒有人能拉下我」毀的。驕傲，就是離開人的本位，抓住神才有的穩固；謙卑，是把這個位置還給神：讓人作人，讓神作神。<\/p>"},{"a":5,"z":7,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אִם גַּנָּבִ֤ים בָּאֽוּ לְךָ֙ אִם שׁ֣וֹדְדֵי לַ֔יְלָה אֵ֣יךְ נִדְמֵ֔יתָה הֲל֥וֹא יִגְנְב֖וּ דַּיָּ֑ם אִם בֹּֽצְרִים֙ בָּ֣אוּ לָ֔ךְ הֲל֖וֹא יַשְׁאִ֥ירוּ עֹלֵלֽוֹת אֵ֚יךְ נֶחְפְּשׂ֣וּ עֵשָׂ֔ו נִבְע֖וּ מַצְפֻּנָֽיו עַֽד הַגְּב֣וּל שִׁלְּח֗וּךָ כֹּ֚ל אַנְשֵׁ֣י בְרִיתֶ֔ךָ הִשִּׁיא֛וּךָ יָכְל֥וּ לְךָ֖ אַנְשֵׁ֣י שְׁלֹמֶ֑ךָ לַחְמְךָ֗ יָשִׂ֤ימוּ מָזוֹר֙ תַּחְתֶּ֔יךָ אֵ֥ין תְּבוּנָ֖ה בּֽוֹ<\/p><\/blockquote>","lit":"<blockquote><p>「若賊來到你那裡，若夜間的搶掠者來——你何竟被毀滅！——他們不是偷到夠了就停嗎？若摘葡萄的來到你那裡，不是會留下些葡萄嗎？以掃何竟被搜遍，他隱藏的寶物何竟被翻出！所有與你立約的人都把你送到邊界；與你和好的人欺騙你，勝過你；吃你餅的人在你下面設了陷阱；他裡面沒有聰明。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>剪除<\/td><td>נִדְמֵיתָה<\/td><td>nidmeita<\/td><td>H1820<\/td><td>√דמה（滅絕）<\/td><td>被毀滅、被剪除<\/td><td>連說話的人也忍不住驚呼<\/td><\/tr><tr><td>夠了<\/td><td>דַּיָּם<\/td><td>dayyam<\/td><td>H1767<\/td><td>—<\/td><td>他們所需要的<\/td><td>賊也有個限度：偷到夠了就停<\/td><\/tr><tr><td>搜尋<\/td><td>נֶחְפְּשׂוּ<\/td><td>nechpesu<\/td><td>H2664<\/td><td>√חפשׂ（搜）<\/td><td>被搜遍（被動）<\/td><td>以掃的每個角落都被查過<\/td><\/tr><tr><td>隱密處<\/td><td>מַצְפֻּנָיו<\/td><td>matspunav<\/td><td>H4710<\/td><td>√צפן（隱藏）<\/td><td>隱藏的寶物<\/td><td>以為最安全的，也被翻出來<\/td><\/tr><tr><td>盟友<\/td><td>אַנְשֵׁי בְרִיתֶךָ<\/td><td>anshe veritekha<\/td><td>H376、H1285<\/td><td>—<\/td><td>與你立約的人<\/td><td>結盟的人，是最後送你上路的<\/td><\/tr><tr><td>欺騙<\/td><td>הִשִּׁיאוּךָ<\/td><td>hisshi’ukha<\/td><td>H5377<\/td><td>√נשׁא（欺騙，使動式）<\/td><td>使你受騙<\/td><td>與 3 節是同一個動詞<\/td><\/tr><tr><td>網羅<\/td><td>מָזוֹר<\/td><td>mazor<\/td><td>H4204<\/td><td>—<\/td><td>陷阱（意思有爭議）<\/td><td>吃你餅的人，設在你下面<\/td><\/tr><tr><td>聰明<\/td><td>תְּבוּנָה<\/td><td>tevunah<\/td><td>H8394<\/td><td>√בין（明白）<\/td><td>聰明、辨別力<\/td><td>「在他裡面毫無聰明」<\/td><\/tr><\/table>","gram":"<p><strong>① 5 節的兩個問句，期待的答案是甚麼？<\/strong><\/p><ul><li>「豈不偷竊直到夠了呢？」「豈不剩下些葡萄呢？」兩個問句都期待「是的」<\/li><li>摘葡萄的人照習慣會留下落穗（利 19:10；申 24:21），賊也只偷夠用的<\/li><\/ul><p>以東的情形卻是連「夠了」「剩下」都沒有。耶利米書 49:9 有相近的比喻，次序與措詞略有不同。<\/p><p><strong>② 7 節的 מָזוֹר 是甚麼？<\/strong>這個字的意思不確定：<\/p><ul><li><strong>網羅、陷阱<\/strong>：和合本與多數現代譯本<\/li><li><strong>傷口<\/strong>：古英文譯本（KJV）的讀法，這個字在其他地方多與「傷口、藥膏」有關<\/li><\/ul><p>另外，「吃你餅的」原文只說「你的餅」（לַחְמְךָ），指與你同桌的人。詩 41:9 也有同一種痛：「我所倚靠、吃過我飯的，也用腳踢我。」<\/p><blockquote><p><strong>最好的理解：<\/strong>網羅與傷口，兩者都在說同一件事：最親近的人背叛了你。意思清楚，不必在這個字上停太久。<\/p><\/blockquote>","exp":"<p><strong>賊來了還會留一點；以東，連藏起來的也被搜出來。<\/strong><\/p><p>5 節先打了兩個比方。夜裡的盜賊來偷東西，偷夠了就走。摘葡萄的人來到園子，總會剩下些落穗。這是人世間的常情：連壞人也有個限度。<\/p><p>以東卻不是這樣。「你何竟被剪除！」這句話插在句子中間，像說話的人忍不住驚呼。6 節接著說：以掃的隱密處被搜尋，藏起來的寶物被查出。他以為最安全的地方，也被翻出來。<\/p><p>然後 7 節是最痛的一句。搜他、騙他的，不是陌生人，是與他結盟的、與他和好的、與他一同吃飯的。送你上路的人，把你送到邊界，然後在邊界翻臉。<\/p><p>原文有一個字很有意思：欺騙（הִשִּׁיא）。第 3 節說你的心把你「騙」了，這裡說你的盟友把你「騙」了。同一個動詞。先騙你的，是你自己的心；後來騙你的，是你以為靠得住的人。心已經先把你送上高處，盟友只是在邊界把梯子抽走。<\/p><p>最後一句：「在你心裡毫無聰明。」以東是以智慧出名的地方（耶 49:7）。對這樣的人，這是最重的一句判詞。<\/p><p>落地：我們很容易把「安全」押在別人身上：靠山、人脈、盟約。這些不是不能有，可是它們不是神。凡是被我們當成最後保障的，有一天都可能在邊界轉身。<\/p>"},{"a":8,"z":9,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הֲל֛וֹא בַּיּ֥וֹם הַה֖וּא נְאֻם יְהוָ֑ה וְהַאֲבַדְתִּ֤י חֲכָמִים֙ מֵֽאֱד֔וֹם וּתְבוּנָ֖ה מֵהַ֥ר עֵשָֽׂו וְחַתּ֥וּ גִבּוֹרֶ֖יךָ תֵּימָ֑ן לְמַ֧עַן יִכָּֽרֶת אִ֛ישׁ מֵהַ֥ר עֵשָׂ֖ו מִקָּֽטֶל<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華宣告：在那日，我不是要從以東除滅智慧人，從以掃山除滅聰明嗎？提幔啊，你的勇士要驚惶，使以掃山的每一個人都因殺戮被剪除。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>那日<\/td><td>יּוֹם<\/td><td>yom<\/td><td>H3117<\/td><td>—<\/td><td>日子<\/td><td>「到那日」：神的日子第一次出現<\/td><\/tr><tr><td>除滅<\/td><td>הַאֲבַדְתִּי<\/td><td>ha’avadti<\/td><td>H6<\/td><td>—<\/td><td>使滅亡（使動式）<\/td><td>主詞是神：「我」要除滅<\/td><\/tr><tr><td>智慧人<\/td><td>חֲכָמִים<\/td><td>chakhamim<\/td><td>H2450<\/td><td>√חכם（有智慧）<\/td><td>智慧人（複數）<\/td><td>以東以智慧出名<\/td><\/tr><tr><td>提幔<\/td><td>תֵּימָן<\/td><td>teman<\/td><td>H8487<\/td><td>—<\/td><td>提幔（以東地區名；也有「南方」之意）<\/td><td>以利法的家鄉（創 36:11；伯 2:11）<\/td><\/tr><tr><td>勇士<\/td><td>גִבּוֹרֶיךָ<\/td><td>gibborekha<\/td><td>H1368<\/td><td>√גבר（強壯）<\/td><td>勇士<\/td><td>與智慧人相對：一個管腦，一個管手<\/td><\/tr><tr><td>驚惶<\/td><td>חַתּוּ<\/td><td>chattu<\/td><td>H2865<\/td><td>√חתת（驚恐）<\/td><td>被驚嚇、破碎<\/td><td>勇士也怕<\/td><\/tr><tr><td>剪除<\/td><td>יִכָּרֶת<\/td><td>yikkaret<\/td><td>H3772<\/td><td>√כרת（砍斷）<\/td><td>被剪除（被動式）<\/td><td>★ 這個字 10 節與 14 節還要出現<\/td><\/tr><tr><td>殺戮<\/td><td>קָּטֶל<\/td><td>qatel<\/td><td>H6993<\/td><td>—<\/td><td>殺戮<\/td><td>句末的字，歸上節還是下節有不同讀法<\/td><\/tr><\/table>","gram":"<p><strong>① 「到那日」是哪一日？<\/strong><\/p><p>這裡沒有說。「那日」（בַּיּוֹם הַהוּא）在這一節第一次出現，沒有交代是哪一天；真正說明的是 15 節：「耶和華降罰的日子」。本講義不替這一日排時間表，只看它的作用：把人帶到神面前。<\/p><p><strong>② 句末的 מִקָּטֶל（因殺戮）歸哪一節？<\/strong><\/p><ul><li>和合本與多數譯本：歸 9 節，「被殺戮剪除」<\/li><li>也有譯本把它歸到 10 節，成為「因殺戮、因向兄弟雅各行強暴」，作為控告的第一項<\/li><\/ul><p>兩種讀法不改變 10 節的控告，只是斷句不同。<\/p><blockquote><p><strong>最好的理解：<\/strong>採和合本的斷法：9 節講結局，10 節才講理由。<\/p><\/blockquote>","exp":"<p><strong>以東最驕傲的兩樣東西：腦袋與拳頭。<\/strong><\/p><p>8 節神說：「到那日，我豈不從以東除滅智慧人？」以東這地方，以智慧出名。耶利米書問過：「提幔中再沒有智慧嗎？」約伯的朋友以利法就是提幔人。這是一個以謀略自豪的地方。<\/p><p>9 節接著說另一樣：勇士。提幔的勇士要驚惶（חַתּוּ），整座以掃山的人要被剪除。<\/p><p>智慧人與勇士，一個管腦，一個管手，是一個國家最能自保的兩樣東西。神把這兩樣一起收走。<\/p><p>這裡有一個細節：7 節說以東「毫無聰明」，8 節神說要除滅「聰明」，兩處是同一個字（תְּבוּנָה）。以東心裡早已沒有聰明了，神只是把剩下的名聲也拿走。<\/p><p>這兩節也預備了下面的控告。為甚麼受這樣的審判？第 10 節才說原因。聖經這裡的次序很有意思：先講結局，再講理由。聽的人先知道這是真的，再被問：為甚麼？<\/p><p>落地：一個人能靠的，不外乎腦袋和手腳。這兩樣好不好？好。可是當我們把它們當成「不用神也能活」的本錢，它們就從恩賜變成了高處。神收走的不是你的能力，是你拿能力當神的那個位置。<\/p>"},{"a":10,"z":11,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>מֵחֲמַ֛ס אָחִ֥יךָ יַעֲקֹ֖ב תְּכַסְּךָ֣ בוּשָׁ֑ה וְנִכְרַ֖תָּ לְעוֹלָֽם בְּיוֹם֙ עֲמָֽדְךָ֣ מִנֶּ֔גֶד בְּי֛וֹם שְׁב֥וֹת זָרִ֖ים חֵיל֑וֹ וְנָכְרִ֞ים בָּ֣אוּ שְׁעָרָ֗יו וְעַל יְרוּשָׁלִַ֨ם֙ יַדּ֣וּ גוֹרָ֔ל גַּם אַתָּ֖ה כְּאַחַ֥ד מֵהֶֽם<\/p><\/blockquote>","lit":"<blockquote><p>「因為你向兄弟雅各所行的強暴，羞愧要遮蓋你，你也要被剪除，直到永遠。在你從對面站著的那日，在外人擄去他的財物、外邦人進了他的城門、為耶路撒冷拈鬮的那日，你也像他們中的一個。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>強暴<\/td><td>חֲמַס<\/td><td>chamas<\/td><td>H2555<\/td><td>—<\/td><td>強暴、不義的傷害<\/td><td>★ 全章控告的第一個字<\/td><\/tr><tr><td>兄弟<\/td><td>אָחִיךָ<\/td><td>achikha<\/td><td>H251<\/td><td>—<\/td><td>你的兄弟<\/td><td>控告的出發點：是兄弟，不是敵人<\/td><\/tr><tr><td>羞愧<\/td><td>בוּשָׁה<\/td><td>bushah<\/td><td>H955<\/td><td>√בושׁ（羞愧）<\/td><td>羞愧、恥辱<\/td><td>先是臉上的<\/td><\/tr><tr><td>遮蓋<\/td><td>תְּכַסְּךָ<\/td><td>tekhassekha<\/td><td>H3680<\/td><td>√כסה（遮蓋）<\/td><td>遮蓋你（強調式）<\/td><td>羞愧像衣服一樣蓋住他<\/td><\/tr><tr><td>斷絕<\/td><td>נִכְרַתָּ<\/td><td>nikhrata<\/td><td>H3772<\/td><td>√כרת（砍斷）<\/td><td>被剪除（被動式）<\/td><td>再是名字上的：永遠<\/td><\/tr><tr><td>站在一旁<\/td><td>עֲמָדְךָ מִנֶּגֶד<\/td><td>‘amadkha minneged<\/td><td>H5975、H5048<\/td><td>—<\/td><td>站著，從對面（遠處）<\/td><td>站在遠處，與在對面，兩義並存<\/td><\/tr><tr><td>擄掠<\/td><td>שְׁבוֹת<\/td><td>shevot<\/td><td>H7617<\/td><td>√שׁבה（擄去）<\/td><td>擄去（不定詞）<\/td><td>外人擄去他的財物<\/td><\/tr><tr><td>拈鬮<\/td><td>גוֹרָל<\/td><td>goral<\/td><td>H1486<\/td><td>—<\/td><td>籤、鬮<\/td><td>把一座城當作可以抽籤分的東西<\/td><\/tr><tr><td>同夥<\/td><td>אַחַד<\/td><td>achad<\/td><td>H259<\/td><td>√אחד（一）<\/td><td>好像一個<\/td><td>「像他們中的一個」<\/td><\/tr><\/table>","gram":"<p><strong>① 「站在一旁」（מִנֶּגֶד）是袖手旁觀，還是站在敵對的一邊？<\/strong><\/p><ul><li><strong>在遠處旁觀<\/strong>：詩 38:11「我的良朋密友因我的災病都躲在旁邊站著」，原文用的是同一個詞<\/li><li><strong>在對面<\/strong>：王下 2:7「遠遠地站在他們對面」，同一個詞，指隔著一段距離、面對面站著<\/li><\/ul><p>這個詞的意思就在「遠處、對面」之間。重點是下一句：「像與他們同夥」——不論站在哪一個角度，他沒有站在雅各這一邊。<\/p><p><strong>② 「財物」（חֵיל）是財，還是軍力？<\/strong>這個字可譯「財力、軍力、力量」。和合本在 11、13 節都取「財物」，前後一致。<\/p><p><strong>③ 與其他經文的互證。<\/strong>阿摩司書 1:11 說以東「拿刀追趕兄弟」；詩 137:7 記得「耶路撒冷遭難的日子，以東人說：拆毀！拆毀！」；約珥書 3:19 說以東受罰「都因向猶大人所行的強暴」，用的也是 חָמָס。<\/p><blockquote><p><strong>最好的理解：<\/strong>「站在一旁」不是中立。經文自己給了答案：像與他們同夥。<\/p><\/blockquote>","exp":"<p><strong>控告書的第一句不是「你殺了人」，是「你向你的兄弟」。<\/strong><\/p><p>10 節是全書的轉折。前面講以東怎樣被拉下，到這裡才講為甚麼：「因你向兄弟雅各行強暴。」<\/p><p>「強暴」（חָמָס）在聖經裡是個很重的字，挪亞的時候，「地上滿了強暴」（創 6:11）。這裡的受害者有一個稱呼：「你兄弟雅各」。不是「猶大國」，是「你兄弟」。申命記說：「不可憎惡以東人，因為他是你的弟兄。」神吩咐以色列要這樣對待以東；以東卻沒有這樣對待雅各。<\/p><p>結局也有兩層：羞愧遮蓋你，永遠斷絕。先是臉上的，再是名字上的。<\/p><p>11 節把控告說得更具體。那一天，外人擄走雅各的財物，外邦人進了他的城門，為耶路撒冷拈鬮。以東做了甚麼？「你竟站在一旁。」<\/p><p>原文這個詞（מִנֶּגֶד）是「從遠處、從對面」。不論讀成冷眼旁觀，還是站到敵對的一邊，下一句已經說清楚：「像與他們同夥。」<\/p><p>這是這一節最重的話。以東沒有拿刀，沒有進城。他只是站著。可是神說：這樣站著，就是他們中間的一個。<\/p><p>連「兄弟」（אָח）與「一個」（אֶחָד）聽起來都幾乎一樣：他本來是「兄弟」，那一天卻成了「他們中的一個」。<\/p><p>落地：我們比較容易承認自己「做了甚麼」，比較難承認自己「沒有做甚麼」。兄弟遭難那一天，我們站在哪裡？這不是要我們背起所有人的苦難，而是在心裡問一句：我有沒有看見？我有沒有可以伸手而沒有伸？<\/p>"},{"a":12,"z":14,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְאַל תֵּ֤רֶא בְיוֹם אָחִ֨יךָ֙ בְּי֣וֹם נָכְר֔וֹ וְאַל תִּשְׂמַ֥ח לִבְנֵֽי יְהוּדָ֖ה בְּי֣וֹם אָבְדָ֑ם וְאַל תַּגְדֵּ֥ל פִּ֖יךָ בְּי֥וֹם צָרָֽה אַל תָּב֤וֹא בְשַֽׁעַר עַמִּי֙ בְּי֣וֹם אֵידָ֔ם אַל תֵּ֧רֶא גַם אַתָּ֛ה בְּרָעָת֖וֹ בְּי֣וֹם אֵיד֑וֹ וְאַל תִּשְׁלַ֥חְנָה בְחֵיל֖וֹ בְּי֥וֹם אֵידֽוֹ וְאַֽל תַּעֲמֹד֙ עַל הַפֶּ֔רֶק לְהַכְרִ֖ית אֶת פְּלִיטָ֑יו וְאַל תַּסְגֵּ֥ר שְׂרִידָ֖יו בְּי֥וֹם צָרָֽה<\/p><\/blockquote>","lit":"<blockquote><p>「不要在你兄弟的日子，在他變得陌生（遭難）的日子瞪眼看著；不要在猶大子孫滅亡的日子歡樂；不要在患難的日子張大你的口。不要在我百姓遭災的日子進他們的城門；不要，你也不要，在他遭災的日子瞪眼看他的惡運；不要在他遭災的日子伸手奪他的財物。不要站在岔路口剪除他逃脫的人；不要在患難的日子把他剩下的人交出去。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>不當<\/td><td>אַל<\/td><td>’al<\/td><td>H408<\/td><td>—<\/td><td>不要（禁止詞）<\/td><td>★ 三節共 8 次，起頭同一個字<\/td><\/tr><tr><td>瞪眼看著<\/td><td>תֵּרֶא<\/td><td>tere’<\/td><td>H7200<\/td><td>√ראה（看）<\/td><td>看（含樂見之意）<\/td><td>「看」的方式不是關心，是欣賞<\/td><\/tr><tr><td>歡樂<\/td><td>תִּשְׂמַח<\/td><td>tismach<\/td><td>H8055<\/td><td>√שׂמח（歡喜）<\/td><td>歡喜<\/td><td>看著別人遭難，心裡竟覺得痛快<\/td><\/tr><tr><td>狂傲的話<\/td><td>תַּגְדֵּל פִּיךָ<\/td><td>tagdel pikha<\/td><td>H1431、H6310<\/td><td>—<\/td><td>張大你的口<\/td><td>張大嘴巴說大話<\/td><\/tr><tr><td>城門<\/td><td>שַׁעַר<\/td><td>sha‘ar<\/td><td>H8179<\/td><td>—<\/td><td>城門<\/td><td>城的審判與交易之處<\/td><\/tr><tr><td>伸手搶<\/td><td>תִּשְׁלַחְנָה חֵילוֹ<\/td><td>tishlachnah bechelo<\/td><td>H7971、H2428<\/td><td>√שׁלח（伸出）<\/td><td>伸手奪他的財物<\/td><td>原文有「伸出」，手是和合本補的<\/td><\/tr><tr><td>岔路口<\/td><td>הַפֶּרֶק<\/td><td>happereq<\/td><td>H6563<\/td><td>—<\/td><td>岔路、分叉口<\/td><td>逃命的人在這裡分路<\/td><\/tr><tr><td>逃脫的<\/td><td>פְּלִיטָיו<\/td><td>pelitav<\/td><td>H6412<\/td><td>√פלט（逃脫）<\/td><td>他逃脫的人<\/td><td>★ 17 節「逃脫的人」同出一字根<\/td><\/tr><tr><td>交付<\/td><td>תַּסְגֵּר<\/td><td>tasgir<\/td><td>H5462<\/td><td>√סגר（關閉、交出）<\/td><td>交出去（使動式）<\/td><td>把人送到仇敵手裡<\/td><\/tr><\/table>","gram":"<p><strong>① 「不當」是「你本不該」，還是「你不要」？<\/strong><\/p><ul><li><strong>追悔式<\/strong>：「你本不該……」，日子已經過去，是追述以東已做的事<\/li><li><strong>禁止式<\/strong>：「你不要……」，原文是 אַל 加上禁止的語氣，字面是命令；有人讀成對將要發生的事的勸誡<\/li><li><strong>兩者並存<\/strong>：先知把已發生的事說得像正在眼前，叫聽的人當下就被問到<\/li><\/ul><p>和合本的「不當」恰好站在兩者之間。<\/p><p><strong>② 八個「不當」的結構。<\/strong>12 節三個、13 節三個、14 節兩個；除了 14 節第一個，每一個後面都跟著「在……的日子」。12 節三個在「看、樂、說」，13 節是「進、看、搶」，14 節是最後的兩個動作：截住逃脫的，交給仇敵。<\/p><p><strong>③ 箴言 24:17。<\/strong>「你仇敵跌倒，你不要歡喜；他傾倒，你心不要快樂」——與 12 節的「不當歡樂」是同一個倫理。<\/p><blockquote><p><strong>最好的理解：<\/strong>這是一份清單：每一項都是「沒有人逼你」的事。<\/p><\/blockquote>","exp":"<p><strong>八個「不當」：這是一份清單，列的全是「沒有人逼你」的事。<\/strong><\/p><p>12 到 14 節像一首連珠炮的詩。八次，同一個句子起頭：「你不當……」<\/p><p>讀慢一點，會發現是一條往下滑的路。<\/p><p>12 節的三個不當，在眼睛、在心、在口：瞪眼看著，因此歡樂，說狂傲的話。13 節是腳進去了、眼睛又看、手伸出去：進城門，瞪眼看，伸手搶。14 節是最後的動作：站在岔路口，把逃脫的截下來，把剩下的人交給仇敵。<\/p><p>從看，到樂，到說，到進，到搶，到截。每一步都只比前一步多走一點，每一步都有一個理由：我只是看看；我只是說說；人家都進去了，我不進去，豈不吃虧？<\/p><p>最可怕的是岔路口。逃命的人在這裡分兩條路，他在這裡等。這是以為「已經沒事了」的人，最後一個險境。<\/p><p>有一個字值得連起來看：「逃脫的人」（פְּלִיטָיו）。以東在岔路口把逃脫的人剪除，神在 17 節說：在錫安山必有逃脫的人（פְלֵיטָה）。以東堵截的那條逃生的路，神要在別處開出來。<\/p><p>落地：一個人不是一天變成同夥的。他從一個眼神開始，從一句「活該」開始。今天，在你認識的人遭難的時候，你的眼睛、你的嘴、你的腳，會往哪裡走？<\/p>"},{"a":15,"z":16,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כִּֽי קָר֥וֹב יוֹם יְהוָ֖ה עַל כָּל הַגּוֹיִ֑ם כַּאֲשֶׁ֤ר עָשִׂ֨יתָ֙ יֵעָ֣שֶׂה לָּ֔ךְ גְּמֻלְךָ֖ יָשׁ֥וּב בְּרֹאשֶֽׁךָ כִּ֗י כַּֽאֲשֶׁ֤ר שְׁתִיתֶם֙ עַל הַ֣ר קָדְשִׁ֔י יִשְׁתּ֥וּ כָֽל הַגּוֹיִ֖ם תָּמִ֑יד וְשָׁת֣וּ וְלָע֔וּ וְהָי֖וּ כְּל֥וֹא הָיֽוּ<\/p><\/blockquote>","lit":"<blockquote><p>「因為耶和華的日子臨近所有的列國。你怎樣做，就怎樣被做在你身上；你的所為要回到你的頭上。因為你們怎樣在我的聖山上喝了，所有的列國也要常常喝；他們要喝，要咽，他們要成為好像未曾有過。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>日子<\/td><td>יוֹם<\/td><td>yom<\/td><td>H3117<\/td><td>—<\/td><td>日子<\/td><td>★ 同一個字，這次的主詞是耶和華<\/td><\/tr><tr><td>臨近<\/td><td>קָרוֹב<\/td><td>qarov<\/td><td>H7138<\/td><td>√קרב（靠近）<\/td><td>近的<\/td><td>「臨近」：不說哪一天<\/td><\/tr><tr><td>萬國<\/td><td>כָּל הַגּוֹיִם<\/td><td>kol hagoyim<\/td><td>H3605、H1471<\/td><td>—<\/td><td>所有的列國<\/td><td>審判從以東擴及萬國<\/td><\/tr><tr><td>報應<\/td><td>גְּמֻלְךָ<\/td><td>gemulkha<\/td><td>H1576<\/td><td>√גמל（回報）<\/td><td>你的所為、你的報償<\/td><td>「你所行的」要回到你自己<\/td><\/tr><tr><td>歸<\/td><td>יָשׁוּב<\/td><td>yashuv<\/td><td>H7725<\/td><td>√שׁוב（返回）<\/td><td>返回、轉回<\/td><td>像投出去的東西繞一圈回來<\/td><\/tr><tr><td>喝<\/td><td>שְׁתִיתֶם<\/td><td>shetitem<\/td><td>H8354<\/td><td>√שׁתה（喝）<\/td><td>喝<\/td><td>原文只說「喝」，「杯」是譯者按上下文加的<\/td><\/tr><tr><td>聖山<\/td><td>הַר קָדְשִׁי<\/td><td>har qodshi<\/td><td>H2022、H6944<\/td><td>√קדשׁ（分別為聖）<\/td><td>我的聖山<\/td><td>神自己稱它「我的」<\/td><\/tr><tr><td>常常<\/td><td>תָּמִיד<\/td><td>tamid<\/td><td>H8548<\/td><td>—<\/td><td>持續地、不斷地<\/td><td>喝，不是一口，是源源不絕<\/td><\/tr><tr><td>咽<\/td><td>לָעוּ<\/td><td>la‘u<\/td><td>H3886<\/td><td>—<\/td><td>大口喝下、吞<\/td><td>喝到不能自制<\/td><\/tr><\/table>","gram":"<p><strong>① 15 節「你怎樣行，他也必照樣向你行」是甚麼原則？<\/strong><\/p><ul><li><strong>行為自己帶來的回轉<\/strong>：「歸到你頭上」（יָשׁוּב，返回）像是作為本身帶來後果<\/li><li><strong>神親自的審判<\/strong>：本節的主詞是「耶和華」，是神降罰的日子<\/li><li><strong>兩者並存<\/strong>：神讓人所行的，回到人自己身上<\/li><\/ul><p>無論哪一種，這句話的主詞是神，不是人。它不是給人報復的許可，羅馬書 12:19 說：「伸冤在我，我必報應。」<\/p><p><strong>② 16 節的「你們」是誰？<\/strong>原文只有「你們喝了」（שְׁתִיתֶם），沒有「猶大人」，也沒有「杯」；這兩樣都是和合本按上下文補上去的。<\/p><ul><li><strong>猶大喝了審判的杯<\/strong>（和合本）：先是猶大在聖山遭難，如今杯傳到列國。耶 25:15、49:12 與哀 4:21 都用「杯」說審判傳遞<\/li><li><strong>以東與列國喝了歡慶的酒<\/strong>：他們在聖山上喝酒作樂，如今輪到他們喝審判<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong>兩種讀法結論相同：那一杯會傳到每一個人。耶 49:12 說：「原不該喝那杯的一定要喝。」<\/p><\/blockquote>","exp":"<p><strong>同一個字，主詞換了。<\/strong><\/p><p>11 到 14 節，「日子」這個字一直用在兄弟身上：他遭難的日子、被滅的日子、遭災的日子。到了 15 節，這個字突然換了主人：「耶和華降罰的日子臨近萬國。」<\/p><p>你站在旁邊看兄弟的日子；現在是耶和華看你的日子。<\/p><p>接著是一個很簡單的原則：「你怎樣行，他也必照樣向你行；你的報應必歸到你頭上。」原文說的是「歸回」（יָשׁוּב）：像一把投出去的迴力鏢，繞一圈，回到頭上。<\/p><p>這句話最容易被誤用。它不是說：別人傷害你，你可以照樣報復他。這是神在說話，神是主詞：「耶和華降罰」。羅馬書說：「伸冤在我，我必報應。」報應的手在神，不在我們。受過傷的人讀到這裡，不是得到一把武器，是得到一個可以安息的地方：公義有人管，不必我來。<\/p><p>16 節說到一個杯（原文只說「喝」，杯是譯者按上下文加的）。有一杯，所有人都要喝。有人讀成猶大先喝了審判的杯，列國也要喝；有人讀成以東與列國曾在聖山上喝酒歡慶，現在輪到他們喝審判。不論哪一種，那一杯會輪到每一個人，沒有人被豁免。<\/p><p>注意這一節的規模。審判從以東一個國家，擴大到「萬國」。以東的故事不再只是以東的故事。它是所有「站在一旁」的人、所有以為自己是例外的人的故事。<\/p><p>落地：這一節對受傷的人是安慰：公義有主。對傷人的人是警告：作為會回來。對每一個人，是一個問題：我是不是還在等別人先被審判？<\/p>"},{"a":17,"z":18,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וּבְהַ֥ר צִיּ֛וֹן תִּהְיֶ֥ה פְלֵיטָ֖ה וְהָ֣יָה קֹ֑דֶשׁ וְיָֽרְשׁוּ֙ בֵּ֣ית יַֽעֲקֹ֔ב אֵ֖ת מוֹרָֽשֵׁיהֶם וְהָיָה֩ בֵית יַעֲקֹ֨ב אֵ֜שׁ וּבֵ֧ית יוֹסֵ֣ף לֶהָבָ֗ה וּבֵ֤ית עֵשָׂו֙ לְקַ֔שׁ וְדָלְק֥וּ בָהֶ֖ם וַאֲכָל֑וּם וְלֹֽא יִֽהְיֶ֤ה שָׂרִיד֙ לְבֵ֣ית עֵשָׂ֔ו כִּ֥י יְהוָ֖ה דִּבֵּֽר<\/p><\/blockquote>","lit":"<blockquote><p>「在錫安山必有逃脫（的人），那山必成聖；雅各家要承受他們的產業。雅各家必成為火，約瑟家為火焰，以掃家為碎稭；火要在他們中點燃，把他們吞吃；以掃家不再有餘剩的人，因為耶和華已經說了。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>逃脫<\/td><td>פְלֵיטָה<\/td><td>peleitah<\/td><td>H6413<\/td><td>√פלט（逃脫）<\/td><td>逃脫的人、逃脫<\/td><td>★ 14 節的「逃脫的人」，在這裡得了出路<\/td><\/tr><tr><td>錫安山<\/td><td>הַר צִיּוֹן<\/td><td>har tsiyyon<\/td><td>H2022、H6726<\/td><td>—<\/td><td>錫安山<\/td><td>以掃山的對面<\/td><\/tr><tr><td>成聖<\/td><td>קֹדֶשׁ<\/td><td>qodesh<\/td><td>H6944<\/td><td>√קדשׁ（分別為聖）<\/td><td>聖、分別出來的<\/td><td>因神在那裡，不是因地勢高<\/td><\/tr><tr><td>得<\/td><td>יָרְשׁוּ<\/td><td>yareshu<\/td><td>H3423<\/td><td>—<\/td><td>承受、得為業<\/td><td>17–20 節一共出現 4 次<\/td><\/tr><tr><td>產業<\/td><td>מוֹרָשֵׁיהֶם<\/td><td>morasheihem<\/td><td>H4180<\/td><td>—<\/td><td>產業、承受之地<\/td><td>另有古譯本讀成「奪取他們產業的人」<\/td><\/tr><tr><td>火<\/td><td>אֵשׁ<\/td><td>’esh<\/td><td>H784<\/td><td>—<\/td><td>火<\/td><td>雅各家<\/td><\/tr><tr><td>火焰<\/td><td>לֶהָבָה<\/td><td>lehavah<\/td><td>H3852<\/td><td>—<\/td><td>火焰<\/td><td>約瑟家<\/td><\/tr><tr><td>碎稭<\/td><td>קַשׁ<\/td><td>qash<\/td><td>H7179<\/td><td>—<\/td><td>碎稭、禾梗<\/td><td>以掃家，一點就著<\/td><\/tr><tr><td>餘剩<\/td><td>שָׂרִיד<\/td><td>sarid<\/td><td>H8300<\/td><td>—<\/td><td>倖存者、餘剩的人<\/td><td>★ 與 14 節「剩下的人」同一字根<\/td><\/tr><\/table>","gram":"<p><strong>① 17 節的「產業」（מוֹרָשֵׁיהֶם）是誰的產業？<\/strong><\/p><ul><li><strong>他們原有的產業<\/strong>（和合本）：被奪走的，要歸還<\/li><li><strong>「奪取他們產業的人」<\/strong>：有些古譯本把這個字讀成另一個形式，意思是雅各家要得回「那些得了他們產業的人」<\/li><\/ul><p>這個字在 17 至 20 節反覆出現的動詞「得」（יָרַשׁ）是同一個字根；整段在講「得回」。<\/p><p><strong>② 「約瑟家」是誰？<\/strong>舊約常用「約瑟家」指北邊的支派（以法蓮、瑪拿西）；和「雅各家」並列，是說分裂的兩邊，到這裡一同成為火。<\/p><p><strong>③ 火與碎稭。<\/strong>碎稭一點就著是舊約常見的意象（賽 5:24；瑪 4:1「凡狂傲的和行惡的必如碎稭」）。<\/p><blockquote><p><strong>最好的理解：<\/strong>這段講的是神為「強暴兄弟」所說的話，要連同 10–14 節的理由一起讀；它不是一句「我們這一邊贏」的口號。<\/p><\/blockquote>","exp":"<p><strong>火與碎稭：兩個兄弟的家，在這一節分開了。<\/strong><\/p><p>17 節的第一句，叫人鬆一口氣：「在錫安山必有逃脫的人。」<\/p><p>還記得 14 節嗎？以東站在岔路口，要把逃脫的人截下來。現在神說：逃脫的人在這裡。以東堵不住的那一條路，神早已預備好了。約珥書也有一句相近的話：「在錫安山，耶路撒冷必有逃脫的人。」這是先知書裡反覆出現的盼望。<\/p><p>「那山也必成聖」，錫安不是因為地勢高才成聖，是因為神在那裡。「雅各家必得原有的產業」：被奪走的，要歸還。<\/p><p>18 節用了三樣東西：火、火焰、碎稭。雅各家是火，約瑟家（通常指北邊的支派）是火焰，以掃家是碎稭。火碰到碎稭，沒有甚麼好商量。<\/p><p>要小心這個畫面。它不是在說：我們是火，他們是草。前面已經講了理由：不是因為他是以掃家，是因為他向兄弟行強暴，站在一旁。<\/p><p>還有一個字要放在一起看。14 節以東把雅各「剩下的人」（שְׂרִידָיו）交給仇敵；18 節說以掃家「必無餘剩的」（שָׂרִיד）。同一個字根：你怎樣對待別人的餘剩，你自己也怎樣沒有餘剩。<\/p><p>落地：這一節的盼望，是給被趕散、被奪走的人。公義有主，被奪走的，神記得。這個盼望不是讓人更恨，是讓人可以放下。<\/p>"},{"a":19,"z":20,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְיָרְשׁ֨וּ הַנֶּ֜גֶב אֶת הַ֣ר עֵשָׂ֗ו וְהַשְּׁפֵלָה֙ אֶת פְּלִשְׁתִּ֔ים וְיָרְשׁוּ֙ אֶת שְׂדֵ֣ה אֶפְרַ֔יִם וְאֵ֖ת שְׂדֵ֣ה שֹׁמְר֑וֹן וּבִנְיָמִ֖ן אֶת הַגִּלְעָֽד וְגָלֻ֣ת הַֽחֵל הַ֠זֶּה לִבְנֵ֨י יִשְׂרָאֵ֤ל אֲשֶֽׁר כְּנַעֲנִים֙ עַד צָ֣רְפַ֔ת וְגָלֻ֥ת יְרוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּסְפָרַ֑ד יִֽרְשׁ֕וּ אֵ֖ת עָרֵ֥י הַנֶּֽגֶב<\/p><\/blockquote>","lit":"<blockquote><p>「南地的人要得以掃山；低地的人要得非利士人（的地）；他們要得以法蓮的田野和撒馬利亞的田野；便雅憫要得基列。這一群被擄的人，就是以色列人，（在）迦南人（中的），直到撒勒法；和耶路撒冷的被擄者，在西法拉的，要得南地的城邑。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>南地<\/td><td>הַנֶּגֶב<\/td><td>hannegev<\/td><td>H5045<\/td><td>—<\/td><td>南地（內蓋夫）<\/td><td>以南的人往東南得以掃山<\/td><\/tr><tr><td>高原<\/td><td>הַשְּׁפֵלָה<\/td><td>hashshephelah<\/td><td>H8219<\/td><td>—<\/td><td>低地、丘陵地<\/td><td>往西得非利士人的地<\/td><\/tr><tr><td>非利士<\/td><td>פְּלִשְׁתִּים<\/td><td>peleshtim<\/td><td>H6430<\/td><td>—<\/td><td>非利士人<\/td><td>海邊平原<\/td><\/tr><tr><td>撒馬利亞<\/td><td>שֹׁמְרוֹן<\/td><td>shomeron<\/td><td>H8111<\/td><td>—<\/td><td>撒馬利亞<\/td><td>北國的首都<\/td><\/tr><tr><td>基列<\/td><td>הַגִּלְעָד<\/td><td>hagil‘ad<\/td><td>H1568<\/td><td>—<\/td><td>基列<\/td><td>約旦河東<\/td><\/tr><tr><td>被擄<\/td><td>גָלֻת<\/td><td>galut<\/td><td>H1546<\/td><td>√גלה（遷移）<\/td><td>被擄的人（群）<\/td><td>兩群被擄的人，並排站在同一幅地圖上<\/td><\/tr><tr><td>撒勒法<\/td><td>צָרְפַת<\/td><td>tsarefat<\/td><td>H6886<\/td><td>—<\/td><td>撒勒法（在西頓境內）<\/td><td>往北到腓尼基海岸（王上 17:9）<\/td><\/tr><tr><td>西法拉<\/td><td>סְפָרַד<\/td><td>sefarad<\/td><td>H5614<\/td><td>—<\/td><td>地名，地點不確定<\/td><td>多數學者認為是小亞細亞的撒狄<\/td><\/tr><\/table>","gram":"<p><strong>① 誰得了甚麼？<\/strong>動詞「得」（יָרַשׁ）反覆出現，主詞要靠上下文補：南地的人得以掃山；低地的人得非利士人的地，以及以法蓮、撒馬利亞的田野；便雅憫得基列。四個方向：東南、西、北、東。<\/p><p><strong>② 20 節的難處。<\/strong>這一節是全書文字最難讀的幾處之一：הַחֵל הַזֶּה（這一群／這一道城牆）、כְּנַעֲנִים（迦南人，也可指腓尼基商人）的讀法，古譯本與現代譯本都不一致。和合本取的是一種合理的讀法。<\/p><p><strong>③ 「西法拉」（סְפָרַד）是哪裡？<\/strong><\/p><ul><li>多數學者：小亞細亞的撒狄（古波斯文獻稱 Sparda）<\/li><li>中世紀以後的猶太傳統：用這個名字稱西班牙<\/li><\/ul><p>名字在後來的歷史裡被一再使用。本講義不把它與今天任何族群、任何地方畫上等號。<\/p><blockquote><p><strong>最好的理解：<\/strong>地名細節不確定，主旨清楚：被擄、被趕散的人，要回家；南北兩邊的兄弟，要在同一份產業裡。<\/p><\/blockquote>","exp":"<p><strong>從山頂回到全地：四面八方的地名，是一幅「歸還」的地圖。<\/strong><\/p><p>19 到 20 節像一張地圖，一個一個報地名：南地、高原、以法蓮、撒馬利亞、基列、撒勒法、西法拉。名字多，讀起來像一份地契清單。<\/p><p>可是留意動詞。「得」（יָרַשׁ）這個字，在 17 到 20 節一共出現四次，17 節的「產業」也是同一個字根。在舊約，這是一個最熟悉的動詞：以色列人過約旦河，得迦南地，就是這個字。現在這個動詞回來了：被奪走的，要重新得回。<\/p><p>留意被提到的人：南地的人、高原的人、便雅憫人；還有兩群被擄的人：以色列人（北邊）和耶路撒冷人（南邊）。北國與南國在歷史上分裂了幾百年，到這裡，在同一份地圖上並排站著。<\/p><p>20 節的原文不容易讀，古譯本與現代譯本的讀法也不一致。「西法拉」到底在哪裡？多數學者認為是小亞細亞的撒狄；後來猶太人才用這個名字稱西班牙。不確定的地名，可以不確定。確定的是方向：不是往內縮，是往外開，連最遠的被擄之地，也在神的計劃裡。<\/p><p>這張地圖要小心讀。它不是給任何今天的人用來劃自己的疆界；它是對一群被擄、被趕散、失去家園的人說的安慰。<\/p><p>落地：神的應許，給人一個「回得去」的地方。對現在正在異鄉、被人趕走、覺得自己再也回不去的人，這兩節的重點不是地名，是這一句：你所失去的，不是最後一頁。<\/p>"},{"a":21,"z":21,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְעָל֤וּ מֽוֹשִׁעִים֙ בְּהַ֣ר צִיּ֔וֹן לִשְׁפֹּ֖ט אֶת הַ֣ר עֵשָׂ֑ו וְהָיְתָ֥ה לַֽיהוָ֖ה הַמְּלוּכָֽה<\/p><\/blockquote>","lit":"<blockquote><p>「拯救者要上到錫安山，審判以掃山；王權要歸耶和華。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>拯救者<\/td><td>מוֹשִׁעִים<\/td><td>moshi‘im<\/td><td>H3467<\/td><td>√ישׁע（拯救）<\/td><td>拯救者（複數）<\/td><td>像士師記的「拯救者」（士 3:9、15）<\/td><\/tr><tr><td>上到<\/td><td>עָלוּ<\/td><td>‘alu<\/td><td>H5927<\/td><td>√עלה（上去）<\/td><td>上去<\/td><td>★ 3–4 節「拉下」的相反方向<\/td><\/tr><tr><td>錫安山<\/td><td>הַר צִיּוֹן<\/td><td>har tsiyyon<\/td><td>H2022、H6726<\/td><td>—<\/td><td>錫安山<\/td><td>17 節「逃脫的人」所在之處<\/td><\/tr><tr><td>審判<\/td><td>לִשְׁפֹּט<\/td><td>lishpot<\/td><td>H8199<\/td><td>√שׁפט（審判、治理）<\/td><td>審判、治理<\/td><td>舊約「士師」的字根：也有「治理」之意<\/td><\/tr><tr><td>以掃山<\/td><td>הַר עֵשָׂו<\/td><td>har ‘esav<\/td><td>H2022、H6215<\/td><td>—<\/td><td>以掃山<\/td><td>全書的第三次，「山」對「山」<\/td><\/tr><tr><td>國度<\/td><td>הַמְּלוּכָה<\/td><td>hammelukhah<\/td><td>H4410<\/td><td>√מלך（作王）<\/td><td>王權、國度<\/td><td>★ 全書最後一個名詞<\/td><\/tr><tr><td>歸<\/td><td>וְהָיְתָה לַיהוָה<\/td><td>vehayetah layhwh<\/td><td>H1961、H3068<\/td><td>—<\/td><td>要屬於耶和華<\/td><td>「歸」是「屬於」：以「耶和華」為終點<\/td><\/tr><\/table>","gram":"<p><strong>① 「拯救者」（מוֹשִׁעִים）是誰？<\/strong><\/p><ul><li><strong>神所興起的拯救者<\/strong>：如士師記中的俄陀聶、以笏（士 3:9、15）；原文是複數<\/li><li><strong>被拯救的人<\/strong>：有些古譯本把這個字讀成被動，「被拯救的人」要上去<\/li><li><strong>基督<\/strong>：有人認為這節最終指向那一位拯救者；新約沒有直接引用俄巴底亞書這一節，所以這是一個「使我們想起」的連結，不是「這是預言」<\/li><\/ul><p><strong>② 「審判」（לִשְׁפֹּט）也有「治理」的意思。<\/strong>舊約的士師（שֹׁפְטִים）既審判，也領導；這裡的上去，是為了治理，不只為了定罪。<\/p><p><strong>③ 「國度」（הַמְּלוּכָה）。<\/strong>這個字是「王權」：誰作王。詩 22:28 有同樣的一句：「國權是耶和華的」。<\/p><blockquote><p><strong>最好的理解：<\/strong>這一節的主詞不是雅各，也不是以掃，是耶和華：結局是王權歸祂。<\/p><\/blockquote>","exp":"<p><strong>全書最後一句話，不是勝利的歌，也不是刀；是一句歸屬。<\/strong><\/p><p>俄巴底亞書用了二十節講高處、講站在一旁、講日子、講逃脫的人、講地。到最後一節，只剩一件事。<\/p><p>「必有拯救者上到錫安山，審判以掃山。」注意方向：上到（וְעָלוּ）。3、4 節以東說「誰能將我拉下去」，神說「我拉你下來」；現在方向反過來了：拯救者「上去」。不是自己爬上去，是被差遣上去。他們上去，不是為了坐高位，是為了審判；在舊約，這個動詞也有「治理」的意思，像士師記裡被神興起的拯救者，把百姓從欺壓裡救出來。<\/p><p>然後是最後一句：「國度就歸耶和華了。」原文 הַמְּלוּכָה，是「王權」。詩篇 22 篇有一句幾乎一樣的話：「國權是耶和華的。」這一句的主詞，不是雅各，不是以掃，是耶和華。<\/p><p>讀到這裡，整卷書的重量就轉過來了。以東想的是：我的高處，我的安全。雅各想的也許是：我們的產業，我們的仇。神最後說的是：王權是我的。這正是主禱文的中心：「國度、權柄、榮耀，全是你的，直到永遠。」<\/p><p>落地：歷史的結局，不是我們的任務清單。我們不必當審判官，也不必替神把所有人擺平。我們的位置，是回到本位：不拿權力，不爭高處，讓耶穌作王，讓耶穌得著一切的榮耀。<\/p>"}]},"serm":{"1":{"min":14,"pts":[["你心裡驕傲","1:1--9","誰能將我拉下地去呢"],["你不當站在一旁","1:10--14","你竟站在一旁"],["國度就歸耶和華了","1:15--21","國度就歸耶和華了"]],"blocks":[["h","《國度就歸耶和華了》"],["p","弟兄姊妹平安。"],["p","今天我們讀的，是聖經裡最短的一卷書。"],["p","只有一章，二十一節。"],["p","你一口氣就能讀完，大概五分鐘。"],["p","可是我要說：越短的書，越要慢慢讀。"],["p","因為一個人話不多的時候，每一句，都是他一定要說的。"],["p","這卷書的作者叫俄巴底亞。"],["p","這個名字的意思是：耶和華的僕人。"],["p","他的父親是誰？不知道。"],["p","他住在哪裡？不知道。"],["p","他在哪一個王的時候？也不知道。"],["p","一個人一生的履歷，只剩下兩個字：僕人。"],["p","我常常想，這是聖經裡最短的一份自傳。"],["p","也是最好的一份。"],["p","他要說的事，也很簡單。"],["p","有一個人，住在很高的地方。"],["p","他的兄弟遭難那一天，他站在旁邊。"],["p","然後神說話了。"],["p","最後一句，是這卷書的盼望。"],["p","今天我們分三步走："],["p","第一，你心裡驕傲。"],["p","第二，你不當站在一旁。"],["p","第三，國度就歸耶和華了。"],["p","先看第一步：你心裡驕傲。"],["p","請你想像一座山城。"],["p","四面都是岩石，路又窄又陡。"],["p","要上去的人，只能一個一個爬。"],["p","城裡的人，坐在高處，往下看。"],["p","看見的所有人，都很小。"],["p","這就是以東。"],["p","他們是以掃的後代，住在死海南邊的山地。"],["p","天然的堡壘，不用築牆。"],["q","「住在山穴中、居所在高處的啊，你因狂傲自欺，心裡說：誰能將我拉下地去呢？」"],["p","請你注意兩件事。"],["p","第一，神說他「自欺」。"],["p","欺騙他的，不是敵人。"],["p","是他自己的心。"],["p","驕傲有一個本事："],["p","它先說服你自己，再說服別人。"],["p","你住得越高，越相信：這裡，沒有人上得來。"],["p","第二，他心裡的那一句話。"],["p","「誰能將我拉下地去呢？」"],["p","這是一個問句。"],["p","可是他不需要答案。"],["p","因為他已經替自己答了：沒有人。"],["p","弟兄姊妹，這句話，我們都說過。"],["p","不一定說出口。"],["p","是在心裡說的。"],["p","我的工作，沒有人能動。"],["p","我的存款，夠我過一輩子。"],["p","我的人脈，夠我擋風雨。"],["p","我的屬靈資歷，大家都看見了。"],["p","這些，都是我的山穴。"],["p","山穴不是壞東西。"],["p","壞的是：我心裡說，沒有人能把我拉下去。"],["p","那一刻，我就把自己，放在神的位置上了。"],["p","神怎麼回答？"],["q","「你雖如大鷹高飛，在星宿之間搭窩，我必從那裡拉下你來。這是耶和華說的。」"],["p","請你注意這一個動詞。"],["p","以東問：誰能把我「拉下」？"],["p","神說：我必從那裡「拉下」你來。"],["p","同一個動詞。"],["p","神不是另外找一套話，來反駁他。"],["p","祂把他的話，原原本本，還給他。"],["p","「那裡」是哪裡？"],["p","就是他最安全的地方。"],["p","你以為神搆不到的地方，神說：我就從那裡。"],["p","然後，神把剩下的，一樣一樣拿走。"],["p","第五節，說到賊。"],["p","夜間的賊，偷夠了就走。"],["p","摘葡萄的人，總會留下一點。"],["p","可是以東，連藏起來的寶物，都被翻出來。"],["p","第七節最痛："],["q","「與你結盟的都送你上路，直到交界；與你和好的欺騙你，且勝過你；」"],["p","搜他的人，不是陌生人。"],["p","是盟友，是朋友，是一起吃飯的人。"],["p","「欺騙」這個字，你記一下。"],["p","第三節，他的心欺騙他。"],["p","第七節，他的盟友欺騙他。"],["p","同一個字。"],["p","第一個騙你的，是你自己的心。"],["p","然後，才輪到別人。"],["p","他以為最靠得住的是人脈。"],["p","到了邊界，全部轉身。"],["p","第八、九節，神再拿走兩樣："],["p","智慧人，和勇士。"],["p","一個管腦袋，一個管拳頭。"],["p","他靠聰明，也靠力量。"],["p","神說：到那日，我都要收走。"],["p","不是因為聰明不好，力氣不好。"],["p","是因為他把聰明和力氣，當成了不需要神的本錢。"],["p","弟兄姊妹，驕傲到底是什麼？"],["p","我們用一句話說："],["p","驕傲，是離開人的本位，抓住神的權力，想要代替神。"],["p","以東不是壞在山穴。"],["p","他是壞在，把山穴當成了神。"],["p","那謙卑呢？"],["p","謙卑，是放下權力，回到本位。"],["p","讓人作人，讓神作神。"],["p","我們都有山穴。"],["p","但我們可以選："],["p","是躲在山穴裡說「沒有人能拉下我」，"],["p","還是在山穴裡對神說：「主啊，我的安全，是你。」"],["p","第二步：你不當站在一旁。"],["p","前面九節，說的是結局。"],["p","第十節，才說原因。"],["p","這是整卷書的轉折。"],["q","「因你向兄弟雅各行強暴，羞愧必遮蓋你，你也必永遠斷絕。」"],["p","請你看第一個字。"],["p","控告以東的，不是「你殺了人」。"],["p","是「你向兄弟」。"],["p","兄弟。"],["p","以東是以掃的後代。以色列是雅各的後代。"],["p","以掃與雅各，是一對雙胞胎。"],["p","他們在母親的肚子裡，就已經在爭。"],["p","後來，一個得了祝福，一個恨得要殺他。"],["p","幾百年過去了，這個傷口，還在。"],["p","可是神對以色列說："],["q","「不可憎惡以東人，因為他是你的弟兄。」"],["p","神對以東說：雅各，是你的兄弟。"],["p","兩邊，神都說：你們是兄弟。"],["p","那麼，以東做了什麼？"],["p","第十一節："],["q","「當外人擄掠雅各的財物，外邦人進入他的城門，為耶路撒冷拈鬮的日子，你竟站在一旁，像與他們同夥。」"],["p","你有沒有發現？"],["p","以東沒有拿刀。"],["p","以東沒有進城。"],["p","他只是，站著。"],["p","可是神說：像與他們同夥。"],["p","站在一旁，不是中立。"],["p","有人遭難的時候，沒有中立。"],["p","你不伸手，你的位置，就在「他們」那一邊。"],["p","接下來，十二、十三、十四節。"],["p","有一個句子，重複了八次："],["p","「你不當」。"],["p","讓我們慢慢讀。"],["q","「你兄弟遭難的日子，你不當瞪眼看著；猶大人被滅的日子，你不當因此歡樂；」"],["p","先是眼睛：瞪眼看著。"],["p","不是關心的看，是欣賞的看。"],["p","然後是心：因此歡樂。"],["p","他在別人最痛的時候，心裡覺得痛快。"],["p","箴言說："],["q","「你仇敵跌倒，你不要歡喜；他傾倒，你心不要快樂；」"],["p","連仇敵倒下，都不可以歡喜。"],["p","何況，是兄弟。"],["q","「你不當說狂傲的話。」"],["p","然後是嘴巴：說大話。"],["p","第十三節："],["p","進他們的城門。"],["p","又瞪眼看著。"],["p","然後，伸手搶他們的財物。"],["p","第十四節，是最後一步："],["q","「你不當站在岔路口剪除他們中間逃脫的；」"],["p","你看這個畫面。"],["p","逃命的人，跑到岔路口，要分兩條路走。"],["p","以東就站在那裡。"],["p","把逃出來的人，一個一個截下來。"],["p","交給仇敵。"],["p","從看，到樂，到說，到進，到搶，到截。"],["p","每一步，只比上一步，多走一點點。"],["p","每一步，都有理由。"],["p","我只是看一看。"],["p","我只是說一說。"],["p","人家都進去了，我不進去，豈不吃虧？"],["p","弟兄姊妹，沒有人是一天變成同夥的。"],["p","他從一個眼神開始。"],["p","從一句「活該」開始。"],["p","今天，我要請你，慢一點。"],["p","在你認識的人遭難的時候，"],["p","你的眼睛，往哪裡看？"],["p","你的嘴巴，說什麼？"],["p","你的腳，往哪裡走？"],["p","在這裡，我要停一下，說一句很重要的話。"],["p","這一段經文，不是要你羞愧。"],["p","不是要你，背起所有人的苦難。"],["p","你自己，也可能是被旁觀的人。"],["p","你在最痛的時候，朋友都躲開了。"],["p","如果你是這樣，我要告訴你："],["p","神看見了。"],["p","第十到十四節，是神為你寫下的控告書。"],["p","祂沒有忘記。"],["p","這段話，是對那些有能力、有機會，"],["p","卻站在一旁，甚至趁機得利的人說的。"],["p","不是對那些，自己也在逃命的人說的。"],["p","那麼，我們怎麼活？"],["p","321 講：人比事重要，關係比東西重要。"],["p","關係的次序，是先神，再己，再人，再事。"],["p","一個人，與神的關係歪了，"],["p","與自己的關係就歪了，與人的關係，也就歪了。"],["p","以東為什麼站在一旁？"],["p","因為在他心裡，兄弟，不比他的山重要。"],["p","他的安全，他的利益，他的位置，比兄弟重要。"],["p","這是有己。"],["p","有己，就是以自己為中心。"],["p","無己呢？"],["p","無己，是讓耶穌，在我裡面活。"],["p","耶穌，是怎樣對待遭難的人？"],["p","祂不站在一旁。"],["p","祂從天上走下來。"],["p","祂進了我們的城門。"],["p","祂在我們最痛的日子，站在我們這一邊。"],["p","所以我們才有資格，在別人遭難的日子，伸手。"],["p","不是因為我們比較好。"],["p","是因為，有一個人，先為我們，伸過手。"],["p","第三步：國度就歸耶和華了。"],["p","第十五節，有一個字，要聽出來。"],["q","「耶和華降罰的日子臨近萬國。你怎樣行，他也必照樣向你行；你的報應必歸到你頭上。」"],["p","「日子」。"],["p","從第十一節到第十四節，"],["p","這個字，用了十次。"],["p","都是兄弟的日子：遭難的日子，被滅的日子，遭災的日子。"],["p","到了第十五節，同一個字，換了主人。"],["p","這是耶和華的日子。"],["p","你站在旁邊，看兄弟的日子。"],["p","現在，是耶和華，看你的日子。"],["p","這裡我們要小心。"],["p","「你怎樣行，他也必照樣向你行。」"],["p","這句話，常常被人拿來，當作報復的許可。"],["p","不是這樣。"],["p","這句話的主詞，是耶和華。"],["p","是神降罰，不是我去報仇。"],["p","羅馬書說："],["q","「伸冤在我，我必報應。」"],["p","報應的手，在神。"],["p","不在我們。"],["p","這句話，對受傷的人，是安慰。"],["p","你被人背叛，被人遺棄，被人傷害。"],["p","你心裡有一句話：這件事，有沒有人看見？"],["p","有。"],["p","公義有主，不必我來。"],["p","你可以，把那把刀，放下。"],["p","第十六節，說到一個杯。"],["p","所有的列國，都要喝。"],["p","耶利米書也說："],["q","「原不該喝那杯的一定要喝。」"],["p","沒有人是例外。"],["p","以東的故事，不只是以東的故事。"],["p","是所有站在一旁的人，"],["p","所有以為自己是例外的人，"],["p","的故事。"],["p","然後，聖經的筆鋒一轉。"],["p","第十七節："],["q","「在錫安山必有逃脫的人，那山也必成聖；雅各家必得原有的產業。」"],["p","逃脫的人。"],["p","你記得第十四節嗎？"],["p","以東站在岔路口，要把逃脫的人截下來。"],["p","可是神說：在錫安山，必有逃脫的人。"],["p","以東堵不住的那條路，神早就預備好了。"],["p","然後，十九、二十節，一連串的地名："],["p","南地，高原，以法蓮，撒馬利亞，基列，撒勒法，西法拉。"],["p","讀起來像地契。"],["p","可是你看這兩群人："],["p","被擄的以色列人，被擄的耶路撒冷人。"],["p","北邊的，南邊的，分裂了幾百年的兄弟，"],["p","站在同一張地圖上。"],["p","這是一個很大的盼望。"],["p","被趕散的，要回家。"],["p","被奪走的，要歸還。"],["p","這幾節，要小心讀。"],["p","它不是給任何今天的人，用來劃自己的疆界。"],["p","它也不是給我們，用來算日子、排時間表。"],["p","它是對一群被擄、被趕散、失去家園的人，說的安慰。"],["p","如果你今天，是一個覺得自己再也回不去的人，"],["p","我要告訴你：你所失去的，不是最後一頁。"],["p","然後，是最後一節："],["q","「必有拯救者上到錫安山，審判以掃山；國度就歸耶和華了。」"],["p","我最喜歡這個「上」字。"],["p","第三、四節，以東說：誰能把我拉「下」？"],["p","神說：我拉你「下」。"],["p","現在，方向反過來了。"],["p","拯救者，「上」到錫安山。"],["p","不是自己爬上去。"],["p","是被差遣上去。"],["p","他們上去，不是為了坐高位。"],["p","是為了審判，為了治理。"],["p","像士師記裡的拯救者，把百姓，從欺壓裡救出來。"],["p","然後，是這一句："],["p","「國度就歸耶和華了。」"],["p","全書最後一句話，不是刀。"],["p","不是勝利的歌。"],["p","是一句歸屬。"],["p","原文是「王權」。"],["p","詩篇說："],["q","「因為國權是耶和華的；他是管理萬國的。」"],["p","你有沒有發現？"],["p","這卷書，用了二十節，在講高處，講日子，講地。"],["p","最後，只剩一件事："],["p","誰是王？"],["p","以東想：我的山，我的安全。"],["p","雅各，也許在想：我們的產業，我們的仇。"],["p","可是神，最後說：王權，是我的。"],["p","這是主禱文的中心。"],["q","「國度、權柄、榮耀，全是你的，直到永遠。」"],["p","弟兄姊妹，這就是 321 的兩個核心："],["p","讓耶穌作王。"],["p","讓耶穌得著一切的榮耀。"],["p","歷史的結局，不是我們的任務清單。"],["p","我們不必當審判官。"],["p","我們也不必，替神把所有人擺平。"],["p","我們的位置，是回到本位："],["p","不拿權力，不爭高處，不站在一旁。"],["p","讓人作人，讓神作神。"],["p","讓耶穌，在我裡面活。"],["p","然後，我們才有力量，"],["p","在別人遭難的日子，伸手。"],["p","在自己遭難的日子，放下。"],["p","在一切的日子，等候王。"],["p","俄巴底亞，耶和華的僕人。"],["p","他留下的履歷，只有兩個字。"],["p","我們這一生，也是。"],["p","願神，在我們的名字後面，也只寫兩個字："],["p","僕人。"],["p","我們一起禱告。"],["p","主啊，求你拉下我們心裡的高處。"],["p","不是用羞辱，是用憐憫。"],["p","求你叫我們，在弟兄遭難的日子，不站在一旁。"],["p","求你安慰每一個，被人遺棄的人。"],["p","因為國度、權柄、榮耀，全是你的。"],["p","奉耶穌的名，阿們。"]]}},"issues":[{"id":"ISS00_1","t":"作者與年代：俄巴底亞是誰？這卷書寫在甚麼時候？","r":"1:1--14","ch":[1,1],"why":"書名「俄巴底亞」意思是「耶和華的僕人」，舊約另有多位同名的人，本書除了這個名字，沒有留下父親、家鄉、年代。全書也沒有自己標明年代，只能從 11–14 節所寫的事件去推：「外人擄掠雅各的財物，外邦人進入他的城門，為耶路撒冷拈鬮」。","pos":[["耶路撒冷淪陷（主前 586 年）之後","","11–14 節的畫面最貼近巴比倫攻陷耶路撒冷；詩 137:7、哀 4:21--22 也把以東與那一日連在一起；這是多數學者採用的讀法。"],["約蘭王時代（主前九世紀）","","王下 8:20--22 記載以東背叛猶大；代下 21:16--17 記載外敵入侵猶大、擄掠王宮財物；持這一說的人認為本書與約珥書同期。"],["年代不定，專注信息","","也有人主張：本書自己沒有標年代，無論哪一次，旁觀兄弟遭難、驕傲自恃的控告，重量都一樣。"]],"say":"本講義傾向第一說（與 10–14 節的畫面最貼近），但講台不依賴年代：不論哪一次，經文的重量都一樣。作者的名字就是一份最短的自傳——「耶和華的僕人」，沒有別的履歷。","care":"不要讓讀者覺得「要先把年代弄清楚才能讀這卷書」；讀這卷書不需要先解決它，也不需要在年代的看法上分門別類。","con":[]},{"id":"ISS00_2","t":"審判的信息：怎樣講才不變成恐嚇？","r":"1:2--9；1:15--16","ch":[1,1],"why":"全書大半是審判：被拉下、被搜尋、被除滅、被剪除、必無餘剩。審判的話若沒有對象，很容易變成對任何人的恐嚇，或對仇敵的咒詛。","pos":[["寫給受傷者的安慰","","被擄掠、被背叛的人，聽見公義有主：他們的哀求不是無人聽見。"],["寫給旁觀者的警告","","10–14 節控告的是「在兄弟遭難的日子站在一旁」的人，是對有能力而不作為的人說話。"],["不是教會用來恐嚇人的工具","","也有人提醒：審判的話應該先照在自己心裡，不拿來指著別人說「你們該受審判」。"]],"say":"本講義站在：審判是神的事，不是人的武器；信息先是安慰受傷的人，再是提醒旁觀的人，最後才輪到我們檢查自己心裡的高處。果效是更愛主、更靠近受難的人，不是更怕世界或更恨敵人。","care":"有人曾被背叛、被遺棄、被傷害，讀到審判會想起自己的仇敵：不鼓勵他「該恨誰」，也不要求他「馬上原諒」；先陪伴、確認安全，必要時協助尋求專業協助。","con":[]},{"id":"ISS00_3","t":"旁觀與苦難：「站在一旁」為甚麼也是罪？","r":"1:10--14","ch":[1,1],"why":"10–14 節的控告很特別：沒有說以東殺了誰，說的是「你竟站在一旁」「你不當瞪眼看著」「你不當進他們的城門」「你不當伸手搶他們的財物」。從旁觀，到同夥，到趁機得利，一路下滑。","pos":[["有能力而不作為","","控告的對象是弟兄，且有能力幫助：站在岔路口，不是無力；進城門、伸手搶，是趁機得利。"],["不是對所有無力的人說的","","有人提醒：受創傷的人、能力有限的人、自己也在逃命的人，不在被責之列；本段不拿來羞辱任何人。"],["從旁觀到同夥的下滑","","也有人從「像與他們同夥」這句看出：旁觀常常是第一步，後面還會有「歡樂」「說狂傲的話」「進城門」。"]],"say":"本講義站在：這段話的重點是「兄弟遭難的日子，你站在哪一邊」，不是「你為甚麼沒有拯救所有的人」。我們用它來檢查自己：曾在誰遭難時站在一旁、沒有伸手？但不用它羞辱受創傷、無力幫助的人。","care":"帶領人先保護人：不逼人當場認罪、不追問細節；有人曾被旁觀者傷害過，讀到這段會很痛，會後單獨關心，必要時協助尋求專業協助。","con":[]},{"id":"ISS00_4","t":"兄弟之爭：雅各與以掃，到底在說甚麼？","r":"1:6--10；創 25--33；36","ch":[1,1],"why":"以東是以掃的後裔（創 36），以色列是雅各的後裔；兩個民族的對立可以追到創世記兩兄弟的故事。俄巴底亞書卻把控告說成「你向兄弟雅各行強暴」，使整件事不只是國與國，而是家與家。","pos":[["創世記兩兄弟的回聲","","雙胞胎的故事（創 25--33）在歷史裡繼續：兄弟的不和、和好與再破裂，都留在兩個民族的記憶裡。"],["民族之間的歷史恩怨","","以東曾在曠野拒絕讓以色列人經過（民 20:14--21），也在猶大遭難時旁觀；這些累積成長久的對立。"],["新約怎麼讀以掃","","羅 9:13 引瑪 1:2--3；來 12:16--17 以以掃為警戒；新約都沒有把「以掃」等同任何現代民族。"]],"say":"本講義站在：這卷書要我們看見的是「兄弟」兩個字的分量，不是替任何今日的族群、國家貼標籤，也不為任何仇恨、排外背書。以東是以掃的後裔，這是歷史；不把「以東」逐字等同今日任何一個民族。","care":"不要讓讀者覺得「某個民族天生就是被神定罪的」；兄弟的結局是神的審判與國度，不是任何人的仇恨。","con":[]},{"id":"ISS00_5","t":"國度與歷史的終局：17–21 節怎麼讀？","r":"1:15--21","ch":[1,1],"why":"17–21 節說錫安山有逃脫的人、雅各家必得產業、被擄的人必得地、拯救者上到錫安山審判以掃山，最後說「國度就歸耶和華了」。這些話歷來有幾種讀法。","pos":[["歷史性的應驗","","被擄歸回，以色列人與猶大人重新得地；有人認為這些話在被擄歸回與其後的歷史中已有部分應驗。"],["教會論的讀法","","有人從新約看，把「錫安山」與「拯救者」讀成基督與祂的教會；新約的屬靈以色列也在其中。"],["末世性的讀法","","有人認為這是末後神的國完全顯現的預告，到那日萬國都要在耶和華的王權之下。"]],"say":"本講義並陳各家，不排時間表、不算日子，也不拿這些節作任何現代領土或政治主張的根據。落點只有一句：21 節「國度就歸耶和華了」，與主禱文「國度、權柄、榮耀，全是你的」同聲相應：歷史的終點是王，不是我們的任務清單。","care":"不要因為解釋不同而分門別類、互相論斷；也不要把這幾節用來製造對任何民族或國家的恐懼或敵意。讀完要更愛主，不是更怕世界。","con":[]},{"id":"ISS01_1","t":"俄巴底亞是誰？這卷書寫在甚麼時候？","r":"1:1","ch":[1],"why":"一、「俄巴底亞」是誰？舊約另有多位同名的人（和合本譯作「俄巴底」「俄巴底亞」「俄巴底雅」），例如王上 18:3 亞哈的家宰俄巴底。本書自己沒有交代父親、家鄉與年代。二、這卷書寫在耶路撒冷淪陷之後，還是更早？","pos":[["與王上 18 章的家宰同一人","","有古老的猶太傳統這樣認為：那位在耶洗別殺先知時藏了一百個先知的俄巴底（王上 18:3--4），就是這位先知。但經文沒有這樣說。"],["另一位同名的先知，不可考","","多數現代學者認為這是另一個人：同名者很多，本書沒有任何資料可以把他與誰連在一起。"],["年代：主前 586 年之後，或更早","","10--14 節的畫面最貼近耶路撒冷淪陷；也有人主張在約蘭王時代（王下 8:20--22；代下 21:16--17）。詳見 議題「作者與年代：俄巴底亞是誰？這卷書寫在甚麼時候？」。"]],"con":[],"say":"本講義依 議題「作者與年代：俄巴底亞是誰？這卷書寫在甚麼時候？」：作者的名字就是一份最短的自傳，耶和華的僕人；年代傾向淪陷之後，但講台不依賴年代。","care":"不要讓聽的人覺得要先解決作者與年代，才能讀這卷書。"},{"id":"ISS01_2","t":"與耶利米書 49 章的先後與關係是甚麼？","r":"1:1--9；耶 49:7--22","ch":[1],"why":"一、俄巴底亞書與耶利米書 49:7--22 有許多相同的句子（例如「我從耶和華那裡聽見信息，並有使者被差往列國去」，耶 49:14 與俄 1），次序與措詞略有不同。二、是誰引用誰？","pos":[["俄巴底亞在先，耶利米引用","","有人認為耶利米熟悉這份更早的神諭，並加以引用與改寫。"],["耶利米在先，俄巴底亞引用","","有人認為俄巴底亞在耶路撒冷淪陷之後，把耶利米的話放進新的處境（10--14 節的新控訴）。"],["兩者引用更早的同一個神諭","","也有人主張，兩者都引用一份在以東傳誦的更早神諭，各自編入自己的書。"]],"con":[],"say":"本講義不裁判。不論哪一種，這一句「我從耶和華那裡聽見信息」都是神的話；耶 49 章的存在，也提醒我們：先知的話是被一再傳講、一再應用的。","care":"不要把這個題目變成「誰抄誰」的辯論；這不影響信息的重量。"},{"id":"ISS01_3","t":"以東是誰？從西珥山地到後來的以土買，是怎樣的一段歷史？","r":"1:1--2；創 36:8","ch":[1],"why":"一、以東是誰？創 36:8 說「以掃就是以東」，住在西珥山裡。二、「以土買」（新約時代的稱呼）與以東有甚麼關係？三、為甚麼先知對以東說話這樣重？","pos":[["以東是以掃的後裔，住在西珥山地","","這是聖經自己的說法，也是本卷書的基礎。摩西時代以東已有王，曾拒絕讓以色列人經過（民 20:14--21）。"],["後來的以土買","","學者一般認為，後來以東人被拿巴天人排擠，遷入猶大南地，希臘文稱為「以土買」；新約時代的希律家出自以土買人（太 2:1 只作歷史背景）。"],["「以東」作為象徵","","有人認為「以東」後來也成為「驕傲敵擋神子民的勢力」的象徵；但不應因此把它對應任何今天的族群。"]],"con":[],"say":"本講義站在：以東是以掃的後裔，是歷史中的一個民族，也是「驕傲且旁觀」的畫像；不把「以東」逐字等同今日任何族群或國家。","care":"不為任何仇恨、排外、種族主義背書；先知控告的是行為與驕傲，不是血統。"},{"id":"ISS01_4","t":"11 節「站在一旁」與 13 節「伸手搶」：以東實際做了甚麼？","r":"1:11--14","ch":[1],"why":"一、11 節「站在一旁」（מִנֶּגֶד）是袖手旁觀，還是站到敵對的一邊？二、12--14 節說「不當進城門」「不當伸手搶」「不當站在岔路口剪除逃脫的」，是否表示以東實際動手？","pos":[["旁觀與同夥","","經文只說「站在一旁」，卻說「像與他們同夥」；強調旁觀者的責任，不一定表示以東自己攻城。"],["實際參與搶掠與截殺","","12--14 節的動詞（進、伸手、剪除、交付）是行動；詩 137:7、結 25:12、結 35:5 也提到以東的作為，有人由此讀成以東確實參與。"],["歷史細節不明","","也有人認為經文沒有交代細節；本書的重點是道德的控告，不是還原軍事經過。"]],"con":[],"say":"本講義站在：經文自己說得最清楚的是「像與他們同夥」與八個「不當」；歷史細節不明，不補充經文沒有說的。","care":"這段話是對「有能力而不作為，甚至趁機得利」的人說的；不用來羞辱受創傷、無力幫助的人（議題「旁觀與苦難：『站在一旁』為甚麼也是罪？」）。"},{"id":"ISS01_5","t":"「耶和華的日子」在俄巴底亞書、約珥書與阿摩司書有何異同？","r":"1:8；1:15","ch":[1],"why":"一、15 節說「耶和華降罰的日子臨近萬國」。這個「日子」與約珥書（1:15；2:1；3:14）、阿摩司書（5:18--20）的「耶和華的日子」是同一件事嗎？二、「臨近」是甚麼意思？","pos":[["共同的詞，各自的用法","","約珥書 1:15 也說「耶和華的日子臨近了」；阿摩司書 5:18 說想望這日的有禍了，因為「那日黑暗沒有光明」。三卷書各有自己的對象與處境。"],["俄巴底亞書的特點","","這裡的日子與兄弟的日子緊緊相扣（11--14 節的「日子」，在 15 節換了主詞）；審判的標準是「你怎樣行，他也必照樣向你行」。"],["是一個日子，還是多次的日子","","有人讀成歷史中神多次的審判；有人讀成末後的終局審判；也有人兩者並讀。"]],"con":[],"say":"本講義並陳各家，不排時間表、不算日子。只看它的作用：「日子」換了主詞，把人帶到神面前。","care":"不要用「耶和華的日子」製造恐慌；果效是忍耐與更愛主，不是恐慌。"},{"id":"ISS01_6","t":"15 節的報應：是報復的許可嗎？基督徒怎麼看伸冤？","r":"1:15--16；羅 12:19","ch":[1],"why":"一、「你怎樣行，他也必照樣向你行」是否允許受害者以牙還牙？二、基督徒怎麼理解「伸冤」？三、不報復，是否表示不追求公義？","pos":[["神的審判，不是人的許可","","本節主詞是耶和華：「耶和華降罰的日子」。羅 12:19 說：「伸冤在我，我必報應。」報應的手在神。"],["同態報復的公義尺度","","「以眼還眼，以牙還牙」（出 21:24）原是限制報復的尺度，不是鼓勵。耶穌在太 5:38--39 進一步說：不要與惡人作對。"],["把審判交給神，也不放棄保護與公義","","也有人提醒：不自己伸冤，不表示不保護受害者、不追究傷害；這兩件事並不矛盾。"]],"con":[],"say":"本講義依 議題「審判的信息：怎樣講才不變成恐嚇？」：15 節是神的審判，不是人報復的許可；受害者可以把那把刀放下，因為公義有主。","care":"不要要求受傷的人「馬上原諒」，也不要用這一節鼓勵報復。受傷的人先需要被保護、被陪伴；必要時協助尋求專業協助。"},{"id":"ISS01_7","t":"17–21 節的錫安、產業與領土：有哪幾種讀法？","r":"1:17--21","ch":[1],"why":"一、17--21 節的錫安、產業、被擄的人必得地，是甚麼時候、怎樣應驗？二、這幾節能不能作為任何現代領土或政治主張的根據？","pos":[["歷史性的應驗","","被擄歸回，以色列與猶大人重新得地；也有人指向後來的歷史（如以東地被併入猶大）。"],["教會論的讀法","","有人從新約看：神的百姓不再以疆界為界。新約自己作過的連結是阿摩司書 9:11--12 與徒 15:16--17（外邦人尋求主），而不是直接引用俄巴底亞書。"],["末世性的讀法","","有人認為這是末後神的國完全顯現的預告：到那日萬國都在耶和華的王權之下。"]],"con":[],"say":"本講義依 議題「國度與歷史的終局：17–21 節怎麼讀？」：並陳各家，不排時間表、不算日子，也不拿這幾節作任何現代領土或政治主張的根據；落點只有 21 節。","care":"不要因解釋不同而分門別類；也不要把這些地名用來製造對任何民族或國家的恐懼或敵意。"},{"id":"ISS01_8","t":"21 節的「拯救者」是誰？","r":"1:21","ch":[1],"why":"一、「必有拯救者上到錫安山，審判以掃山」，這些「拯救者」（מוֹשִׁעִים，複數）是誰？二、「審判」（לִשְׁפֹּט）是定罪，還是治理？","pos":[["像士師記一樣的拯救者","","士 3:9、15 的「拯救者」是神興起的人；原文是複數，可指一批被神差遣的人。"],["被拯救的人","","有些古譯本把這個字讀成被動，「被拯救的人要上到錫安山」。"],["這使我們想起那位拯救者","","有人認為最終指向基督。新約沒有直接引用這一節，所以這是「使我們想起」的連結，不是「這是預言」。"]],"con":[],"say":"本講義並陳各家，不下定論：落點不是「拯救者是誰」，而是「國度就歸耶和華了」。","care":"不要為了證明預表而讓經文說出它沒有說的話。"},{"id":"ISS01_9","t":"以掃與雅各：新約怎麼讀？","r":"1:10；創 25--33；羅 9:13；來 12:16--17；瑪 1:2--5","ch":[1],"why":"一、新約怎麼讀以掃？羅 9:13 說：「雅各是我所愛的；以掃是我所惡的。」二、來 12:16--17 把以掃當作警戒。三、瑪 1:2--5 說到以東的後來。","pos":[["揀選的主權","","羅 9:13 引瑪 1:2--3，在講神的揀選；創 25:23 早已說「大的要服事小的」。有人讀成民族與家系的揀選，有人讀成個人。"],["「惡」的語意","","有人指出，聖經裡「愛」「惡」常是比較的語言（如創 29:30--31 的「愛」與「失寵」），不一定是情緒的恨。"],["以掃作為警戒","","來 12:16--17 講的是「貪戀世俗」，以一點食物賣掉長子名分；瑪 1:4 記載以東人說「我們現在雖被毀壞，卻要重建」，神回答：「任他們建造，我必拆毀」。"]],"con":[],"say":"本講義依 議題「兄弟之爭：雅各與以掃，到底在說甚麼？」：這些經文要並陳讀；不拿來說「某些人被神恨惡」，也不把以掃等同任何現代族群。","care":"不要對任何人說「你被神恨惡」；這些經文是對驕傲與貪戀世俗的警戒，也是神主權的宣告，不是給任何人貼標籤。"}],"terrain":{"points":[[1.0,60,0,"使者被差往列國",null],[1.048,46,0,"在列國中為最小",null],[1.095,30,0,"誰能將我拉下地去呢","bot"],[1.238,20,0,"隱密處被搜尋",null],[1.381,14,0,"勇士驚惶，被殺戮剪除",null],[1.476,6,0,"你竟站在一旁","bot"],[1.571,12,0,"不當進他們的城門",null],[1.667,52,0,"耶和華降罰的日子臨近",null],[1.762,78,0,"錫安山必有逃脫的人","top"],[1.857,88,0,"得地為業",null],[1.952,100,0,"國度就歸耶和華了","top"]]},"tracks":[{"gk":"יָרַד","tr":"yarad","gl":"下去、拉下（與高、上）","code":"H3381","root":"√ירד（下去、降下）","n":10,"stops":[["1:1","「起來吧，一同起來」列國被召「起來」：全章的第一個動作是向上，要把高處的拉下來。",""],["1:2","「在列國中為最小的」神一開口，就先降低以東的位置：最小、被藐視。",""],["1:3","「居所在高處」以東的保障：山穴、高處。人把自己安在高處，心就說「誰能將我拉下地去」。",""],["1:4","「我必從那裡拉下你來」神的回答用的是以東自己那個字：「下去」。拉下，不在地上，在「星宿之間」也拉得下。","top"],["1:5","「你何竟被剪除」賊來也會留下些，以東卻被搜刮淨盡：高處不是保障。",""],["1:12","「你不當說狂傲的話」「張大口」說狂傲的話：驕傲在別人遭難的日子，又長了出來。",""],["1:21","「必有拯救者上到錫安山」方向翻轉：驕傲的被拉下，拯救者「上去」。審判者不是自己往上爬，是被神差遣上去。","top"]],"ins":"高與下是這一章的上下軌道。以東住在「高處」（מָרוֹם，3 節），如大鷹「高飛」（תַּגְבִּיהַּ，4 節），心裡說「誰能將我拉下地去」（יוֹרִדֵנִי，3 節）；耶和華回答「我必從那裡拉下你來」（אוֹרִידְךָ，4 節），用的是同一個動詞「下去」（יָרַד）。到了 21 節，方向翻轉：不是驕傲的人上去，而是「拯救者上到錫安山」（וְעָלוּ）。驕傲是自己往上爬、離開本位；謙卑是回到本位，讓神作神。"},{"gk":"אָח","tr":"ach","gl":"兄弟（雅各與以掃）","code":"H251","root":"√אחה（兄弟）","n":12,"stops":[["1:6","「以掃的隱密處」「以掃」的名字第一次出現：全章對以東的稱呼，從這裡轉成兄弟的名字。",""],["1:8","「從以掃山除滅聰明人」以掃山：以東的高地，智慧人要被除滅。",""],["1:9","「以掃山的人都被殺戮剪除」山與人連在一起說：整個以掃家的盼望都壓在這座山上。",""],["1:10","「你向兄弟雅各行強暴」全章的控告：不是兩個國家的恩怨，是「兄弟」之間的強暴。","top"],["1:12","「你兄弟遭難的日子」第二次說「你兄弟」：連續四個「不當」，都從這個稱呼起頭。",""],["1:17","「雅各家必得原有的產業」雅各家的盼望：逃脫的人、成聖的山、原有的產業。",""],["1:18","「以掃家必如碎稭」雅各家如火、以掃家如碎稭：兩個兄弟的家在這節分開。",""],["1:19","「必得以掃山」以掃山成了別人得地之處：曾經的高處，換了主人。",""],["1:21","「審判以掃山」兩座山對面：錫安山上有拯救者，以掃山被審判；結局只有一句：國度歸耶和華。","top"]],"ins":"兄弟的故事從創世記就開始（創 25--33），到俄巴底亞書成了歷史的回聲。這一章「以掃」出現 7 次、「雅各」3 次、「兄弟」2 次（10、12 節）。控告的出發點不是兩個國家，是兩個兄弟：「你向兄弟雅各行強暴」。這一句提醒我們：關係的次序若是顛倒——先抓住權力、再傷害人——到最後連「兄弟」兩個字都成了控告書。到 21 節，兩座山相對：錫安山上有拯救者，以掃山被審判，最後的主角不是任何一個兄弟，是耶和華自己。"},{"gk":"יוֹם","tr":"yom","gl":"日子、那日","code":"H3117","root":"√יום（日、日子）","n":12,"stops":[["1:8","「到那日」神的日子第一次出現：祂要在那日除滅以東的智慧人。",""],["1:11","「為耶路撒冷拈鬮的日子」兄弟遭難的日子：外人拈鬮分城，以東竟站在一旁。",""],["1:12","「你兄弟遭難的日子」12 節連用四次「日子」：不當瞪眼、不當歡樂、不當說狂傲的話。","top"],["1:13","「我民遭災的日子」13 節再用三次：不當進城門、不當瞪眼、不當伸手搶財物。",""],["1:14","「他們遭難的日子」最後一次說兄弟的日子：不當站在岔路口，不當將逃脫的人交付仇敵。",""],["1:15","「耶和華降罰的日子臨近萬國」全章樞紐：同一個字，主詞換了——不再是兄弟遭難的日子，是「耶和華的日子」。","top"]],"ins":"「日子」（יוֹם）全章 12 次：8 節的「到那日」1 次，11–14 節連續 10 次都是兄弟的日子（遭難、被滅、遭災），15 節是「耶和華的日子」。同一個字，主詞換了：你站在旁邊看兄弟的日子，轉成耶和華看你的日子。這不是時間表，不給任何人算日子；它是一條提醒：人在別人的日子裡做的事，神記在自己的日子裡。"}],"lesson":{"1":{"no":1,"vol":"《321俄巴底亞書講義》第1課·俄巴底亞書第1章","title":"國度就歸耶和華了——高、兄、國","chars":4940,"min":60,"deep":8,"dchars":1666,"tchars":1319,"blocks":[["h","一、誰能將我拉下地去（1:1–9）"],["p","弟兄姊妹平安。請你想像這樣一個晚上：手機亮了，螢幕上是一位老朋友的名字。你知道他最近家裡出了事，也猜得到他是想找人說說話。你看了一眼，沒有接，心裡想：我明天再回他。第二天你忘了，第三天更不好意思了。這件事裡，你沒有說過一句傷人的話，沒有拿過人一分錢，也沒有做過任何「壞事」。可是今天我們要讀的這一章聖經，要問你一個很不舒服的問題：站在一旁，算不算有份？"],["p","俄巴底亞書只有一章、二十一節，是舊約最短的一卷。第一節說：「俄巴底亞得了耶和華的默示。」這個名字的意思，一般解作「耶和華的僕人」；除此之外，經文沒有交代他的父親、他的家鄉，也沒有說他是哪一個王的時候說話。這是一個誠實的起點：我們對這位先知所知不多，作者與年代的種種看法，講義的議題另有並陳。今天先記住一件事：不認識他沒有關係，聽見從耶和華那裡來的信息，就夠了。第一節接著說，這信息是「論以東」。以東，就是以掃的後裔，是雅各的哥哥的子孫。"],["p","先看以東住在哪裡。第三節說：「住在山穴中、居所在高處的啊，你因狂傲自欺，心裡說：誰能將我拉下地去呢？」請留意兩個地方。一是「山穴」「高處」，這是地理：一般認為，以東人的地方多山多石，易守難攻。二是「心裡說」，這是心理。經文沒有說以東大聲誇口，是說他「心裡說」。最危險的驕傲，常常不是掛在嘴上的，是藏在心裡、被地形與資源養壯了的那一句：沒有人動得了我。"],["p","這句話，換個場景，就是我們的話。我有存款，所以我不怕；我有職位，所以沒有人能動我；我有人脈、有資歷、有家世，所以我不需要任何人。第四節的回答只有一句：「你雖如大鷹高飛，在星宿之間搭窩，我必從那裡拉下你來。這是耶和華說的。」大鷹已經是空中的王，星宿之間，高得不能再高。可是「我必拉下」的主詞，是耶和華。高處不是保障。與其問你住在哪裡，不如問：你的安全，放在哪裡？"],["p","五到九節，是這座山穴一層一層被拆開的過程。盜賊來了，只偷到夠；摘葡萄的人來了，還會剩下些葡萄（5節）；可是這一次，連隱密處都被搜出來（6節）。最痛的是第七節：「與你結盟的都送你上路，直到交界；與你和好的欺騙你，且勝過你；與你一同吃飯的設下網羅陷害你。」被拆掉的，除了山穴，還有人：盟友、朋友、同桌吃飯的人。第八、九節說，連智慧人、勇士，也救不了。這一段不是只寫給以東聽的。它問每一個把安全放在別處的人：若有一天，你的盟友轉身，你的智慧用盡，你剩下甚麼？"],["d",["這一段是在說以東被神恨惡、活該被拆毀嗎？","不是這樣讀。經文控告的是「狂傲自欺」與後面要看的「向兄弟行強暴」，是具體的心態與行為，不是血統，也不是一個民族天生的身分。聖經裡「愛」與「惡」的用語，有些地方是比較的語言，不一定是情緒的恨；這在議題「以掃與雅各：新約怎麼讀」裡有並陳。這一章還有一個更大的方向：結局不是以東消失，是「國度就歸耶和華了」。神拆的是高處的安全感，不是某一群人存在的價值。所以講這一段，不要把「以東」指到今天任何一個族群或國家；它是歷史中的一個民族，也是一幅「驕傲且旁觀」的畫像。"]],["h","二、你竟站在一旁（1:10–14）"],["p","第十節是全卷的轉折：「因你向兄弟雅各行強暴，羞愧必遮蓋你，你也必永遠斷絕。」前面九節講的是結果，這一節第一次說了理由。請留意兩個字：兄弟。以東和雅各，是一對雙生子的兩條線；創世記裡，那是一場分得很痛的故事：長子名分、祝福、逃亡、多年的分離。神說：你向「兄弟」行強暴。不是向陌生人，不是向敵人，是向本來應該站在同一邊的人。傷人最深的，往往就是這個距離最近的人。"],["p","十一節的畫面很具體：「當外人擄掠雅各的財物，外邦人進入他的城門，為耶路撒冷拈鬮的日子，你竟站在一旁，像與他們同夥。」請注意這句話的順序：先說「站在一旁」，再說「像與他們同夥」。這一節沒有說以東當時拿了刀。它說的是：你站在那裡，你的站位本身，就是一種選擇。旁邊，不是中立。"],["p","十二到十四節接著有八個「不當」：不當瞪眼看著、不當因此歡樂、不當說狂傲的話；不當進他們的城門、不當瞪眼看著他們受苦、不當伸手搶他們的財物；不當站在岔路口剪除逃脫的、不當將剩下的人交付仇敵。把這八件事排起來，有一個走向：從眼睛（看），到心（樂），到口（說），到腳（進城門），到手（搶），到截殺與出賣。罪不是一下子跳進最深的地方，是一步一步下去的。第一步，就是那雙「瞪眼看著」的眼睛。"],["p","這裡要老實說一句：十一到十四節裡，以東實際做了甚麼，各家的看法並不一致。有人讀成以東只是旁觀，甚至幸災樂禍；也有人讀成以東確實參與了搶掠與截殺。經文自己說得最清楚的，是「像與他們同夥」和這八個「不當」。我們不補經文沒有說的細節。可是有一點，不論哪一種讀法，都躲不過：神的控告，從「看」就開始了。"],["p","這一段，要特別小心地講。經文對的是「有能力、有機會，卻不作為，甚至趁機得利」的人。它不是對每一個在災難中嚇呆的人、沒有力量的人、自己也在逃命的人說的。如果你曾經被人旁觀過，你知道那種痛；如果你曾經在別人需要的時候幫不上忙，你可能一直帶著愧疚。請你先聽見這句話：神的控告，不是拿來壓人的，是拿來保護受害的人，也是喚醒那些本來可以伸手的人。"],["d",["我當時真的幫不上忙，是不是也算站在一旁？","先分辨兩件事。經文責備的，是有能力而不作為、甚至「瞪眼看著」「歡樂」「伸手搶」的人；它沒有說，每一個力量不夠、自己也在逃命的人，都和以東同罪。如果你當時是嚇呆了、不知道怎麼辦，或自己也在受苦，這是人的有限，不是以東的罪。可以問自己的，不是「我有沒有愧疚」，而是三個比較實際的問題：我當時看見了嗎？我有沒有一件小事是做得到的，例如一句話、一通電話？我現在還有沒有一個機會，補上一點點？愧疚若把你推向神、推向那位受傷的人，它是好的；若把你推向自責與躲藏，就把它帶到十字架前，交給那位先為我們伸手的主。"]],["h","三、原文亮光：下去、兄弟、日子（1:3–4、10–15）"],["p","讀這一章，有三個希伯來字，像三根釘子，把整卷釘在一起。第一個是 יָרַד（yārad），「下去」。第三節的「拉下」，原文是 יוֹרִדֵנִי，意思是「誰能把我帶下去」；第四節神的回答，用的是同一個字根：אוֹרִידְךָ，「我必使你下去」。同一個動詞，一次在以東心裡，一次在神口中。以東問：「誰能？」神說：「我。」"],["p","這個字根，在舊約別的地方，也常用在神親自「下來」的場合。我們的主，沒有住在高處不下來。腓立比書二章說，祂本有神的形像，卻「虛己，取了奴僕的形像」，又「自己卑微，存心順服，以至於死，且死在十字架上」。以東說：沒有人能拉我下去；耶穌卻自己走了下去。這是這一章的福音：驕傲的人怕被拉下，愛人的神自己下去。"],["p","第二個字是 אָח（ʾāḥ），「兄弟」。在這一章，這個字出現在第十節和第十二節，經文用的不是「鄰國」，也不是「仇敵」，是「你的兄弟」。傷人最深的，不是敵人的刀，是兄弟的轉身。可是請你留意：「兄弟」這個詞，同時是控告，也是邀請。神沒有說「你已經不是兄弟了」，祂說「你向兄弟行強暴」；兄弟的身分還在，所以責任才還在。"],["p","第三個字是 יוֹם（yôm），「日子」。從十一節到十四節，「日子」反覆出現：你兄弟遭難的日子、猶大人被滅的日子、我民遭災的日子。這是「兄弟的日子」。到了第十五節，經文突然換了主詞：「耶和華降罰的日子臨近萬國。」兄弟的日子，變成耶和華的日子。那一天，沒有人是旁觀者，因為所有的人，都站在祂面前。這個「日子」與約珥書、阿摩司書的異同，議題裡有並陳；今天只抓住一件事：日子換了主人。"],["d",["讀希伯來文，對一般弟兄姊妹有甚麼用？","不需要懂希伯來文，也能讀這一章；原文亮光的用處，是讓你看見經文自己的重複。這一章同一個動詞「下去」，一次出現在以東口中，一次出現在神口中，你就看見這不是巧合，而是一個對答：以東說「誰能」，神說「我」。「兄弟」「日子」也是一樣。重複的字，是作者留給我們的路標。你可以用這個辦法讀任何一章：先找出反覆出現的詞，再問它在每一次出現時，換了甚麼主詞、換了甚麼意思。這比背單字重要。用原文只為一件事：幫助你更靠近經文，不是用來顯示自己懂得多。"]],["h","四、國度就歸耶和華了（1:15–21）"],["p","第十五節的前半是「耶和華降罰的日子臨近萬國」，後半是：「你怎樣行，他也必照樣向你行；你的報應必歸到你頭上。」很多人讀到這一句，心裡會有一個聲音：太好了，那些傷害我的人，終於有報應了。這個心情很真實，我們不用急著責備它。可是請你看這句話的主詞：是「耶和華降罰」，不是你去降罰。羅馬書十二章十九節說：「不要自己伸冤，寧可讓步，聽憑主怒。」報應的手，在神手裡。"],["p","第十六節說，猶大人在聖山喝過的苦杯，萬國也必照樣喝。這一節裡，「猶大人」與「杯」，是和合本按上下文補上的字，原文另有不同的讀法，議題裡有說明。這裡不爭辯，只看一件事：先喝的，是神自己的子民。所以這一章不是「我們這一邊贏」的歌，是「全地都要站在王面前」的宣告。我們也不能讀完十到十四節，再讀十八節，就把自己放在「雅各家」那一邊，忘了我們也可能站在以東那一側。"],["p","十七到二十節講的是「得地」：逃脫的人、成聖的山、原有的產業、南地、高原、非利士地、撒馬利亞地、基列、撒勒法、西法拉。這一段很容易被拿去算地圖，甚至拿去作今天某個地區的根據。我們不這樣讀。這些話，是對剛剛失去一切、被擄在外的人說的安慰：你們沒有被忘記。關於這幾節的幾種讀法，議題裡有並陳；講台上，我們不排時間表，不把任何地名，對到今天的國家。"],["p","然後是第二十一節：「必有拯救者上到錫安山，審判以掃山；國度就歸耶和華了。」請你看整卷書的方向：一開始是「誰能將我拉下地去」，往下；最後是「上到錫安山」，往上。一開始，是以東住在高處；最後，是拯救者上到山上。這位「拯救者」是誰，有不同的讀法，議題裡有並陳；這使我們想起那位真正的拯救者。新約沒有直接引用這一節，所以我們只說「使我們想起」，不說「這就是預言」。"],["p","這一章最後一句，不是「以掃被毀了」，也不是「雅各贏了」，是「國度就歸耶和華了」。整卷書的問題，其實是：誰是王？以東說：我是自己的王，我的山就是我的保障。可是雅各家也不是自己的王。最後，國度歸給那位本來就是王的。這句話，對一個被傷害的人是安慰：你不必自己討回公道，王在。這句話，對一個站在一旁的人是呼召：你不是旁觀者，你在王的國度裡，你要怎樣活？"],["d",["十五節說「你怎樣行，他也必照樣向你行」，我能不能因此期待那個傷害我的人受報應？","你可以把傷痛、憤怒與公義的渴望，誠實地告訴神；詩篇裡有很多這樣的禱告。可是這一節的主詞是耶和華，不是受害者。羅馬書十二章說「伸冤在我，我必報應」，意思是：你可以把那把刀放下，因為公義有主。這不表示你要假裝沒事、馬上原諒，也不表示你不能保護自己、不能報案、不能要求對方為傷害負責；保護與追究，和不自己報復，並不矛盾。若你仍在傷痛之中，請先找一個可信的人陪你，必要時尋求專業的協助。這一節是用來安慰受傷的人的，不是用來給人一把武器的。"]],["d",["「國度就歸耶和華了」是已經發生的，還是將來才會發生的？","這是一個值得並陳的問題。有人讀成：在歷史中，神一再收回祂的權柄；有人讀成：這是末後終局的宣告；也有人兩者並讀：已經開始，尚未完全。講義不裁判，也不排時間表。你可以先抓住兩件穩的事：第一，這句話在經文裡是寫給受傷、被擄的人聽的，作用是安慰與盼望；第二，它的對象不是只有以東，也包括所有以為自己可以作王的人，包括我們。無論你怎麼理解時間，今天都可以回應：把你一直想自己作主的那個角落，交還給王。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把「以東」直接等同今天某一個族群或國家。經文的以東，是以掃的後裔，是歷史中的一個民族，也是「驕傲且旁觀」的畫像。把它對到今天的任何人群，往往帶來仇恨與歧視，這與經文的方向完全相反。檢驗標準很簡單：講章裡有沒有點名任何現代的族群或國家？有，就刪。"],["p","第二個偏差，是拿十五節作報復的許可。這一節的主詞是耶和華，不是你。受傷的人若聽完，得到的是一把武器，那就講錯了；若得到的是可以放下刀的安息，才是這一節的方向。"],["p","第三個偏差，是用十七到二十節作領土主張，或排進末世的時間表。這些話是對被擄之民的安慰。講章裡若出現日期、年份、預測，或把地名對到今天，就要刪。果效是忍耐，不是恐慌。"],["p","第四個偏差，是用「站在一旁」去羞辱受創傷、無力的人。十一到十四節對的是有能力而不作為、甚至趁機得利的人。若一位正在流淚、或自己也在逃命的弟兄姊妹，聽完是被指責，而不是被理解，我們就講錯了。"],["p","第五個偏差，是把審判講成恐嚇，或把以掃與雅各簡化成「某些人被神恨惡」。這一章先是對受傷者的安慰，也是對驕傲者的呼召。不要對任何人說「你被神恨惡」；這些經文是對驕傲與貪戀世俗的警戒，不是貼在人身上的標籤。"],["d",["如果我不確定某一句話算不算偏差，怎麼檢查？","用三個問題檢查。第一，這句話是從這一章經文自己說出來的，還是我從別處帶進來的？第二，聽的人裡面，若有一位正在受傷、無力、被人旁觀過的人，他聽完是更靠近神，還是更覺得被定罪？第三，這句話有沒有把任何一群人，當成可以恨的對象？如果第一個問題答不出經文的根據、第二個答案是「被定罪」、第三個答案是「有」，就先不要講，改成經文自己的話。還有一個最簡單的辦法：把你要講的話，先講給一位你信任的弟兄姊妹聽，問他聽完有甚麼感覺。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們從小被教導「各人自掃門前雪」「少管閒事」「明哲保身」，這是不是就是站在一旁？這句話有它保護人的一面：在一個動盪的環境裡，不隨便介入，有時是智慧；若別人的事我沒有能力，也不必硬扛。可是俄巴底亞書提醒我們：當有能力、有機會、而且是「兄弟」遭難的日子，「少管閒事」若成了我們不伸手的理由，我們就要問自己：我保護的，是別人，還是我自己的安全？不必一次背起所有人的苦難，可是請做得到的那一小件事：一通電話、一句問候、一個名字的禱告。"],["p","第二個問題：華人的家族裡，兄弟為了財產、為了照顧父母、為了誰對誰錯，反目成仇，「家醜不外揚」，旁人不敢開口，只好站在一旁。俄巴底亞書說的，正是一對兄弟的故事。神看重的，不是誰的面子，是兄弟之間的行強暴與旁觀。若你正處在這樣的關係裡，請先從自己開始，不是等對方先改。若你是被傷害的一方，不需要馬上原諒，也不需要假裝沒事；可以先找一位可信的長輩或牧者陪你，必要時尋求專業協助。若你是站在一旁的那個人，請試著在安全的前提下，對你的兄弟說一句：「我在。」"],["d",["不站在一旁，是不是就要把所有人的苦難都扛起來？","不是。經文責備的，是有能力、有機會，卻瞪眼看著、歡樂、伸手搶的人，沒有要求每一個人背起所有人的苦難。你的力量、時間、心力都有限，耶穌自己也沒有一次醫好所有的人。可以這樣問：我眼前這一位，是誰？我今天做得到的那一件小事，是甚麼？一通電話、一句問候、一個名字的禱告，都是伸手。若你自己也在筋疲力盡之中，先照顧好自己，也是對神的信實，因為人只有先被扶住，才有力量扶人。不站在一旁的意思，是不把「我做不了全部」當成「我甚麼都不用做」的理由。"]],["h","七、活出321——高處、一旁與國度"],["p","三個基礎。耶穌是我的榜樣：祂本有神的形像，卻不以與神同等為強奪的，反倒虛己、自己卑微，走下去，進到我們的遭難裡，沒有站在一旁。聖經是我的準則：這一章把驕傲、旁觀與國度的次序，說得清清楚楚，我們不添、不減，也不把它拿去傷人。聖靈是我的引導：祂提醒我們，哪一位弟兄姊妹，今天需要一通電話；祂也在我們想站在一旁的時候，輕輕推我們一把。"],["p","兩個核心。讓耶穌作王：把我那座「山穴」交給祂，職位、積蓄、人脈、資歷，都放回祂的手裡，我就不必自己保護自己，也不必為了自保而站在一旁。讓耶穌得著一切的榮耀：「國度就歸耶和華了」，一切都是神在耶穌裡所作所成就的，不是我的山高，也不是我的手快，我只是回到本位。"],["p","一個目的，是建立屬神的體系。屬神的體系，不是一群住在高處、彼此防備的人，是一群在彼此遭難的日子，伸手的兄弟姊妹。驕傲，是離開人的本位，抓住神的權力，想要代替神；謙卑，是放下權力，回到本位，讓人作人，讓神作神。以東問「誰能將我拉下去」，我們的回答是：我自己下來，不用你拉。無己，就是不抓高處、不站旁邊；先生命，再關係，後事工。"],["h","八、四種心，四條回家的路"],["p","驕傲型的人，常把安全放在「我有」：我有職位、有積蓄、有資歷。這種心，聽見「誰能將我拉下地去」會點頭，因為那就是他的話。回家的路，是在高處對神說：「主啊，我的安全是你。」每天一分鐘，把你的山穴，一件一件交出去。"],["p","恐懼型的人，把站在一旁當成保護自己的辦法：我怕被牽連，我怕得罪人，我怕自己也受傷。這種心，聽見「不當瞪眼看著」會緊張。回家的路，是先承認害怕，不必假裝勇敢，再選一件很小的、安全的事去做：一句問候、一則訊息。主看重的，是你願意靠近的那一小步。"],["p","羞恥型的人，常覺得自己過去站在一旁，現在已經沒有資格伸手：我當時沒有幫他，現在才去，是不是很假？這種心，聽見控告會更往後退。回家的路，是把愧疚帶到十字架前，因為有一位先為我們伸手的主。補上一點點，比躲起來更好。"],["p","受傷型的人，曾經被人旁觀、被人背叛，聽到「站在一旁」特別有感觸，甚至不想聽下去。請你知道：這一章先是寫給你的。神看見了。你不需要馬上原諒，也不需要在這裡說出細節；你可以先讓自己被陪伴。若傷痛太深，請找可信的牧者或專業人員。把審判交給神，不是叫你吞下去，是叫你不必一個人扛。"],["d",["四種心的分類，我可能同時有好幾種，怎麼辦？","這很正常。四種心不是把人分成四種人，而是看見同一顆心在不同時候的樣子：順利時，我們容易驕傲；被追問時，容易恐懼；想起舊事時，容易羞恥；被人傷過，更容易把自己關起來。你可以不必先判斷自己是哪一型，只要問：今天讀到哪一段，心裡最有反應？那個反應，就是神今天要對你說話的地方。若你發現自己四種都有，不必緊張，因為福音是同一個：耶穌先走下來，進到我們的高處、旁邊、羞恥與傷痛裡。每一種心，都有同一條回家的路：先回到神面前，再回到弟兄身邊。"]],["h","九、這一週，你可以做的幾件事"],["p","第一，每天睡前，用一分鐘對神說：「主啊，我的安全是你。」不求甚麼，只是把今天抓著的東西，放下一次。"],["p","第二，寫下你的「山穴」：你最依靠的是甚麼（職位、存款、人脈、資歷、家世）？在旁邊寫一句：「這不是我的神。」然後把這張紙放在你每天看得到的地方。"],["p","第三，想一位正在遭難的人，今天伸手一次：打一通電話、傳一句問候，或為他禱告三分鐘。不問理由，不給建議，只讓他知道：你沒有被忘記。"],["p","第四，下次看見別人跌倒的時候，先停一秒，不說「活該」，也不說「早就告訴你了」；把這一句話，換成一句問候。"],["p","第五，在你的小組、教會、家庭裡，留意誰正在被「站在一旁」：被忽略的、被冷落的、沒有人問起的。這個星期，成為第一個靠近他的人。"],["p","我宣告：我的安全不在我的山穴，在耶和華；我不再說「誰能將我拉下地去」。"],["p","我宣告：我不站在一旁，我願意在弟兄姊妹遭難的日子伸手。"],["p","我宣告：伸冤在神，我可以放下那把刀；公義有主，我不必自己討回。"],["p","我宣告：國度歸耶和華，耶穌是王；我回到本位，讓人作人，讓神作神。"],["h","十、結語"],["p","弟兄姊妹，俄巴底亞書只有二十一節，卻畫出了一條很清楚的路：高處的人，被拉下來；站在一旁的人，被算為同夥；而這一切的終點，不是仇恨，是王。開頭那通沒有接的電話，也許你已經忘了；可是神沒有忘。祂不是要拿它來定你的罪，是要借著它，把你從高處、從一旁，領回到弟兄身邊。"],["p","耶穌已經先走了這條路。祂從天上下來，進到我們的遭難裡，沒有站在一旁；祂為我們伸了手，我們才有「在錫安山必有逃脫的人」的盼望。今天你不需要變成一個完美的、永遠有力量的人，你只需要每天回到本位：先看見祂，再看見你的兄弟。焦點在耶穌，不在我的山穴，不在別人的眼光，不在環境。"],["p","願耶穌作王，願祂得著一切的榮耀，願我們都成為在彼此遭難的日子伸手的人，直到國度完全歸給我們的王。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人先把經文放進自己的心裡，看見自己心裡的「山穴」與「一旁」，不急著討論別人。"],["n","1. ★ 第三節說，以東「心裡說」：誰能將我拉下地去呢？請用一句話說出：你心裡有沒有一句類似的話？只說名稱，不必細節。"],["n","2. ★ 請說出一個地點、一個時間，是你最近覺得自己「住在高處」、不太需要別人的時候。"],["n","3. ★★ 十一節說，以東「站在一旁」。請說出一件你這幾個月看見別人需要，卻選擇「站在一旁」的事，只說一句，不必細節。"],["n","4. ★★★ 請安靜一分鐘，想一件你最依靠的東西（職位、存款、人脈、資歷）。用一句話寫下來，並寫下你願意把它交給誰，說出一個名字。"],["m","帶領提醒：請先安靜念一章三到四節，再開始。這一課會碰到被背叛、被旁觀、被遺棄的經歷：不點名逼人說，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」；若有人分享喪親、傷害、輕生的念頭或長期的無望，會後單獨關心，必要時協助尋求輔導或其他專業的協助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：十二到十四節有八個「不當」，從眼睛到手。你最近比較靠近哪一個：瞪眼看著、歡樂、說狂傲的話？請說出一個，不必細節。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，讀二十一節。你聽見的是害怕，還是一個邀請？請說出你聽到的第一個感覺。"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：十五節說「你怎樣行，他也必照樣向你行」。請用自己的話向組員說明：這一節為甚麼不是報復的許可？（提示：主詞是誰？）"],["t","【講】說出口"],["n","8. ★★ 說出口：請用一句話向一位組員說，你這個星期最想先「放下」的一個「山穴」是甚麼，並說出那位組員的名字。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天、在哪一個固定的地方，用一分鐘對神說：「主啊，我的安全是你」，寫下時間，並說出誰會提醒你。"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。不要用這一章去羞辱任何人；若有人說到自己曾被旁觀、被背叛，不追問細節、不要求原諒，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去：進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位正在遭難的人，例如失業、生病、離開教會、家庭破裂的人？請說出名字，並決定這個月陪他一次，不給建議。"],["n","11. ★★ 你的小組或教會，有沒有一件事，是我們習慣「站在一旁」的？請說出具體的一件，並說你可以先從自己哪裡開始。"],["n","12. ★★ 有沒有一位你認識的人，正在受傷？請說出名字，並決定這個星期傳一句話給他：你沒有被忘記。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起走過難處的那位朋友，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽：高處不是保障，旁觀不是中立，國度歸耶和華。並在下次小組回報：你對誰講的、在哪裡講、他的反應是甚麼。"],["m","帶領提醒：請特別提醒：不要在小組裡說「你要原諒他」，也不要用這一章去要求別人堅強或表演敬虔。若有人分享被背叛、被遺棄、被傷害的經歷，不追問細節、不要求原諒，會後單獨關心，必要時協助尋求輔導或其他專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一個「山穴」，放在神面前。一起念俄巴底亞書一章二十一節：必有拯救者上到錫安山，審判以掃山；國度就歸耶和華了。"],["p","由帶領者為每一位禱告：求神使我們願意從高處下來，使我們在弟兄遭難的日子伸手，使我們在一週的日常裡，不站在一旁。散會前，彼此問一句：「這星期，你要伸手的那個人，是誰？」"]]}}}</script>
