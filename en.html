<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Obadiah Study Notes">
<meta name="application-name" content="Obadiah Study Notes">
<meta name="description" content="Obadiah Study Notes: the whole single chapter of verse-by-verse exposition from the original, sermon manuscripts, teaching lessons and 321 life application.">
<title>Obadiah Study Notes</title>
<link rel="manifest" id="MF" href="./manifest-en.webmanifest">
<!--ICONS-->
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="120x120" href="./icon-120.png">
<link rel="apple-touch-icon" sizes="152x152" href="./icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="./icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<!--/ICONS-->
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── Header ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── Tabs ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── Common ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── Terrain map (signature element)── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── Chapter list ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── Bible ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── Six layers ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── Tables ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── Tracks ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── Disputes ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── Levels ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── Check-in ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── bottom sheet ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── Other ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── Teaching lesson script (long-form reading)── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* Think deeper: a collapsed question and answer */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* the Three Transformations */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── Full-screen mode (pulpit / small group)── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* Teleprompter */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* Group */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* Search */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── Brand and splash screen ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── Highlights and notes ──
   Styling lives in 321-app-core/marks.css; every colour is a variable.
   Below they are overridden to this app's own palette and type, so swapping in
   the shared core is invisible to the reader. */
/* ============================================================================
 * 321 App Core — 畫線與筆記樣式  marks.css  v1.0.0
 *
 * 四樣東西：可點的一句（.mks / .mkp）、領受（.mknote）、選色盤（.hlrow .hlsw）、
 * 面板上的原句（.mkq）。顏色一律走 CSS 變數，宿主想換色只覆寫變數。
 *
 * 畫線用 linear-gradient 從 60% 起——像真的螢光筆劃過下半截字，
 * 不是整塊反白。整塊反白在長段落裡會蓋掉字，讀起來吃力。
 * ==========================================================================*/

:root {
  /* 畫線底色（七色 ＋ 預設的金）*/
  --mk-gold: rgba(156, 107, 24, .32);
  --mk-green: #CFE6CC;
  --mk-blue: #CFDFF4;
  --mk-pink: #F7D3DC;
  --mk-purple: #E3D5F1;
  --mk-maroon: #EBD2D0;
  --mk-brown: #E6DBC9;
  --mk-charcoal: #DEDEDA;

  /* 領受區塊左邊那一條（比畫線深，才看得出是同一色系）*/
  --mkb-gold: #9C6B18;
  --mkb-green: #5E9E63;
  --mkb-blue: #5583C7;
  --mkb-pink: #DB7A90;
  --mkb-purple: #9377C0;
  --mkb-maroon: #8C4A4E;
  --mkb-brown: #8A6740;
  --mkb-charcoal: #54534E;

  --mk-note-bg: rgba(156, 107, 24, .08);
  --mk-muted: #54636B;
  --mk-line: #D6DAD2;
  --mk-card: #FFFFFF;
  --mk-ink: #12181B;
  --mk-cut: 60%;               /* 螢光筆從字的哪一截開始 */
  --mk-tap: rgba(0, 0, 0, .08); /* 點下去那一瞬間的回饋 */
}

/* 深色：宿主標了就跟著走；宿主完全沒有主題開關時才聽作業系統 */
:root[data-dark="1"],
:root[data-theme="dark"],
:root.dark {
  --mk-gold: rgba(214, 162, 80, .34);
  --mk-green: #22402A;
  --mk-blue: #1F3350;
  --mk-pink: #45222E;
  --mk-purple: #332A48;
  --mk-maroon: #3D2525;
  --mk-brown: #3B3020;
  --mk-charcoal: #34342F;

  --mkb-gold: #D6A250;
  --mkb-green: #7BC28C;
  --mkb-blue: #7FA0DE;
  --mkb-pink: #E58FA0;
  --mkb-purple: #A48AC9;
  --mkb-maroon: #C08084;
  --mkb-brown: #B99168;
  --mkb-charcoal: #8E8D86;

  --mk-note-bg: rgba(214, 162, 80, .10);
  --mk-muted: #93A29A;
  --mk-line: #28332D;
  --mk-card: #161E1A;
  --mk-ink: #E8EDE9;

}

@media (prefers-color-scheme: dark) {
  :root:not([data-dark]):not([data-theme]):not(.dark):not(.light) {
    --mk-gold: rgba(214, 162, 80, .34);
    --mk-green: #22402A;
    --mk-blue: #1F3350;
    --mk-pink: #45222E;
    --mk-purple: #332A48;
    --mk-maroon: #3D2525;
    --mk-brown: #3B3020;
    --mk-charcoal: #34342F;
    --mk-note-bg: rgba(214, 162, 80, .10);
  }
}

/* ── 可點的一句 ────────────────────────────────────────────────────
 * .mks 是句子（行內），.mkp 是整段（區塊）。兩者行為一樣。
 * 沒畫線時不給任何樣式——只有 cursor，讓畫面保持乾淨。
 * ------------------------------------------------------------------ */
.mks, .mkp {
  cursor: pointer;
  border-radius: 5px;
  transition: background .12s;
  -webkit-tap-highlight-color: transparent;
  /* 跨行的句子，兩行都要有底色——少了這一行，第二行的畫線會斷掉 */
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}

/* 點下去的那一瞬間給個回饋，手機上才知道點到了 */
.mks:active, .mkp:active { background: var(--mk-tap); }

/* tagParas() 產生的段落 */
.mkw { margin: 0 0 14px; }

.mks.hl, .mkp.hl { background: linear-gradient(transparent var(--mk-cut), var(--mk-gold) var(--mk-cut)); }
.mks.hl[data-c="green"],    .mkp.hl[data-c="green"]    { background: linear-gradient(transparent var(--mk-cut), var(--mk-green) var(--mk-cut)); }
.mks.hl[data-c="blue"],     .mkp.hl[data-c="blue"]     { background: linear-gradient(transparent var(--mk-cut), var(--mk-blue) var(--mk-cut)); }
.mks.hl[data-c="pink"],     .mkp.hl[data-c="pink"]     { background: linear-gradient(transparent var(--mk-cut), var(--mk-pink) var(--mk-cut)); }
.mks.hl[data-c="purple"],   .mkp.hl[data-c="purple"]   { background: linear-gradient(transparent var(--mk-cut), var(--mk-purple) var(--mk-cut)); }
.mks.hl[data-c="maroon"],   .mkp.hl[data-c="maroon"]   { background: linear-gradient(transparent var(--mk-cut), var(--mk-maroon) var(--mk-cut)); }
.mks.hl[data-c="brown"],    .mkp.hl[data-c="brown"]    { background: linear-gradient(transparent var(--mk-cut), var(--mk-brown) var(--mk-cut)); }
.mks.hl[data-c="charcoal"], .mkp.hl[data-c="charcoal"] { background: linear-gradient(transparent var(--mk-cut), var(--mk-charcoal) var(--mk-cut)); }

/* ── 領受 ────────────────────────────────────────────────────────── */
.mknote {
  display: block;
  border-left: 3px solid var(--mkb-gold);
  background: var(--mk-note-bg);
  border-radius: 0 10px 10px 0;
  padding: 10px 12px;
  margin: 8px 0 12px;
  font-size: .85em;
  line-height: 1.8;
}

.mknote[data-c="green"]    { border-left-color: var(--mkb-green); }
.mknote[data-c="blue"]     { border-left-color: var(--mkb-blue); }
.mknote[data-c="pink"]     { border-left-color: var(--mkb-pink); }
.mknote[data-c="purple"]   { border-left-color: var(--mkb-purple); }
.mknote[data-c="maroon"]   { border-left-color: var(--mkb-maroon); }
.mknote[data-c="brown"]    { border-left-color: var(--mkb-brown); }
.mknote[data-c="charcoal"] { border-left-color: var(--mkb-charcoal); }

.mknote b {
  color: var(--mkb-gold);
  font-size: 12px;
  letter-spacing: .1em;
}

/* 領受裡的小按鈕（問小智／刪除）*/
.mkask {
  display: inline-block;
  margin-left: 8px;
  border: 1px solid var(--mk-line);
  background: var(--mk-card);
  color: inherit;
  border-radius: 8px;
  padding: 3px 9px;
  font: inherit;
  font-size: 12.5px;
  cursor: pointer;
}

/* ── 選色盤 ──────────────────────────────────────────────────────── */
.hlrow {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
  margin: 2px 0 12px;
}

.hlrow .lb {
  font-size: 12.5px;
  color: var(--mk-muted);
  white-space: nowrap;
}

.hlsw {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid transparent;
  padding: 0;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12);
}

.hlsw.on { border-color: var(--mk-ink); }

/* ── 面板上的原句 ────────────────────────────────────────────────── */
.mkq {
  font-size: .94em;
  line-height: 1.85;
  border-left: 3px solid var(--mkb-gold);
  padding: 8px 0 8px 12px;
  margin: 6px 0 12px;
  color: var(--mk-muted);
}

/* 清單裡可點去原處的那一句 */
.hlq {
  font-size: .92em;
  line-height: 1.8;
  margin: 0;
  cursor: pointer;
}

@media (prefers-reduced-motion: reduce) {
  .mks, .mkp { transition: none; }
}

:root, :root[data-dark="0"], :root[data-dark="1"]{

/* The sentence being read, and the bottom control bar: styling lives in
   321-app-core/tts.css. Colours and placement are all variables, overridden below
   to match this app exactly — readers cannot tell the core was swapped in. */
/* ============================================================================
 * 321 App Core — 朗讀模組樣式  tts.css  v1.1.0
 *
 * 只有兩樣東西：正在朗讀的那一句（.spk-now），和底部的控制列（.spkbar）。
 * 顏色一律走 CSS 變數，宿主 App 想換色只要覆寫變數，不必改這一份。
 * ==========================================================================*/

:root {
  --spk-now: #FFE9A8;          /* 正在讀的那一句的底色 */
  --spk-bar-bg: #12305E;       /* 控制列底色 */
  --spk-bar-fg: #FFFFFF;
  --spk-bar-on: #F0C462;       /* 「自動捲動」開著時的顏色 */
  --spk-bar-bottom: 64px;      /* 底部分頁列的高度，宿主自己調（可以整段 calc，含 env(safe-area-inset-bottom)）*/
  --spk-bar-gap-right: 0px;    /* 右下角有浮動鈕（例如「小智」）的 App 設它的寬度＋邊距 */
  --spk-bar-z: 60;             /* 宿主若有更高的浮動層（小智 fab…），把它疊上去 */

  /* 按鈕外觀：宿主本來就有自己一套樣子的，覆寫這四個就能長得一模一樣，
     不必為了換基座而改變使用者看慣的畫面 */
  --spk-btn-bg: transparent;
  --spk-btn-size: 32px;
  --spk-btn-radius: 8px;
  --spk-btn-font: 16px;
}

/* ── 主題 ────────────────────────────────────────────────────────
 * 淺色是底色。宿主用什麼機制標深色，核心都跟得上：
 *   data-dark="1"（321 這一家 App 的慣例）／data-theme="dark"／class="dark"
 * 只有在宿主完全沒有自己的主題開關時，才去聽作業系統——否則會出現
 * 「App 是淺色的，標示卻是深色的」這種不一致。
 * -------------------------------------------------------------- */
:root[data-dark="1"],
:root[data-theme="dark"],
:root.dark {
  --spk-now: #6B5A22;
  --spk-bar-bg: #0B1D3A;
}

:root[data-dark="0"],
:root[data-theme="light"],
:root.light {
  --spk-now: #FFE9A8;
  --spk-bar-bg: #12305E;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-dark]):not([data-theme]):not(.dark):not(.light) {
    --spk-now: #6B5A22;
    --spk-bar-bg: #0B1D3A;
  }
}

/* ── 正在朗讀的那一句 ──────────────────────────────────────────────
 * 用 box-shadow 把底色往外撐，而不是加 padding——加 padding 會讓整段文字
 * 在朗讀時跳動。box-decoration-break 讓跨行的句子兩行都有底。
 * ------------------------------------------------------------------ */
.spk-now {
  background: var(--spk-now) !important;
  border-radius: 4px;
  box-shadow: 0 0 0 3px var(--spk-now);
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  transition: background .18s ease;
}

/* ── 底部控制列 ────────────────────────────────────────────────── */
.spkbar {
  position: fixed;
  left: 50%;
  /* 右下角若有浮動鈕，整條往左讓一半的距離，兩邊看起來仍然平衡 */
  transform: translateX(calc(-50% - var(--spk-bar-gap-right) / 2));
  bottom: calc(var(--spk-bar-bottom) + 10px);
  z-index: var(--spk-bar-z);
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: calc(100vw - 24px - var(--spk-bar-gap-right));
  padding: 8px 12px;
  border-radius: 999px;
  background: var(--spk-bar-bg);
  color: var(--spk-bar-fg);
  box-shadow: 0 8px 28px rgba(0, 0, 0, .34);
  font-size: 14px;
  line-height: 1;
}

.spkbar b {
  font-weight: 600;
  /* 標題讓給按鈕，但至少留得下幾個字，不要被擠成一個字加句點 */
  flex: 1 1 auto;
  min-width: 4.5em;
  max-width: 34vw;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 「3/14」這種進度字：跟著控制列自己的字色走再調暗，
   不要寫死成白色——有些 App 的控制列在深色模式反而是淺底深字。 */
.spkbar .pv {
  color: inherit;
  opacity: .7;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.spkbar button {
  appearance: none;
  -webkit-appearance: none;
  border: 0;
  background: var(--spk-btn-bg);
  color: var(--spk-bar-fg);
  font-size: var(--spk-btn-font);
  line-height: 1;
  padding: 0;
  cursor: pointer;
  border-radius: var(--spk-btn-radius);
  min-width: var(--spk-btn-size);
  height: var(--spk-btn-size);
  flex: 0 0 auto;
}

.spkbar button:active { background: rgba(255, 255, 255, .16); }
.spkbar button.on { color: var(--spk-bar-on); }

/* 正在播的小圓點 */
.spkbar .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--spk-bar-on);
  flex: 0 0 auto;
  animation: spk-pulse 1.4s ease-in-out infinite;
}

@keyframes spk-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .35; }
}

@media (prefers-reduced-motion: reduce) {
  .spkbar .dot { animation: none; }
  .spk-now { transition: none; }
}

/* 窄螢幕：標題讓位給按鈕 */
@media (max-width: 380px) {
  .spkbar { gap: 4px; padding: 7px 9px; }
  .spkbar b { max-width: 24vw; }
  .spkbar button { min-width: 28px; height: 28px; font-size: 15px; }
}

/* This app's colours already follow --hl-now / --ink in both themes.
   The selector must be as specific as the core's :root[data-dark="..."] to win. */
:root, :root[data-dark="0"], :root[data-dark="1"]{
  --spk-now:var(--hl-now);
  --spk-bar-bg:var(--ink); --spk-bar-fg:var(--paper);
  --spk-bar-on:var(--brass);
  --spk-bar-bottom:calc(64px + env(safe-area-inset-bottom));
  --spk-bar-z:110;
  --spk-btn-bg:rgba(255,255,255,.16); --spk-btn-size:30px;
  --spk-btn-radius:50%; --spk-btn-font:13px;
}
.spkbar{gap:9px;padding:8px 8px 8px 15px;font-size:13.5px;max-width:calc(100% - 32px);
  box-shadow:0 6px 24px rgba(0,0,0,.22)}
.spkbar b{max-width:40vw}
.spkbar .dot{width:7px;height:7px;background:var(--brass)}
.spkbar button.on{background:var(--brass);color:#fff}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}

/* ── App shell (tabs, sheet, toast, splash, boot guard) ──
   Styling lives in 321-app-core/shell.css; colours go through --ui-* variables.
   This app's own rules (type, spacing) override further down. */
/* ============================================================================
 * 321 App Core — 版面骨架樣式  shell.css  v1.0.0
 *
 * 五樣東西：底部分頁（nav.tabs）、底部面板（.sheet）、提示（.toast）、
 * 啟動畫面（#splash）、開機守門員（#boot）。
 *
 * 顏色一律走變數，宿主覆寫變數就好。變數名帶 --ui- 前綴，
 * 不佔用宿主可能已經在用的名字（經文出處那一輪的教訓：核心的 .vs
 * 撞到宿主的「經文那一列」，連結整條被撐成一整行，而且完全不報錯）。
 * ==========================================================================*/

:root {
  --ui-ink: #12181B;
  --ui-paper: #EEF0EB;
  --ui-card: #FFFFFF;
  --ui-line: #D6DAD2;
  --ui-dim: #54636B;
  --ui-accent: #1F4D3D;
  --ui-brand-bg: #12305E;     /* 啟動畫面與開機畫面的底色 */
  --ui-brand-fg: #FFFFFF;
  --ui-tabs-h: 56px;          /* 分頁列高度；內容底部要留這麼多 */
  --ui-radius: 14px;
  --ui-serif: inherit;
  --ui-upd: #B4893C;          /* 更新提示條的底色（金）*/
  --ui-upd-fg: #FFFFFF;
}

:root[data-dark="1"],
:root[data-theme="dark"],
:root.dark {
  --ui-ink: #E8EDE9;
  --ui-paper: #0E1412;
  --ui-card: #161E1A;
  --ui-line: #28332D;
  --ui-dim: #93A29A;
  --ui-accent: #7FBFA4;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-dark]):not([data-theme]):not(.dark):not(.light) {
    --ui-ink: #E8EDE9;
    --ui-paper: #0E1412;
    --ui-card: #161E1A;
    --ui-line: #28332D;
    --ui-dim: #93A29A;
    --ui-accent: #7FBFA4;
  }
}

/* ── 底部分頁 ────────────────────────────────────────────────────
 * `padding-bottom: env(safe-area-inset-bottom)` 是 iPhone 沒有實體 Home 鍵
 * 那一條橫線的空間。少了它，分頁文字會被那條線壓住。
 * ------------------------------------------------------------------ */
nav.tabs {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 50;
  display: flex;
  background: var(--ui-card);
  border-top: 1px solid var(--ui-line);
  padding-bottom: env(safe-area-inset-bottom);
}

nav.tabs button {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--ui-dim);
  font: inherit;
  font-size: 11px;
  padding: 8px 0 7px;
  cursor: pointer;
  line-height: 1.3;
  -webkit-tap-highlight-color: transparent;
}

nav.tabs button b {
  display: block;
  font-family: var(--ui-serif);
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 1px;
}

nav.tabs button.on { color: var(--ui-accent); }

/* 內容最後一段不可以被分頁列吃掉——每支 App 都漏過一次 */
.ui-wrap {
  padding-bottom: calc(var(--ui-tabs-h) + env(safe-area-inset-bottom) + 16px);
}

/* ── 底部面板 ────────────────────────────────────────────────────
 * 整片是背景（點它關閉），裡面那一層才是面板本身（點它不關）。
 * ------------------------------------------------------------------ */
.sheet {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: rgba(10, 16, 14, .42);
  display: none;
  align-items: flex-end;
}

.sheet.on { display: flex; }

.sheet .inner {
  background: var(--ui-paper);
  width: 100%;
  max-height: 88vh;
  overflow: auto;
  border-radius: 20px 20px 0 0;
  padding: 8px 18px calc(28px + env(safe-area-inset-bottom));
  animation: ui-up .22s ease;
}

@keyframes ui-up { from { transform: translateY(24px); opacity: .5; } }

.sheet .grab {
  width: 38px; height: 4px;
  border-radius: 2px;
  background: var(--ui-line);
  margin: 6px auto 12px;
}

.sheet h4 {
  font-family: var(--ui-serif);
  font-size: 20px;
  margin: 4px 0 2px;
}

/* ── 提示 ────────────────────────────────────────────────────────
 * 浮在分頁列上方；不可以攔到點擊（pointer-events:none），
 * 否則正好蓋住按鈕的那一下會點不到。
 * ------------------------------------------------------------------ */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--ui-tabs-h) + env(safe-area-inset-bottom) + 32px);
  transform: translateX(-50%);
  background: var(--ui-ink);
  color: var(--ui-paper);
  padding: 9px 16px;
  border-radius: 999px;
  font-size: 13.5px;
  z-index: 120;
  opacity: 0;
  transition: opacity .2s;
  pointer-events: none;
  white-space: nowrap;
  max-width: calc(100vw - 32px);
  overflow: hidden;
  text-overflow: ellipsis;
}

.toast.on { opacity: 1; }

/* ── 啟動畫面 ────────────────────────────────────────────────────
 * 顏色寫死不跟主題走：它在主題套上去之前就要顯示。
 * ------------------------------------------------------------------ */
#splash {
  position: fixed;
  inset: 0;
  z-index: 300;
  background: var(--ui-brand-bg);
  color: var(--ui-brand-fg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  transition: opacity .45s ease;
}

#splash.gone { opacity: 0; pointer-events: none; }

#splash img {
  width: 132px; height: 132px;
  border-radius: 28px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, .4);
  margin-bottom: 20px;
}

#splash h2 {
  font-family: var(--ui-serif);
  font-size: 25px;
  margin: 0;
  letter-spacing: .06em;
  font-weight: 700;
}

#splash p { margin: 4px 0 0; font-size: 15px; opacity: .85; letter-spacing: .3em; }
#splash small { margin-top: 26px; font-size: 11.5px; opacity: .55; letter-spacing: .16em; }

/* ── 開機守門員 ──────────────────────────────────────────────────
 * 檔案沒下載完就是一片白。與其讓使用者看著白畫面，不如告訴他發生什麼事，
 * 並且給一個「清除快取後重試」——「看不到更新」十之八九就是這個。
 * 這一塊的樣式刻意不依賴任何變數：它要在主程式壞掉時也長得出來。
 * ------------------------------------------------------------------ */
#boot {
  position: fixed;
  inset: 0;
  z-index: 400;
  background: #12305E;
  color: #fff;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  text-align: center;
  gap: 14px;
}

#boot .t { font-size: 19px; font-weight: 600; }
#boot .s { font-size: 14.5px; opacity: .8; line-height: 1.7; max-width: 340px; }
#boot .row { display: flex; gap: 10px; margin-top: 8px; }

#boot button {
  border: 0;
  border-radius: 999px;
  padding: 11px 20px;
  font: inherit;
  font-size: 15px;
  background: #fff;
  color: #12305E;
  cursor: pointer;
}

#boot button.ghost {
  border: 1px solid rgba(255, 255, 255, .4);
  background: transparent;
  color: #fff;
}

/* ── 更新提示條 ───────────────────────────────────────────────────
 * 固定在最頂端，蓋在所有東西上面（面板 z-index 300，所以它要更高），
 * 但比開機守門員低——開機都還沒過，講更新沒有意義。
 *
 * 三件事是刻意的：
 *   · 不是彈窗。彈窗會打斷正在讀的人；一條在頂端的提示，不理它也能繼續讀。
 *   · 整條都可以點。手機上不要做小小的「更新」兩個字讓人瞄準。
 *   · 它一出現，就把頁面往下推（--ui-upd-h），不去蓋住 App 自己的頂端列。
 * ------------------------------------------------------------------ */

:root { --ui-upd-h: 0px; }
:root[data-upd="1"] { --ui-upd-h: 40px; }

.upd321 {
  position: fixed;
  left: 0;
  right: 0;
  top: 0;
  z-index: 340;
  background: var(--ui-upd);
  color: var(--ui-upd-fg);
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: .02em;
  text-align: center;
  padding: 10px 16px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  box-shadow: 0 2px 10px rgba(0, 0, 0, .18);
  cursor: pointer;
  user-select: none;
  animation: upd321-in .25s ease-out;
}

.upd321:active { filter: brightness(.94); }

@keyframes upd321-in {
  from { transform: translateY(-100%); }
  to   { transform: translateY(0); }
}

/* 提示條出現時，把整頁往下讓一格。App 的頂端列若是 position:fixed，
   宿主自己把 top 接到 --ui-upd-h 上就會跟著讓。 */
:root[data-upd="1"] body { padding-top: var(--ui-upd-h); }

@media (prefers-reduced-motion: reduce) {
  .sheet .inner, .upd321 { animation: none; }
  .toast, #splash { transition: none; }
}

:root, :root[data-dark="0"], :root[data-dark="1"]{
  --ui-ink:var(--ink); --ui-paper:var(--paper); --ui-card:var(--card);
  --ui-line:var(--line); --ui-dim:var(--dusk); --ui-accent:var(--pine);
  --ui-serif:var(--serif); --ui-tabs-h:56px;
}

/* ── Scripture references ──
   Styling lives in 321-app-core/scripture.css; the colours below wire it to this
   app's own palette. */
/* ============================================================================
 * 321 App Core — 經文出處樣式  scripture.css  v1.0.0
 *
 * 只有一樣東西：文字裡被認出來的經文出處（a.ref321）。
 *
 * class 帶前綴，不叫 .vs——創世記與啟示錄的 .vs 是「經文那一列」，display:flex。
 * 核心若佔用同一個名字，連結會被撐成一整行，而且完全不會報錯。
 * 用虛線底線，不用藍色連結——它在一段中文裡要看得出可以點，
 * 又不能把整段文字變得像網頁目錄。
 * ==========================================================================*/

:root {
  --ref-fg: #1F4D3D;          /* 出處的字色 */
  --ref-line: rgba(31, 77, 61, .45);
  --ref-tap: rgba(31, 77, 61, .10);
}

:root[data-dark="1"],
:root[data-theme="dark"],
:root.dark {
  --ref-fg: #7FBFA4;
  --ref-line: rgba(127, 191, 164, .5);
  --ref-tap: rgba(127, 191, 164, .14);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-dark]):not([data-theme]):not(.dark):not(.light) {
    --ref-fg: #7FBFA4;
    --ref-line: rgba(127, 191, 164, .5);
    --ref-tap: rgba(127, 191, 164, .14);
  }
}

a.ref321 {
  color: var(--ref-fg);
  text-decoration: none;
  border-bottom: 1px dashed var(--ref-line);
  padding: 0 1px;
  border-radius: 3px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
}

a.ref321:active { background: var(--ref-tap); }

/* 這個 App 自己開得了的那一卷，線畫實一點——點下去會留在 App 裡，
   不是跳去別的地方。讀者一眼分得出來。 */
a.ref321.ref321-here { border-bottom-style: solid; }

:root, :root[data-dark="0"], :root[data-dark="1"]{
  --ref-fg:var(--pine); --ref-line:var(--pine2); --ref-tap:rgba(31,77,61,.10);
}

/* ── Sage ──
   Styling lives in 321-app-core/sage.css; colours go through --sg-* variables. */
/* ============================================================================
 * 321 App Core — AI 陪讀樣式  sage.css  v1.0.0
 *
 * 三樣東西：右下角的浮動鈕（.xzfab）、整片的對話面板（.xz）、
 * 收藏頁裡的一則回答（.xzsv）。
 *
 * 顏色走 --sg-* 變數。前綴是自己的，不佔用宿主可能已經在用的名字
 * （經文出處那一輪的教訓：核心的 .vs 撞到宿主的「經文那一列」，
 *  連結整條被撐成一整行，而且完全不報錯）。
 * ==========================================================================*/

:root {
  --sg-ink: #12181B;
  --sg-paper: #EEF0EB;
  --sg-card: #FFFFFF;
  --sg-line: #D6DAD2;
  --sg-dim: #54636B;
  --sg-accent: #1F4D3D;        /* 使用者那一側的泡泡、浮動鈕 */
  --sg-on-accent: #FFFFFF;
  --sg-star: #9C6B18;          /* 已收藏 */
  --sg-fab-bottom: 78px;       /* 分頁列高度 ＋ 一點空隙 */
  --sg-serif: inherit;
}

:root[data-dark="1"],
:root[data-theme="dark"],
:root.dark {
  --sg-ink: #E8EDE9;
  --sg-paper: #0E1412;
  --sg-card: #161E1A;
  --sg-line: #28332D;
  --sg-dim: #93A29A;
  --sg-accent: #7FBFA4;
  --sg-on-accent: #0E1412;     /* 深色模式的主色是淺的，字要反過來 */
  --sg-star: #D6A250;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-dark]):not([data-theme]):not(.dark):not(.light) {
    --sg-ink: #E8EDE9;
    --sg-paper: #0E1412;
    --sg-card: #161E1A;
    --sg-line: #28332D;
    --sg-dim: #93A29A;
    --sg-accent: #7FBFA4;
    --sg-on-accent: #0E1412;
    --sg-star: #D6A250;
  }
}

/* ── 右下角的浮動鈕 ──────────────────────────────────────────────
 * 要避開底部分頁列，也要避開 iPhone 那一條橫線。
 * ------------------------------------------------------------------ */
.xzfab {
  position: fixed;
  right: 16px;
  bottom: calc(var(--sg-fab-bottom) + env(safe-area-inset-bottom));
  z-index: 70;
  border: 0;
  cursor: pointer;
  border-radius: 999px;
  padding: 11px 17px 11px 14px;
  background: var(--sg-accent);
  color: var(--sg-on-accent);
  font: inherit;
  box-shadow: 0 8px 26px rgba(31, 77, 61, .4);
  display: flex;
  align-items: center;
  gap: 7px;
  -webkit-tap-highlight-color: transparent;
}

.xzfab i { font-style: normal; font-size: 17px; line-height: 1; }
.xzfab em {
  font-style: normal; font-size: 15px; font-weight: 600;
  letter-spacing: .04em; line-height: 1; white-space: nowrap;
}

/* ── 對話面板 ────────────────────────────────────────────────────
 * 整片是背景（點它關閉），底下那一張卡才是面板。
 * z-index 要比底部面板（.sheet，90）高——兩個同時開的時候小智在上面。
 * ------------------------------------------------------------------ */
.xz { position: fixed; inset: 0; z-index: 150; display: none; }
.xz.on { display: block; }

.xzmask { position: absolute; inset: 0; background: rgba(10, 16, 14, .44); }

.xzcard {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  max-height: 86vh;
  background: var(--sg-paper);
  border-radius: 20px 20px 0 0;
  display: flex;
  flex-direction: column;
  animation: sg-up .22s ease;
}

@keyframes sg-up { from { transform: translateY(24px); opacity: .5; } }

.xzh {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--sg-line);
}
.xzh b { font-family: var(--sg-serif); font-size: 17px; }
.xzh button { flex: 0 0 auto; white-space: nowrap; }
.xzh .ico { width: auto; min-width: 34px; padding: 0 9px; font-size: 13.5px; }

.xzb {
  flex: 1; overflow: auto;
  padding: 14px 16px;
  -webkit-overflow-scrolling: touch;
}

/* ── 一則訊息 ────────────────────────────────────────────────── */
.xzm {
  max-width: 88%;
  padding: 11px 14px;
  border-radius: 15px;
  margin: 0 0 11px;
  font-size: 15px;
  line-height: 1.85;
  white-space: normal;
}

.xzm.user {
  background: var(--sg-accent);
  color: var(--sg-on-accent);
  margin-left: auto;
  border-bottom-right-radius: 5px;
}

.xzm.assistant {
  background: var(--sg-card);
  border: 1px solid var(--sg-line);
  border-bottom-left-radius: 5px;
  padding-bottom: 8px;
}

.xzm.xzwait { opacity: .6; font-style: italic; }

/* 太長的回答先收起來——一則長回答會把整個畫面佔滿 */
.xzt.clip {
  display: -webkit-box;
  -webkit-line-clamp: 6;
  -webkit-box-orient: vertical;
  overflow: hidden;
  position: relative;
}

.xzmore {
  display: block;
  margin: 6px 0 0;
  border: 0;
  background: transparent;
  padding: 2px 0;
  color: var(--sg-accent);
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

/* 每一則回答底下的動作列：朗讀／收藏／刪除 */
.xzact {
  display: flex; gap: 6px;
  margin-top: 9px; padding-top: 8px;
  border-top: 1px solid var(--sg-line);
}

.xzact button {
  border: 1px solid var(--sg-line);
  background: transparent;
  color: var(--sg-dim);
  border-radius: 9px;
  padding: 5px 10px;
  font: inherit;
  font-size: 12.5px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.xzact button.on {
  border-color: var(--sg-star);
  color: var(--sg-star);
  font-weight: 600;
}

/* ── 開場白與快捷問題 ────────────────────────────────────────── */
.xzhi {
  background: var(--sg-card);
  border: 1px solid var(--sg-line);
  border-radius: 14px;
  padding: 14px;
  font-size: 15px;
  line-height: 1.85;
  margin-bottom: 12px;
}

.xzq { display: flex; flex-direction: column; gap: 7px; }

.xzq button {
  text-align: left;
  border: 1px solid var(--sg-line);
  background: var(--sg-card);
  color: var(--sg-ink);
  border-radius: 11px;
  padding: 11px 13px;
  font: inherit;
  font-size: 14.5px;
  cursor: pointer;
  line-height: 1.7;
}

/* ── 輸入列 ──────────────────────────────────────────────────── */
.xzf {
  display: flex; gap: 8px;
  padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--sg-line);
}

.xzf input {
  flex: 1;
  border: 1px solid var(--sg-line);
  border-radius: 12px;
  background: var(--sg-card);
  color: inherit;
  font: inherit;
  /* 16px 以下 iOS Safari 會自己放大整個畫面，不要小於它 */
  font-size: 16px;
  padding: 11px 13px;
}

/* ── 收藏頁裡的一則 ──────────────────────────────────────────── */
.xzsv { font-size: 15px; line-height: 1.85; margin: 0; white-space: normal; }

@media (prefers-reduced-motion: reduce) {
  .xzcard { animation: none; }
}

/* ── 回答裡的表格與條列 ──────────────────────────────────────────
 * 樣式本身在 narrate.css；這裡只處理「在對話泡泡裡」的那幾件事。
 * 最要緊的是寬度：一張三欄表在手機上一定超出泡泡，
 * 不擋的話整個對話面板會被撐開，而且使用者不知道是哪裡出了問題。 */

.xzt .nartw {
  max-width: 100%;
  margin: 9px 0;
}

.xzt .narh:first-child { margin-top: 0; }
.xzt .narl { margin: 6px 0; }
.xzt .narq { margin: 8px 0; }
.xzt p { margin: 6px 0; }
.xzt p:first-child { margin-top: 0; }
.xzt p:last-child { margin-bottom: 0; }

/* 收合的時候表格也要跟著被裁掉，不可以冒出來 */
.xzt.clip .nartw { overflow: hidden; }


/* -- Verse images --
   Styling lives in 321-app-core/card.css; colours follow the --cd-* variables.
   All three selectors must be written together: :root alone is not specific
   enough to beat the core's own :root[data-dark="1"], and the whole override
   would fail silently in dark mode. */
/* ============================================================================
 * 321 App Core — 經文美圖樣式  card.css  v1.0.0
 *
 * 顏色走 --cd-* 變數，宿主覆寫變數就好。
 * 覆寫時記得三個選擇器一起寫：
 *
 *     :root, :root[data-dark="0"], :root[data-dark="1"] { --cd-ink: … }
 *
 * 只寫 :root 的話，特異性贏不過核心自己的 :root[data-dark="1"]，
 * 深色模式下整組覆寫會靜靜地失效。（第一輪就踩過這個坑。）
 * ==========================================================================*/

:root {
  --cd-ink: #12181B;
  --cd-paper: #EEF0EB;
  --cd-card: #FFFFFF;
  --cd-line: #D6DAD2;
  --cd-dim: #54636B;
  --cd-accent: #1F4D3D;
  --cd-on-accent: #FFFFFF;
  --cd-radius: 14px;
}

:root[data-dark="1"] {
  --cd-ink: #E8EDE9;
  --cd-paper: #0E1412;
  --cd-card: #161E1A;
  --cd-line: #28332D;
  --cd-dim: #93A29A;
  --cd-accent: #7FBFA4;
  --cd-on-accent: #0E1412;
}

/* ── 面板 ──────────────────────────────────────────────────────────
 * 從底部滑上來，不是中央彈窗。手機上中央彈窗按不到下緣的按鈕。 */

.cd321 {
  position: fixed;
  inset: 0;
  z-index: 320;
  background: rgba(0, 0, 0, .46);
  display: none;
  align-items: flex-end;
  justify-content: center;
}

.cd321.on { display: flex; }

.cd321 .cdbox {
  width: 100%;
  max-width: 560px;
  max-height: 94vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--cd-paper);
  color: var(--cd-ink);
  border-radius: var(--cd-radius) var(--cd-radius) 0 0;
  padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  animation: cd321-up .22s ease-out;
}

@keyframes cd321-up {
  from { transform: translateY(14px); opacity: .6; }
  to   { transform: translateY(0); opacity: 1; }
}

.cd321 .cdhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 2px 0 12px;
}

.cd321 .cdhead b { font-size: 16px; font-weight: 700; }

.cd321 .cdx {
  border: 0;
  background: transparent;
  color: var(--cd-dim);
  font: inherit;
  font-size: 18px;
  line-height: 1;
  padding: 6px 8px;
  cursor: pointer;
}

/* ── 預覽 ──────────────────────────────────────────────────────────
 * 這裡放的是 <img>，不是 <canvas>——canvas 長按不會跳出「儲存圖片」。
 * 手機上長按是最可靠的儲存方式，所以預覽一定要是圖片。 */

.cd321 .cdpvwrap {
  display: flex;
  justify-content: center;
  background: var(--cd-card);
  border: 1px solid var(--cd-line);
  border-radius: var(--cd-radius);
  padding: 10px;
}

.cd321 .cdpv {
  display: block;
  max-width: 100%;
  max-height: 46vh;
  width: auto;
  border-radius: 6px;
  box-shadow: 0 4px 18px rgba(0, 0, 0, .16);
  /* 要能長按 */
  -webkit-touch-callout: default;
  -webkit-user-select: auto;
  user-select: auto;
}

.cd321 .cdhold {
  margin: 8px 0 12px;
  text-align: center;
  font-size: 12px;
  color: var(--cd-dim);
}

/* ── 選項 ─────────────────────────────────────────────────────────── */

.cd321 .cdrow {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
}

.cd321 .cdlab {
  flex: 0 0 auto;
  width: 34px;
  padding-top: 8px;
  font-size: 12.5px;
  color: var(--cd-dim);
  line-height: 1.3;
}

.cd321 .cdchips {
  flex: 1 1 auto;
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding-bottom: 3px;
  scrollbar-width: none;
}

.cd321 .cdchips::-webkit-scrollbar { display: none; }

.cd321 .cdchip {
  flex: 0 0 auto;
  border: 1px solid var(--cd-line);
  background: var(--cd-card);
  color: var(--cd-ink);
  border-radius: 999px;
  padding: 7px 13px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s;
}

.cd321 .cdchip.on {
  background: var(--cd-accent);
  border-color: var(--cd-accent);
  color: var(--cd-on-accent);
}

/* 底圖的小縮圖：3:4，跟最常用的直式一致 */
.cd321 .cdthumb {
  width: 54px;
  height: 72px;
  padding: 0;
  border-radius: 9px;
  background-size: cover;
  background-position: center;
  position: relative;
  overflow: hidden;
}

.cd321 .cdthumb span {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 3px 4px;
  font-size: 10px;
  color: #fff;
  background: linear-gradient(transparent, rgba(0, 0, 0, .62));
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cd321 .cdthumb.on { box-shadow: 0 0 0 3px var(--cd-accent) inset; }

/* ── 按鈕 ─────────────────────────────────────────────────────────── */

.cd321 .cdacts {
  display: flex;
  gap: 9px;
  margin-top: 14px;
}

.cd321 .cdbtn {
  flex: 1 1 0;
  border: 1px solid var(--cd-line);
  background: var(--cd-card);
  color: var(--cd-ink);
  border-radius: 12px;
  padding: 13px 10px;
  font: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.cd321 .cdbtn.pri {
  background: var(--cd-accent);
  border-color: var(--cd-accent);
  color: var(--cd-on-accent);
}

.cd321 .cdbtn:active { filter: brightness(.95); }

/* 面板開著的時候不要讓底下的頁面跟著捲 */
:root[data-cd="1"] body { overflow: hidden; }

@media (prefers-reduced-motion: reduce) {
  .cd321 .cdbox { animation: none; }
}


/* -- Prose layout (tables, lists, quotes) --
   Styling lives in 321-app-core/narrate.css; colours follow --nar-* variables.
   All three selectors must be written together: :root alone is not specific
   enough to beat the core's own :root[data-dark="1"], and the whole override
   would fail silently in dark mode. */
/* ============================================================================
 * 321 App Core — 內容排版樣式  narrate.css  v1.0.0
 *
 * NAR321.html() 產出的那幾種東西：標題、條列、引用、表格。
 * 顏色走 --nar-* 變數，宿主覆寫變數就好。
 *
 * 覆寫時三個選擇器一起寫：
 *     :root, :root[data-dark="0"], :root[data-dark="1"] { --nar-ink: … }
 * 只寫 :root 的話，特異性贏不過核心自己的 :root[data-dark="1"]。
 * ==========================================================================*/

:root {
  --nar-ink: #12181B;
  --nar-dim: #54636B;
  --nar-line: #D6DAD2;
  --nar-accent: #1F4D3D;
  --nar-head-bg: #F2F5F0;
  --nar-zebra: #FAFBF9;
  --nar-quote-bg: #F5F7F3;
  --nar-code-bg: #EDF0EA;
  --nar-serif: inherit;
}

:root[data-dark="1"] {
  --nar-ink: #E8EDE9;
  --nar-dim: #93A29A;
  --nar-line: #28332D;
  --nar-accent: #7FBFA4;
  --nar-head-bg: #1B2420;
  --nar-zebra: #141B18;
  --nar-quote-bg: #161E1A;
  --nar-code-bg: #1B2420;
}

/* ── 標題 ─────────────────────────────────────────────────────────── */

.narh {
  margin: 14px 0 6px;
  font-size: 15.5px;
  font-weight: 700;
  color: var(--nar-ink);
  line-height: 1.5;
}

.narh.sm { font-size: 14.5px; }
.narh:first-child { margin-top: 2px; }

/* ── 條列 ─────────────────────────────────────────────────────────
 * padding-left 用 em 不用 px：字級放大之後，項目符號與文字之間的距離
 * 要跟著長，不然大字級下會擠在一起。 */

.narl {
  margin: 8px 0;
  padding-left: 1.5em;
}

.narl li {
  margin: 4px 0;
  line-height: 1.75;
}

.narl li::marker { color: var(--nar-accent); }

/* ── 引用 ─────────────────────────────────────────────────────────── */

.narq {
  margin: 10px 0;
  padding: 10px 13px;
  border-left: 3px solid var(--nar-accent);
  background: var(--nar-quote-bg);
  border-radius: 0 8px 8px 0;
  font-family: var(--nar-serif);
  line-height: 1.85;
}

/* ── 表格 ─────────────────────────────────────────────────────────
 * 手機上一張三欄表幾乎一定超出畫面寬度。
 * 外面包一層可以橫向捲動的殼，而不是讓它把整個版面撐開——
 * 表格撐開版面的話，整頁的文字都會跟著跑出畫面外，
 * 而且使用者不會知道是哪裡出了問題。 */

.nartw {
  margin: 10px 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--nar-line);
  border-radius: 10px;
}

.nart {
  border-collapse: collapse;
  width: 100%;
  min-width: 260px;
  font-size: .94em;
  line-height: 1.6;
}

.nart th,
.nart td {
  padding: 8px 11px;
  text-align: left;
  vertical-align: top;
  border-bottom: 1px solid var(--nar-line);
}

.nart th {
  background: var(--nar-head-bg);
  font-weight: 700;
  color: var(--nar-ink);
  white-space: nowrap;
}

/* 第一欄是那一列在講什麼，讓它站出來一點 */
.nart td:first-child {
  font-weight: 600;
  color: var(--nar-ink);
  white-space: nowrap;
}

.nart tbody tr:nth-child(even) { background: var(--nar-zebra); }
.nart tbody tr:last-child th,
.nart tbody tr:last-child td { border-bottom: 0; }

/* ── 行內碼 ───────────────────────────────────────────────────────── */

.narq code,
.nart code,
code {
  background: var(--nar-code-bg);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: .92em;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"The Kingdom Will Be Yahweh’s","sub":"Heights, Brother, Kingdom","lv":"A","arc":"Heights · Brother · Kingdom","sec":[["1:1--2","Hearing the message: “Arise, and let’s rise up against Edom in battle”"],["1:3--4","The pride of the high place: “Who will bring me down to the ground?”"],["1:5--9","Hidden places searched out: allies turn enemies; the wise and the mighty are destroyed"],["1:10--14","You should not stand aside: the day of your brother’s disaster"],["1:15--16","The day Yahweh brings judgment: “As you have done, it will be done to you”"],["1:17--21","Those who escape on Mount Zion: the kingdom will be Yahweh’s"]],"serm":{"pts":[["The pride of your heart","1:1--9","Who will bring me down to the ground?"],["You should not stand aside","1:10--14","You stood aside"],["The kingdom will be Yahweh’s","1:15--21","The kingdom will be Yahweh’s"]]},"q":"“I was only standing there. I didn’t do anything.” We have all said these words, and we have all had them said to us. On the day a brother is in trouble, some reach out a hand, some turn their heads away, and some just stand aside. Obadiah has only one chapter, yet it answers this most painful question: if you only stood aside, do you still share in it? God answers in three steps. First, the proud man says in his heart, “Who will bring me down to the ground?” Then, “You stood aside… even you were like one of them.” And finally: “the kingdom will be Yahweh’s.” The ending is not about who got revenge. It is about who is King.","truth":"A high place is no protection, and standing aside is not neutrality. God brings the proud down from the heights, counts the one who stood aside among the others, and in the end takes the kingdom back into his own hands.","mv":{"t":"Saviors will go up on Mount Zion to judge the mountains of Esau, and the kingdom will be Yahweh’s.","r":"Obad 1:21"},"card":["Obadiah has one chapter, in three steps. Verses 1--9: Edom, who lives high in the rock clefts and says in his heart, “Who will bring me down to the ground?”, is brought down from there by God. Verses 10--14: the reason is that he did violence to his brother Jacob and, on the day of disaster, stood aside, “like one of them” (the eight “you should not”). Verses 15--21: the day of Yahweh is near, and as you have done, it will be done to you; there will be those who escape on Mount Zion; and the last line: the kingdom will be Yahweh’s.","A high place is no protection, and standing aside is not neutrality; the subject of the ending is Yahweh (1:3--4; 1:11; 1:21).","Grace in this chapter is “going up”: the proud are brought down, while the saviors “go up on Mount Zion”; those who escape have a way out (1:17), because Someone first reached out his hand for us.","Selflessness means no longer saying “Who will bring me down?” and instead saying to God from the high place, “Lord, my safety is you.” It also means no longer standing aside, and being willing to reach out a hand to a brother.","“You don’t need to live on the heights to protect yourself, and you don’t need to stand aside and watch others. Return to your position. The kingdom is mine.”","This week, think of one person who is in trouble, and do one small thing today: a phone call, a greeting, or three minutes of prayer. Don’t stand aside.","The final integration:\nThere was a man who lived in the clefts of the rock.\nHis home was on the heights.\nHe said in his heart:\nWho will bring me down to the ground?\n\nGod said:\nI will bring you down from there.\n\nOn the day his brother was in trouble,\nhe took up no sword\nand entered no city.\nHe only stood aside.\nGod said: like one of them.\n\nSo the “day” changed owners.\nNo longer his brother’s day,\nbut the day of Yahweh.\n\nYet the end of this book\nis not a sword,\nand not a song of victory.\n\nIt is a belonging:\nthe kingdom will be Yahweh’s.\n\nThis is selflessness.\nNot grasping the heights, not standing aside,\nletting Jesus be King,\nletting Jesus receive all the glory."],"self":"The definition of pride: leaving man’s position, seizing God’s authority, and wanting to take God’s place. The pride in Obadiah is living on the heights and saying in the heart, “Who will bring me down to the ground?”: making yourself your own security, and putting your brother behind your mountain.","t321":{"k":"On the day we were in trouble, Jesus did not stand aside.\\ > He came down from heaven, entered our city gate, and stood on our side (Phil 2:6--8).\\ > He is our Role Model: he reaches out first and asks for reasons afterward.","g":"To let Jesus be King is to hand “my high place” over to him (1:3--4).\\ > My position, my savings, my connections, my qualifications: all go back into his hands.\\ > He reigns, so I don’t have to protect myself, and I don’t have to stand aside in order to stay safe.","p":"God’s system is a group of brothers who reach out to one another on the day of trouble (1:10--14).\\ > God’s Kingdom does not rest on mountain strongholds, treaties, or borders (1:7; 1:21).\\ > Together we return to our position and let the King be King: this renewal begins with life and relationships."},"grp":["[1. Icebreaker] Name a “high place” you most wanted to live in as a child (a treehouse, a rooftop, a mountain, under the blankets…). Why that place?","[2. Heart-searching] In 1:3 Edom says in his heart, “Who will bring me down to the ground?” What is your own “cleft in the rock” (a position, savings, connections, spiritual qualifications)? Say only the name, no details.","[3. Gospel] 1:17: “in Mount Zion, there will be those who escape.” Has there been a time when someone reached out and pulled you out? Who was it? How will you thank him or her today?","[4. Action] 1:10--14 has eight “you should not.” Think of someone in trouble now. This week, which of “see, say, go” will you use to move one step closer to that person? Say the name and the time right now. (920: this person is your “2.”)","[5. Prayer] Please pray for everyone who has been looked on from the sidelines or abandoned. Those who have been betrayed or abandoned do not need to share details, and they should not be asked to forgive or to be strong."],"prac":{"main":"This week, think of one brother or sister who is in trouble, and don’t stand aside: make a phone call, send a greeting, or pray for them for three minutes.","items":["With God: this week, each night before bed, spend one minute telling God, “Lord, my safety is you.”","With yourself: write down what your “cleft in the rock” is (a position, savings, connections, qualifications), and next to it write one line: “This is not my God.”","With others: think of one person in trouble, and reach out once today without asking for reasons.","With daily life: when you see someone fall, pause for one second and don’t say “serves them right”; replace those words with a greeting.","With mission: in ministry, don’t look at people as “our side, their side”; see first that he is a brother."]},"safe":["① Equating “Edom” with some modern people or nation","The Edom of the text is the descendants of Esau, a people in history, and also a portrait of “pride that stands aside.”","Test: Does the sermon name any modern people or nation? If so, delete it.","② Using verse 15, “As you have done, it will be done to you,” to justify revenge","The subject of this sentence is Yahweh, not the one who was hurt.","Test: After hearing it, does the wounded person find rest, or find a weapon?","③ Using verses 17--21 as a basis for modern territorial or political claims","These verses are comfort for a people taken into exile.","Test: Does the sermon match any place name to a present-day country or region? If so, delete it.","④ Setting timetables and counting days: placing “that day” and “the day of Yahweh” into an end-times schedule","The text says only “near.”","Test: Does the sermon contain dates, years, or predictions? If so, delete them.","⑤ Using “standing aside” to shame people who are traumatized, powerless, or themselves running for their lives","Verses 11--14 speak to those who had power and did nothing, or even profited from the moment.","Test: If some listeners have been abandoned, or are powerless themselves, do they leave feeling blamed or understood?","⑥ Turning “standing aside” into “everyone who doesn’t help is an accomplice,” and asking people to carry everyone’s suffering","The text does not say that.","Test: Does the sermon distinguish between “having power but doing nothing, or profiting” and “having no power, or running for one’s own life”?","⑦ Turning judgment into intimidation, so that people obey out of fear","This book was first written as comfort for the wounded.","Test: After hearing it, do people love the Lord more and draw nearer to those who are suffering, or fear the world more and hate their enemies more?","⑧ Reading “the house of Jacob a fire, the house of Esau stubble” as “our side wins”","Verse 18 must be read together with the reasons given in verses 10--14.","Test: Does the sermon also admit that “we” may stand on Edom’s side?","⑨ Preaching that the author, the date, and the relation to Jeremiah 49 must be settled before one can receive this book","These issues only need to be laid side by side, each view set out.","Test: Are listeners told, “You don’t need to settle these first. You can read this book anyway”?","⑩ Treating the “cup” and the “people of Judah” in verse 16 as words the original has","These two words were added by the CUV from context.","Test: Does the sermon say so, and explain that there are other readings?","⑪ Saying outright of the “saviors” in verse 21, “This is a prophecy of Christ”","The original is plural, and the New Testament does not directly quote this verse.","Test: Does the sermon say “this makes us think of,” or “this is the type of”?","⑫ Using Romans 9:13 to simplify “Esau and Jacob” into “God hates certain people”","There are different readings here, and they need to be set side by side.","Test: Does the sermon say to anyone, “You are hated by God”? If so, delete it.","⑬ Teaching selflessness as something people must achieve by themselves, forgetting that Jesus reached out first","","Test: Does the sermon first tell the gospel (he reached out for us first), and then our response?"]}],"txt":{"1":["The vision of Obadiah. This is what the Lord Yahweh says about Edom. We have heard news from Yahweh, and an ambassador is sent among the nations, saying, “Arise, and let’s rise up against her in battle.","Behold, I have made you small among the nations. You are greatly despised.","The pride of your heart has deceived you, you who dwell in the clefts of the rock, whose habitation is high, who says in his heart, ‘Who will bring me down to the ground?’","Though you mount on high as the eagle, and though your nest is set among the stars, I will bring you down from there,” says Yahweh.","“If thieves came to you, if robbers by night—oh, what disaster awaits you—wouldn’t they only steal until they had enough? If grape pickers came to you, wouldn’t they leave some gleaning grapes?","How Esau will be ransacked! How his hidden treasures are sought out!","All the men of your alliance have brought you on your way, even to the border. The men who were at peace with you have deceived you, and prevailed against you. Friends who eat your bread lay a snare under you. There is no understanding in him.”","“Won’t I in that day”, says Yahweh, “destroy the wise men out of Edom, and understanding out of the mountain of Esau?","Your mighty men, Teman, will be dismayed, to the end that everyone may be cut off from the mountain of Esau by slaughter.","For the violence done to your brother Jacob, shame will cover you, and you will be cut off forever.","In the day that you stood on the other side, in the day that strangers carried away his substance, and foreigners entered into his gates, and cast lots for Jerusalem, even you were like one of them.","But don’t look down on your brother in the day of his disaster, and don’t rejoice over the children of Judah in the day of their destruction. Don’t speak proudly in the day of distress.","Don’t enter into the gate of my people in the day of their calamity. Don’t look down on their affliction in the day of their calamity, neither seize their wealth on the day of their calamity.","Don’t stand in the crossroads to cut off those of his who escape. Don’t deliver up those of his who remain in the day of distress.","For the day of Yahweh is near all the nations! As you have done, it will be done to you. Your deeds will return upon your own head.","For as you have drunk on my holy mountain, so will all the nations drink continually. Yes, they will drink, swallow down, and will be as though they had not been.","But in Mount Zion, there will be those who escape, and it will be holy. The house of Jacob will possess their possessions.","The house of Jacob will be a fire, the house of Joseph a flame, and the house of Esau for stubble. They will burn among them, and devour them. There will not be any remaining to the house of Esau.” Indeed, Yahweh has spoken.","Those of the South will possess the mountain of Esau, and those of the lowland, the Philistines. They will possess the field of Ephraim, and the field of Samaria. Benjamin will possess Gilead.","The captives of this army of the children of Israel, who are among the Canaanites, will possess even to Zarephath; and the captives of Jerusalem, who are in Sepharad, will possess the cities of the Negev.","Saviors will go up on Mount Zion to judge the mountains of Esau, and the kingdom will be Yahweh’s."]},"blk":{"1":[{"a":1,"z":2,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>חֲז֖וֹן עֹֽבַדְיָ֑ה כֹּֽה אָמַר֩ אֲדֹנָ֨י יְהוִ֜ה לֶאֱד֗וֹם שְׁמוּעָ֨ה שָׁמַ֜עְנוּ מֵאֵ֤ת יְהוָה֙ וְצִיר֙ בַּגּוֹיִ֣ם שֻׁלָּ֔ח ק֛וּמוּ וְנָק֥וּמָה עָלֶיהָ לַמִּלְחָמָֽה הִנֵּ֥ה קָטֹ֛ן נְתַתִּ֖יךָ בַּגּוֹיִ֑ם בָּז֥וּי אַתָּ֖ה מְאֹֽד<\/p><\/blockquote>","lit":"<blockquote><p>“The vision of Obadiah. This is what the Lord Yahweh says about Edom. We have heard news from Yahweh, and an ambassador is sent among the nations, saying, “Arise, and let’s rise up against her in battle. Behold, I have made you small among the nations. You are greatly despised.”<\/p><\/blockquote>","key":"<table><tr><th>Chinese<\/th><th>Original<\/th><th>Transliteration<\/th><th>Strong’s<\/th><th>Root / formation<\/th><th>Basic meaning<\/th><th>Context here<\/th><\/tr><tr><td>vision<\/td><td>חֲזוֹן<\/td><td>chazon<\/td><td>H2377<\/td><td>√חזה (see)<\/td><td>vision, what is seen<\/td><td>★ Not hearsay: he was called to “see”<\/td><\/tr><tr><td>Obadiah<\/td><td>עֹבַדְיָה<\/td><td>‘ovadyah<\/td><td>H5662<\/td><td>עֶבֶד (servant) + יָהּ (Yahweh)<\/td><td>servant of Yahweh<\/td><td>All the author leaves us is this name<\/td><\/tr><tr><td>news<\/td><td>שְׁמוּעָה<\/td><td>shemu‘ah<\/td><td>H8052<\/td><td>√שׁמע (hear)<\/td><td>what is heard, report<\/td><td>Hearing comes first, speaking after<\/td><\/tr><tr><td>ambassador<\/td><td>צִיר<\/td><td>tsir<\/td><td>H6735<\/td><td>—<\/td><td>envoy, messenger<\/td><td>Sent to the nations to summon them<\/td><\/tr><tr><td>arise<\/td><td>קוּמוּ<\/td><td>qumu<\/td><td>H6965<\/td><td>√קום (arise)<\/td><td>arise (plural imperative)<\/td><td>The first action of the whole chapter is upward<\/td><\/tr><tr><td>small<\/td><td>קָטֹן<\/td><td>qaton<\/td><td>H6996<\/td><td>—<\/td><td>small, insignificant<\/td><td>What God changes first is position: from the heights among the nations to the smallest<\/td><\/tr><tr><td>despised<\/td><td>בָּזוּי<\/td><td>bazuy<\/td><td>H959<\/td><td>√בזה (despise)<\/td><td>looked down on<\/td><td>A passive state: this is the outcome God has set<\/td><\/tr><\/table>","gram":"<p><strong>① “We have heard news from Yahweh”: “I,” or “we”?<\/strong><\/p><ul><li>The Hebrew שָׁמַעְנוּ is <strong>first person plural<\/strong>: “we have heard”<\/li><li>The CUV makes it singular, “I”; Jeremiah 49:14 has almost the same sentence, and there the Hebrew is singular, “I have heard”<\/li><\/ul><p>Some think the “we” is the prophet together with a group who heard God’s word; some think it is a common manner of speaking in the prophets; others notice that the next phrase, “let’s rise up” (וְנָקוּמָה), is also “we,” joining into one voice.<\/p><p><strong>② How does this sentence relate to Jeremiah 49?<\/strong> There are three readings: Obadiah quotes Jeremiah; Jeremiah quotes Obadiah; or both quote an earlier oracle. These notes do not rule on it (see the issues), because whichever came first, this sentence is God’s word.<\/p><blockquote><p><strong>The best understanding:<\/strong> This is a message heard together by a company of prophets and handed on together. The CUV condenses “the Lord Yahweh says this” into “concerning Edom,” and nothing of the meaning is lost.<\/p><\/blockquote>","exp":"<p><strong>The shortest résumé in the book: one name, one “seeing.”<\/strong><\/p><p>Of some Old Testament prophets we know the father and the hometown, and the king in whose days they spoke. Obadiah left nothing: no date, no family tree, no story, only a name. Obadiah means “servant of Yahweh.”<\/p><p>A whole life’s résumé, shrunk to two words: servant. It may be the shortest autobiography in the Bible.<\/p><p>He says he “received a vision.” The Hebrew חָזוֹן means “seeing”: he did not get it secondhand; he was called to look. He says, “We have heard news from Yahweh”: he was not the only one who heard. An ambassador has already been sent among the nations, saying: arise, let us rise up together!<\/p><p>Notice the picture. The first step of the judgment is not a thunderclap from heaven; God sends an ambassador to summon the nations. The neighbors, allies, and partners Edom leaned on now stand up together. In verse 2 God says in his own voice: “I have made you small among the nations.” Not “I will make,” but “I have made,” as if with God the matter is already settled.<\/p><p>What did Edom value most? Its own position. This verse takes the position away first: the smallest, greatly despised.<\/p><p>Landing: what we fear most in life is often being looked down on. But God often begins changing a person at “position.” A selfless person does not wait to be despised before learning humility; he is willing to stand now in the place of “servant.”<\/p>"},{"a":3,"z":4,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>זְד֤וֹן לִבְּךָ֙ הִשִּׁיאֶ֔ךָ שֹׁכְנִ֥י בְחַגְוֵי סֶּ֖לַע מְר֣וֹם שִׁבְתּ֑וֹ אֹמֵ֣ר בְּלִבּ֔וֹ מִ֥י יוֹרִדֵ֖נִי אָֽרֶץ אִם תַּגְבִּ֣יהַּ כַּנֶּ֔שֶׁר וְאִם בֵּ֥ין כּֽוֹכָבִ֖ים שִׂ֣ים קִנֶּ֑ךָ מִשָּׁ֥ם אוֹרִֽידְךָ֖ נְאֻם יְהוָֽה<\/p><\/blockquote>","lit":"<blockquote><p>“The pride of your heart has deceived you, you who dwell in the clefts of the rock, whose habitation is high, who says in his heart, ‘Who will bring me down to the ground?’ Though you mount on high as the eagle, and though your nest is set among the stars, I will bring you down from there,” says Yahweh.”<\/p><\/blockquote>","key":"<table><tr><th>Chinese<\/th><th>Original<\/th><th>Transliteration<\/th><th>Strong’s<\/th><th>Root / formation<\/th><th>Basic meaning<\/th><th>Context here<\/th><\/tr><tr><td>pride<\/td><td>זְדוֹן<\/td><td>zadon<\/td><td>H2087<\/td><td>—<\/td><td>arrogance, presumption<\/td><td>★ The name of pride: it lives in the “heart”<\/td><\/tr><tr><td>heart<\/td><td>לִבְּךָ<\/td><td>libbekha<\/td><td>H3820<\/td><td>—<\/td><td>heart, the inner person<\/td><td>First “your heart,” then “he says in his heart”<\/td><\/tr><tr><td>deceived<\/td><td>הִשִּׁיאֶךָ<\/td><td>hisshi’ekha<\/td><td>H5377<\/td><td>√נשׁא (deceive, causative)<\/td><td>caused you to be deceived<\/td><td>The same verb appears again in verse 7<\/td><\/tr><tr><td>clefts<\/td><td>חַגְוֵי<\/td><td>chagve<\/td><td>H2288<\/td><td>—<\/td><td>cleft, rock cave<\/td><td>Edom’s mountain country is a natural fortress<\/td><\/tr><tr><td>high place<\/td><td>מְרוֹם<\/td><td>marom<\/td><td>H4791<\/td><td>√רום (high)<\/td><td>height, high position<\/td><td>His home is on the “height”: this is his sense of security<\/td><\/tr><tr><td>bring down<\/td><td>יוֹרִדֵנִי<\/td><td>yoridheni<\/td><td>H3381<\/td><td>√ירד (go down)<\/td><td>cause to go down (causative)<\/td><td>“Who will make me go down?”<\/td><\/tr><tr><td>mount on high<\/td><td>תַּגְבִּיהַּ<\/td><td>tagbiah<\/td><td>H1361<\/td><td>√גבה (high)<\/td><td>make oneself high<\/td><td>Even if you rise like the eagle to the highest<\/td><\/tr><tr><td>stars<\/td><td>כּוֹכָבִים<\/td><td>kokhavim<\/td><td>H3556<\/td><td>—<\/td><td>stars<\/td><td>A nest among the stars: not even heaven is taken seriously<\/td><\/tr><\/table>","gram":"<p><strong>① What does “says in his heart” mean?<\/strong><\/p><ul><li>“Says in his heart” (אֹמֵר בְּלִבּוֹ) is a way of speaking in the Bible: not speaking to others, but a person’s <strong>conviction about himself<\/strong><\/li><li>Psalm 14:1, “The fool has said in his heart, ‘There is no God,’” and Isaiah 47:8 and Zephaniah 2:15, “I am, and there is no one besides me,” are the same kind<\/li><\/ul><p>Edom’s sentence puts himself in God’s place: no one can reach me. The question at the end, “Who will…?”, is a rhetorical question that needs no answer; he has already answered it for himself: no one.<\/p><p><strong>② The person suddenly changes.<\/strong> The first half of verse 3 is “you,” and the second half turns to “he” (שִׁבְתּוֹ, בְּלִבּוֹ). Some see a rhetorical device: God turns his head so that the nations can hear what this man says in his heart.<\/p><p><strong>③ Where is the “cleft in the rock”?<\/strong> The Hebrew is “the clefts of the rock” (סֶלַע is “rock”). 2 Kings 14:7 mentions an Edomite city called “Sela,” the same Hebrew word; some think it is alluded to here, and others think it only refers to Edom’s rocky highlands.<\/p><blockquote><p><strong>The best understanding:<\/strong> The terrain is only the stage. The point is the first line of verse 3: “The pride of your heart has deceived you.” It was not an enemy that deceived him; it was his own heart.<\/p><\/blockquote>","exp":"<p><strong>“Who will bring me down to the ground?” This one sentence is the fullest self-portrait of a heart.<\/strong><\/p><p>First, look at where he lives: rock clefts, mountain caves, a home on the heights. Edom’s terrain is a natural fortress: the rock is steep, the paths are narrow, and anyone attacking has to climb one by one. From up there, everyone looks small.<\/p><p>But God says his problem is not the terrain; it is the “heart.”<\/p><p>The Hebrew says, “The pride of your heart has deceived you” (זְדוֹן לִבְּךָ הִשִּׁיאֶךָ). It was not an enemy that deceived him; it was his own heart. Pride has a special skill: it first persuades itself, then persuades others. The higher you live, the more you believe nobody here can pull you down.<\/p><p>His heart’s words are only one sentence: “Who will bring me down to the ground?” It is a question that needs no answer, because he has already answered it himself: no one.<\/p><p>God’s answer is also one sentence: “I will bring you down from there.” “There” is the very place where he feels safest. Even if you mount on high like the eagle and set your nest among the stars, that is not a place beyond God’s reach.<\/p><p>Notice the verb: Edom asks “who will make me go down,” and God answers with <strong>the same verb<\/strong> (יָרַד). God does not find another set of words to refute him; he hands his own words back to him as they were.<\/p><p>Landing: everyone has a “high place” in the heart: my position, my savings, my connections, my spiritual qualifications. People are not ruined by the high place; they are ruined by the sentence “no one can bring me down.” Pride is leaving man’s position and grasping the security that belongs only to God. Humility is giving that place back to God: let man be man, and let God be God.<\/p>"},{"a":5,"z":7,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אִם גַּנָּבִ֤ים בָּאֽוּ לְךָ֙ אִם שׁ֣וֹדְדֵי לַ֔יְלָה אֵ֣יךְ נִדְמֵ֔יתָה הֲל֥וֹא יִגְנְב֖וּ דַּיָּ֑ם אִם בֹּֽצְרִים֙ בָּ֣אוּ לָ֔ךְ הֲל֖וֹא יַשְׁאִ֥ירוּ עֹלֵלֽוֹת אֵ֚יךְ נֶחְפְּשׂ֣וּ עֵשָׂ֔ו נִבְע֖וּ מַצְפֻּנָֽיו עַֽד הַגְּב֣וּל שִׁלְּח֗וּךָ כֹּ֚ל אַנְשֵׁ֣י בְרִיתֶ֔ךָ הִשִּׁיא֛וּךָ יָכְל֥וּ לְךָ֖ אַנְשֵׁ֣י שְׁלֹמֶ֑ךָ לַחְמְךָ֗ יָשִׂ֤ימוּ מָזוֹר֙ תַּחְתֶּ֔יךָ אֵ֥ין תְּבוּנָ֖ה בּֽוֹ<\/p><\/blockquote>","lit":"<blockquote><p>““If thieves came to you, if robbers by night—oh, what disaster awaits you—wouldn’t they only steal until they had enough? If grape pickers came to you, wouldn’t they leave some gleaning grapes? How Esau will be ransacked! How his hidden treasures are sought out! All the men of your alliance have brought you on your way, even to the border. The men who were at peace with you have deceived you, and prevailed against you. Friends who eat your bread lay a snare under you. There is no understanding in him.””<\/p><\/blockquote>","key":"<table><tr><th>Chinese<\/th><th>Original<\/th><th>Transliteration<\/th><th>Strong’s<\/th><th>Root / formation<\/th><th>Basic meaning<\/th><th>Context here<\/th><\/tr><tr><td>cut off<\/td><td>נִדְמֵיתָה<\/td><td>nidmeita<\/td><td>H1820<\/td><td>√דמה (be destroyed)<\/td><td>destroyed, cut off<\/td><td>Even the speaker cannot help crying out<\/td><\/tr><tr><td>enough<\/td><td>דַּיָּם<\/td><td>dayyam<\/td><td>H1767<\/td><td>—<\/td><td>what they need<\/td><td>Even thieves have a limit: they stop when they have enough<\/td><\/tr><tr><td>ransacked<\/td><td>נֶחְפְּשׂוּ<\/td><td>nechpesu<\/td><td>H2664<\/td><td>√חפשׂ (search)<\/td><td>searched through (passive)<\/td><td>Every corner of Esau has been checked<\/td><\/tr><tr><td>hidden treasures<\/td><td>מַצְפֻּנָיו<\/td><td>matspunav<\/td><td>H4710<\/td><td>√צפן (hide)<\/td><td>hidden treasures<\/td><td>What he thought safest is dug out too<\/td><\/tr><tr><td>allies<\/td><td>אַנְשֵׁי בְרִיתֶךָ<\/td><td>anshe veritekha<\/td><td>H376, H1285<\/td><td>—<\/td><td>men of your covenant<\/td><td>Those in alliance with you are the last to send you off<\/td><\/tr><tr><td>deceived<\/td><td>הִשִּׁיאוּךָ<\/td><td>hisshi’ukha<\/td><td>H5377<\/td><td>√נשׁא (deceive, causative)<\/td><td>caused you to be deceived<\/td><td>The same verb as in verse 3<\/td><\/tr><tr><td>snare<\/td><td>מָזוֹר<\/td><td>mazor<\/td><td>H4204<\/td><td>—<\/td><td>trap (meaning disputed)<\/td><td>Those who eat your bread set it under you<\/td><\/tr><tr><td>understanding<\/td><td>תְּבוּנָה<\/td><td>tevunah<\/td><td>H8394<\/td><td>√בין (understand)<\/td><td>understanding, discernment<\/td><td>“There is no understanding in him”<\/td><\/tr><\/table>","gram":"<p><strong>① What answer do the two questions in verse 5 expect?<\/strong><\/p><ul><li>“Wouldn’t they only steal until they had enough?” “Wouldn’t they leave some gleaning grapes?” Both questions expect “yes”<\/li><li>Grape pickers customarily leave gleanings (Lev 19:10; Deut 24:21), and thieves steal only what they need<\/li><\/ul><p>Edom’s case is that there is not even “enough” or “leftover.” Jeremiah 49:9 has a similar comparison, with a slightly different order and wording.<\/p><p><strong>② What is the מָזוֹר in verse 7?<\/strong> The meaning of this word is uncertain:<\/p><ul><li><strong>Snare, trap<\/strong>: the CUV and most modern translations<\/li><li><strong>Wound<\/strong>: the reading of the old English version (KJV); elsewhere this word is mostly connected with “wound, salve”<\/li><\/ul><p>Also, “those who eat your bread” in the Hebrew says only “your bread” (לַחְמְךָ), meaning those who sit at table with you. Psalm 41:9 has the same pain: “Yes, my own familiar friend, in whom I trusted, who ate bread with me, has lifted up his heel against me.”<\/p><blockquote><p><strong>The best understanding:<\/strong> Snare and wound both say the same thing: those closest to you have betrayed you. The meaning is clear, and there is no need to linger on this word.<\/p><\/blockquote>","exp":"<p><strong>Thieves would leave a little behind; but with Edom, even what was hidden is searched out.<\/str
