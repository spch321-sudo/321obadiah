ong><\/p><p>Verse 5 begins with two comparisons. A thief who comes by night steals enough and leaves. Grape pickers who come into the vineyard always leave some gleanings. This is the way of the world: even wicked people have a limit.<\/p><p>But Edom is not like this. “How you are cut off!” The sentence is thrown into the middle, as if the speaker cannot help crying out. Verse 6 goes on: Esau’s hidden places are searched, and his hidden treasures are found out. The place he thought safest is turned over too.<\/p><p>Then verse 7 is the most painful line. Those who search him and deceive him are not strangers; they are his allies, those at peace with him, those who ate at his table. The ones who sent you on your way take you to the border, and at the border they turn on you.<\/p><p>There is an interesting word in the Hebrew: deceive (הִשִּׁיא). Verse 3 says your heart “deceived” you; here your allies “deceived” you. The same verb. The one who first deceived you was your own heart; the one who deceived you later was the one you thought reliable. The heart had already carried you up to the height; the allies only pulled the ladder away at the border.<\/p><p>The last line: “There is no understanding in him.” Edom was known for wisdom (Jer 49:7). For such a people, this is the heaviest sentence of all.<\/p><p>Landing: it is easy for us to stake our “safety” on others: a patron, connections, treaties. These are not forbidden, but they are not God. Whatever we make our last security may one day turn on us at the border.<\/p>"},{"a":8,"z":9,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הֲל֛וֹא בַּיּ֥וֹם הַה֖וּא נְאֻם יְהוָ֑ה וְהַאֲבַדְתִּ֤י חֲכָמִים֙ מֵֽאֱד֔וֹם וּתְבוּנָ֖ה מֵהַ֥ר עֵשָֽׂו וְחַתּ֥וּ גִבּוֹרֶ֖יךָ תֵּימָ֑ן לְמַ֧עַן יִכָּֽרֶת אִ֛ישׁ מֵהַ֥ר עֵשָׂ֖ו מִקָּֽטֶל<\/p><\/blockquote>","lit":"<blockquote><p>““Won’t I in that day”, says Yahweh, “destroy the wise men out of Edom, and understanding out of the mountain of Esau? Your mighty men, Teman, will be dismayed, to the end that everyone may be cut off from the mountain of Esau by slaughter.”<\/p><\/blockquote>","key":"<table><tr><th>Chinese<\/th><th>Original<\/th><th>Transliteration<\/th><th>Strong’s<\/th><th>Root / formation<\/th><th>Basic meaning<\/th><th>Context here<\/th><\/tr><tr><td>that day<\/td><td>יּוֹם<\/td><td>yom<\/td><td>H3117<\/td><td>—<\/td><td>day<\/td><td>“In that day”: the first appearance of God’s day<\/td><\/tr><tr><td>destroy<\/td><td>הַאֲבַדְתִּי<\/td><td>ha’avadti<\/td><td>H6<\/td><td>—<\/td><td>cause to perish (causative)<\/td><td>The subject is God: “I” will destroy<\/td><\/tr><tr><td>wise men<\/td><td>חֲכָמִים<\/td><td>chakhamim<\/td><td>H2450<\/td><td>√חכם (be wise)<\/td><td>wise men (plural)<\/td><td>Edom was known for wisdom<\/td><\/tr><tr><td>Teman<\/td><td>תֵּימָן<\/td><td>teman<\/td><td>H8487<\/td><td>—<\/td><td>Teman (a region of Edom; also “south”)<\/td><td>Home of Eliphaz (Gen 36:11; Job 2:11)<\/td><\/tr><tr><td>mighty men<\/td><td>גִבּוֹרֶיךָ<\/td><td>gibborekha<\/td><td>H1368<\/td><td>√גבר (be strong)<\/td><td>mighty men<\/td><td>Set against the wise: one governs the head, the other the hand<\/td><\/tr><tr><td>dismayed<\/td><td>חַתּוּ<\/td><td>chattu<\/td><td>H2865<\/td><td>√חתת (be terrified)<\/td><td>terrified, shattered<\/td><td>Even the mighty are afraid<\/td><\/tr><tr><td>cut off<\/td><td>יִכָּרֶת<\/td><td>yikkaret<\/td><td>H3772<\/td><td>√כרת (cut down)<\/td><td>be cut off (passive)<\/td><td>★ This word appears again in verses 10 and 14<\/td><\/tr><tr><td>slaughter<\/td><td>קָּטֶל<\/td><td>qatel<\/td><td>H6993<\/td><td>—<\/td><td>slaughter<\/td><td>The last word of the verse; whether it belongs to this verse or the next is read differently<\/td><\/tr><\/table>","gram":"<p><strong>① Which day is “that day”?<\/strong><\/p><p>It is not said here. “That day” (בַּיּוֹם הַהוּא) appears for the first time in this verse without saying which day; what explains it is verse 15: “the day of Yahweh.” These notes do not set a timetable for this day; they only look at what it does: it brings people before God.<\/p><p><strong>② Does the final מִקָּטֶל (“by slaughter”) belong to this verse or the next?<\/strong><\/p><ul><li>The CUV and most translations: to verse 9, “cut off by slaughter”<\/li><li>Some translations attach it to verse 10, so that it reads “for slaughter, for violence done to your brother Jacob,” as the first item of the accusation<\/li><\/ul><p>The two readings do not change the accusation in verse 10; only the punctuation differs.<\/p><blockquote><p><strong>The best understanding:<\/strong> Follow the CUV’s division: verse 9 speaks of the outcome, and verse 10 gives the reason.<\/p><\/blockquote>","exp":"<p><strong>The two things Edom was proudest of: the head and the fist.<\/strong><\/p><p>In verse 8 God says, “Won’t I in that day destroy the wise men out of Edom?” Edom was known for wisdom. Jeremiah asks, “Is wisdom no more in Teman?” Job’s friend Eliphaz was a Temanite. This was a place that took pride in its strategies.<\/p><p>Verse 9 goes on to the other thing: the mighty men. Teman’s mighty men will be dismayed (חַתּוּ), and everyone on Mount Esau will be cut off.<\/p><p>The wise and the mighty, one governing the head and the other the hand, are the two things a nation most relies on to protect itself. God takes both away together.<\/p><p>There is a detail here: verse 7 said there is “no understanding” in Edom, and in verse 8 God says he will destroy “understanding”; both are the same word (תְּבוּנָה). Edom’s heart had already lost its understanding, and God only takes away the reputation that was left.<\/p><p>These two verses also prepare for the accusation that follows. Why this judgment? Verse 10 gives the reason. The order of Scripture here is interesting: first the outcome, then the reason. The hearer first knows that this is real, and is then asked: why?<\/p><p>Landing: what a person can rely on comes down to the head and the hands. Are these two good? Yes. But when we treat them as capital for living “without God,” they turn from gifts into high places. What God takes away is not your ability, but the place where you set your ability up as God.<\/p>"},{"a":10,"z":11,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>מֵחֲמַ֛ס אָחִ֥יךָ יַעֲקֹ֖ב תְּכַסְּךָ֣ בוּשָׁ֑ה וְנִכְרַ֖תָּ לְעוֹלָֽם בְּיוֹם֙ עֲמָֽדְךָ֣ מִנֶּ֔גֶד בְּי֛וֹם שְׁב֥וֹת זָרִ֖ים חֵיל֑וֹ וְנָכְרִ֞ים בָּ֣אוּ שְׁעָרָ֗יו וְעַל יְרוּשָׁלִַ֨ם֙ יַדּ֣וּ גוֹרָ֔ל גַּם אַתָּ֖ה כְּאַחַ֥ד מֵהֶֽם<\/p><\/blockquote>","lit":"<blockquote><p>“For the violence done to your brother Jacob, shame will cover you, and you will be cut off forever. In the day that you stood on the other side, in the day that strangers carried away his substance, and foreigners entered into his gates, and cast lots for Jerusalem, even you were like one of them.”<\/p><\/blockquote>","key":"<table><tr><th>Chinese<\/th><th>Original<\/th><th>Transliteration<\/th><th>Strong’s<\/th><th>Root / formation<\/th><th>Basic meaning<\/th><th>Context here<\/th><\/tr><tr><td>violence<\/td><td>חֲמַס<\/td><td>chamas<\/td><td>H2555<\/td><td>—<\/td><td>violence, unjust harm<\/td><td>★ The first word of the accusation of the whole chapter<\/td><\/tr><tr><td>brother<\/td><td>אָחִיךָ<\/td><td>achikha<\/td><td>H251<\/td><td>—<\/td><td>your brother<\/td><td>The starting point of the accusation: a brother, not an enemy<\/td><\/tr><tr><td>shame<\/td><td>בוּשָׁה<\/td><td>bushah<\/td><td>H955<\/td><td>√בושׁ (be ashamed)<\/td><td>shame, disgrace<\/td><td>First on the face<\/td><\/tr><tr><td>cover<\/td><td>תְּכַסְּךָ<\/td><td>tekhassekha<\/td><td>H3680<\/td><td>√כסה (cover)<\/td><td>will cover you (intensive)<\/td><td>Shame covers him like a garment<\/td><\/tr><tr><td>cut off<\/td><td>נִכְרַתָּ<\/td><td>nikhrata<\/td><td>H3772<\/td><td>√כרת (cut down)<\/td><td>be cut off (passive)<\/td><td>Then on the name: forever<\/td><\/tr><tr><td>stood on the other side<\/td><td>עֲמָדְךָ מִנֶּגֶד<\/td><td>‘amadkha minneged<\/td><td>H5975, H5048<\/td><td>—<\/td><td>stand, from opposite (from afar)<\/td><td>Standing far off and standing opposite: both meanings coexist<\/td><\/tr><tr><td>carried away<\/td><td>שְׁבוֹת<\/td><td>shevot<\/td><td>H7617<\/td><td>√שׁבה (take captive)<\/td><td>carry off (infinitive)<\/td><td>Strangers carry off his substance<\/td><\/tr><tr><td>cast lots<\/td><td>גוֹרָל<\/td><td>goral<\/td><td>H1486<\/td><td>—<\/td><td>lot<\/td><td>Treating a city as something to be divided by lot<\/td><\/tr><tr><td>one of them<\/td><td>אַחַד<\/td><td>achad<\/td><td>H259<\/td><td>√אחד (one)<\/td><td>like one<\/td><td>“Like one of them”<\/td><\/tr><\/table>","gram":"<p><strong>① Does “stood aside” (מִנֶּגֶד) mean watching with folded arms, or standing on the opposing side?<\/strong><\/p><ul><li><strong>Watching from a distance<\/strong>: Psalm 38:11, “My lovers and my friends stand aloof from my plague,” uses the same word<\/li><li><strong>Opposite<\/strong>: 2 Kings 2:7, “stood opposite them at a distance,” the same word, meaning standing at a distance, facing them<\/li><\/ul><p>The meaning of the word lies between “at a distance” and “opposite.” The point is the next line: “even you were like one of them.” From whichever angle, he was not standing on Jacob’s side.<\/p><p><strong>② Is “substance” (חֵיל) wealth, or military strength?<\/strong> The word can be translated “wealth, army, strength.” The CUV takes “wealth” in both verses 11 and 13, consistently.<\/p><p><strong>③ Other passages that confirm it.<\/strong> Amos 1:11 says Edom “pursued his brother with the sword”; Psalm 137:7 remembers “the day of Jerusalem,” when the Edomites said, “Raze it! Raze it!”; Joel 3:19 says Edom will be desolate “for the violence done to the children of Judah,” also using חָמָס.<\/p><blockquote><p><strong>The best understanding:<\/strong> “Standing aside” is not neutrality. The text itself gives the answer: like one of them.<\/p><\/blockquote>","exp":"<p><strong>The first line of the indictment is not “you killed someone,” but “you, against your brother.”<\/strong><\/p><p>Verse 10 is the turning point of the book. Earlier it told how Edom is brought down; here it says why: “For the violence done to your brother Jacob.”<\/p><p>“Violence” (חָמָס) is a heavy word in the Bible; in Noah’s day, “the earth was filled with violence” (Gen 6:11). The victim here has a title: “your brother Jacob.” Not “the kingdom of Judah,” but “your brother.” Deuteronomy says, “You shall not abhor an Edomite, for he is your brother.” God told Israel to treat Edom this way; Edom did not treat Jacob this way.<\/p><p>The outcome is also two-layered: shame will cover you, and you will be cut off forever. First on the face, then on the name.<\/p><p>Verse 11 makes the accusation more concrete. On that day strangers carried off Jacob’s substance, foreigners entered his gates, and they cast lots for Jerusalem. What did Edom do? “You stood on the other side.”<\/p><p>The Hebrew word (מִנֶּגֶד) is “from afar, from opposite.” Whether it is read as watching coldly, or as standing with the opposing side, the next line has made it clear: “even you were like one of them.”<\/p><p>This is the heaviest line in the verse. Edom took up no sword and entered no city. He only stood there. But God says: standing like this makes you one of them.<\/p><p>Even “brother” (אָח) and “one” (אֶחָד) sound almost the same: he was meant to be a “brother,” but that day he became “one of them.”<\/p><p>Landing: it is easier for us to admit what we “did” than what we “did not do.” On the day a brother was in trouble, where were we standing? This is not asking us to carry everyone’s suffering, but to ask ourselves in the heart one question: Did I see? Was there a hand I could have reached out, and did not?<\/p>"},{"a":12,"z":14,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְאַל תֵּ֤רֶא בְיוֹם אָחִ֨יךָ֙ בְּי֣וֹם נָכְר֔וֹ וְאַל תִּשְׂמַ֥ח לִבְנֵֽי יְהוּדָ֖ה בְּי֣וֹם אָבְדָ֑ם וְאַל תַּגְדֵּ֥ל פִּ֖יךָ בְּי֥וֹם צָרָֽה אַל תָּב֤וֹא בְשַֽׁעַר עַמִּי֙ בְּי֣וֹם אֵידָ֔ם אַל תֵּ֧רֶא גַם אַתָּ֛ה בְּרָעָת֖וֹ בְּי֣וֹם אֵיד֑וֹ וְאַל תִּשְׁלַ֥חְנָה בְחֵיל֖וֹ בְּי֥וֹם אֵידֽוֹ וְאַֽל תַּעֲמֹד֙ עַל הַפֶּ֔רֶק לְהַכְרִ֖ית אֶת פְּלִיטָ֑יו וְאַל תַּסְגֵּ֥ר שְׂרִידָ֖יו בְּי֥וֹם צָרָֽה<\/p><\/blockquote>","lit":"<blockquote><p>“But don’t look down on your brother in the day of his disaster, and don’t rejoice over the children of Judah in the day of their destruction. Don’t speak proudly in the day of distress. Don’t enter into the gate of my people in the day of their calamity. Don’t look down on their affliction in the day of their calamity, neither seize their wealth on the day of their calamity. Don’t stand in the crossroads to cut off those of his who escape. Don’t deliver up those of his who remain in the day of distress.”<\/p><\/blockquote>","key":"<table><tr><th>Chinese<\/th><th>Original<\/th><th>Transliteration<\/th><th>Strong’s<\/th><th>Root / formation<\/th><th>Basic meaning<\/th><th>Context here<\/th><\/tr><tr><td>should not<\/td><td>אַל<\/td><td>’al<\/td><td>H408<\/td><td>—<\/td><td>do not (prohibitive)<\/td><td>★ Eight times in three verses, each beginning with the same word<\/td><\/tr><tr><td>look down on<\/td><td>תֵּרֶא<\/td><td>tere’<\/td><td>H7200<\/td><td>√ראה (see)<\/td><td>look (with a sense of gloating)<\/td><td>The way of “looking” is not concern but enjoyment<\/td><\/tr><tr><td>rejoice<\/td><td>תִּשְׂמַח<\/td><td>tismach<\/td><td>H8055<\/td><td>√שׂמח (rejoice)<\/td><td>be glad<\/td><td>Watching someone’s disaster and feeling satisfied<\/td><\/tr><tr><td>speak proudly<\/td><td>תַּגְדֵּל פִּיךָ<\/td><td>tagdel pikha<\/td><td>H1431, H6310<\/td><td>—<\/td><td>make your mouth big<\/td><td>Opening the mouth wide to boast<\/td><\/tr><tr><td>gate<\/td><td>שַׁעַר<\/td><td>sha‘ar<\/td><td>H8179<\/td><td>—<\/td><td>city gate<\/td><td>The place of a city’s judgment and trade<\/td><\/tr><tr><td>seize<\/td><td>תִּשְׁלַחְנָה חֵילוֹ<\/td><td>tishlachnah bechelo<\/td><td>H7971, H2428<\/td><td>√שׁלח (stretch out)<\/td><td>reach out the hand to take his wealth<\/td><td>The Hebrew has “send out”; “hand” was supplied by the CUV<\/td><\/tr><tr><td>crossroads<\/td><td>הַפֶּרֶק<\/td><td>happereq<\/td><td>H6563<\/td><td>—<\/td><td>fork, junction<\/td><td>Where those fleeing for their lives split into different paths<\/td><\/tr><tr><td>those who escape<\/td><td>פְּלִיטָיו<\/td><td>pelitav<\/td><td>H6412<\/td><td>√פלט (escape)<\/td><td>his escaped ones<\/td><td>★ “Those who escape” in verse 17 comes from the same root<\/td><\/tr><tr><td>deliver up<\/td><td>תַּסְגֵּר<\/td><td>tasgir<\/td><td>H5462<\/td><td>√סגר (shut up, hand over)<\/td><td>hand over (causative)<\/td><td>Giving people into the hand of the enemy<\/td><\/tr><\/table>","gram":"<p><strong>① Is “you should not” “you ought not to have,” or “do not”?<\/strong><\/p><ul><li><strong>Regretful<\/strong>: “you ought not to have…”: the day has already passed, and it recounts what Edom has already done<\/li><li><strong>Prohibitive<\/strong>: “do not…”: the Hebrew אַל with a prohibitive force, literally a command; some read it as a warning about what is about to happen<\/li><li><strong>Both together<\/strong>: the prophet speaks of what has happened as if it were before our eyes, so that the hearers are questioned right now<\/li><\/ul><p>The CUV’s “you should not” stands exactly between the two.<\/p><p><strong>② The structure of the eight “you should not.”<\/strong> Three in verse 12, three in verse 13, two in verse 14; except for the first in verse 14, each is followed by “in the day of…” The three in verse 12 are “look, rejoice, speak”; verse 13 is “enter, look, seize”; verse 14 has the last two actions: cutting off those who escape, and handing over the survivors to the enemy.<\/p><p><strong>③ Proverbs 24:17.<\/strong> “Don’t rejoice when your enemy falls, and don’t let your heart be glad when he is overthrown”: the same ethic as “don’t rejoice” in verse 12.<\/p><blockquote><p><strong>The best understanding:<\/strong> This is a list, and each item is something that nobody forced you to do.<\/p><\/blockquote>","exp":"<p><strong>The eight “you should not”: a list in which every item is something nobody forced you to do.<\/strong><\/p><p>Verses 12 to 14 are like a poem fired in rapid succession. Eight times, the same line begins: “you should not…”<\/p><p>Read slowly, and you notice a road sliding downward.<\/p><p>The three in verse 12 are in the eyes, the heart, and the mouth: looking down, therefore rejoicing, and speaking proudly. In verse 13 the feet have gone in, the eyes look again, and the hand reaches out: entering the gate, looking on, seizing. Verse 14 is the last action: standing at the crossroads, cutting off those who escape, and handing the rest over to the enemy.<\/p><p>From looking, to rejoicing, to speaking, to entering, to seizing, to cutting off. Each step goes only a little farther than the one before, and each has its reason: I’m only looking; I’m only talking; everyone else is going in, so what do I lose by staying out?<\/p><p>The most terrible is the crossroads. Those fleeing for their lives split onto two paths here, and he waits here. It is the last danger for those who think “it’s already over.”<\/p><p>One word is worth linking: “those who escape” (פְּלִיטָיו). At the crossroads Edom cut off those who escaped, and in verse 17 God says: in Mount Zion there will be those who escape (פְלֵיטָה). The escape route Edom blocked, God will open somewhere else.<\/p><p>Landing: no one becomes an accomplice in a day. It begins with a glance, with a sentence like “serves them right.” Today, when someone you know is in trouble, where will your eyes, your mouth, and your feet go?<\/p>"},{"a":15,"z":16,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כִּֽי קָר֥וֹב יוֹם יְהוָ֖ה עַל כָּל הַגּוֹיִ֑ם כַּאֲשֶׁ֤ר עָשִׂ֨יתָ֙ יֵעָ֣שֶׂה לָּ֔ךְ גְּמֻלְךָ֖ יָשׁ֥וּב בְּרֹאשֶֽׁךָ כִּ֗י כַּֽאֲשֶׁ֤ר שְׁתִיתֶם֙ עַל הַ֣ר קָדְשִׁ֔י יִשְׁתּ֥וּ כָֽל הַגּוֹיִ֖ם תָּמִ֑יד וְשָׁת֣וּ וְלָע֔וּ וְהָי֖וּ כְּל֥וֹא הָיֽוּ<\/p><\/blockquote>","lit":"<blockquote><p>“For the day of Yahweh is near all the nations! As you have done, it will be done to you. Your deeds will return upon your own head. For as you have drunk on my holy mountain, so will all the nations drink continually. Yes, they will drink, swallow down, and will be as though they had not been.”<\/p><\/blockquote>","key":"<table><tr><th>Chinese<\/th><th>Original<\/th><th>Transliteration<\/th><th>Strong’s<\/th><th>Root / formation<\/th><th>Basic meaning<\/th><th>Context here<\/th><\/tr><tr><td>day<\/td><td>יוֹם<\/td><td>yom<\/td><td>H3117<\/td><td>—<\/td><td>day<\/td><td>★ The same word, and this time the subject is Yahweh<\/td><\/tr><tr><td>near<\/td><td>קָרוֹב<\/td><td>qarov<\/td><td>H7138<\/td><td>√קרב (draw near)<\/td><td>near<\/td><td>“Near”: it does not say which day<\/td><\/tr><tr><td>all the nations<\/td><td>כָּל הַגּוֹיִם<\/td><td>kol hagoyim<\/td><td>H3605, H1471<\/td><td>—<\/td><td>all the nations<\/td><td>The judgment extends from Edom to all nations<\/td><\/tr><tr><td>deeds<\/td><td>גְּמֻלְךָ<\/td><td>gemulkha<\/td><td>H1576<\/td><td>√גמל (repay)<\/td><td>your doing, your recompense<\/td><td>What “you have done” returns to you<\/td><\/tr><tr><td>return<\/td><td>יָשׁוּב<\/td><td>yashuv<\/td><td>H7725<\/td><td>√שׁוב (return)<\/td><td>return, turn back<\/td><td>Like something thrown out that comes around again<\/td><\/tr><tr><td>drink<\/td><td>שְׁתִיתֶם<\/td><td>shetitem<\/td><td>H8354<\/td><td>√שׁתה (drink)<\/td><td>drink<\/td><td>The Hebrew says only “drink”; “cup” was added by translators from context<\/td><\/tr><tr><td>holy mountain<\/td><td>הַר קָדְשִׁי<\/td><td>har qodshi<\/td><td>H2022, H6944<\/td><td>√קדשׁ (be set apart as holy)<\/td><td>my holy mountain<\/td><td>God himself calls it “my”<\/td><\/tr><tr><td>continually<\/td><td>תָּמִיד<\/td><td>tamid<\/td><td>H8548<\/td><td>—<\/td><td>continually, without ceasing<\/td><td>Drinking, not a single mouthful, but an unending flow<\/td><\/tr><tr><td>swallow down<\/td><td>לָעוּ<\/td><td>la‘u<\/td><td>H3886<\/td><td>—<\/td><td>gulp down, swallow<\/td><td>Drinking until there is no control<\/td><\/tr><\/table>","gram":"<p><strong>① What principle is “As you have done, it will be done to you” in verse 15?<\/strong><\/p><ul><li><strong>Deeds that rebound on their own<\/strong>: “will return upon your own head” (יָשׁוּב, return) is like an act bringing its own consequence<\/li><li><strong>God’s own judgment<\/strong>: the subject of this verse is “Yahweh”; it is the day Yahweh brings judgment<\/li><li><strong>Both together<\/strong>: God lets what a person has done come back on that person<\/li><\/ul><p>Whichever it is, the subject of this sentence is God, not man. It is not a permit for revenge. Romans 12:19 says: “Don’t seek revenge yourselves, beloved… ‘Vengeance belongs to me; I will repay, says the Lord.’”<\/p><p><strong>② Who is “you” in verse 16?<\/strong> The Hebrew has only “you drank” (שְׁתִיתֶם), with no “people of Judah” and no “cup”; both were added by the CUV from context.<\/p><ul><li><strong>Judah drank the cup of judgment<\/strong> (the CUV): first Judah suffered on the holy mountain, and now the cup passes to the nations. Jer 25:15, 49:12, and Lam 4:21 all use the “cup” to speak of judgment being passed around<\/li><li><strong>Edom and the nations drank the wine of celebration<\/strong>: they drank and made merry on the holy mountain, and now it is their turn to drink judgment<\/li><\/ul><blockquote><p><strong>The best understanding:<\/strong> The two readings end in the same place: that cup will be passed to everyone. Jeremiah 49:12 says: “they to whom it didn’t pertain to drink of the cup will certainly drink.”<\/p><\/blockquote>","exp":"<p><strong>The same word, a new subject.<\/strong><\/p><p>In verses 11 to 14 the word “day” keeps being used of the brother: the day of his disaster, the day of his destruction, the day of his distress. In verse 15 the word suddenly changes owners: “The day of Yahweh is near all the nations.”<\/p><p>You stood by and watched your brother’s day; now it is Yahweh’s day to watch you.<\/p><p>Then comes a very simple principle: “As you have done, it will be done to you. Your deeds will return upon your own head.” The Hebrew says “return” (יָשׁוּב): like a boomerang thrown out, it circles back to the head.<\/p><p>This sentence is the easiest to misuse. It does not say: if others hurt you, you may do the same to them. God is speaking, and God is the subject: “the day of Yahweh.” Romans says: “Vengeance belongs to me; I will repay.” The hand of recompense is God’s, not ours. A person who has been wounded does not find a weapon here, but a place to rest: justice has an owner, and it is not my job.<\/p><p>Verse 16 speaks of a cup (the Hebrew says only “drink”; “cup” was added by translators from context). There is a cup that everyone must drink. Some read it as Judah drinking the cup of judgment first, with the nations to follow; some read it as Edom and the nations drinking wine in celebration on the holy mountain, and now it is their turn to drink judgment. Either way, the cup will come to everyone, and no one is exempt.<\/p><p>Notice the scale of this verse. Judgment widens from one nation, Edom, to “all the nations.” Edom’s story is no longer only Edom’s story. It is the story of everyone who stands aside, and everyone who thinks he is the exception.<\/p><p>Landing: for the wounded this verse is comfort: justice has a Lord. For those who wound it is a warning: deeds come back. For everyone it is a question: am I still waiting for someone else to be judged first?<\/p>"},{"a":17,"z":18,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וּבְהַ֥ר צִיּ֛וֹן תִּהְיֶ֥ה פְלֵיטָ֖ה וְהָ֣יָה קֹ֑דֶשׁ וְיָֽרְשׁוּ֙ בֵּ֣ית יַֽעֲקֹ֔ב אֵ֖ת מוֹרָֽשֵׁיהֶם וְהָיָה֩ בֵית יַעֲקֹ֨ב אֵ֜שׁ וּבֵ֧ית יוֹסֵ֣ף לֶהָבָ֗ה וּבֵ֤ית עֵשָׂו֙ לְקַ֔שׁ וְדָלְק֥וּ בָהֶ֖ם וַאֲכָל֑וּם וְלֹֽא יִֽהְיֶ֤ה שָׂרִיד֙ לְבֵ֣ית עֵשָׂ֔ו כִּ֥י יְהוָ֖ה דִּבֵּֽר<\/p><\/blockquote>","lit":"<blockquote><p>“But in Mount Zion, there will be those who escape, and it will be holy. The house of Jacob will possess their possessions. The house of Jacob will be a fire, the house of Joseph a flame, and the house of Esau for stubble. They will burn among them, and devour them. There will not be any remaining to the house of Esau.” Indeed, Yahweh has spoken.”<\/p><\/blockquote>","key":"<table><tr><th>Chinese<\/th><th>Original<\/th><th>Transliteration<\/th><th>Strong’s<\/th><th>Root / formation<\/th><th>Basic meaning<\/th><th>Context here<\/th><\/tr><tr><td>escape<\/td><td>פְלֵיטָה<\/td><td>peleitah<\/td><td>H6413<\/td><td>√פלט (escape)<\/td><td>those who escape, escape<\/td><td>★ The “those who escape” of verse 14 finds a way out here<\/td><\/tr><tr><td>Mount Zion<\/td><td>הַר צִיּוֹן<\/td><td>har tsiyyon<\/td><td>H2022, H6726<\/td><td>—<\/td><td>Mount Zion<\/td><td>Opposite the mountain of Esau<\/td><\/tr><tr><td>holy<\/td><td>קֹדֶשׁ<\/td><td>qodesh<\/td><td>H6944<\/td><td>√קדשׁ (be set apart as holy)<\/td><td>holy, set apart<\/td><td>Because God is there, not because the terrain is high<\/td><\/tr><tr><td>possess<\/td><td>יָרְשׁוּ<\/td><td>yareshu<\/td><td>H3423<\/td><td>—<\/td><td>inherit, take as possession<\/td><td>Appears 4 times in verses 17–20<\/td><\/tr><tr><td>possessions<\/td><td>מוֹרָשֵׁיהֶם<\/td><td>morasheihem<\/td><td>H4180<\/td><td>—<\/td><td>possession, inherited land<\/td><td>Some ancient versions read “those who dispossessed them”<\/td><\/tr><tr><td>fire<\/td><td>אֵשׁ<\/td><td>’esh<\/td><td>H784<\/td><td>—<\/td><td>fire<\/td><td>The house of Jacob<\/td><\/tr><tr><td>flame<\/td><td>לֶהָבָה<\/td><td>lehavah<\/td><td>H3852<\/td><td>—<\/td><td>flame<\/td><td>The house of Joseph<\/td><\/tr><tr><td>stubble<\/td><td>קַשׁ<\/td><td>qash<\/td><td>H7179<\/td><td>—<\/td><td>stubble, straw<\/td><td>The house of Esau: catches fire at a touch<\/td><\/tr><tr><td>remaining<\/td><td>שָׂרִיד<\/td><td>sarid<\/td><td>H8300<\/td><td>—<\/td><td>survivor, remnant<\/td><td>★ The same root as “those who remain” in verse 14<\/td><\/tr><\/table>","gram":"<p><strong>① Whose “possessions” (מוֹרָשֵׁיהֶם) in verse 17?<\/strong><\/p><ul><li><strong>Their own original possessions<\/strong> (the CUV): what was taken away will be restored<\/li><li><strong>“Those who dispossessed them”<\/strong>: some ancient versions read this word in another form, meaning that the house of Jacob will take back “those who took their inheritance”<\/li><\/ul><p>The verb “possess” (יָרַשׁ), which recurs through verses 17 to 20, comes from the same root; the whole passage is about “getting back.”<\/p><p><strong>② Who is “the house of Joseph”?<\/strong> In the Old Testament “the house of Joseph” often refers to the northern tribes (Ephraim, Manasseh); set beside “the house of Jacob,” it says that the two divided halves become fire together here.<\/p><p><strong>③ Fire and stubble.<\/strong> Stubble that catches at a touch is a common Old Testament image (Isa 5:24; Mal 4:1, “all the proud, and all who work wickedness, will be stubble”).<\/p><blockquote><p><strong>The best understanding:<\/strong> This passage speaks of what God said about “violence against a brother,” and must be read with the reasons in verses 10–14; it is not a slogan that “our side wins.”<\/p><\/blockquote>","exp":"<p><strong>Fire and stubble: the houses of two brothers part ways here.<\/strong><\/p><p>The first sentence of verse 17 lets people breathe out: “in Mount Zion, there will be those who escape.”<\/p><p>Remember verse 14? Edom stood at the crossroads to cut off those who escaped. Now God says: those who escape are here. The road Edom could not block, God had prepared long ago. Joel has a similar line: “in Mount Zion and in Jerusalem there will be those who escape.” This is a hope that keeps returning in the prophets.<\/p><p>“It will be holy”: Zion is holy not because its terrain is high, but because God is there. “The house of Jacob will possess their possessions”: what was taken away will be returned.<\/p><p>Verse 18 uses three things: fire, flame, stubble. The house of Jacob is fire, the house of Joseph (usually the northern tribes) is flame, and the house of Esau is stubble. When fire meets stubble, there is nothing to negotiate.<\/p><p>Be careful with this picture. It is not saying: we are fire, they are grass. The reason has already been given: not because he is of the house of Esau, but because he did violence to his brother and stood aside.<\/p><p>One more word must be seen together. In verse 14 Edom handed over Jacob’s “survivors” (שְׂרִידָיו) to the enemy; verse 18 says the house of Esau will have no “remaining” (שָׂרִיד). The same root: as you treat others’ survivors, so you will have no survivor yourself.<\/p><p>Landing: the hope in this verse is for those who were scattered and stripped. Justice has a Lord, and what was taken away, God remembers. This hope is not meant to make people hate more, but to let them lay it down.<\/p>"},{"a":19,"z":20,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְיָרְשׁ֨וּ הַנֶּ֜גֶב אֶת הַ֣ר עֵשָׂ֗ו וְהַשְּׁפֵלָה֙ אֶת פְּלִשְׁתִּ֔ים וְיָרְשׁוּ֙ אֶת שְׂדֵ֣ה אֶפְרַ֔יִם וְאֵ֖ת שְׂדֵ֣ה שֹׁמְר֑וֹן וּבִנְיָמִ֖ן אֶת הַגִּלְעָֽד וְגָלֻ֣ת הַֽחֵל הַ֠זֶּה לִבְנֵ֨י יִשְׂרָאֵ֤ל אֲשֶֽׁר כְּנַעֲנִים֙ עַד צָ֣רְפַ֔ת וְגָלֻ֥ת יְרוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּסְפָרַ֑ד יִֽרְשׁ֕וּ אֵ֖ת עָרֵ֥י הַנֶּֽגֶב<\/p><\/blockquote>","lit":"<blockquote><p>“Those of the South will possess the mountain of Esau, and those of the lowland, the Philistines. They will possess the field of Ephraim, and the field of Samaria. Benjamin will possess Gilead. The captives of this army of the children of Israel, who are among the Canaanites, will possess even to Zarephath; and the captives of Jerusalem, who are in Sepharad, will possess the cities of the Negev.”<\/p><\/blockquote>","key":"<table><tr><th>Chinese<\/th><th>Original<\/th><th>Transliteration<\/th><th>Strong’s<\/th><th>Root / formation<\/th><th>Basic meaning<\/th><th>Context here<\/th><\/tr><tr><td>South<\/td><td>הַנֶּגֶב<\/td><td>hannegev<\/td><td>H5045<\/td><td>—<\/td><td>the South (the Negev)<\/td><td>The people of the South take the mountain of Esau to the southeast<\/td><\/tr><tr><td>lowland<\/td><td>הַשְּׁפֵלָה<\/td><td>hashshephelah<\/td><td>H8219<\/td><td>—<\/td><td>lowland, foothills<\/td><td>To the west they take the land of the Philistines<\/td><\/tr><tr><td>Philistines<\/td><td>פְּלִשְׁתִּים<\/td><td>peleshtim<\/td><td>H6430<\/td><td>—<\/td><td>the Philistines<\/td><td>The coastal plain<\/td><\/tr><tr><td>Samaria<\/td><td>שֹׁמְרוֹן<\/td><td>shomeron<\/td><td>H8111<\/td><td>—<\/td><td>Samaria<\/td><td>Capital of the northern kingdom<\/td><\/tr><tr><td>Gilead<\/td><td>הַגִּלְעָד<\/td><td>hagil‘ad<\/td><td>H1568<\/td><td>—<\/td><td>Gilead<\/td><td>East of the Jordan<\/td><\/tr><tr><td>captives<\/td><td>גָלֻת<\/td><td>galut<\/td><td>H1546<\/td><td>√גלה (go into exile)<\/td><td>exiles (a company)<\/td><td>Two groups of exiles, standing side by side on the same map<\/td><\/tr><tr><td>Zarephath<\/td><td>צָרְפַת<\/td><td>tsarefat<\/td><td>H6886<\/td><td>—<\/td><td>Zarephath (in the territory of Sidon)<\/td><td>North to the Phoenician coast (1 Kings 17:9)<\/td><\/tr><tr><td>Sepharad<\/td><td>סְפָרַד<\/td><td>sefarad<\/td><td>H5614<\/td><td>—<\/td><td>a place name, location uncertain<\/td><td>Most scholars think it is Sardis in Asia Minor<\/td><\/tr><\/table>","gram":"<p><strong>① Who takes what?<\/strong> The verb “possess” (יָרַשׁ) recurs, and its subject has to be supplied from context: those of the South possess the mountain of Esau; those of the lowland possess the land of the Philistines, and the fields of Ephraim and Samaria; Benjamin possesses Gilead. Four directions: southeast, west, north, east.<\/p><p><strong>② The difficulty of verse 20.<\/strong> This verse is one of the hardest places in the book to read: how to read הַחֵל הַזֶּה (this host / this rampart) and כְּנַעֲנִים (Canaanites, which can also mean Phoenician traders) is not agreed in ancient or modern versions. The CUV takes one reasonable reading.<\/p><p><strong>③ Where is “Sepharad” (סְפָרַד)?<\/strong><\/p><ul><li>Most scholars: Sardis in Asia Minor (Persian texts call it Sparda)<\/li><li>Jewish tradition after the Middle Ages: used this name for Spain<\/li><\/ul><p>The name was used again and again in later history. These notes do not equate it with any present-day people or any place today.<\/p><blockquote><p><strong>The best understanding:<\/strong> The details of the place names are uncertain, but the main point is clear: those taken captive and scattered will come home, and brothers in north and south will share one inheritance.<\/p><\/blockquote>","exp":"<p><strong>From the mountaintop to the whole land: place names on every side form a map of “returning.”<\/strong><\/p><p>Verses 19 and 20 are like a map, naming place after place: the South, the lowland, Ephraim, Samaria, Gilead, Zarephath, Sepharad. There are many names, and reading them feels like going through a list of title deeds.<\/p><p>But notice the verb. “Possess” (יָרַשׁ) appears four times in verses 17 to 20, and “possessions” in verse 17 comes from the same root. In the Old Testament this is a very familiar verb: when Israel crossed the Jordan and possessed the land of Canaan, this was the word. Now the verb returns: what was taken away will be possessed again.<\/p><p>Notice the people named: those of the South, those of the lowland, Benjamin; and two groups of captives: the children of Israel (north) and the captives of Jerusalem (south). The northern and southern kingdoms were divided for hundreds of years in history, and here they stand side by side on the same map.<\/p><p>The Hebrew of verse 20 is not easy to read, and ancient and modern versions read it differently. Where is “Sepharad” exactly? Most scholars think Sardis in Asia Minor; only later did Jews use this name for Spain. A place name that is uncertain can stay uncertain. What is certain is the direction: not drawing inward but opening outward, so that even the farthest land of exile is within God’s plan.<\/p><p>This map must be read carefully. It is not for anyone today to draw their own borders; it is a comfort spoken to a people who were taken captive, scattered, and robbed of their homes.<\/p><p>Landing: God’s promise gives people a place they can return to. For someone who is now in a strange land, driven out, and feeling they can never go back, the point of these two verses is not the place names but this sentence: what you have lost is not the last page.<\/p>"},{"a":21,"z":21,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְעָל֤וּ מֽוֹשִׁעִים֙ בְּהַ֣ר צִיּ֔וֹן לִשְׁפֹּ֖ט אֶת הַ֣ר עֵשָׂ֑ו וְהָיְתָ֥ה לַֽיהוָ֖ה הַמְּלוּכָֽה<\/p><\/blockquote>","lit":"<blockquote><p>“Saviors will go up on Mount Zion to judge the mountains of Esau, and the kingdom will be Yahweh’s.”<\/p><\/blockquote>","key":"<table><tr><th>Chinese<\/th><th>Original<\/th><th>Transliteration<\/th><th>Strong’s<\/th><th>Root / formation<\/th><th>Basic meaning<\/th><th>Context here<\/th><\/tr><tr><td>saviors<\/td><td>מוֹשִׁעִים<\/td><td>moshi‘im<\/td><td>H3467<\/td><td>√ישׁע (save)<\/td><td>saviors (plural)<\/td><td>Like the “deliverers” of Judges (Judg 3:9, 15)<\/td><\/tr><tr><td>go up<\/td><td>עָלוּ<\/td><td>‘alu<\/td><td>H5927<\/td><td>√עלה (go up)<\/td><td>go up<\/td><td>★ The opposite direction from the “bring down” of verses 3–4<\/td><\/tr><tr><td>Mount Zion<\/td><td>הַר צִיּוֹן<\/td><td>har tsiyyon<\/td><td>H2022, H6726<\/td><td>—<\/td><td>Mount Zion<\/td><td>Where “those who escape” of verse 17 are<\/td><\/tr><tr><td>judge<\/td><td>לִשְׁפֹּט<\/td><td>lishpot<\/td><td>H8199<\/td><td>√שׁפט (judge, govern)<\/td><td>judge, govern<\/td><td>The root of the Old Testament “judges”: it also means “govern”<\/td><\/tr><tr><td>mountains of Esau<\/td><td>הַר עֵשָׂו<\/td><td>har ‘esav<\/td><td>H2022, H6215<\/td><td>—<\/td><td>the mountain of Esau<\/td><td>The third time in the book: “mountain” against “mountain”<\/td><\/tr><tr><td>kingdom<\/td><td>הַמְּלוּכָה<\/td><td>hammelukhah<\/td><td>H4410<\/td><td>√מלך (reign)<\/td><td>kingship, kingdom<\/td><td>★ The last noun of the book<\/td><\/tr><tr><td>will be Yahweh’s<\/td><td>וְהָיְתָה לַיהוָה<\/td><td>vehayetah layhwh<\/td><td>H1961, H3068<\/td><td>—<\/td><td>shall belong to Yahweh<\/td><td>“Will be” means “belong to”: its end point is “Yahweh”<\/td><\/tr><\/table>","gram":"<p><strong>① Who are the “saviors” (מוֹשִׁעִים)?<\/strong><\/p><ul><li><strong>Saviors God raises up<\/strong>: like Othniel and Ehud in Judges (Judg 3:9, 15); the Hebrew is plural<\/li><li><strong>Those who are saved<\/strong>: some ancient versions read the word as passive, “those who have been saved” go up<\/li><li><strong>Christ<\/strong>: some think this verse finally points to that one Savior; the New Testament does not directly quote this verse of Obadiah, so this is a connection of “this makes us think of,” not “this is the prophecy”<\/li><\/ul><p><strong>② “Judge” (לִשְׁפֹּט) also means “govern.”<\/strong> The Old Testament judges (שֹׁפְטִים) both judged and led; the going up here is for governing, not only for condemning.<\/p><p><strong>③ “The kingdom” (הַמְּלוּכָה).<\/strong> This word is “kingship”: who is king. Psalm 22:28 has the same sentence: “For the kingdom is Yahweh’s.”<\/p><blockquote><p><strong>The best understanding:<\/strong> The subject of this verse is neither Jacob nor Esau, but Yahweh: the ending is that kingship belongs to him.<\/p><\/blockquote>","exp":"<p><strong>The last line of the whole book is not a victory song, and not a sword; it is a belonging.<\/strong><\/p><p>Obadiah spent twenty verses speaking of high places, of standing aside, of days, of those who escape, of land. By the last verse only one thing remains.<\/p><p>“Saviors will go up on Mount Zion to judge the mountains of Esau.” Notice the direction: going up (וְעָלוּ). In verses 3 and 4 Edom says, “Who will bring me down?” and God says, “I will bring you down”; now the direction has reversed: the saviors “go up.” They do not climb by themselves; they are sent. They go up not to take a high seat but to judge; in the Old Testament this verb also means “govern,” like the saviors God raised up in Judges, who delivered the people from oppression.<\/p><p>Then the last sentence: “the kingdom will be Yahweh’s.” The Hebrew הַמְּלוּכָה is “kingship.” Psalm 22 has a nearly identical line: “the kingdom is Yahweh’s.” The subject of this sentence is neither Jacob nor Esau, but Yahweh.<\/p><p>Reading to here, the weight of the whole book turns. What Edom thought was: my high place, my safety. What Jacob perhaps thought was: our inheritance, our enemy. What God finally says is: the kingship is mine. This is the center of the Lord’s Prayer: “For yours is the kingdom, the power, and the glory, forever.”<\/p><p>Landing: the end of history is not our to-do list. We do not need to be the judge, and we do not need to settle everyone in God’s place. Our position is to return to our position: not taking power, not contending for high places, letting Jesus be King, letting Jesus receive all the glory.<\/p>"}]},"serm":{"1":{"min":14,"pts":[["The pride of your heart","1:1--9","Who will bring me down to the ground?"],["You should not stand aside","1:10--14","You stood aside"],["The kingdom will be Yahweh’s","1:15--21","The kingdom will be Yahweh’s"]],"blocks":[["h","“The Kingdom Will Be Yahweh’s”"],["p","Brothers and sisters, peace to you."],["p","Today we are reading the shortest book in the Bible."],["p","One chapter, twenty-one verses."],["p","You could read it in one breath, in about five minutes."],["p","But I want to say this: the shorter the book, the more slowly it should be read."],["p","Because when a person says few words, every sentence is something he had to say."],["p","The author of this book is named Obadiah."],["p","The name means: servant of Yahweh."],["p","Who was his father? We don’t know."],["p","Where did he live? We don’t know."],["p","In the days of which king? We don’t know that either."],["p","A person’s whole résumé has shrunk to two words: servant."],["p","I often think this is the shortest autobiography in the Bible."],["p","And also the best one."],["p","What he has to say is simple too."],["p","There was a man who lived very high up."],["p","On the day his brother was in trouble, he stood to one side."],["p","Then God spoke."],["p","The last line is the hope of this book."],["p","Today we will go in three steps:"],["p","First, the pride of your heart."],["p","Second, you should not stand aside."],["p","Third, the kingdom will be Yahweh’s."],["p","Let’s look at the first step: the pride of your heart."],["p","Please imagine a mountain city."],["p","Rock on every side, and the paths narrow and steep."],["p","Anyone who wants to go up has to climb one by one."],["p","The people in the city sit on the heights and look down."],["p","Everyone they see is small."],["p","This is Edom."],["p","They were the descendants of Esau, living in the hill country south of the Dead Sea."],["p","A natural fortress: no need to build walls."],["q","“The pride of your heart has deceived you, you who dwell in the clefts of the rock, whose habitation is high, who says in his heart, ‘Who will bring me down to the ground?’”"],["p","Please notice two things."],["p","First, God says he is “deceived.”"],["p","The one who deceived him was not an enemy."],["p","It was his own heart."],["p","Pride has a special skill:"],["p","it first persuades you, then persuades others."],["p","The higher you live, the more you believe: no one can come up here."],["p","Second, the sentence in his heart."],["p","“Who will bring me down to the ground?”"],["p","This is a question."],["p","But he doesn’t need an answer."],["p","Because he has already answered it for himself: no one."],["p","Brothers and sisters, we have all said this sentence."],["p","Not necessarily out loud."],["p","We said it in the heart."],["p","Nobody can touch my job."],["p","My savings are enough for my whole life."],["p","My connections are enough to shield me from the storm."],["p","My spiritual qualifications are plain for everyone to see."],["p","These are all my rock clefts."],["p","A rock cleft is not a bad thing."],["p","What is bad is that I say in my heart: no one can bring me down."],["p","At that moment, I have put myself in God’s place."],["p","How does God answer?"],["q","“Though you mount on high as the eagle, and though your nest is set among the stars, I will bring you down from there,” says Yahweh."],["p","Please notice this verb."],["p","Edom asks: who will “bring me down”?"],["p","God says: I will “bring you down” from there."],["p","The same verb."],["p","God does not find another set of words to refute him."],["p","He hands his words back to him, just as they were."],["p","Where is “there”?"],["p","It is the place where he feels safest."],["p","The place you think God cannot reach, God says: I will start from there."],["p","Then God takes away what is left, one thing at a time."],["p","Verse 5 speaks of thieves."],["p","Thieves at night steal until they have enough, then leave."],["p","Grape pickers always leave a little."],["p","But with Edom, even the hidden treasures are turned out."],["p","Verse 7 is the most painful:"],["q","“All the men of your alliance have brought you on your way, even to the border. The men who were at peace with you have deceived you, and prevailed against you.”"],["p","The ones who searched him were not strangers."],["p","They were allies, friends, people who ate at his table."],["p","Remember the word “deceive.”"],["p","In verse 3, his heart deceived him."],["p","In verse 7, his allies deceived him."],["p","The same word."],["p","The first to deceive you is your own heart."],["p","Only then does it come to others."],["p","He thought the most reliable thing was his connections."],["p","At the border, every one of them turned away."],["p","In verses 8 and 9, God takes away two more things:"],["p","the wise men and the mighty men."],["p","One governs the head, one governs the fist."],["p","He relied on cleverness, and on strength."],["p","God says: in that day, I will take both."],["p","Not because cleverness is bad, or strength is bad."],["p","But because he made his cleverness and strength into capital for not needing God."],["p","Brothers and sisters, what is pride, really?"],["p","Let us say it in one sentence:"],["p","pride is leaving man’s position, seizing God’s authority, and wanting to take God’s place."],["p","Edom did not go wrong at the rock cleft."],["p","He went wrong in making the rock cleft his god."],["p","And humility?"],["p","Humility is laying down authority and returning to your position."],["p","Let man be man, and let God be God."],["p","We all have rock clefts."],["p","But we can choose:"],["p","to hide in the cleft and say, “No one can bring me down,”"],["p","or to say to God from inside the cleft, “Lord, my safety is you.”"],["p","The second step: you should not stand aside."],["p","The first nine verses speak of the outcome."],["p","Verse 10 gives the reason."],["p","This is the turning point of the whole book."],["q","“For the violence done to your brother Jacob, shame will cover you, and you will be cut off forever.”"],["p","Please look at the first word."],["p","What Edom is accused of is not “you killed someone.”"],["p","It is “to your brother.”"],["p","Brother."],["p","Edom is the descendant of Esau. Israel is the descendant of Jacob."],["p","Esau and Jacob were twins."],["p","They were already struggling in their mother’s womb."],["p","Later, one received the blessing, and the other hated him enough to kill him."],["p","Hundreds of years passed, and the wound was still there."],["p","But God said to Israel:"],["q","“You shall not abhor an Edomite, for he is your brother.”"],["p","God says to Edom: Jacob is your brother."],["p","To both sides God says: you are brothers."],["p","So what did Edom do?"],["p","Verse 11:"],["q","“In the day that you stood on the other side, in the day that strangers carried away his substance, and foreigners entered into his gates, and cast lots for Jerusalem, even you were like one of them.”"],["p","Did you notice?"],["p","Edom took up no sword."],["p","Edom entered no city."],["p","He only stood there."],["p","But God says: like one of them."],["p","Standing aside is not neutrality."],["p","When someone is in trouble, there is no neutral ground."],["p","If you don’t reach out, your place is on “their” side."],["p","Next, verses 12, 13, and 14."],["p","One sentence is repeated eight times:"],["p","“You should not.”"],["p","Let’s read slowly."],["q","“But don’t look down on your brother in the day of his disaster, and don’t rejoice over the children of Judah in the day of their destruction.”"],["p","First the eyes: looking down."],["p","Not a look of care, but a look of enjoyment."],["p","Then the heart: rejoicing over it."],["p","At the moment of another’s deepest pain, he feels satisfied."],["p","Proverbs says:"],["q","“Don’t rejoice when your enemy falls. Don’t let your heart be glad when he is overthrown.”"],["p","Even when an enemy falls, we may not rejoice."],["p","How much more a brother."],["q","“Don’t speak proudly in the day of distress.”"],["p","Then the mouth: big talk."],["p","Verse 13:"],["p","Entering their gate."],["p","Looking down again."],["p","Then reaching out to seize their wealth."],["p","Verse 14 is the last step:"],["q","“Don’t stand in the crossroads to cut off those of his who escape.”"],["p","Look at the picture."],["p","People fleeing for their lives run to the crossroads, where they have to choose between two roads."],["p","Edom is standing right there."],["p","He cuts off those who escaped, one by one."],["p","And hands them over to the enemy."],["p","From looking, to rejoicing, to speaking, to entering, to seizing, to cutting off."],["p","Each step goes only a little farther than the one before."],["p","Each step has its reason."],["p","I’m only looking."],["p","I’m only talking."],["p","Everyone else is going in; if I don’t, don’t I lose out?"],["p","Brothers and sisters, no one becomes an accomplice in a day."],["p","He starts with a glance."],["p","He starts with a sentence like “serves them right.”"],["p","Today I ask you to slow down."],["p","When someone you know is in trouble,"],["p","where do your eyes look?"],["p","What does your mouth say?"],["p","Where do your feet go?"],["p","Here I want to stop, and say something very important."],["p","This passage is not meant to shame you."],["p","It is not meant to make you carry everyone’s suffering."],["p","You yourself may be someone who was looked on from the sidelines."],["p","In your deepest pain, your friends all stayed away."],["p","If that is you, I want to tell you:"],["p","God saw."],["p","Verses 10 to 14 are the indictment God wrote for you."],["p","He has not forgotten."],["p","These words are spoken to those who had power and opportunity,"],["p","yet stood aside, and even profited from the moment."],["p","They are not spoken to those who were themselves running for their lives."],["p","So how do we live?"],["p","The 321 says: people matter more than things, and relationships matter more than possessions."],["p","The order of relationships is God first, then ourselves, then others, then things."],["p","When a person’s relationship with God is crooked,"],["p","the relationship with self is crooked, and the relationship with others is crooked too."],["p","Why did Edom stand aside?"],["p","Because in his heart, his brother did not matter more than his mountain."],["p","His safety, his interests, his position mattered more than his brother."],["p","This is self."],["p","Self is being centered on yourself."],["p","And selflessness?"],["p","Selflessness is letting Jesus live in me."],["p","How does Jesus treat people in trouble?"],["p","He doesn’t stand aside."],["p","He came down from heaven."],["p","He entered our city gate."],["p","On our most painful day, he stood on our side."],["p","So we are qualified, on the day another is in trouble, to reach out a hand."],["p","Not because we are better."],["p","But because someone first reached out his hand for us."],["p","The third step: the kingdom will be Yahweh’s."],["p","In verse 15, there is a word to listen for."],["q","“For the day of Yahweh is near all the nations! As you have done, it will be done to you. Your deeds will return upon your own head.”"],["p","“Day.”"],["p","From verse 11 to verse 14,"],["p","this word is used ten times."],["p","Always the brother’s day: the day of disaster, the day of destruction, the day of distress."],["p","In verse 15, the same word changes owners."],["p","It is the day of Yahweh."],["p","You stood by and watched your brother’s day."],["p","Now it is Yahweh who watches your day."],["p","Here we must be careful."],["p","“As you have done, it will be done to you.”"],["p","This sentence is often taken as a permit for revenge."],["p","It is not so."],["p","The subject of this sentence is Yahweh."],["p","It is God who brings the judgment, not me going to take revenge."],["p","Romans says:"],["q","“Vengeance belongs to me; I will repay, says the Lord.”"],["p","The hand of recompense is God’s."],["p","Not ours."],["p","For the wounded, this sentence is comfort."],["p","You were betrayed, abandoned, hurt."],["p","In your heart is one question: did anybody see this?"],["p","Yes."],["p","Justice has a Lord; it doesn’t have to be me."],["p","You can put that knife down."],["p","Verse 16 speaks of a cup."],["p","All the nations will drink."],["p","Jeremiah also says:"],["q","“they to whom it didn’t pertain to drink of the cup will certainly drink.”"],["p","No one is an exception."],["p","Edom’s story is not only Edom’s story."],["p","It is the story of everyone who stands aside,"],["p","of everyone who thinks he is the exception."],["p","This is their story."],["p","Then the pen of Scripture turns."],["p","Verse 17:"],["q","“But in Mount Zion, there will be those who escape, and it will be holy. The house of Jacob will possess their possessions.”"],["p","Those who escape."],["p","Do you remember verse 14?"],["p","Edom stood at the crossroads to cut off those who escaped."],["p","But God says: in Mount Zion, there will be those who escape."],["p","The road Edom could not block, God had prepared long ago."],["p","Then, in verses 19 and 20, a string of place names:"],["p","the South, the lowland, Ephraim, Samaria, Gilead, Zarephath, Sepharad."],["p","It reads like a title deed."],["p","But look at these two groups of people:"],["p","the captive children of Israel, and the captives of Jerusalem."],["p","Those of the north and those of the south, brothers divided for hundreds of years,"],["p","standing on the same map."],["p","This is a great hope."],["p","The scattered will come home."],["p","What was taken away will be returned."],["p","These verses must be read with care."],["p","They are not for anyone today to draw their own borders."],["p","They are not for us to count days or set timetables."],["p","They are a comfort spoken to a people who were taken captive, scattered, and robbed of their homes."],["p","If today you are someone who feels you can never go back,"],["p","I want to tell you: what you have lost is not the last page."],["p","Then comes the last verse:"],["q","“Saviors will go up on Mount Zion to judge the mountains of Esau, and the kingdom will be Yahweh’s.”"],["p","I like this word “up” best."],["p","In verses 3 and 4, Edom says: who will bring me “down”?"],["p","God says: I will bring you “down.”"],["p","Now the direction has reversed."],["p","The saviors go “up” on Mount Zion."],["p","They do not climb by themselves."],["p","They are sent."],["p","They go up not to take a high seat,"],["p","but to judge, to govern."],["p","Like the saviors in Judges, who delivered the people from oppression."],["p","Then this sentence:"],["p","“The kingdom will be Yahweh’s.”"],["p","The last line of the whole book is not a sword."],["p","It is not a song of victory."],["p","It is a belonging."],["p","The Hebrew is “kingship.”"],["p","The Psalms say:"],["q","“For the kingdom is Yahweh’s. He is the ruler over the nations.”"],["p","Did you notice?"],["p","In twenty verses this book speaks of high places, of days, of land."],["p","At the end, only one thing is left:"],["p","who is King?"],["p","Edom thought: my mountain, my safety."],["p","Jacob, perhaps, was thinking: our inheritance, our enemy."],["p","But God, in the end, says: the kingship is mine."],["p","This is the center of the Lord’s Prayer."],["q","“For yours is the Kingdom, the power, and the glory forever.”"],["p","Brothers and sisters, these are the two core values of the 321:"],["p","Let Jesus be King."],["p","Let Jesus receive all the glory."],["p","The end of history is not our to-do list."],["p","We don’t need to be the judge."],["p","We also don’t need to settle everyone in God’s place."],["p","Our position is to return to our position:"],["p","not taking power, not contending for high places, not standing aside."],["p","Let man be man, and let God be God."],["p","Let Jesus live in me."],["p","Then we will have the strength"],["p","to reach out on the day another is in trouble,"],["p","to lay down on the day we ourselves are in trouble,"],["p","and on every day to wait for the King."],["p","Obadiah, servant of Yahweh."],["p","The résumé he left is only two words."],["p","So is ours, for our whole life."],["p","May God, after our names, also write only two words:"],["p","servant."],["p","Let’s pray together."],["p","Lord, bring down the high places in our hearts."],["p","Not with shame, but with mercy."],["p","Make us, on the day a brother is in trouble, not stand aside."],["p","Comfort every person who has been abandoned."],["p","For the kingdom, the power, and the glory are all yours."],["p","In Jesus’ name, amen."]]}},"issues":[{"id":"ISS00_1","t":"Author and Date: Who Was Obadiah, and When Was the Book Written?","r":"1:1--14","ch":[1,1],"why":"The book’s name “Obadiah” means “servant of Yahweh”; there are several others with the same name in the Old Testament, and apart from this name the book leaves no father, hometown, or date. The book also gives no date of its own, and it can only be inferred from the events described in verses 11–14: “strangers carried away his substance, and foreigners entered into his gates, and cast lots for Jerusalem.”","pos":[["After the fall of Jerusalem (586 BC)","","The picture in verses 11–14 fits best the Babylonian capture of Jerusalem; Psalm 137:7 and Lamentations 4:21--22 also link Edom with that day; this is the reading most scholars adopt."],["The time of King Jehoram (ninth century BC)","","2 Kings 8:20--22 records Edom’s revolt against Judah; 2 Chronicles 21:16--17 records foreign invaders attacking Judah and carrying off the royal house’s goods; those who hold this view think the book dates from the same period as Joel."],["Date uncertain; focus on the message","","Others hold that the book gives no date itself, and whichever occasion it was, the accusation of watching a brother’s disaster and trusting in one’s own pride carries the same weight."]],"say":"These notes lean toward the first view (it fits the picture in verses 10–14 most closely), but the pulpit does not depend on the date: whichever occasion it was, the weight of the text is the same. The author’s name is itself the shortest autobiography: “servant of Yahweh,” and no other résumé.","care":"Do not let readers feel that “the date must be settled before this book can be read”; reading this book does not require solving it first, nor sorting people into camps over views of the date.","con":[]},{"id":"ISS00_2","t":"The Message of Judgment: How Can We Preach It Without It Becoming a Threat?","r":"1:2--9；1:15--16","ch":[1,1],"why":"Most of the book is judgment: brought down, searched out, destroyed, cut off, no one remaining. If words of judgment have no object, they easily become intimidation of anyone, or a curse on enemies.","pos":[["Comfort written for the wounded","","Those who were plundered and betrayed hear that justice has a Lord: their cries were not unheard."],["A warning written for bystanders","","Verses 10–14 accuse those who “stood aside on the day of their brother’s disaster”; they speak to those who had power and did nothing."],["Not a tool for the church to frighten people","","Others also remind us: words of judgment should shine first into our own hearts, and not be used to point at others and say “you deserve judgment.”"]],"say":"These notes take this position: judgment is God’s matter, not a human weapon; the message is first comfort for the wounded, then a reminder to bystanders, and only last our turn to check the high places in our own hearts. The result is loving the Lord more and drawing nearer to those who suffer, not fearing the world more or hating enemies more.","care":"Some have been betrayed, abandoned, or hurt, and reading about judgment brings their enemies to mind: do not encourage them toward “whom they should hate,” and do not ask them to “forgive right away”; first accompany them and make sure they are safe, and help them seek professional help if needed.","con":[]},{"id":"ISS00_3","t":"Standing Aside and Suffering: Why Is “Standing Aside” Also Sin?","r":"1:10--14","ch":[1,1],"why":"The accusation in verses 10–14 is unusual: it does not say whom Edom killed; it says “you stood aside,” “you should not look down,” “you should not enter their gate,” “you should not seize their wealth.” From watching, to being one of them, to profiting from the moment: a slide all the way down.","pos":[["Having power and doing nothing","","The object of the accusation is a brother, and one with the ability to help: standing at the crossroads is not powerlessness; entering the gate and seizing is profiting from the moment."],["Not spoken to all who are powerless","","Some remind us: those who are traumatized, those with limited ability, and those who are themselves running for their lives are not under the rebuke; this passage is not used to shame anyone."],["The slide from watching to being one of them","","Others see in the line “like one of them” that watching is often the first step, and that “rejoicing,” “speaking proudly,” and “entering the gate” can follow."]],"say":"These notes take this position: the point of this passage is “on the day of a brother’s disaster, which side are you on,” not “why didn’t you save everyone.” We use it to check ourselves: when someone was in trouble, did we stand aside and not reach out? But we do not use it to shame the traumatized or those who have no power to help.","care":"Leaders protect people first: do not force anyone to confess on the spot, do not press for details; someone who has been hurt by bystanders will find this passage very painful, so check on them privately after the meeting, and help them seek professional help if needed.","con":[]},{"id":"ISS00_4","t":"The Quarrel Between Brothers: What Are Jacob and Esau Really About?","r":"Obad 1:6--10; Gen 25--33; 36","ch":[1,1],"why":"Edom is the descendants of Esau (Gen 36), and Israel the descendants of Jacob; the opposition between the two peoples can be traced to the story of two brothers in Genesis. But Obadiah puts the accusation as “violence done to your brother Jacob,” so that the whole matter is not only between nations but between houses.","pos":[["The echo of the two brothers in Genesis","","The story of the twins (Gen 25--33) continues in history: the brothers’ quarrel, reconciliation, and renewed breach all remain in the memory of the two peoples."],["Historical grievances between peoples","","Edom once refused to let Israel pass through the wilderness (Num 20:14--21), and also watched from the side when Judah was in trouble; these accumulated into a long-standing hostility."],["How the New Testament reads Esau","","Romans 9:13 quotes Malachi 1:2--3; Hebrews 12:16--17 uses Esau as a warning; neither New Testament passage equates “Esau” with any modern people."]],"say":"These notes take this position: what this book wants us to see is the weight of the word “brother,” and not to attach labels to any group or nation today, nor to endorse any hatred or exclusion. Edom is the descendants of Esau, which is history; “Edom” is not equated word for word with any people today.","care":"Do not let readers feel that “some people are by birth condemned by God”; the end of the brothers is God’s judgment and the kingdom, not anyone’s hatred.","con":[]},{"id":"ISS00_5","t":"The Kingdom and the End of History: How Should Verses 17–21 Be Read?","r":"1:15--21","ch":[1,1],"why":"Verses 17–21 say that on Mount Zion there will be those who escape, the house of Jacob will possess its inheritance, the captives will possess land, saviors will go up on Mount Zion to judge the mountains of Esau, and finally “the kingdom will be Yahweh’s.” These words have been read in several ways.","pos":[["Historical fulfillment","","With the return from exile, Israel and Judah regained land; some think these words were partly fulfilled in the return and in the history that followed."],["An ecclesial reading","","Some, reading from the New Testament, read “Mount Zion” and the “saviors” as Christ and his church; the spiritual Israel of the New Testament is included."],["An eschatological reading","","Some think this foretells the full revelation of God’s kingdom at the end, when all nations will be under Yahweh’s kingship."]],"say":"These notes set the views side by side, set no timetable, count no days, and do not use these verses as the basis for any modern territorial or political claim. The landing is only one sentence: verse 21, “the kingdom will be Yahweh’s,” which resonates with the Lord’s Prayer, “yours is the kingdom, the power, and the glory”: the end of history is the King, not our to-do list.","care":"Do not divide into camps and judge one another because of different interpretations; and do not use these verses to create fear or hostility toward any people or nation. After reading, we should love the Lord more, not fear the world more.","con":[]},{"id":"ISS01_1","t":"Who Was Obadiah, and When Was This Book Written?","r":"1:1","ch":[1],"why":"1. Who is “Obadiah”? There are several others with the same name in the Old Testament (the CUV renders them “Obadiah” in different forms), for example Obadiah, the steward of Ahab’s house, in 1 Kings 18:3. The book itself gives no father, hometown, or date. 2. Was this book written after the fall of Jerusalem, or earlier?","pos":[["The same man as the steward in 1 Kings 18","","An ancient Jewish tradition holds that the Obadiah who hid a hundred prophets when Jezebel killed the prophets (1 Kings 18:3--4) is this prophet. But the text does not say so."],["Another prophet of the same name, impossible to trace","","Most modern scholars think this was another person: many shared the name, and nothing in the book can connect him to any of them."],["Date: after 586 BC, or earlier","","The picture in verses 10--14 fits the fall of Jerusalem best; others hold it was in the time of King Jehoram (2 Kings 8:20--22; 2 Chronicles 21:16--17). See the issue “Author and Date: Who Was Obadiah, and When Was the Book Written?”"]],"con":[],"say":"These notes follow the issue “Author and Date: Who Was Obadiah, and When Was the Book Written?”: the author’s name is itself the shortest autobiography, servant of Yahweh; the date leans toward after the fall, but the pulpit does not depend on the date.","care":"Do not let listeners feel they must first settle author and date before they can read this book."},{"id":"ISS01_2","t":"What Is the Order and Relationship Between Obadiah and Jeremiah 49?","r":"Obad 1:1--9; Jer 49:7--22","ch":[1],"why":"1. Obadiah and Jeremiah 49:7--22 share many of the same sentences (for example, “We have heard news from Yahweh, and an ambassador is sent among the nations,” Jer 49:14 and Obad 1), with slightly different order and wording. 2. Who quotes whom?","pos":[["Obadiah first, Jeremiah quotes","","Some think Jeremiah knew this earlier oracle and quoted and reworked it."],["Jeremiah first, Obadiah quotes","","Some think Obadiah, after the fall of Jerusalem, put Jeremiah’s words into a new situation (the new accusation in verses 10--14)."],["Both quote an earlier oracle","","Others hold that both quote an earlier oracle that circulated in Edom, each building it into its own book."]],"con":[],"say":"These notes do not rule. Whichever it was, this sentence “We have heard news from Yahweh” is God’s word; the existence of Jeremiah 49 also reminds us that the prophets’ words were repeatedly told and repeatedly applied.","care":"Do not turn this subject into a debate about “who copied whom”; it does not affect the weight of the message."},{"id":"ISS01_3","t":"Who Is Edom? What Is the History from the Mountains of Seir to the Later Idumeans?","r":"Obad 1:1--2; Gen 36:8","ch":[1],"why":"1. Who is Edom? Genesis 36:8 says “Esau is Edom,” living in the hill country of Seir. 2. What is the relationship between “Idumea” (the New Testament-era name) and Edom? 3. Why do the prophets speak so heavily to Edom?","pos":[["Edom is the descendants of Esau, living in the hill country of Seir","","This is the Bible’s own account, and the foundation of this book. In Moses’ time Edom already had a king and refused to let Israel pass through (Num 20:14--21)."],["The later Idumeans","","Scholars generally think that later the Edomites were pushed out by the Nabateans and moved into the Negev of Judah, called “Idumea” in Greek; the Herodian family of New Testament times came from the Idumeans (Matt 2:1 is only historical background)."],["“Edom” as a symbol","","Some think “Edom” later also became a symbol of “proud powers that oppose God’s people”; but this should not be used to match it to any group today."]],"con":[],"say":"These notes take this position: Edom is the descendants of Esau, a people in history, and also a portrait of “pride that stands aside”; “Edom” is not equated word for word with any group or nation today.","care":"Do not endorse any hatred, exclusion, or racism; what the prophet accuses is conduct and pride, not bloodline."},{"id":"ISS01_4","t":"“Standing Aside” in Verse 11 and “Reaching Out to Seize” in Verse 13: What Did Edom Actually Do?","r":"1:11--14","ch":[1],"why":"1. Does “stood aside” (מִנֶּגֶד) in verse 11 mean watching with folded arms, or standing on the opposing side? 2. Verses 12--14 say “don’t enter the gate,” “don’t seize,” “don’t stand at the crossroads to cut off those who escape”: does this mean Edom actually acted?","pos":[["Watching and being one of them","","The text says only “stood aside,” yet says “like one of them”; this stresses the responsibility of the bystander, and does not necessarily mean Edom attacked the city itself."],["Actually taking part in plunder and cutting off","","The verbs in verses 12--14 (enter, reach out, cut off, deliver up) are actions; Psalm 137:7, Ezekiel 25:12, and Ezekiel 35:5 also mention Edom’s doings, and some read from these that Edom did take part."],["Historical details unclear","","Others think the text gives no details; the point of this book is a moral accusation, not reconstructing the military course of events."]],"con":[],"say":"These notes take this position: what the text itself says most clearly is “like one of them” and the eight “you should not”; the historical details are unclear, and we do not add what the text does not say.","care":"This passage is spoken to those who “have power and do nothing, even profit from the moment”; it is not used to shame those who are traumatized or powerless to help (the issue “Standing Aside and Suffering: Why Is ‘Standing Aside’ Also Sin?”)."},{"id":"ISS01_5","t":"How Does “the Day of Yahweh” Differ and Agree in Obadiah, Joel, and Amos?","r":"1:8；1:15","ch":[1],"why":"1. Verse 15 says “the day of Yahweh is near all the nations.” Is this “day” the same thing as the “day of Yahweh” in Joel (1:15; 2:1; 3:14) and Amos (5:18--20)? 2. What does “near” mean?","pos":[["A shared phrase, each with its own use","","Joel 1:15 also says “the day of Yahweh is at hand”; Amos 5:18 says woe to those who desire that day, because “the day of Yahweh is darkness, and not light.” The three books each have their own audience and situation."],["What is distinctive in Obadiah","","Here the day is tightly bound to the brother’s day (the “day” of verses 11--14 changes its subject in verse 15); the standard of judgment is “as you have done, it will be done to you.”"],["One day, or many days","","Some read it as God’s many judgments within history; some as the final judgment at the end; others read both."]],"con":[],"say":"These notes set the views side by side, set no timetable, and count no days. They look only at its function: “day” changes its subject and brings people before God.","care":"Do not use “the day of Yahweh” to create panic; the result is perseverance and loving the Lord more, not panic."},{"id":"ISS01_6","t":"Retribution in Verse 15: Is It a License for Revenge? How Should Christians View Vengeance?","r":"Obad 1:15--16; Rom 12:19","ch":[1],"why":"1. Does “As you have done, it will be done to you” permit victims to repay in kind? 2. How should Christians understand “vengeance”? 3. Does not taking revenge mean not seeking justice?","pos":[["God’s judgment, not a human permit","","The subject of this verse is Yahweh: “the day of Yahweh.” Romans 12:19 says: “Vengeance belongs to me; I will repay.” The hand of recompense is God’s."],["The standard of justice in like-for-like retribution","","“Eye for eye, tooth for tooth” (Exod 21:24) was originally a measure to limit revenge, not to encourage it. Jesus goes further in Matthew 5:38--39: do not resist an evil person."],["Handing judgment to God without abandoning protection and justice","","Others remind us: not taking vengeance yourself does not mean not protecting victims or not pursuing accountability for harm; the two do not contradict."]],"con":[],"say":"These notes follow the issue “The Message of Judgment: How Can We Preach It Without It Becoming a Threat?”: verse 15 is God’s judgment, not a human permit for revenge; the victim can put down that knife, because justice has a Lord.","care":"Do not ask the wounded to “forgive right away,” and do not use this verse to encourage revenge. The wounded first need to be protected and accompanied; help them seek professional help if needed."},{"id":"ISS01_7","t":"Zion, Inheritance, and Territory in Verses 17–21: What Are the Several Ways to Read Them?","r":"1:17--21","ch":[1],"why":"1. When and how are the Zion, the inheritance, and the captives’ possession of land in verses 17--21 fulfilled? 2. Can these verses be used as the basis for any modern territorial or political claim?","pos":[["Historical fulfillment","","With the return from exile, Israel and Judah regained land; some also point to later history (such as Edom’s land being absorbed into Judah)."],["An ecclesial reading","","Some, reading from the New Testament, say that God’s people are no longer defined by borders. The connection the New Testament itself makes is Amos 9:11--12 and Acts 15:16--17 (the Gentiles seeking the Lord), and not a direct quotation of Obadiah."],["An eschatological reading","","Some think this foretells the full revelation of God’s kingdom at the end: on that day all nations will be under Yahweh’s kingship."]],"con":[],"say":"These notes follow the issue “The Kingdom and the End of History: How Should Verses 17–21 Be Read?”: set the views side by side, set no timetable, count no days, and do not use these verses as the basis for any modern territorial or political claim; the landing is only verse 21.","care":"Do not divide into camps over different interpretations; and do not use these place names to create fear or hostility toward any people or nation."},{"id":"ISS01_8","t":"Who Are the “Saviors” in Verse 21?","r":"1:21","ch":[1],"why":"1. “Saviors will go up on Mount Zion to judge the mountains of Esau”: who are these “saviors” (מוֹשִׁעִים, plural)? 2. Does “judge” (לִשְׁפֹּט) mean to condemn, or to govern?","pos":[["Saviors like those in Judges","","The “saviors” of Judges 3:9, 15 are people God raised up; the original is plural, and can refer to a company sent by God."],["Those who are saved","","Some ancient versions read this word as passive: “those who have been saved will go up on Mount Zion.”"],["This makes us think of that Savior","","Some think it ultimately points to Christ. The New Testament does not directly quote this verse, so this is a connection of “this makes us think of,” not “this is the prophecy.”"]],"con":[],"say":"These notes set the views side by side and reach no conclusion: the landing is not “who the saviors are” but “the kingdom will be Yahweh’s.”","care":"Do not let the text say what it does not say in order to prove a type."},{"id":"ISS01_9","t":"Esau and Jacob: How Does the New Testament Read Them?","r":"Obad 1:10; Gen 25--33; Rom 9:13; Heb 12:16--17; Mal 1:2--5","ch":[1],"why":"1. How does the New Testament read Esau? Romans 9:13 says: “Jacob I loved, but Esau I hated.” 2. Hebrews 12:16--17 takes Esau as a warning. 3. Malachi 1:2--5 speaks of Edom’s later fate.","pos":[["The sovereignty of election","","Romans 9:13 quotes Malachi 1:2--3, speaking of God’s election; Genesis 25:23 had already said “the elder will serve the younger.” Some read it as the election of peoples and lines of descent, some as individuals."],["The meaning of “hate”","","Some point out that in the Bible “love” and “hate” are often the language of comparison (as in Gen 29:30--31, “loved” and “unloved”), not necessarily an emotion of hatred."],["Esau as a warning","","Hebrews 12:16--17 speaks of being “profane,” selling the birthright for a meal; Malachi 1:4 records the Edomites saying, “We are beaten down, but we will return and build the ruins,” and God answering: “They may build, but I will tear down.”"]],"con":[],"say":"These notes follow the issue “The Quarrel Between Brothers: What Are Jacob and Esau Really About?”: these passages should be read side by side; they are not used to say “some people are hated by God,” and Esau is not equated with any modern group.","care":"Do not say to anyone “you are hated by God”; these passages are a warning against pride and craving for this world, and also a declaration of God’s sovereignty, not a label to give to anyone."}],"terrain":{"points":[[1.0,60,0,"An ambassador sent among the nations",null],[1.048,46,0,"Small among the nations",null],[1.095,30,0,"Who will bring me down to the ground?","bot"],[1.238,20,0,"Hidden places searched out",null],[1.381,14,0,"The mighty dismayed, cut off by slaughter",null],[1.476,6,0,"You stood aside","bot"],[1.571,12,0,"You should not enter their gate",null],[1.667,52,0,"The day of Yahweh is near",null],[1.762,78,0,"Those who escape on Mount Zion","top"],[1.857,88,0,"Possessing the land",null],[1.952,100,0,"The kingdom will be Yahweh’s","top"]]},"tracks":[{"gk":"יָרַד","tr":"yarad","gl":"Go down, bring down (and high, up)","code":"H3381","root":"√ירד (go down, descend)","n":10,"stops":[["1:1","“Arise, and let’s rise up”: the nations are summoned to “arise”: the first action of the whole chapter is upward, meant to pull down those on the heights.",""],["1:2","“Small among the nations”: as soon as God speaks, he first lowers Edom’s position: smallest, despised.",""],["1:3","“Whose habitation is high”: Edom’s security: rock clefts, the heights. When people set themselves on the heights, the heart says, “Who will bring me down to the ground?”",""],["1:4","“I will bring you down from there”: God’s answer uses Edom’s own word: “go down.” The bringing down is not on the ground; even “among the stars” he can bring down.","top"],["1:5","“How you are cut off!”: thieves would leave some, but Edom was stripped clean: a high place is no protection.",""],["1:12","“Don’t speak proudly”: the “open mouth” of proud speech: pride grows again on the day of another’s disaster.",""],["1:21","“Saviors will go up on Mount Zion”: the direction reverses: the proud are brought down, and the saviors “go up.” The judge does not climb up by himself; he is sent up by God.","top"]],"ins":"High and down are the upper and lower tracks of this chapter. Edom lives on the “height” (מָרוֹם, verse 3), “mounts on high” like the eagle (תַּגְבִּיהַּ, verse 4), and says in his heart, “Who will bring me down to the ground?” (יוֹרִדֵנִי, verse 3); Yahweh answers, “I will bring you down from there” (אוֹרִידְךָ, verse 4), using the same verb “go down” (יָרַד). By verse 21 the direction has reversed: it is not the proud who go up, but “saviors will go up on Mount Zion” (וְעָלוּ). Pride is climbing up on your own and leaving your position; humility is returning to your position and letting God be God."},{"gk":"אָח","tr":"ach","gl":"Brother (Jacob and Esau)","code":"H251","root":"√אחה (brother)","n":12,"stops":[["1:6","“Esau’s hidden places”: the name “Esau” appears for the first time: the book’s way of naming Edom turns here into the name of a brother.",""],["1:8","“Understanding out of the mountain of Esau”: the mountain of Esau: Edom’s highlands, where the wise men will be destroyed.",""],["1:9","“Cut off from the mountain of Esau by slaughter”: mountain and people are spoken of together: the hope of the whole house of Esau rests on this mountain.",""],["1:10","“The violence done to your brother Jacob”: the accusation of the whole chapter: not a quarrel between two nations, but violence between “brothers.”","top"],["1:12","“The day of your brother’s disaster”: the second time it says “your brother”: four “don’t”s in a row all begin with this title.",""],["1:17","“The house of Jacob will possess their possessions”: the hope of the house of Jacob:
