/* ===== Terrain map ===== */
function terrain(cur){
  const P = D.terrain.points, W = 320, H0 = 96, pad = 14;
  const LAST = LASTCH;
  /* a point’s x is “chapter + position in the chapter” (7.345 = a third of the way through chapter 7), so the axis runs from 1 to LAST+1 */
  const XMAX = Math.max(LAST + 1, ...P.map(p => p[0]));
  const x = c => pad + (c - 1) / Math.max(1, XMAX - 1) * (W - pad * 2);
  const y = v => 10 + (100 - v) / 100 * (H0 - 26);
  let d = `M ${x(1)} ${y(40)}`;
  P.forEach(p => { d += ` L ${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`; });
  d += ` L ${x(XMAX)} ${y(P.length ? P[P.length - 1][1] : 30)}`;

  // ── Label layout: two-dimensional avoidance using boxes; push outward when there is no room ──
  const lab = P.filter(p => p[4]);
  const fs = lab.length > 10 ? 6.6 : (lab.length > 6 ? 7.4 : 8.5);
  const boxes = [], out = [];
  const hit = (a, b) => !(a.x1 < b.x0 - 1 || a.x0 > b.x1 + 1 || a.y1 < b.y0 - 1 || a.y0 > b.y1 + 1);
  // The dots and the “you are here” ring are obstacles too, so labels never sit on the line
  const obst = [];
  P.forEach(p => { const cx = x(p[0]), cy = y(p[1]), r = (p[4] ? 3.2 : 2.2) + 1.5;
    obst.push({ x0: cx - r, x1: cx + r, y0: cy - r, y1: cy + r }); });
  if (cur) { const cx = x(cur + .5), cy = y(50);
    obst.push({ x0: cx - 7, x1: cx + 7, y0: cy - 7, y1: cy + 7 }); }
  obst.forEach(o => boxes.push(o));
  lab.slice().sort((a, b) => a[0] - b[0]).forEach(p => {
    const txt = String(p[3] || '');
    let w = 0;
    for (const ch of txt) w += /[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]/.test(ch) ? fs : fs * 0.55;
    const cx = Math.min(W - 1 - w / 2, Math.max(1 + w / 2, x(p[0])));
    const base = y(p[1]);
    const up = [-7, -16, -25, -34, -43], dn = [11, 20, 29, 38, 47];
    const cand = (p[4] === 'bot' ? dn.concat(up) : up.concat(dn));
    let yy = base + cand[0];
    for (const off of cand) {
      const t = base + off;
      const box = { x0: cx - w / 2, x1: cx + w / 2, y0: t - fs, y1: t + 2 };
      if (!boxes.some(b => hit(b, box))) { yy = t; boxes.push(box); break; }
      if (off === cand[cand.length - 1]) { yy = t; boxes.push(box); }
    }
    out.push({ p, cx, yy });
  });
  const labs = out.map(o =>
    `<text class="tlab ${o.p[4] === 'top' ? 'hi' : ''}" style="font-size:${fs}px" x="${o.cx.toFixed(1)}" y="${o.yy.toFixed(1)}" text-anchor="middle">${esc(String(o.p[3] || ''))}</text>`
  ).join('');
  const dots = P.map(p => `<circle class="tdot ${p[4] === 'bot' ? 'low' : ''}" cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="${p[4] ? 3.2 : 2.2}"/>`).join('');
  const now = cur ? `<circle class="tnow" cx="${x(cur + .5).toFixed(1)}" cy="${y(50)}" r="6"/>` : '';
  // viewBox expands to fit the actual content, so labels are never clipped
  const lb = boxes.slice(obst.length);
  const vy0 = Math.min(0, ...lb.map(b => b.y0)) - 3;
  const vy1 = Math.max(H0, ...lb.map(b => b.y1)) + 3;
  return `<div class="terrain"><svg viewBox="0 ${vy0.toFixed(1)} ${W} ${(vy1 - vy0).toFixed(1)}" role="img" aria-label="Obadiah whole-book terrain map">
    <path class="tpath" d="${d}"/>${dots}${labs}${now}</svg>
    <p class="xs muted center" style="margin:2px 0 6px">Wall · Book and Covenant · Keeping</p></div>`;
}

/* ===== verse commentary (six layers)===== */
let OPENL = { 1:1, 2:0, 3:1, 4:0, 5:0, 6:1 };
function openV(ref){
  const v = VMAP[ref]; if (!v) return;
  const rr = v.ch + ':' + (v.a === v.z ? v.a : v.a + '–' + v.z);
  const L = (i, name, body, cls) => {
    const on = OPENL[i] && !(i === 2 && !S.set.grk) && !(i === 4 && !S.set.grk);
    return `<div class="layer"><div class="lh" onclick="tglL(${i},'${ref}')">
      <span class="n">${['','①','②','③','④','⑤','⑥'][i]}</span><span>${name}</span>
      <span class="caret">${on ? '▾' : '▸'}</span></div>
      ${on ? `<div class="lb ${cls || ''}">${body}</div>` : ''}</div>`;
  };
  let h = `<h4>Obadiah ${esc(rr)}</h4>
    <p class="xs muted" style="margin:0 0 10px">${v.star ? '★ Key passage　' : ''}Chapter ${v.ch}</p>
    ${L(1, 'WEB', blkCuv(v))}
    ${S.set.grk && v.grk ? L(2, 'Original', v.grk, 'grk') : ''}
    ${v.lit ? L(3, 'Literal', tagParas(v.lit, 'x|' + v.ch + ':' + v.a + '|lit'), 'lit') : ''}
    ${S.set.grk && v.key ? L(4, 'Key Words', v.key) : ''}
    ${v.gram ? L(5, 'Grammar', tagParas(v.gram, 'x|' + v.ch + ':' + v.a + '|gram')) : ''}
    ${v.exp ? L(6, 'Explanation', tagParas(v.exp, 'x|' + v.ch + ':' + v.a + '|exp')) : ''}`;
  const iss = (D.issues || []).filter(x => (x.ch || []).includes(v.ch));
  if (iss.length){ h += `<div class="hr"></div>`;
    iss.forEach(x => h += `<button class="btn" style="margin:0 6px 6px 0" onclick="openIssue('${x.id}')">⚖ ${esc(x.t)} ›</button>`); }
  const prev = BLK[v.ch][v.i - 1], next = BLK[v.ch][v.i + 1];
  h += `<div class="hr"></div><div class="row">
    ${prev ? `<button class="btn" onclick="openV('${v.ch}:${prev.a}')">‹ Previous</button>` : ''}
    ${next ? `<button class="btn" onclick="openV('${v.ch}:${next.a}')">Next ›</button>` : ''}
    <button class="btn" onclick="sayV('${ref}')">🔊 Read aloud</button>
    <button class="btn" onclick="askXz(blkPlain('${ref}'))">✨ Ask Xiaozhi</button>
    <button class="btn" onclick="go('course',${v.ch})">Full chapter lesson</button></div>`;
  sheet(h);
}
function blkPlain(ref){ const v = VMAP[ref]; if (!v) return '';
  const t = D.txt[v.ch] || []; let c = '';
  for (let i = v.a; i <= v.z; i++) c += (t[i - 1] || '') + ' ';
  return c + '\n' + (v.lit || '').replace(/<[^>]+>/g, ' ') + '\n' + (v.exp || '').replace(/<[^>]+>/g, ' '); }
function sayV(ref){ const v = VMAP[ref]; if (!v) return;
  speak(blkPlain(ref), 'Judg ' + v.ch + ':' + v.a); }
function sayMV(n){ const m = meta(n); speak(m.mv.t + '。' + m.mv.r, 'Memory Verse'); }
function tglL(i, ref){ OPENL[i] = OPENL[i] ? 0 : 1; openV(ref); }

/* Teaching lesson script: one lesson per chapter, ten sections, about five thousand characters. Different from the sermon - the sermon is an eighteen-minute
   proclamation; this lesson is forty minutes of teaching, with a copy in every hand. */

  const L = (D.lesson || {})[n];
  if (!L) return `<div class="card"><p class="sm muted" style="margin:0">This chapter has no teaching lesson yet.</p></div>`;

  L.blocks.forEach((b, i) => { if (b[0] === 'h') heads.push([i, b[1]]); });

  const nsec = heads.length;
  let h = `<div class="card"><p class="eyebrow">${esc(L.vol)}</p>
    <p style="font-family:var(--serif);font-size:calc(var(--fs) * 1.35);line-height:1.5;margin:6px 0 0">${esc(L.title)}</p>
    <p class="sm muted" style="margin:8px 0 0">${L.chars.toLocaleString()} words · ${nsec} sections · about ${L.min} min${

      <button class="btn" id="lesSpk${n}" onclick="lesSpeak(${n})">🔊 Read the lesson aloud</button>

    </div>
    <p class="xs muted" style="margin:8px 0 0">The reading starts from the text of verse one; it does not read out the book name or the table of contents. Think deeper and the Three Transformations are led in conversationally. Download once and you can listen offline, and it keeps playing with the screen locked.</p></div>
  <div class="card" style="border-color:var(--pine)">

  <div class="mkhint">💡 <b>tap any line</b> to highlight; <b>tap again</b> to change the colour (seven of them), write a reflection or ask Xiaozhi.</div>
  <div class="les" id="les${n}">${L.blocks.map((b, i) => {
    switch (b[0]){

      case 'n': return `<p class="t3n mkw" id="lb${n}_${i}">${lesSents(n, i, 't', b[1])}</p>`;
      default:  return `<p class="mkw${b[1].startsWith('I declare, ') ? ' dec' : ''}" id="lb${n}_${i}">${lesSents(n, i, 't', b[1])}</p>`;
    }

    <textarea class="note" id="ln" placeholder="When you teach this lesson, what do you want to add?">${esc((S.lnote || {})[n] || '')}</textarea>

function lesGo(n, i){
  const el = document.getElementById('ls' + n + '_' + i);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
}
function lesNote(n){ (S.lnote = S.lnote || {})[n] = $('#ln').value; save(); toast('Note saved'); }

/* ── Reading the study notes aloud: skip the book name, the teleprompter and the table of contents, and start from the text itself ──
   the section headings, Think deeper and the Three Transformations are all led in conversationally,
   so it sounds like a teacher speaking, not a screen reading out a layout. */
/* The lead-in phrases now live in the core (NAR321): five or six versions of
   each, rotated by position. To change the wording, edit the table in
   321-app-core/narrate.js and every app changes with it. This edition passes
   its own English set through NAR321.init({ templates: {...} }) above. */
/* Split plain text into sentences (the same rule as the on-screen .mks spans use, so the two line up)*/
const plainSents = s => splitHTML(esc(s)).map(x =>
  x.replace(/<[^>]+>/g, '').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'));

/* Reading units: one per sentence, each remembering which block on screen it belongs to and which sentence it is
   { t:text to speak, i:block index, part:'t'|'a', j:sentence index (-1 means the whole block) }  */
function lesSpeakUnits(n){
  const L = (D.lesson || {})[n];
  if (!L) return [];
  /* A different starting point per lesson — otherwise lesson 3 and lesson 17
     fall into exactly the same rhythm. */
  NAR321.setSeed(n);
  const out = [];
  let di = 0, qi = 0;
  const push = (t, i, part, j) => { if (String(t).trim()) out.push({ t:String(t), i, part, j }); };
  /* One whole block: the first sentence takes a spoken lead-in, the rest is read as written, and the order matches the screen */
  const block = (raw, i, part, lead, drop) => {
    const ss = plainSents(raw);
    ss.forEach((s, j) => {
      let x = s;
      if (j === 0){ if (drop) x = x.replace(drop, ''); x = (lead || '') + x; }
      push(x, i, part, j);
    });
  };
  L.blocks.forEach((b, i) => {
    const t = b[1];
    switch (b[0]){
      case 'h': {                                   // 1. xxx → Part one, xxx.
        const p = String(t).split(/[,\uff0c\u3001]\s*/);
        push(p.length > 1 ? NAR321.section(p.slice(1).join(', '), p[0], i)
                          : NAR321.section(String(t), null, i), i, 't', -1);
        break;
      }
      case 'd':                                     // Think deeper?: question and answer
        push(NAR321.deeper(t[0], di), i, 'q', -1);
        block(t[1], i, 'a', NAR321.deeperAnswer(di));
        di++;
        break;
      case 's': {                                   // Section headings for the Three Transformations (the minutes in brackets are not read)
        const s = String(t).replace(/（[^）]*）/g, '').replace(/｜/g, '，').trim();
        push(/^(Wrap|Clos)/i.test(s) ? NAR321.wrap(i) : NAR321.section(s, null, i), i, 't', 0);
        break;
      }
      case 't': {                                   // [See][Listen][Think][Speak][Do]
        const m = String(t).match(/^【(.+?)】(.*)$/);
        push(m ? NAR321.step(m[1], m[2] + '.', i) : String(t) + '。', i, 't', 0);
        break;
      }
      case 'm':                                     // Leader’s note / reminder: already carries its own label
        if (/priority marker/.test(t)) break;           // an asterisk is a mark printed on paper; read aloud it means nothing
        block(t, i, 't');
        break;
      case 'n': {                                   // 1. ★★★ question text → Question one. The question
        const m = String(t).match(/^(\d+)\./);
        qi = m ? +m[1] : qi + 1;
        const must = /\[Must do\]/.test(String(t));
        block(t, i, 't', NAR321.numbered(qi, i) + (must ? 'This one is a must. ' : ''),
              /^\d+\.\s*(★+)?\s*(\[Must do\])?\s*/);
        break;
      }
      default:
        block(t, i, 't');
    }
  });
  return out;
}
/* Merge the units into segments that fetch one piece of audio at a time: inside one block, join up to 60 characters or more before cutting,
   Too fine and it waits on the network the whole time; too big and it takes forever to start speaking. Each segment remembers which lines on screen it covers. */
function lesSegs(n){
  const us = lesSpeakUnits(n), segs = [];
  us.forEach(u => {
    const last = segs[segs.length - 1];
    if (last && last.i === u.i && last.part === u.part && last.j0 >= 0 && u.j >= 0
        && last.t.length < 60 && last.t.length + u.t.length <= 240){
      last.t += u.t; last.js.push(u.j);
    } else {
      segs.push({ t:u.t, i:u.i, part:u.part, j0:u.j, js:u.j >= 0 ? [u.j] : [] });
    }
  });
  /* The id deliberately carries NO running number. If it did, adding one
     paragraph would shift every id in the lesson and the bookmark would never
     find its way back. It is built from block, part and sentence instead. */
  const seen = {};
  segs.forEach(s => {
    s.n = n;                                       // so elFor knows which lesson
    let k = `${n}#${s.i}#${s.part || ''}#${s.j0 >= 0 ? s.j0 : 't'}`;
    if (seen[k]) k += '~' + (seen[k] = seen[k] + 1); else seen[k] = 1;
    s.k = k;
  });
  return segs.filter(s => TTS321.sanitize(s.t));
}
const lesSpeakText = n => lesSpeakUnits(n).map(u => u.t).join('\n');
function lesTitle(n){
  const L = (D.lesson || {})[n];
  return L ? `Lesson ${n} — ${String(L.title).split(' — ')[0]}` : 'Lesson';
}
/* The sections of this lesson, for "start from a section".
   A section heading is an 'h' block (I, II, III...) or an 's' block. */
function lesSections(n){
  const L = (D.lesson || {})[n];
  if (!L) return [];
  const out = [];
  L.blocks.forEach((b, i) => {
    if (b[0] !== 'h' && b[0] !== 's') return;
    const t = String(b[1]).replace(/（[^）]*）/g, '').replace(/｜/g, '，').trim();
    if (t) out.push({ i, t });
  });
  return out;
}

/* Bookmark -> which segment of this run. Match the id first, fall back to the number. */
function lesAtOf(segs, b){
  if (!b) return 0;
  const k = TTS321.indexOfKey(segs, b.key);
  if (k >= 0) return k;
  return Math.max(0, Math.min(segs.length - 1, b.i | 0));
}

/* Which section segment `at` belongs to */
function lesSecNo(n, segs, at){
  const secs = lesSections(n), bi = (segs[at] || {}).i;
  let no = 0;
  for (let i = 0; i < secs.length; i++) if (secs[i].i <= bi) no = i + 1;
  return no || 1;
}

/* Start reading for real.
   The lead-in sentence is glued to the FRONT of the segment we start on rather
   than added as a unit of its own: an extra unit would shift every sentence
   index and the bookmark would no longer line up. */
function lesSpeakAt(n, at, cue){
  const segs = lesSegs(n);
  if (!segs.length) return toast('This chapter has no teaching lesson yet');
  at = Math.max(0, Math.min(segs.length - 1, at | 0));
  if (cue) segs[at] = Object.assign({}, segs[at], { t: cue + segs[at].t });
  TTS321.play(segs, { title:lesTitle(n), scope:n, from:at });
}

function lesSpeakHead(n){
  NAR321.setSeed(n);
  lesSpeakAt(n, 0, NAR321.start(lesTitle(n), 0));
}

function lesSpeakResume(n){
  const segs = lesSegs(n);
  if (!segs.length) return toast('This chapter has no teaching lesson yet');
  const at = lesAtOf(segs, TTS321.bookmark(n));
  NAR321.setSeed(n);
  lesSpeakAt(n, at, at ? NAR321.resume(lesSecNo(n, segs, at), 0)
                       : NAR321.start(lesTitle(n), 0));
}

function lesSpeakSection(n, at, bi){
  const secs = lesSections(n);
  let no = 1, t = '';
  for (let i = 0; i < secs.length; i++) if (secs[i].i === bi){ no = i + 1; t = secs[i].t; }
  NAR321.setSeed(n);
  lesSpeakAt(n, at, at ? NAR321.startAt(no, t, 0) : NAR321.start(lesTitle(n), 0));
}

/* Where to start reading */
function lesSpeakSheet(n){
  const segs = lesSegs(n);
  if (!segs.length) return toast('This chapter has no teaching lesson yet');
  const b = TTS321.bookmark(n), at = lesAtOf(segs, b);
  let h = `<h4>Where should I start?</h4>`;
  if (b) h += `<button class="btn" onclick="closeSheet();lesSpeakResume(${n})">
      Pick up where I stopped<span class="xs muted">&nbsp;&nbsp;segment ${at + 1} of ${segs.length}</span></button>`;
  h += `<button class="btn" style="margin-top:8px" onclick="closeSheet();lesSpeakHead(${n})">Start from the beginning</button>`;
  const secs = lesSections(n);
  if (secs.length){
    h += `<div class="hr"></div><p class="eyebrow">Or start from a section</p><div class="row">`;
    secs.forEach(sc => {
      let k = -1;
      for (let i = 0; i < segs.length; i++) if (segs[i].i === sc.i){ k = i; break; }
      if (k < 0) return;
      h += `<button class="pill" onclick="closeSheet();lesSpeakSection(${n},${k},${sc.i})">${esc(sc.t)}</button>`;
    });
    h += `</div>`;
  }
  h += `<p class="sm muted" style="margin-top:14px">When you stop, your place is
        remembered. It is still here next time, and it travels with your backup
        to another device.</p>`;
  sheet(h);
}

/* The "Read the notes aloud" button.
   If we stopped part-way last time, ask first: picking up mid-lesson without a
   word makes the listener think something was skipped, and starting over throws
   away the thirty segments they got through yesterday. */
function lesSpeak(n){
  if (TTS321.isOn()) return stopSpeak();
  const b = TTS321.bookmark(n);
  if (b && b.i > 0) return lesSpeakSheet(n);
  lesSpeakHead(n);
}
/* Pre-download: pull the whole lesson’s audio into IndexedDB so it plays offline afterwards */
async function lesDownload(n){
  const segs = lesSegs(n);
  if (!segs.length) return toast('This chapter has no teaching lesson yet');
  if (!S.set.human) return toast('The device voice is in use, so there is nothing to download');
  const b = $('#lesDl' + n);
  const fail = await new Promise(res => TTS321.prefetch(segs,
    (ok, bad) => res(bad),
    (done, all) => { const e = $('#lesDl' + n); if (e) e.textContent = `⤓ Downloading ${done}/${all}`; }));
  const e = $('#lesDl' + n); if (e) e.textContent = fail ? '⤓ Download' : '✓ Downloaded';
  toast(fail ? `${fail} segments did not download &mdash; please try again` : 'The whole lesson’s audio is saved on this device; you can listen offline');
}
/* On entering the lesson page, check whether this lesson has been downloaded already */
function lesDlCheck(n){
  const b = $('#lesDl' + n);
  if (!b || !S.set.human) return;
  const segs = lesSegs(n); if (!segs.length) return;
  TTS321.cacheHave(segs, (got, all) => {
    const el = $('#lesDl' + n); if (!el) return;
    el.textContent = got >= all ? '✓ Downloaded'
      : got ? `⤓ Predownload (have ${got}/${all}）` : '⤓ Download';
  });
}

    <p class="q" style="margin:0">${esc(items[0])}</p></div><div class="card">`;
  items.forEach((t, i) => {
    if (!i) return;
    h += `<div class="chk ${p[i] ? 'on' : ''}" onclick="tglP(${n},${i})">
      <span class="box">${p[i] ? '✓' : ''}</span><span class="t">${esc(t)}</span></div>`;
  });
  h += `</div>
  <div class="card"><p class="eyebrow">Day Seven</p>
    <p class="sm" style="margin:0 0 8px">Ask a spiritual companion to check in with you on day seven.</p>
    <input class="note" style="min-height:0;height:44px" id="pal" placeholder="Their name" value="${esc((S.prac[n] || {}).pal || '')}">

  return h;
}
function tglP(n, i){ const p = S.prac[n] = S.prac[n] || {}; p[i] = !p[i]; save(); render(); }

function cSafe(n, m){
  let h = `<div class="card" style="border-color:var(--clay)">
    <p class="eyebrow" style="color:var(--clay)">Pulpit safety check · Chapter ${n}</p>
    <p class="sm" style="margin:0">Three minutes before you go up, scan this.</p></div><div class="card">`;
  m.safe.forEach((s, i) => {
    const k = 'sf' + n + '_' + i, on = S.seen[k];
    h += `<div class="chk ${on ? 'on' : ''}" onclick="S.seen['${k}']=!S.seen['${k}'];save();render()">
      <span class="box">${on ? '✓' : ''}</span><span class="t">${esc(s)}</span></div>`;
  });
  h += `</div><div class="card"><p class="eyebrow">Iron Rule</p>
    <p style="font-family:var(--serif);font-size:18px;margin:0">If you are not sure, do not use it.</p>
    <p class="sm muted" style="margin:8px 0 0">A preacher who turns a “maybe” into a “definitely” for effect has traded the congregation’s trust for one story.</p></div>`;
  return h;
}

function vTracks(){

/* disputes are grouped by chapter: ISS00_* = whole-book positions, otherwise the chapter in the id (ISS12_3 -> chapter 12) */
const issGrp = i => { const m = /^ISS(\d+)_/.exec(i.id || ''); return m ? +m[1] : ((i.ch || [])[0] || 0); };
const issRef = r => (/^\d+:\d/.test(String(r || '')) ? 'Obadiah ' : '') + String(r || '').replace(/--/g, '–');

/* Backup, restore, erase.

   the moment one step is missing:

     no "back up what you have first" -> wrong file picked, both copies gone
     no confirmation                  -> one stray tap, every highlight gone
     no "this is what will be replaced" -> nobody knows what they just pressed

   The old exportData() could only export, never import, so changing phone
   meant starting over. */

  toast('Erased');
}

  const l = LANGS.find(x => x.k === k); if (!l) return;
  if (k==='sc'||k==='tc') { try { var K='r321.obadiah.v1', o=JSON.parse(localStorage.getItem(K)||'null'); if (o && o.set) { o.set.sc=(k==='sc')?1:0; localStorage.setItem(K, JSON.stringify(o)); } } catch(e){} }

}

    var k = s.toLowerCase().replace(/[\s.]/g, '');
    for (i = 0; i < ORDER.length; i++) {
      if (String(ORDER[i][0]).toLowerCase().replace(/[\s.]/g, '') === k) return BY_N[ORDER[i][1]];
    }
    return null;
  }

  /* ── 認出處 ──────────────────────────────────────────────────────── */

  var DASH = '[-\u2010\u2011\u2012\u2013\u2014\uFF0D~\uFF5E]';
  var NUM = '\\d{1,3}';

  /* 名字後面接的數字部分：
       3:16        3:16-18       3:16-4:2       3        3章／3篇 */
  var TAIL = new RegExp(
    '^\\s*(' + NUM + ')' +
    '(?:\\s*([:\uFF1A\u7ae0\u7bc7])\\s*(' + NUM + ')?)?' +
    '(?:\\s*' + DASH + '\\s*(' + NUM + ')(?:\\s*[:\uFF1A]\\s*(' + NUM + '))?)?' +
    '\\s*[\u7bc0\u7ae0\u7bc7]?'
  );

  /* 量詞。單字簡稱＋範圍（多2-3）後面若跟著這些字，那是日常中文不是出處。 */
  var UNIT = /[個天年月日次人位間本張塊條頁週歲元倍成分秒點度斤台件場句字項步層遍回%％、]/;

  function isLetter(ch) { return /[A-Za-z]/.test(ch || ''); }
  function isHan(ch) { return /[\u3400-\u4dbf\u4e00-\u9fff]/.test(ch || ''); }

  /* 從 pos 開始，看看是不是一筆出處。是的話回傳 {…, end}，不是就 null */
  function at(text, pos) {
    for (var i = 0; i < ORDER.length; i++) {
      var name = ORDER[i][0], n = ORDER[i][1];
      if (text.substr(pos, name.length) !== name) continue;
      if (C.only && C.only.indexOf(n) < 0) continue;
      /* 英文書名前後不能黏著別的字母（"Job" 不可以從 "Jobs" 裡切出來）*/
      if (isLetter(name.charAt(0))) {
        if (isLetter(text.charAt(pos - 1))) continue;
        if (isLetter(text.charAt(pos + name.length))) continue;
      } else if (name.length === 1 && C.strictShort && isHan(text.charAt(pos - 1))) {
        continue;                                    // 「大約3:1」不是約翰福音
      }
      var rest = text.slice(pos + name.length);
      var m = TAIL.exec(rest);
      if (!m || !m[1]) continue;
      /* 單字簡稱要有明確標記才算：冒號式（約3:16）或帶單位詞（羅8章）。
         沒有標記的「很多5個」「後來3年」一律不算。

         一個例外：帶範圍的寫法（創2-4、創2～4）。
         「多5」可能是「很多五個」，但「多2-3」幾乎一定是提多書——
         範圍符號本身就是很強的訊號。

         不過還是要擋一種：後面跟著量詞的。
         「約2-3個」「來3-5次」「多2-3天」都是日常中文，不是出處。 */
      var sep = m[2] || '';
      if (name.length === 1 && C.shortNeedsColon && !isLetter(name.charAt(0)) && !sep) {
        var isRange = m[4] != null && m[3] == null;
        if (!isRange || !C.rangeNoColon) continue;
        var tail = m[0].replace(/\s+$/, '');
        if (UNIT.test(text.charAt(pos + name.length + tail.length))) continue;
      }

      var b = BY_N[n];
      var ch = +m[1];
      if (C.maxChapter && (ch < 1 || ch > b.c)) continue;   // 超出範圍就不是出處

      var v = m[3] ? +m[3] : 0;
      var ch2 = 0, v2 = 0;
      if (m[4] != null) {
        if (m[5] != null) { ch2 = +m[4]; v2 = +m[5]; }      // 1:1-2:3 跨章
        else if (v) { v2 = +m[4]; }                          // 3:16-18
        else { ch2 = +m[4]; }                                // 3-4 章
      }
      if (ch2 && C.maxChapter && ch2 > b.c) continue;

      var raw = text.substr(pos, name.length + m[0].length);
      /* 結尾若只是空白，不要吃進去 */
      raw = raw.replace(/\s+$/, '');
      return {
        n: n, book: b, name: name, ch: ch, v: v, ch2: ch2, v2: v2,
        raw: raw, start: pos, end: pos + raw.length,
        id: n + '|' + ch + (v ? ':' + v : '')
      };
    }
    return null;
  }

  /* 掃一整段純文字，回傳所有出處 */
  function find(text) {
    text = String(text == null ? '' : text);
    var out = [], i = 0;
    while (i < text.length) {
      var r = at(text, i);
      if (r) { out.push(r); i = r.end; } else { i++; }
    }
    return out;
  }

  /* 只認一筆（整個字串就是一個出處）*/
  function parse(s) {
    var a = find(s);
    return (a.length === 1 && a[0].raw.length === String(s).replace(/^\s+|\s+$/g, '').length)
      ? a[0] : (a[0] || null);
  }

  /* ── 變成連結 ────────────────────────────────────────────────────
   * HTML 標籤裡面、已經是 <a> 的地方一概不動——否則會把 href 裡的
   * 「創1:1」也換掉，整個連結就壞了。
   * ------------------------------------------------------------------ */

  function linkify(html, opt) {
    opt = opt || {};
    html = String(html == null ? '' : html);
    var out = '', i = 0, inTag = false, depthA = 0, buf = '';

    function flush() {
      if (!buf) return;
      out += mark(buf, opt);
      buf = '';
    }

    while (i < html.length) {
      var ch = html.charAt(i);
      if (!inTag && ch === '<') {
        flush();
        inTag = true;
        var close = html.indexOf('>', i);
        var tag = close < 0 ? html.slice(i) : html.slice(i, close + 1);
        if (/^<a\b/i.test(tag)) depthA++;
        else if (/^<\/a\b/i.test(tag)) depthA = Math.max(0, depthA - 1);
        out += tag;
        i += tag.length;
        inTag = false;
        continue;
      }
      if (depthA > 0) { out += ch; i++; continue; }          // 連結裡面不動
      buf += ch; i++;
    }
    flush();
    return out;
  }

  function mark(text, opt) {
    var refs = find(text);
    if (!refs.length) return text;
    var out = '', last = 0;
    for (var i = 0; i < refs.length; i++) {
      var r = refs[i];
      out += text.slice(last, r.start) + anchor(r, opt);
      last = r.end;
    }
    return out + text.slice(last);
  }

  function anchor(r, opt) {
    opt = opt || {};
    var here = C.inApp ? !!C.inApp(r.n, r.ch) : false;
    var a = '<a class="' + C.cls + (here ? ' ' + C.cls + '-here' : '') + '"' +
      ' ' + C.attr + '="' + esc(r.id) + '"' +
      ' title="' + esc(full(r)) + '"';
    if (C.onOpen) a += ' onclick="event.stopPropagation();REF321.open(\'' + esc(r.id) + '\')"';
    return a + '>' + esc(r.raw) + '</a>';
  }

  function open(id) {
    if (!C.onOpen) return;
    var p = String(id).split('|'), n = +p[0], cv = (p[1] || '').split(':');
    var r = { n: n, book: BY_N[n], ch: +cv[0] || 0, v: +cv[1] || 0, id: id };
    C.onOpen(r);
  }

  /* ── 唸出來 ──────────────────────────────────────────────────────
   * 「太28:19-20」語音引擎會唸成「太二十八冒號十九減二十」。
   * 展開成「馬太福音二十八章十九到二十節」才唸得對。
   * 詩篇的單位詞是「篇」不是「章」——這一條各 App 都踩過。
   * ------------------------------------------------------------------ */

  function cn(n) {
    n = parseInt(n, 10);
    var d = '零一二三四五六七八九';
    if (isNaN(n)) return '';
    if (n < 10) return d.charAt(n);
    if (n < 20) return '十' + (n % 10 ? d.charAt(n % 10) : '');
    if (n < 100) return d.charAt(Math.floor(n / 10)) + '十' + (n % 10 ? d.charAt(n % 10) : '');
    if (n < 1000) {
      var h = d.charAt(Math.floor(n / 100)) + '百', r = n % 100;
      if (!r) return h;
      if (r < 10) return h + '零' + d.charAt(r);
      /* 一百一十九，不是一百十九——十位數在百位後面要把「一」唸出來 */
      return h + d.charAt(Math.floor(r / 10)) + '十' + (r % 10 ? d.charAt(r % 10) : '');
    }
    return String(n);
  }

  function full(r) {
    var b = r.book, unit = b.u || '章';
    if (C.lang === 'en') {
      var s = b.t + ' ' + r.ch;
      if (r.v) s += ':' + r.v;
      if (r.ch2 && r.v2) s += '-' + r.ch2 + ':' + r.v2;
      else if (r.v2) s += '-' + r.v2;
      else if (r.ch2) s += '-' + r.ch2;
      return s;
    }
    /* 單位詞只唸一次。
       「二到四章」，不是「二章到四章」；
       「十九到二十節」，不是「十九節到二十節」。
       多唸一次不算錯，但唸起來很鈍，而且一課裡會出現幾十次。 */
    if (r.ch2 && !r.v && !r.v2) return b.t + cn(r.ch) + W.to + cn(r.ch2) + unit;

    var t = b.t + cn(r.ch) + unit;
    if (r.v) t += cn(r.v) + (r.v2 && !r.ch2 ? W.to + cn(r.v2) : '') + W.v;
    if (r.ch2 && r.v2) t += W.to + cn(r.ch2) + unit + cn(r.v2) + W.v;
    else if (r.ch2) t += W.to + cn(r.ch2) + unit;
    return t;
  }

  /* ── 括號裡的出處不用唸 ──────────────────────────────────────────
   * 講義裡到處是「……神就是愛（約壹4:8）」這種註記。
   * 那個括號是給眼睛看的——讀者想查的時候有得查。
   * 唸出來就變成「神就是愛，約翰一書四章八節」，句子的氣被打斷了，
   * 而且聽的人根本記不住那一串數字。
   *
   * 但不是所有括號都能拿掉。「（這裡的『愛』是 agape）」是說明，
   * 拿掉就少了一塊。所以判準是：
   *
   *     把括號裡的出處拿走之後，還剩下有意義的字嗎？
   *     沒有 → 整個括號拿掉。有 → 原封不動留著。
   *
   * 剩下來只算這些不算數：參、見、另見、比較、又、cf.、標點、空白。
   * -------------------------------------------------------------------- */

  var FILLER = /^[\s，,、;；。・·\-–—~～和與及或]*(?:參|參看|參閱|見|另見|另參|比較|又見|又|詳|cf\.?|see|compare)?[\s，,、;；。・·\-–—~～]*$/i;

  function dropParenRefs(text) {
    text = String(text == null ? '' : text);
    /* 全形與半形的括號都要認。不用貪婪比對——括號不會巢狀。 */
    return text.replace(/[（(]([^（()）]*)[)）]/g, function (whole, inner) {
      var refs = find(inner);
      if (!refs.length) return whole;              // 裡面根本沒有出處
      var rest = '', last = 0, i;
      for (i = 0; i < refs.length; i++) {
        rest += inner.slice(last, refs[i].start);
        last = refs[i].end;
      }
      rest += inner.slice(last);
      if (!FILLER.test(rest)) return whole;        // 還有話要說，留著
      return '';
    })
      /* 拿掉之後會留下縫：「God is love （…），that is」變成
         「God is love ，that is」——一個空白掉在逗號前面。
         英文版特別明顯，中文版則會多出兩個空格。 */
      .replace(/[ \t]+([，。、；：！？,.;:!?）)」』])/g, '$1')
      .replace(/([（(「『])[ \t]+/g, '$1')
      .replace(/[ \t]{2,}/g, ' ');
  }

  /* 把一段文字裡的出處通通換成口語唸法 */
  function speak(text) {
    text = String(text == null ? '' : text);
    var refs = find(text);
    if (!refs.length) return text;
    var out = '', last = 0;
    for (var i = 0; i < refs.length; i++) {
      out += text.slice(last, refs[i].start) + full(refs[i]);
      last = refs[i].end;
    }
    return out + text.slice(last);
  }

  /* ── 掛上 ─────────────────────────────────────────────────────────── */

  function init(cfg) {
    C = ext(ext({}, DEF), cfg || {});
    load(C.lang);
    return API;
  }

  function setLang(lang) { C.lang = lang; load(lang); }

  var API = {
    init: init, setLang: setLang,
    find: find, parse: parse, book: book,
    linkify: linkify, speak: speak, format: full, open: open,
    dropParenRefs: dropParenRefs,
    cn: cn,
    books: function () { return T; },
    count: function () { return T ? T.length : 0; },
    version: '1.1.0'
  };
  return API;
})();

if (typeof module !== 'undefined' && module.exports) module.exports = REF321;

/* The English edition has no script switch, so the book table never changes. */

/* ======= (0) What you see and what you hear (321-app-core * NAR321) ======= */
/* One piece of content, two faces: on screen a table is drawn as a table;
   in your ear it is read as a paragraph.

   The lead-in phrases (sections, numbered questions, going deeper, the five
   steps, wrapping up) each come in several versions, rotated by position.
   A lesson has thirty-odd blocks; open every one with the same sentence and
   by the fifth question the ear has stopped listening.

   The rotation is **predictable**, not random: reading the same lesson twice
   must sound identical, or the sentence highlighting and auto-scroll fall out
   of step and the reader wonders why it changed. */
/* ============================================================================
 * 321 App Core — 看的與聽的  narrate.js  v1.1.0
 * ----------------------------------------------------------------------------
 * 同一段內容，兩種樣子：
 *
 *     NAR321.html(md)     給眼睛看的——表格畫成真的表格，條列有層次
 *     NAR321.speech(md)   給耳朵聽的——表格讀成一段話，序號用口語帶入
 *
 * 這兩件事必須放在一起，因為它們是同一份內容的兩個面。分開做的結果是：
 * 畫面上是一張漂亮的三欄表，朗讀時變成「豎線 觀點 豎線 立場A 豎線 …」。
 *
 * ── 為什麼帶入詞要有好幾套 ────────────────────────────────────────
 *
 * 一課講義有三十幾個區塊。每一個分段都唸「第一段」「第二段」「第三段」，
 * 每一題都唸「第一題」「第二題」，聽到第五題的時候，人的耳朵就開始滑過去了。
 *
 * 這不是美感問題，是**聽得進去**的問題。真人講道的時候不會這樣講——
 * 他會說「我們往下走」「接著是」「來到第三題」，句子的形狀一直在變，
 * 耳朵才跟得住。
 *
 * 所以每一種帶入都備了好幾套，照位置輪替。
 *
 * **輪替是可預測的，不是隨機的。** 同一課唸兩次要一模一樣——
 * 隨機的話，逐句標示與跟讀會對不上，而且使用者會覺得「怎麼跟剛才不一樣」。
 *
 * 語法：ES5，無相依。
 * ==========================================================================*/

var NAR321 = (function () {
  'use strict';

  /* ── 帶入詞 ────────────────────────────────────────────────────────
   * 寫這些句子的時候想的是：一位牧者站在台上，講到這裡會怎麼開口？
   * 不是「系統提示音」，是一個人在講話。
   * ------------------------------------------------------------------- */

  var T = {
    /* 分段／節標題：{n} 是段序（中文數字），{t} 是標題 */
    section: [
      'Section {n}. {t}.',
      'Let’s look at section {n}: {t}.',
      'Next comes section {n}: {t}.',
      'Section {n} is about {t}.',
      'Moving on. Section {n}, {t}.',
      'Now to section {n}, {t}.'
    ],
    /* 沒有段序、只有標題的時候 */
    heading: [
      '{t}。',
      'Let’s look at {t}.',
      'Next, {t}.',
      'What follows is {t}.',
      'This part is about {t}.'
    ],
    /* 序號題目：{n} 是題序 */
    numbered: [
      'Question {n}.',
      'Let’s take question {n}.',
      'Next is question {n}.',
      'On to question {n}.',
      'Question {n} asks this.',
      'Moving on, question {n}.'
    ],

    item: [

    ],
    /* 想更深：問 */
    deeper: [

      'Allow me one more word here. Someone may be asking,',
      'I know some of you will stop here and ask,',
      'Let’s take this one step further. Someone asks,',

    ],

    step: [

    table: [

    list: [

    ],
    /* 引用經文 */
    quote: [
      'Scripture says:',
      'The Bible puts it this way:',
      'Let’s read this verse:',
      'This verse reads:'
    ],

    /* ── 開始、暫停、停止、接續 ──────────────────────────────────
     * 這四件事本來沒有聲音：按下去就開始唸，按停就沒聲了。
     * 少了這一句話，聽的人不知道自己在哪裡——尤其是「從書籤繼續」，
     * 冷不防從半路唸起，耳朵會以為前面漏掉了。
     *
     * 一位牧者不會這樣帶人。他會說「我們接著上次停的地方」。
     * ------------------------------------------------------------- */

    /* 開始：{t} 是這一課的名字 */
    start: [
      'Let us read {t} together.',
      '{t}. Let us begin.',
      'Come, let us read {t}.',
      'We begin with {t}.',
      '{t} — let us listen together.'
    ],
    /* 開始，可是不知道叫什麼名字 */
    startBare: [
      'Let us begin.',
      'Come, let us read together.',
      'Let us read this together.',
      'All right, let us start reading.'
    ],
    /* 指定從第幾段開始：{n} 段序，{t} 標題 */
    startAt: [
      'We start at section {n}, {t}.',
      'This time we begin at section {n}: {t}.',
      'Let us go straight to section {n}, {t}.',
      'Starting at section {n}. {t}.',
      'We read on from section {n}, {t}.'
    ],
    /* 指定從第幾段開始，可是那一段沒有標題 */
    startAtBare: [
      'We start at section {n}.',
      'This time we begin at section {n}.',
      'Let us go straight to section {n}.',
      'Starting at section {n}.'
    ],
    /* 接著上次停的地方：{n} 段序 */
    resume: [
      'We pick up where we stopped last time, at section {n}.',
      'Last time we reached section {n}; let us go on from there.',
      'Back to section {n}, and onward.',
      'Continuing from where we just stopped, section {n}.',
      'From section {n}, we go on.'
    ],
    /* 暫停 */
    pause: [
      'Let us pause here.',
      'We stop for a moment.',
      'Let us take a breath here.',
      'Holding here for now.'
    ],
    /* 停止 */
    stop: [
      'We will stop here for today.',
      'Let us leave it here.',
      'This section stops here for now.',
      'Good — we stop here for now.'
    ]
  };

  /* 表格與條列讀出來的零件。
   *
   * 這一組本來寫死在程式裡，英文版於是唸成
   * 「What follows was laid out as a table. 先看「x」，y。」——
   * 一半英文一半中文，而且所有測試都過，因為沒有人驗長相。
   *
   * 凡是會被唸出來或看到的字，一律要能換掉。 */
  var W = {
    rowFirst: ['First', 'To start', 'The first row'],
    rowMid: ['Next', 'Then', 'After that', 'Following that', 'Next up'],
    rowLast: ['And last'],
    cols: 'The table has {n} columns: {list}.',
    row2: '{link}「{label}」，{value}。',      // 兩欄表
    rowN: '{link}「{label}」：{parts}。',      // 三欄以上
    pair: '{col} is {value}',
    pairSep: '；',
    listSep: '、',
    itemFirst: '{n}. ',
    itemLast: 'And last, ',
    end: '。'
  };

  var DEF = {
    seed: 0,             // 換一課就換一個起點，整課的節奏不會跟上一課一樣
    speakUnit: true,
    cls: 'nar',          // HTML 的 class 前綴
    words: null,         // 上面那一組零件；英文版整組換掉
    /* 序號怎麼寫。預設中文數字（第三段）；英文版給 String（Section 3）。
       這一格漏了的話，英文版會唸成「Section 三」——模板全換成英文了，
       塞進去的數字還是中文，而且每一項測試都過，因為沒有人驗長相。 */
    num: null,           // fn(n) -> string
    labels: { col: 'column', row: 'row' }
  };

  var C = null;

  function ext(a, b) { for (var k in b) if (b.hasOwnProperty(k)) a[k] = b[k]; return a; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function cfg() { return C || (C = ext({}, DEF)); }

  /* 中文數字。跟 REF321 的那一份刻意各留一份——
     這兩個模組不互相依賴，要能單獨掛。 */
  function cn(n) {
    n = parseInt(n, 10);
    var d = '零一二三四五六七八九';
    if (isNaN(n)) return '';
    if (n < 10) return d.charAt(n);
    if (n < 20) return '十' + (n % 10 ? d.charAt(n % 10) : '');
    if (n < 100) return d.charAt(Math.floor(n / 10)) + '十' + (n % 10 ? d.charAt(n % 10) : '');
    return String(n);
  }

  /* ── 挑一套 ────────────────────────────────────────────────────────
   * 用位置算，不用亂數。同一課唸兩次要一模一樣——
   * 亂數的話逐句標示與跟讀會對不上，而且使用者會覺得「怎麼跟剛才不一樣」。
   *
   * 各種帶入詞不可以同步：如果每一種都用 i % n，那麼第 0 個分段配第 0 個
   * 題目、第 1 個分段配第 1 個題目，整課的節奏會出現一種說不上來的規律感。
   * 所以混進種類名字的雜湊，讓每一種各走各的。
   * ------------------------------------------------------------------- */

  function hash(kind) {
    var h = 0, i;
    for (i = 0; i < kind.length; i++) h = (h * 31 + kind.charCodeAt(i)) % 9973;
    return h;
  }

  /* 序號：數字才轉，已經是字串的就原樣送出（宿主給「十二」那種） */
  function num(n) {
    if (typeof n !== 'number') return n == null ? '' : String(n);
    var f = cfg().num;
    if (f) { try { return String(f(n)); } catch (e) {} }
    return cn(n);
  }

  function pick(kind, i) {
    var arr = T[kind];
    if (!arr || !arr.length) return '';
    var n = (Math.abs(parseInt(i, 10) || 0) + hash(kind) + (cfg().seed | 0)) % arr.length;
    return arr[n];
  }

  function fill(tpl, vars) {
    return String(tpl).replace(/\{(\w+)\}/g, function (m, k) {
      return vars && vars[k] != null ? String(vars[k]) : '';
    });
  }

  /* ── 對外的幾種帶入 ─────────────────────────────────────────────── */

  function lead(kind, i, vars) { return fill(pick(kind, i), vars || {}); }

  function section(title, n, i) {
    title = String(title == null ? '' : title).replace(/[。．.]$/, '');
    if (n == null || n === '') return fill(pick('heading', i), { t: title });
    return fill(pick('section', i), { n: num(n), t: title });
  }

  function numbered(n, i) {
    return fill(pick('numbered', i), { n: num(n) });
  }

  function step(key, body, i) {
    return fill(pick('step', i), { k: key, t: String(body == null ? '' : body) });
  }

  function deeper(q, i) { return pick('deeper', i) + String(q == null ? '' : q); }
  function deeperAnswer(i) { return pick('deeperAnswer', i); }
  function wrap(i) { return pick('wrap', i); }

  /* ── 開始、暫停、停止、接續 ────────────────────────────────────────
   * `i` 是輪替的位置。分段、題目那些有天然的位置（第幾塊），
   * 這四種沒有——所以慣例是：
   *
   *   · 開始／接續：傳 0（種子已經一課一換，整課的第一句自然就不一樣）
   *   · 暫停／停止：傳「這一課按了第幾次」，同一課連按兩次才不會一樣
   *
   * 標題末尾的句號要去掉，不然會唸成「創世記第一章。。我們開始」。
   * ------------------------------------------------------------------- */

  function title_(t) {
    return String(t == null ? '' : t).replace(/[。．.\s]+$/, '');
  }

  function start(title, i) {
    var t = title_(title);
    if (!t) return pick('startBare', i);
    return fill(pick('start', i), { t: t });
  }

  function startAt(n, title, i) {
    var t = title_(title);
    var v = { n: num(n), t: t };
    if (!t) return fill(pick('startAtBare', i), v);
    return fill(pick('startAt', i), v);
  }

  function resume(n, i) {
    return fill(pick('resume', i), { n: num(n) });
  }

  function pause(i) { return pick('pause', i); }
  function halt(i) { return pick('stop', i); }

  /* ── Markdown ─────────────────────────────────────────────────────
   * 只認小智真的會用到的那幾種：標題、粗體、條列、編號、表格、引用、行內碼。
   * 不做完整的 Markdown——做完整的話要處理巢狀、參考式連結、HTML 混排，
   * 那是一整個函式庫，而且錯了會把整段答案弄亂。
   * ------------------------------------------------------------------- */

  function isTableLine(l) { return /^\s*\|.*\|\s*$/.test(l); }
  function isDivider(l) { return /^\s*\|[\s:|-]*\|\s*$/.test(l) && l.indexOf('-') >= 0; }

  function cells(l) {
    var t = String(l).replace(/^\s*\|/, '').replace(/\|\s*$/, '');
    var out = t.split('|'), i;
    for (i = 0; i < out.length; i++) out[i] = out[i].replace(/^\s+|\s+$/g, '');
    return out;
  }

  /* 把整段切成一塊一塊：段落、標題、條列、編號、表格、引用 */
  function blocks(md) {
    var lines = String(md == null ? '' : md).replace(/\r\n?/g, '\n').split('\n');
    var out = [], i = 0;
    while (i < lines.length) {
      var l = lines[i];
      if (!l.replace(/\s/g, '')) { i++; continue; }

      if (isTableLine(l) && i + 1 < lines.length && isDivider(lines[i + 1])) {
        var head = cells(l), rows = [];
        i += 2;
        while (i < lines.length && isTableLine(lines[i])) { rows.push(cells(lines[i])); i++; }
        out.push({ k: 'table', head: head, rows: rows });
        continue;
      }
      var m = l.match(/^\s*(#{1,6})\s*(.+)$/);
      if (m) { out.push({ k: 'h', n: m[1].length, t: m[2] }); i++; continue; }
      if (/^\s*>/.test(l)) {
        var q = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          q.push(lines[i].replace(/^\s*>\s?/, '')); i++;
        }
        out.push({ k: 'quote', t: q.join('\n') });
        continue;
      }
      if (/^\s*([-*・]|\d+[.、)])\s+/.test(l)) {
        var items = [], ord = /^\s*\d+[.、)]/.test(l);
        while (i < lines.length && /^\s*([-*・]|\d+[.、)])\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*([-*・]|\d+[.、)])\s+/, '')); i++;
        }
        out.push({ k: 'list', ord: ord, items: items });
        continue;
      }
      var p = [];
      while (i < lines.length && lines[i].replace(/\s/g, '') &&
             !isTableLine(lines[i]) && !/^\s*(#{1,6}\s|>|[-*・]\s|\d+[.、)]\s)/.test(lines[i])) {
        p.push(lines[i]); i++;
      }
      /* 一行都沒收進來的話，i 就不會動——那是一個無窮迴圈，而且會把
         陣列撐爆。會走到這裡的是「長得像表格、可是下一行不是分隔線」
         那種行（例如只有一行的 `| 這不是表格 |`）。
         這種行就當成普通一段，硬收一行再往下走。 */
      if (!p.length) { p.push(lines[i]); i++; }
      out.push({ k: 'p', t: p.join('\n') });
    }
    return out;
  }

     分不乾淨的時候寧可原樣留著，也不要把句子拆壞。 */
  function inlineHTML(t) {

      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');

  function inlineText(t) {
    return String(t == null ? '' : t)
      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/^\s+|\s+$/g, '');
  }

  /* ── 給眼睛看的 ──────────────────────────────────────────────────── */

  function html(md) {
    var bs = blocks(md), out = [], i, b, j, c = cfg().cls;
    for (i = 0; i < bs.length; i++) {
      b = bs[i];
      if (b.k === 'h') {
        out.push('<p class="' + c + 'h' + (b.n <= 2 ? '' : ' sm') + '">' + inlineHTML(b.t) + '</p>');
      } else if (b.k === 'quote') {
        out.push('<blockquote class="' + c + 'q">' + inlineHTML(b.t) + '</blockquote>');
      } else if (b.k === 'list') {
        var tag = b.ord ? 'ol' : 'ul';
        var li = '';
        for (j = 0; j < b.items.length; j++) li += '<li>' + inlineHTML(b.items[j]) + '</li>';
        out.push('<' + tag + ' class="' + c + 'l">' + li + '</' + tag + '>');
      } else if (b.k === 'table') {
        var h = '<div class="' + c + 'tw"><table class="' + c + 't"><thead><tr>';
        for (j = 0; j < b.head.length; j++) h += '<th>' + inlineHTML(b.head[j]) + '</th>';
        h += '</tr></thead><tbody>';
        for (j = 0; j < b.rows.length; j++) {
          h += '<tr>';
          for (var k = 0; k < b.head.length; k++) {
            h += '<td>' + inlineHTML(b.rows[j][k] || '') + '</td>';
          }
          h += '</tr>';
        }
        out.push(h + '</tbody></table></div>');
      } else {
        out.push('<p>' + inlineHTML(b.t) + '</p>');
      }
    }
    return out.join('');
  }

  /* ── 給耳朵聽的 ──────────────────────────────────────────────────── */

  /* 一張表讀成一段話。
     第一欄當成那一列在講什麼，其餘各欄是它的內容。
     兩欄表最單純：「甲，是乙。」 */
  function w() { return (cfg().words) || W; }

  function tableSpeech(b, i) {
    var head = b.head || [], rows = b.rows || [], out = [], j, k, ww = w();
    out.push(pick('table', i));
    /* 兩欄表不必報欄數——「這張表有二欄」是廢話，而且拖慢節奏。
       三欄以上才值得先說一聲，不然聽的人跟不上後面的對照。 */
    if (head.length >= 3) {
      out.push(fill(ww.cols, { n: num(head.length), list: head.join(ww.listSep) }));
    }
    for (j = 0; j < rows.length; j++) {
      var r = rows[j], label = inlineText(r[0] || '');
      var link = j === 0 ? ww.rowFirst[(i + j) % ww.rowFirst.length]
               : (j === rows.length - 1 && rows.length > 2 ? ww.rowLast[0]
                  : ww.rowMid[(i + j) % ww.rowMid.length]);
      if (head.length === 2) {
        out.push(fill(ww.row2, { link: link, label: label, value: inlineText(r[1] || '') }));
      } else {
        var parts = [];
        for (k = 1; k < head.length; k++) {
          var v = inlineText(r[k] || '');
          if (v) parts.push(fill(ww.pair, { col: inlineText(head[k]), value: v }));
        }
        out.push(fill(ww.rowN, { link: link, label: label, parts: parts.join(ww.pairSep) }));
      }
    }
    return out.join('');
  }

  function listSpeech(b, i) {
    var out = [], j;
    if (b.items.length > 2) out.push(pick('list', i));
    for (j = 0; j < b.items.length; j++) {
      var t = inlineText(b.items[j]);
      if (!t) continue;
      /* 前兩點說「第一」「第二」，後面換成連接詞——
         十點全部報數，聽的人會累。 */
      var ww = w();
      var head = j < 2 ? fill(ww.itemFirst, { n: num(j + 1) })
               : (j === b.items.length - 1 ? ww.itemLast
                  : fill(pick('item', i + j), { n: num(j + 1) }));
      out.push(head + t + (/[。！？.!?]$/.test(t) ? '' : ww.end));
    }
    return out.join('');
  }

  /* 整段 Markdown → 適合唸出來的純文字。
     opt.drop：一個 fn(text)->text，唸之前還要拿掉的東西
     （例如括號裡的經文出處：REF321.dropParenRefs）。 */
  function speech(md, opt) {
    opt = opt || {};
    var bs = blocks(md), out = [], i, b, t;
    var base = opt.i || 0;
    for (i = 0; i < bs.length; i++) {
      b = bs[i];
      if (b.k === 'table') { out.push(tableSpeech(b, base + i)); continue; }
      if (b.k === 'list') { out.push(listSpeech(b, base + i)); continue; }
      if (b.k === 'h') {
        t = inlineText(b.t);
        /* 「一、神的呼召」這種本身帶序號的標題，序號交給模板去說 */
        var m = t.match(/^([一二三四五六七八九十\d]+)[、．.]\s*(.+)$/);
        out.push(m ? section(m[2], m[1], base + i) : section(t, null, base + i));
        continue;
      }
      if (b.k === 'quote') {
        out.push(pick('quote', base + i) + inlineText(b.t));
        continue;
      }
      t = inlineText(b.t);
      /* 已經有句末標點的不補。冒號、分號、頓號也算——
         「三個立場：」後面接一張表，補成「三個立場：。」很難聽。 */
      if (t) out.push(t + (/[。！？；：、，,.:;!?」』）)]$/.test(t) ? '' : '。'));
    }
    var s = out.join('\n');
    if (opt.drop) { try { s = opt.drop(s); } catch (e) {} }
    return s;
  }

  /* ── 掛上 ─────────────────────────────────────────────────────────── */

  function init(c) {
    C = ext(ext({}, DEF), c || {});
    /* words 給了就跟預設合併——英文版只想換幾個零件時不必整組重寫 */
    C.words = ext(ext({}, W), (c && c.words) || {});
    if (c && c.templates) {
      for (var k in c.templates) {
        if (c.templates.hasOwnProperty(k)) T[k] = c.templates[k];
      }
    }
    return API;
  }

  var API = {
    init: init,
    lead: lead, section: section, numbered: numbered, step: step,
    deeper: deeper, deeperAnswer: deeperAnswer, wrap: wrap,
    start: start, startAt: startAt, resume: resume, pause: pause, stop: halt,
    html: html, speech: speech,
    blocks: blocks, cn: cn, num: num,
    templates: T,
    setSeed: function (n) { cfg().seed = n | 0; },
    version: '1.1.0'
  };
  return API;
})();

/* ============================================================================
 * 321 App Core — 朗讀模組  tts.js  v1.4.0
 * ----------------------------------------------------------------------------
 * 這一份把「朗讀」這一整組功能從創世記講義 App 抽出來，收成一個可以掛到任何

 * 一次（破音字校正 4 次、朗讀跟讀 4 次、串流切塊 3 次），而且每一次都重新踩了

 *
 * 包含的功能
 *   · 串流播放      先抓兩段就開播，邊播邊抓，不必等整課下載完
 *   · 逐句標示      播到哪一句，畫面上那一句就亮起來
 *   · 自動跟讀      畫面跟著捲，使用者自己捲過之後先不搶
 *   · 離線          音檔逐段存 IndexedDB，可整課預先下載
 *   · 背景播放      MediaSession ＋ Wake Lock ＋ 看門狗（被打斷會自己接回來）
 *   · 冷啟動        開機預熱 ＋ 退避重試，第一次朗讀不會掉到機器音
 *   · 破音字        一張表，繁體 pattern 自動展開簡體
 *   · 重繪重綁      畫線／換色／寫筆記重繪之後，標示會自己回到原位
 *   · 開始暫停停止  三顆按鈕各按各的，不是一顆切換
 *   · 停在哪裡      停止／暫停時記住位置，下次接著讀；也可以指定從第幾句起
 *
 * 語法：ES5。不是為了復古，是為了讓 WPS WebView 那幾支 App（空中團契、晨讀321）
 * 也能共用同一份——核心只做一次決定，全家都受益。
 *
 * 掛法：見 README.md 的「宿主契約」。核心不認識任何一個 App 的資料結構，
 * App 專屬的部分全部由 cfg 的幾個函式提供。
 * ==========================================================================*/

var TTS321 = (function () {
  'use strict';

  /* ── 預設值 ────────────────────────────────────────────────────────── */

  var DEF = {
    worker: '',
    db: 'r321_tts',
    store: 'a',
    voices: {},
    defaultVoice: '',
    lang: 'zh-TW',
    /* 中文一句約 110 字；英文一句長得多，所以每個 App 自己給 */
    chunk: { punct: '。！？；\n', min: 110, max: 300 },
    sil: { s: 140, c: 140, e: 260 },
    say: [],              // 破音字修正 [[RegExp, '替代字'], …]
    t2s: null,            // 繁→簡：單字表 {繁:簡} 或 fn(str)->str；給了就自動展開 say 的簡體版
    script: null,         // 'tc' | 'sc' | fn()->'tc'|'sc'；知道是哪一套就只產那一套
    preStart: 2,          // 抓到幾段就開播
    preAhead: 8,          // 往前預抓幾段
    parallel: 4,          // 同時幾個請求
    retry: [800, 1600],   // 退避重試（毫秒）；Worker 冷啟動用
    holdScroll: 6000,     // 使用者自己捲過之後，幾毫秒內不搶畫面
    /* 停在哪裡：存進設定的哪一格。設成 '' 就不記。
       這一格要加進 ST321 的 defaults（唯一欄位清單），不要另外開一個
       localStorage key——不然匯出備份的時候會漏掉，換一台裝置就沒了。 */
    bookmarkKey: 'ttsMark',
    keyFor: null,         // fn(unit) -> string  這一句在這一頁的身分證（畫線／書籤用同一把）
    labels: {
      bar: 'Reading aloud', buffering: 'Buffering…', prev: 'Previous sentence', next: 'Next sentence',
      pause: 'Pause', resume: 'Resume', stop: 'Stop', follow: 'Auto-scroll',
      resumeFrom: 'Continue where you left off (sentence {n})',
      startOver: 'Start from the beginning',
      followOn: 'Auto-scroll while reading aloud', followOff: 'No auto-scroll — you control the screen',
      fallback: 'Couldn’t reach the natural voice — using your device’s voice instead',
      nosupport: 'This device doesn’t support reading aloud'
    },
    media: null,          // { artist, album, icon } 鎖屏／耳機／車機上顯示什麼
    settings: null,       // { get: fn -> {human,voice,rate,follow}, save: fn }
    elFor: null,          // fn(unit) -> DOM element | null
    stillHere: null,      // fn(scope) -> bool   還在同一頁嗎
    clean: null,          // fn(text) -> text    App 專屬的朗讀前清理
    toast: null,          // fn(msg)
    onItem: null          // fn(index, unit)     每換一句回呼（選用）
  };

  var C = null;                       // 生效中的設定
  var SPK = { on: false, tok: 0 };    // 播放狀態
  var PL = null;                      // 串流佇列
  var AUP = null;                     // 兩個 <audio> 輪流用
  var LAST = [];                      // 目前標示中的元素
  var SAY = [];                       // 展開後的破音字表
  var BAR = null;
  /* -rf1105（互動聖經 v2.60 朗讀升級）：雲端失敗回復、看門狗、睡前定時 */
  var DOWN = 0;                       // 雲端暫停到什麼時候（失敗後 20 秒內，沒有快取的段落直接改裝置語音）
  var NATIVE_STOP = null;             // 目前這一句若正在用裝置語音，可以用它收掉
  var WD2 = null;                     // 看門狗：音檔放完卻沒觸發 ended 時，依實際長度推進
  var SLEEP = { mode: 0, mins: [0, 15, 30, 60], t: 0, iv: 0 };

  /* ── 小工具 ────────────────────────────────────────────────────────── */

  function ext(a, b) { for (var k in b) if (b.hasOwnProperty(k)) a[k] = b[k]; return a; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function set() { return (C && C.settings && C.settings.get && C.settings.get()) || {}; }
  function save() { if (C && C.settings && C.settings.save) C.settings.save(); }
  function toast(m) { if (C && C.toast) C.toast(m); }
  function L(k) { return (C && C.labels && C.labels[k]) || DEF.labels[k] || ''; }

  function voiceName() {
    var s = set(), v = C.voices[s.voice] || C.voices[C.defaultVoice];
    if (!v) { for (var k in C.voices) { v = C.voices[k]; break; } }
    return v ? v.name : '';
  }
  function rateAttr() {
    var r = set().rate || 0;
    return (r >= 0 ? '+' : '') + (r * 5) + '%';
  }

  /* ── 破音字表：繁體 pattern 自動展開簡體 ──────────────────────────────
   * 學神神學的教訓：SAYFIX 全是繁體 pattern，簡體模式下畫面文字已經是簡體，
   * 整張表比對不到——902 處校正有 733 處對簡體讀者完全失效。
   * 核心在這裡做掉，App 只要給一張繁→簡單字表（make_scmap.py 本來就有）。
   * ------------------------------------------------------------------- */

  /* C.t2s 可以是一張單字表 {繁:簡}，也可以是宿主自己的轉換函式（詞組表那種）。 */
  function t2s(str) {
    if (!C.t2s) return str;
    if (typeof C.t2s === 'function') { try { return C.t2s(str); } catch (e) { return str; } }
    var out = '', i;
    for (i = 0; i < str.length; i++) out += (C.t2s[str.charAt(i)] || str.charAt(i));
    return out;
  }

  /* 這裡有一個很容易漏掉的坑。
   *
   * 有些規則的 pattern 繁簡同形，但**替代字不同形**——例如
   *
   *     重生 → 蟲生（繁）    重生 → 虫生（簡）
   *
   * 兩條都加的話，pattern 一模一樣，先加的那一條永遠先換掉，
   * 後面那一條再也找不到東西。簡體讀者拿到的就是「蟲生」——
   * 唸得出來，但那是繁體字混進簡體版裡。
   *
   * 所以要知道現在是繁是簡。C.script 給了就只產那一套；
   * 沒給就兩套都產（舊行為，不會弄壞既有的 App）。
   * 切換語言之後記得叫一次 TTS321.rebuildSay()。
   * ------------------------------------------------------------------- */

  function script() {
    if (!C || !C.script) return '';
    try { return typeof C.script === 'function' ? C.script() : C.script; }
    catch (e) { return ''; }
  }

  function buildSay() {
    SAY = [];
    var seen = {}, sc = script();
    function add(re, to) {
      var k = String(re) + '\u0000' + to;
      if (seen[k]) return;
      seen[k] = 1; SAY.push([re, to]);
    }
    function toSC(re, to) {
      var srcS = t2s(re.source), toS = t2s(to);
      return [new RegExp(srcS, re.flags || 'g'), toS];
    }
    for (var i = 0; i < (C.say || []).length; i++) {
      var pair = C.say[i], re = pair[0], to = pair[1], v;
      if (sc === 'sc' && C.t2s && re instanceof RegExp) {
        v = toSC(re, to); add(v[0], v[1]);          // 簡體版只要簡體那一套
        continue;
      }
      add(re, to);
      if (sc === 'tc') continue;                    // 繁體版只要繁體那一套
      if (C.t2s && re instanceof RegExp) {          // 不知道是哪一套：兩套都上
        v = toSC(re, to);
        if (v[0].source !== re.source || v[1] !== to) add(v[0], v[1]);
      }
    }
  }

  /* ── 送去合成之前的整理 ───────────────────────────────────────────── */

  function sanitize(t) {
    t = String(t == null ? '' : t).replace(/<[^>]+>/g, ' ');
    t = t.replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&')
         .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"');
    if (C.clean) t = C.clean(t);                    // App 專屬清理（原文、括號出處…）
    for (var i = 0; i < SAY.length; i++) t = t.replace(SAY[i][0], SAY[i][1]);
    t = t.replace(/\s+([，。！？；、,.!?;])/g, '$1');
    return t.replace(/\s{2,}/g, ' ').replace(/^\s+|\s+$/g, '');
  }

  function chunks(t) {
    t = sanitize(t);
    if (!t) return [];
    var out = [], buf = '', i, ch, cfg = C.chunk;
    for (i = 0; i < t.length; i++) {
      ch = t.charAt(i); buf += ch;
      if (cfg.punct.indexOf(ch) >= 0 && buf.length >= cfg.min) { out.push(buf); buf = ''; }
    }
    if (buf.replace(/^\s+|\s+$/g, '')) out.push(buf);
    var fin = [];
    for (i = 0; i < out.length; i++) {
      var s = out[i];
      while (s.length > cfg.max) { fin.push(s.slice(0, cfg.max)); s = s.slice(cfg.max); }
      if (s) fin.push(s);
    }
    return fin.length ? fin : [t];
  }

  /* ── 原文（希伯來文／希臘文）只唸一遍 ──────────────────────────────
   * 中文語音唸不出原文。後面若跟著括號裡的拼音，就只唸那個拼音；
   * 沒有拼音就整段略過。略過之後還要把「原文是（）。」這種懸在半空的
   * 括號與接續詞一起收乾淨——不收的話會唸成「原文是　。」。
   *
   * 這一段本來只在創世記 App 裡；啟示錄那一版只把希臘文拿掉，
   * 留下一對空括號。收進核心之後兩邊都對。
   * ------------------------------------------------------------------ */

  var ORIG_CH = '\u0590-\u05FF\u0370-\u03FF\u1F00-\u1FFF';
  var ORIG_RUN = '[' + ORIG_CH + '][' + ORIG_CH + '\\s\'\u2019\\-\u05be\u05f3\u05f4\u00b7]*';
  var RE_ORIG_ROMAN = new RegExp(
    ORIG_RUN + '\\s*[（(]\\s*([A-Za-z][A-Za-z\'\u2019\u0101\u0113\u012b\u014d\u016b\\- ]*)\\s*[）)]', 'g');
  var RE_ORIG_RUN = new RegExp(ORIG_RUN, 'g');

  function stripOriginal(t) {
    t = String(t == null ? '' : t);
    t = t.replace(RE_ORIG_ROMAN, ' $1 ').replace(RE_ORIG_RUN, '\u0000');
    t = t.replace(/[（(]\s*\u0000\s*[）)]/g, '\u0000');
    t = t.replace(/[是叫作為的]?\s*\u0000\s*(?=[，。；、！？])/g, '');
    t = t.replace(/\s*\u0000\s*/g, ' ');
    return t.replace(/[（(]\s*[）)]/g, ' ');
  }

  /* 送去合成的字 ≠ 畫面上的字。
     畫面要留著原文、書名號、8:28 這些；送去唸的要換成「八章二十八節」。
     核心在這裡統一做，宿主只要給畫面上的字就好——
     否則每個 App 都要自己記得先 sanitize 一次，漏掉就整段原文照著亂唸。 */
  function speechText(u) {
    if (typeof u === 'string') return sanitize(u);
    if (u._s == null) u._s = sanitize(u.t);
    return u._s;
  }

  /* ── IndexedDB 音檔快取 ───────────────────────────────────────────── */

  function db(cb) {
    try {
      if (!window.indexedDB) return cb(null);
      var r = indexedDB.open(C.db, 1);
      r.onupgradeneeded = function () {
        try {
          if (!r.result.objectStoreNames.contains(C.store)) r.result.createObjectStore(C.store);
        } catch (e) {}
      };
      r.onsuccess = function () { cb(r.result); };
      r.onerror = function () { cb(null); };
    } catch (e) { cb(null); }
  }

  function cacheGet(k, cb) {
    db(function (d) {
      if (!d) return cb(null);
      try {
        var q = d.transaction(C.store).objectStore(C.store).get(k);
        q.onsuccess = function () { cb(q.result || null); };
        q.onerror = function () { cb(null); };
      } catch (e) { cb(null); }
    });
  }

  function cachePut(k, blob) {
    db(function (d) {
      if (!d) return;
      try { d.transaction(C.store, 'readwrite').objectStore(C.store).put(blob, k); } catch (e) {}
    });
  }

  function cacheCount(cb) {
    db(function (d) {
      if (!d) return cb(0);
      try {
        var q = d.transaction(C.store).objectStore(C.store).count();
        q.onsuccess = function () { cb(q.result || 0); };
        q.onerror = function () { cb(0); };
      } catch (e) { cb(0); }
    });
  }

  /* 這幾段已經下載了幾段？——一次交易查完，不逐段開連線。
     用在「預先下載」按鈕上：進頁時要能說出「已有 12/45」。 */
  function cacheHave(units, cb) {
    units = units || [];
    if (!units.length) return cb(0, 0);
    var pre = voiceName() + '|' + rateAttr() + '|';
    db(function (d) {
      if (!d) return cb(0, units.length);
      try {
        var st = d.transaction(C.store).objectStore(C.store);
        var n = 0, done = 0, i;
        for (i = 0; i < units.length; i++) {
          (function (u) {
            var k = pre + speechText(u);
            var q = st.getKey ? st.getKey(k) : st.count(k);
            q.onsuccess = function () {
              if (q.result !== undefined && q.result !== 0) n++;
              if (++done === units.length) cb(n, units.length);
            };
            q.onerror = function () { if (++done === units.length) cb(n, units.length); };
          })(units[i]);
        }
      } catch (e) { cb(0, units.length); }
    });
  }

  function cacheClear(cb) {
    db(function (d) {
      if (!d) return cb && cb();
      try {
        var q = d.transaction(C.store, 'readwrite').objectStore(C.store).clear();
        q.onsuccess = function () { cb && cb(); };
        q.onerror = function () { cb && cb(); };
      } catch (e) { cb && cb(); }
    });
  }

  /* ── 取音檔：快取 → Worker（退避重試）───────────────────────────────
   * 領導力 App 的教訓：一個 session 裡「只有第一次」會失敗，換語言再換回來就好——
   * 那是 Worker 冷啟動的指紋，不是哪個語音的 bug。解法是開機預熱 ＋ 退避重試。
   * ------------------------------------------------------------------- */

  function post(text, quick) {
    var ctrl = null, timer = null;
    try { if (window.AbortController) ctrl = new AbortController(); } catch (e) {}
    if (ctrl) timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, quick ? 6000 : 15000);
    function clr() { if (timer) { clearTimeout(timer); timer = null; } }
    return fetch(C.worker, {
      signal: ctrl ? ctrl.signal : undefined,
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        voice: voiceName(), rate: rateAttr(),
        sil: C.sil.s, silc: C.sil.c, sile: C.sil.e, text: text
      })
    }).then(function (res) {
      if (!res.ok) throw new Error('TTS ' + res.status);
      return res.blob();
    }).then(function (b) { clr(); return b; }, function (e) { clr(); throw e; });
  }

  function fetchAudio(piece, quick, bulk) {
    var key = voiceName() + '|' + rateAttr() + '|' + piece;
    return new Promise(function (resolve, reject) {
      cacheGet(key, function (hit) {
        if (hit) return resolve(hit);
        /* 剛失敗過的 20 秒內，沒有快取的段落不再等待，立刻讓呼叫端改用裝置語音（整課預先下載不受影響） */
        if (!bulk && Date.now() < DOWN) return reject(new Error('cloud paused'));
        var n = 0, tries = quick ? 2 : C.retry.length + 1;
        function attempt() {
          post(piece, quick && !bulk).then(function (blob) {
            cachePut(key, blob); resolve(blob);
          }, function (err) {
            n++;
            if (n >= tries) { if (!bulk) DOWN = Date.now() + 20000; return reject(err); }
            var wait = C.retry[n - 1] || 800;
            setTimeout(attempt, wait);
          });
        }
        attempt();
      });
    });
  }

  /* 開機就先戳一下，把冷啟動的代價吃在使用者按下播放之前 */
  function warmUp() {
    if (!C || !C.worker) return;
    /* 離線時不必預熱——Worker 也連不上，只會在主控台留下一筆紅字 */
    try { if (navigator.onLine === false) return; } catch (e) {}
    try { post('.').then(function () {}, function () {}); } catch (e) {}
  }

  /* ── 兩個 <audio> 輪流接力 ────────────────────────────────────────── */

  var SILENT = 'data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA';

  function pair() {
    if (!AUP) {
      AUP = [];
      for (var i = 0; i < 2; i++) {
        var a = new Audio();
        a.preload = 'auto'; a.loop = false;
        a.setAttribute('playsinline', '');
        a.addEventListener('play', function () { mediaState('playing'); });
        a.addEventListener('pause', function () { if (!SPK.on) mediaState('paused'); });
        AUP.push(a);
      }
    }
    return AUP;
  }

  /* ── MediaSession（鎖屏控制）與 Wake Lock ─────────────────────────── */

  var wake = null;

  /* 鎖屏上的封面：宿主沒指定就用頁面自己的 apple-touch-icon／icon */
  function appIcon() {
    if (C.media && C.media.icon) return C.media.icon;
    try {
      var l = document.querySelector('link[rel="apple-touch-icon"][sizes="180x180"]');
      return (l && l.getAttribute('href')) || '';
    } catch (e) { return ''; }
  }

  /* Wake Lock 會被系統收回——螢幕一鎖就收，分頁一藏也收。
     收回之後 wake 這個變數還在，看起來像還握著，其實早就沒了。
     所以要看 released，而且回到前景時要再要一次。 */
  function wakeGet() {
    try {
      if (!navigator.wakeLock || !navigator.wakeLock.request) return;
      if (wake && !wake.released) return;
      navigator.wakeLock.request('screen').then(function (w) {
        wake = w;
        try { w.addEventListener('release', function () { wake = null; }); } catch (e) {}
      }, function () { wake = null; });
    } catch (e) {}
  }

  /* 鎖屏上要看得到「唸到哪裡了」。每換一句就更新一次。 */
  function mediaNow(k, total) {
    try {
      if (!navigator.mediaSession) return;
      var md = navigator.mediaSession.metadata;
      if (md && total) md.artist = (C.media && C.media.artist ? C.media.artist + '　·　' : '') +
                                   'Sentence ' + (k + 1) + ' of ' + total;
      if (navigator.mediaSession.setPositionState) {
        navigator.mediaSession.setPositionState({
          duration: total || 0, position: Math.min(k, total || 0), playbackRate: 1
        });
      }
    } catch (e) {}
  }

  function mediaSetup(title) {
    try {
      if (!navigator.mediaSession || !window.MediaMetadata) return;
      var m = C.media || {}, ic = appIcon();
      navigator.mediaSession.metadata = new window.MediaMetadata({
        title: title || L('bar'),
        artist: m.artist || '',
        album: m.album || '',
        artwork: ic ? [{ src: ic, sizes: '180x180', type: 'image/png' }] : []
      });
      navigator.mediaSession.setActionHandler('play', function () { if (SPK.pause) togglePause(); });
      navigator.mediaSession.setActionHandler('pause', function () { if (!SPK.pause) togglePause(); });
      navigator.mediaSession.setActionHandler('stop', stop);
      navigator.mediaSession.setActionHandler('previoustrack', function () { step(-1); });
      navigator.mediaSession.setActionHandler('nexttrack', function () { step(1); });
      /* 車機／耳機只給快轉鍵的，也讓它當上下一句用 */
      navigator.mediaSession.setActionHandler('seekbackward', function () { step(-1); });
      navigator.mediaSession.setActionHandler('seekforward', function () { step(1); });
    } catch (e) {}
    wakeGet();
  }

  function mediaState(s) {

   * 每秒一次。背景節流會把它拉長到幾秒一次——那正好，反正是救援，

    /* 連續推了十幾秒還是不動，就別再推了——再推下去只是在主控台刷紅字。

  }

  /* ── 逐句標示與跟讀 ───────────────────────────────────────────────
   * 手動捲動偵測不可以用 scroll 事件——自己的 smooth scroll 會觸發它，
   * 於是「使用者捲過了」永遠成立，跟讀就再也不動了。改聽真正的輸入意圖事件。
   * ------------------------------------------------------------------- */

    for (var i = 0; i < LAST.length; i++) {

    if (!els) return;

    catch (e) { try { els[0].scrollIntoView(); } catch (e2) {} }
  }

    for (var i = 0; i < evs.length; i++) {

  /* 畫面重繪之後把標示點回原位。
     畫線／換色／寫筆記都會整個重繪，舊元素失效，不重綁就再也標不回來。 */
  function rebind() {
    if (!SPK.on || !PL) return;
    var u = PL.units[PL.i];
    if (!u) return;
    var hold = SPK.hold;
    SPK.hold = Date.now() + 1;      // 重綁不搶畫面

    SPK.hold = hold;
  }

  /* ── 控制列 ───────────────────────────────────────────────────────── */

  function drawBar() {
    if (!SPK.on) { if (BAR) { BAR.parentNode && BAR.parentNode.removeChild(BAR); BAR = null; } return; }
    if (!BAR) {
      BAR = document.createElement('div');
      BAR.id = 'spkbar'; BAR.className = 'spkbar';
      document.body.appendChild(BAR);

        else if (a === 'next') step(1);

        else if (a === 'stop') stop();
        else if (a === 'follow') toggleFollow();
        else if (a === 'sleep') sleepCycle();

    }
    var st = SPK.buffering ? '<span class="pv">' + esc(L('buffering')) + '</span>'
      : (SPK.total ? '<span class="pv">' + ((SPK.i || 0) + 1) + '/' + SPK.total + '</span>' : '');
    /* 只要這一輪真的標示得到畫面上的元素，就該有「跟讀」開關——
       同一支 App 可能一頁有句子結構、另一頁沒有（整頁唸完那種），
       所以要問這一輪的第一個單位，不是問宿主有沒有給 elFor。 */
    var canFollow = false;
    try {

      }

    var fol = canFollow
      ? '<button data-a="follow" class="' + (set().follow === 0 ? '' : 'on') + '" title="' +
        esc(L('follow')) + '">' + (set().follow === 0 ? '⇕' : '⇳') + '</button>' : '';
    BAR.innerHTML = '<span class="dot"></span><b>' + esc(SPK.title) + '</b>' + st +
      '<button data-a="prev" title="' + esc(L('prev')) + '">⏮</button>' +
      '<button data-a="pause" title="' + esc(SPK.pause ? L('resume') : L('pause')) + '">' +
      (SPK.pause ? '▶' : '⏸') + '</button>' +
      '<button data-a="next" title="' + esc(L('next')) + '">⏭</button>' +
      fol +
      '<button data-a="sleep" title="' + esc(sleepMsg(SLEEP.mins[SLEEP.mode] || 0)) + '" class="' + (SLEEP.mode ? 'on' : '') + '">⏲' + (SLEEP.mode ? '<small>' + SLEEP.mins[SLEEP.mode] + '</small>' : '') + '</button>' +
      '<button data-a="stop" title="' + esc(L('stop')) + '">✕</button>';

  /* ── 串流播放 ─────────────────────────────────────────────────────── */

  function pump() {
    if (!PL || PL.tok !== SPK.tok) return;
    var end = Math.min(PL.units.length, Math.max(C.preStart, PL.i + 1 + C.preAhead));
    for (var k = PL.i; k < end && PL.running < C.parallel; k++) {
      if ((PL.try[k] || 0) < 3) {

    }
    }

  function grab(k) {

    fetchAudio(speechText(PL.units[k]), k === (PL.need != null ? PL.need : PL.i) || PL.fail > 0).then(function (b) {

    }, function () {

    })['then'](function () {

      PL.pend[k] = 0; PL.running--;

  function playAt(k) {

    if (!b) {

  /* ── 裝置內建語音（離線／Worker 掛掉時的退路）──────────────────────── */

  function clearWd2() { if (WD2) { try { clearTimeout(WD2); } catch (e) {} WD2 = null; } }

    var my = SPK.tok, done = false, tm = null;
    PL.i = k; SPK.i = k; PL.need = null; SPK.buffering = false; SPK.native = true;
    if (!SPK.toasted) { SPK.toasted = true; toast(L('fallback')); }
    mark(PL.units[k]);
    if (C.onItem) { try { C.onItem(k, PL.units[k]); } catch (e) {} }
    drawBar();
    var txt = speechText(PL.units[k]);
    function fin(cancelOnly) {
      if (done) return; done = true;
      if (tm) { clearTimeout(tm); tm = null; }
      NATIVE_STOP = null; SPK.native = false;
      if (cancelOnly) return;

      playAt(k + 1);

    NATIVE_STOP = function () { if (done) return; fin(true); try { speechSynthesis.cancel(); } catch (e) {} };

      tm = setTimeout(function () { if (done) return; if (SPK.pause) return guard(); fin(); }, Math.max(15000, txt.length * 480 / ((set().rate || 0) * 0.05 + 0.94)) + 10000);
    }
    try {
      var u = utter(txt);
      u.onend = function () { fin(); }; u.onerror = function () { fin(); };

  /* 睡前定時：關 → 15 → 30 → 60 分鐘 → 關。時間到淡出 5 秒再停（非自然結束，保留續讀位置，隔天按播放接續） */

    return en ? 'Sleep timer: stop in ' + m + ' min' : (sc ? '睡前定时：' + m + ' 分钟后停止' : '睡前定時：' + m + ' 分鐘後停止');
  }

    if (SLEEP.iv) { clearInterval(SLEEP.iv); SLEEP.iv = 0; try { var e2 = pair(); for (var i = 0; i < e2.length; i++) e2[i].volume = 1; } catch (e) {} }

    if (!SPK.on) return;
    var m = (SLEEP.mode + 1) % SLEEP.mins.length;
    if (SLEEP.t) { clearTimeout(SLEEP.t); SLEEP.t = 0; }
    SLEEP.mode = m;
    if (m) SLEEP.t = setTimeout(sleepFire, SLEEP.mins[m] * 60000);

  function sleepFire() {

      n++;
      try { for (var i = 0; i < els.length; i++) els[i].volume = Math.max(0, 1 - n * 0.2); } catch (e) {}

  /* ── 停在哪裡 ───────────────────────────────────────────────────────
   * 按停止多半不是「不要了」，是「先到這裡，等一下接著讀」。
   * 所以停止的時候要把位置留下來——而且要留在設定裡，跟著備份走，
   * 不要另外開一個 localStorage key（匯出的時候會漏掉，換一台裝置就沒了）。
   *
   * 留兩份：第幾句，加上那一句的身分證。
   *   · 只留第幾句 → 講義改過一次（多一段、少一段），第 37 句就不是原來那句
   *   · 只留身分證 → 宿主沒給 keyFor 的話什麼都沒有
   * 回來的時候先認身分證，認不出來才退回第幾句。
   * ------------------------------------------------------------------- */

    return String(u.key || u.id || '');
  }

  function bmSave() {
    if (!C || !C.bookmarkKey || !PL || !PL.units.length) return null;
    var i = Math.max(0, Math.min(PL.units.length - 1, PL.i || 0));
    var b = {
      scope: PL.scope || '', i: i, total: PL.units.length,
      key: unitKey(PL.units[i]), title: SPK.title || '', at: Date.now()

    return b;
  }

  function bookmark(scope) {
    if (!C || !C.bookmarkKey) return null;
    var b = null;
    try { b = set()[C.bookmarkKey]; } catch (e) { b = null; }
    if (!b || typeof b.i !== 'number') return null;
    /* 同一支 App 有好幾頁，書籤只對得上自己那一頁。
       沒給 scope 就不挑——宿主自己知道它在問哪一頁。 */
    if (scope != null && String(scope) !== String(b.scope == null ? '' : b.scope)) return null;
    return b;
  }

  function clearBookmark() {
    if (!C || !C.bookmarkKey) return;
    try {

      if (s[C.bookmarkKey] == null) return;

  /* ── 對外 API ─────────────────────────────────────────────────────── */

    var my = ++SPK.tok;

  t = TTS321.stripOriginal(t);          // Hebrew and Greek are read once (rule lives in the core)
  t = t.replace(/\*\*/g, '').replace(/[《》「」『』【】]/g, '');
  t = t.replace(/^[ \t]*#{1,6}[ \t]*/gm, '').replace(/^[ \t]*>[ \t]?/gm, '');
  t = t.replace(/★|⚠|✓|❌|🟢|🟡|🔴|📋|📖|⚖|▸|▾|·/g, ' ');
  /* A reference inside brackets is for the eye, not the ear.
     "God is love (1 John 4:8)" read aloud becomes "God is love, First John
     chapter four verse eight" — the sentence loses its breath, and nobody
     remembers the numbers anyway.

     Not every bracket goes: "(here 'love' is agape)" is an explanation and
     has to stay. The core's test is whether anything meaningful is left
     once the reference is taken out. */
  t = REF321.dropParenRefs(t);

  /* References outside brackets are still read, and read in full. */
  t = REF321.speak(t);
  t = t.replace(/(\d{1,3}):(\d{1,3})(?:[–-](\d{1,3}))?/g, (m, a, b, c) =>
    'chapter ' + a + ' verse ' + b + (c ? ' to ' + c : ''));
  t = t.replace(/321/g, 'three two one').replace(/920/g, 'nine twenty').replace(/235/g, 'two three five');
  return t.replace(/[：]/g, ', ');
}

/* Which element (or elements) a sentence maps to.
   Lesson sentences are already wrapped in .mks[data-k="l|lesson|block|part|sentence"],
   so use that; blocks with no sentence structure (tables, headings) get marked whole. */
function gnElFor(seg){
  if (!seg || !seg.n) return null;                 // whole-page reading: no sentence structure
  const els = [];
  if (seg.js && seg.js.length){
    seg.js.forEach(j => {
      const e = document.querySelector('.les .mks[data-k="l|' + seg.n + '|' + seg.i + '|' + seg.part + '|' + j + '"]');
      if (e) els.push(e);
    });
  }
  if (!els.length){
    const blk = document.getElementById('lb' + seg.n + '_' + seg.i);
    if (blk) els.push(blk);
  }
  return els.length ? els : null;
}
