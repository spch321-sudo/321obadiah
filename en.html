those who escape, the holy mountain, the original possessions.",""],["1:18","“The house of Esau for stubble”: the house of Jacob as fire, the house of Esau as stubble: the houses of the two brothers part ways in this verse.",""],["1:19","“Will possess the mountain of Esau”: the mountain of Esau becomes a place where others take land: the former high place has changed owners.",""],["1:21","“To judge the mountains of Esau”: two mountains face each other: on Mount Zion are the saviors, and the mountain of Esau is judged; the ending is only one sentence: the kingdom is Yahweh’s.","top"]],"ins":"The story of the brothers begins in Genesis (Gen 25--33) and becomes a historical echo in Obadiah. In this chapter “Esau” appears 7 times, “Jacob” 3 times, and “brother” 2 times (verses 10, 12). The accusation does not start from two nations but from two brothers: “the violence done to your brother Jacob.” This sentence reminds us: when the order of relationships is reversed, grasping power first and then hurting people, in the end even the word “brother” becomes an indictment. By verse 21 the two mountains stand opposite: on Mount Zion are saviors, the mountain of Esau is judged, and the final protagonist is neither brother, but Yahweh himself."},{"gk":"יוֹם","tr":"yom","gl":"Day, that day","code":"H3117","root":"√יום (day)","n":12,"stops":[["1:8","“In that day”: God’s day appears for the first time: in that day he will destroy the wise men of Edom.",""],["1:11","“Cast lots for Jerusalem”: the day of a brother’s disaster: strangers cast lots to divide the city, and Edom stood aside.",""],["1:12","“The day of your brother’s disaster”: in verse 12 “day” is used four times: don’t look down, don’t rejoice, don’t speak proudly.","top"],["1:13","“The day of their calamity”: verse 13 uses it three more times: don’t enter the gate, don’t look down, don’t seize their wealth.",""],["1:14","“The day of distress”: the last time it speaks of the brother’s day: don’t stand at the crossroads, don’t deliver up those who escape to the enemy.",""],["1:15","“The day of Yahweh is near all the nations”: the hinge of the whole chapter: the same word, the subject changed: no longer the day of a brother’s disaster, but “the day of Yahweh.”","top"]],"ins":"The word “day” (יוֹם) appears 12 times in the chapter: once in verse 8, “in that day,” 10 times in verses 11–14, all of the brother’s day (disaster, destruction, calamity), and verse 15 is “the day of Yahweh.” The same word, the subject changed: the day you stood by and watched your brother’s day turns into the day Yahweh watches yours. This is not a timetable, and gives no one a way to count days; it is a reminder: what people do in others’ days, God records in his own."}],"lesson":{"1":{"no":1,"vol":"321 Obadiah Study Notes, Lesson 1 · Obadiah Chapter 1","title":"The Kingdom Will Be Yahweh’s—Heights, Brother, Kingdom","chars":3906,"min":60,"deep":8,"dchars":1236,"tchars":1003,"blocks":[["h","I. “Who Will Bring Me Down to the Ground?” (1:1–9)"],["p","Brothers and sisters, peace to you. Imagine an evening like this: your phone lights up, and on the screen is the name of an old friend. You know that something has happened in his family lately, and you can guess he wants someone to talk to. You glance at it, and don’t answer. You think: I’ll call him back tomorrow. The next day you forget, and by the third day you’re too embarrassed. In all this you never said a hurtful word, never took a cent from anyone, never did anything “wrong.” Yet the chapter of Scripture we read today asks you a very uncomfortable question: if you only stood aside, do you still have a share in it?"],["p","Obadiah has only one chapter, twenty-one verses, the shortest book in the Old Testament. Verse 1 says, “The vision of Obadiah.” The name is generally understood as “servant of Yahweh”; beyond this, the text does not tell us his father, his hometown, or in whose king’s days he spoke. This is an honest starting point: we know little about this prophet, and the various views on author and date are laid side by side in the issues of these notes. For today, remember one thing: it does not matter that we don’t know him; to hear a message from Yahweh is enough. Verse 1 goes on to say that the message is “about Edom.” Edom are the descendants of Esau, the descendants of Jacob’s older brother."],["p","First, look at where Edom lived. Verse 3 says: “The pride of your heart has deceived you, you who dwell in the clefts of the rock, whose habitation is high, who says in his heart, ‘Who will bring me down to the ground?’” Please notice two places. One is “the clefts of the rock” and “high”: this is geography; it is generally thought that Edom’s land was mountainous and rocky, easy to defend and hard to attack. The other is “says in his heart”: this is psychology. The text does not say Edom boasted aloud; it says he “says in his heart.” The most dangerous pride is often not hung on the lips; it is hidden in the heart, fed by terrain and resources: no one can move me."],["p","This sentence, in another setting, is our sentence. I have savings, so I’m not afraid; I have a position, so no one can touch me; I have connections, qualifications, a family name, so I don’t need anybody. The answer in verse 4 is just one sentence: “Though you mount on high as the eagle, and though your nest is set among the stars, I will bring you down from there,” says Yahweh. The eagle is already king of the air, and among the stars is as high as high can be. But the subject of “I will bring you down” is Yahweh. A high place is no protection. Rather than ask where you live, ask: where have you placed your safety?"],["p","Verses 5 to 9 describe how this rock fortress is taken apart, layer by layer. When thieves come, they steal only until they have enough; when grape pickers come, they leave some gleaning grapes (verse 5); but this time even the hidden places are searched out (verse 6). The most painful is verse 7: “All the men of your alliance have brought you on your way, even to the border. The men who were at peace with you have deceived you, and prevailed against you. Friends who eat your bread lay a snare under you.” What was taken apart was not only the rock fortress, but people: allies, friends, those who sat at the same table. Verses 8 and 9 say that even the wise men and the mighty men cannot save him. This passage was not written only for Edom to hear. It asks everyone who has put their safety somewhere else: if one day your ally turns away and your wisdom runs out, what do you have left?"],["d",["Is this passage saying that Edom was hated by God and deserved to be torn down?","It should not be read that way. What the text accuses is “the pride of your heart” and, as we will see, “violence done to your brother”: specific attitudes and actions, not bloodline and not an identity a people is born with. The language of “love” and “hate” in the Bible is in some places the language of comparison, not necessarily an emotion of hatred; this is laid side by side in the issue “Esau and Jacob: How Does the New Testament Read Them?” This chapter also has a larger direction: the ending is not that Edom disappears, but that “the kingdom will be Yahweh’s.” What God tears down is the sense of safety on the heights, not the worth of any group of people. So when preaching this passage, do not point “Edom” to any people or nation today; it is a people in history, and also a portrait of “pride that stands aside.”"]],["h","II. “You Stood Aside” (1:10–14)"],["p","Verse 10 is the turning point of the whole book: “For the violence done to your brother Jacob, shame will cover you, and you will be cut off forever.” The first nine verses spoke of the outcome; this verse for the first time gives the reason. Please notice one word: brother. Edom and Jacob are two lines from one pair of twins; in Genesis it is a story that was split painfully: the birthright, the blessing, the flight, the many years of separation. God says: you did violence to your “brother.” Not to a stranger, not to an enemy, but to someone who should have been standing on the same side. The deepest wounds often come from the one who is closest."],["p","The picture in verse 11 is very concrete: “In the day that you stood on the other side, in the day that strangers carried away his substance, and foreigners entered into his gates, and cast lots for Jerusalem, even you were like one of them.” Notice the order of this sentence: first “you stood on the other side,” then “you were like one of them.” This verse does not say that Edom took up a sword at that time. It says: you stood there, and where you stood was itself a choice. Standing aside is not neutral."],["p","Verses 12 to 14 go on with eight “you should not”: you should not look down, you should not rejoice over it, you should not speak proudly; you should not enter their gate, you should not look down on their affliction, you should not seize their wealth; you should not stand at the crossroads to cut off those who escape, you should not deliver up those who remain. Line these eight up, and there is a direction: from the eyes (looking), to the heart (rejoicing), to the mouth (speaking), to the feet (entering the gate), to the hand (seizing), to cutting off and betraying. Sin does not jump straight into the deepest place; it goes down step by step. The first step is those eyes that look on."],["p","Here an honest word is needed: what Edom actually did in verses 11 to 14, scholars do not agree. Some read it as Edom merely watching, even gloating; others read it as Edom actually taking part in the plunder and the cutting off. What the text itself says most clearly is “like one of them” and these eight “you should not.” We do not supply details the text does not give. But one thing, under either reading, cannot be avoided: God’s accusation begins with the “looking.”"],["p","This passage must be preached with special care. The text speaks to those who “have power and opportunity, yet do nothing, and even profit from the moment.” It is not spoken to everyone who froze in a disaster, to those who have no strength, to those who were themselves running for their lives. If you have ever been looked on from the sidelines, you know that pain; if you have ever been unable to help when someone needed you, you may have carried guilt all along. Please hear this first: God’s accusation is not for pressing people down; it protects those who were wronged, and it wakes those who could have reached out their hands."],["d",["If I truly couldn’t help at the time, does that count as standing aside too?","First separate two things. What the text rebukes is those who have the ability and do nothing, and even “look down,” “rejoice,” and “seize”; it does not say that everyone who lacked strength and was running for their own life is guilty like Edom. If at that time you froze and didn’t know what to do, or were suffering yourself, that is human limitation, not Edom’s sin. What you can ask yourself is not “do I feel guilty?” but three more practical questions: Did I see it then? Was there one small thing I could have done, such as a word or a phone call? Is there still a chance now to make up a little of it? If guilt pushes you toward God and toward the one who was hurt, it is good; if it pushes you toward self-blame and hiding, bring it to the cross and hand it over to the Lord who first reached out his hand for us."]],["h","III. Light from the Original: Go Down, Brother, Day (1:3–4, 10–15)"],["p","To read this chapter, there are three Hebrew words, like three nails that fasten the whole book together. The first is יָרַד (yārad), “to go down.” The “bring down” of verse 3 is, in Hebrew, יוֹרִדֵנִי, meaning “who will take me down”; God’s answer in verse 4 uses the same root: אוֹרִידְךָ, “I will make you go down.” The same verb, once in Edom’s heart and once in God’s mouth. Edom asks: “Who will?” God says: “I will.”"],["p","This root is often used elsewhere in the Old Testament for occasions when God himself “comes down.” Our Lord did not stay on the heights and refuse to come down. Philippians 2 says that he, existing in the form of God, “emptied himself, taking the form of a servant,” and “humbled himself, becoming obedient to the point of death, yes, the death of the cross.” Edom said: no one can bring me down; Jesus went down by himself. This is the gospel of this chapter: the proud fear being brought down, but the God who loves went down himself."],["p","The second word is אָח (ʾāḥ), “brother.” In this chapter the word appears in verses 10 and 12, and the text uses not “neighboring nation,” and not “enemy,” but “your brother.” The deepest wound is not an enemy’s sword; it is a brother turning away. But notice: the word “brother” is both an accusation and an invitation. God did not say “you are no longer a brother”; he said “you did violence to your brother.” The status of brother is still there, and so the responsibility is still there."],["p","The third word is יוֹם (yôm), “day.” From verse 11 to 14 “day” appears again and again: the day of your brother’s disaster, the day of Judah’s destruction, the day of my people’s calamity. This is “the brother’s day.” In verse 15 the text suddenly changes the subject: “the day of Yahweh is near all the nations.” The brother’s day becomes Yahweh’s day. On that day no one is a bystander, because everyone stands before him. How this “day” compares with Joel and Amos is laid out in the issues; for today, grasp just one thing: the day changed owners."],["d",["What use is reading Hebrew for ordinary brothers and sisters?","You do not need to know Hebrew to read this chapter; the use of the light from the original is to let you see the text’s own repetitions. In this chapter the same verb “go down” appears once in Edom’s mouth and once in God’s, and you see that this is no coincidence but a dialogue: Edom says “who could,” God says “I.” “Brother” and “day” are the same. Repeated words are signposts the author left for us. You can use this method to read any chapter: first find the words that keep appearing, then ask what subject they have each time and what meaning they take on. This matters more than memorizing vocabulary. The original is used for one thing only: to bring you closer to the text, not to show how much you know."]],["h","IV. The Kingdom Will Be Yahweh’s (1:15–21)"],["p","The first half of verse 15 is “the day of Yahweh is near all the nations,” and the second half is: “As you have done, it will be done to you. Your deeds will return upon your own head.” Many people reading this sentence hear a voice in their heart: Good, at last those who hurt me will get what they deserve. That feeling is real, and we need not hurry to condemn it. But look at the subject of this sentence: it is “Yahweh” who brings the judgment, not you. Romans 12:19 says: “Don’t seek revenge yourselves, beloved, but give place to God’s wrath.” The hand of recompense is in God’s hand."],["p","Verse 16 says that the bitter cup Judah drank on the holy mountain, all the nations will drink in the same way. In this verse “people of Judah” and “cup” are words the CUV added from context, and the original has other readings, explained in the issues. We will not argue here, but look at one thing: the first to drink were God’s own people. So this chapter is not a song of “our side wins”; it is a declaration that “the whole earth will stand before the King.” Nor can we read verses 10 to 14, then read verse 18, and put ourselves on the side of “the house of Jacob,” forgetting that we too may stand on Edom’s side."],["p","Verses 17 to 20 speak of “possessing the land”: those who escape, the holy mountain, the original possessions, the South, the lowland, the land of the Philistines, the land of Samaria, Gilead, Zarephath, Sepharad. This passage is very easily taken to calculate maps, even to be used as grounds for some region today. We do not read it this way. These words are a comfort spoken to people who had just lost everything and were taken captive abroad: you have not been forgotten. The several ways of reading these verses are laid side by side in the issues; from the pulpit we set no timetable and do not match any place name to a present-day country."],["p","Then verse 21: “Saviors will go up on Mount Zion to judge the mountains of Esau, and the kingdom will be Yahweh’s.” Look at the direction of the whole book: at the beginning it is “Who will bring me down to the ground?”, downward; at the end it is “go up on Mount Zion,” upward. At the beginning Edom lives on the heights; at the end the saviors go up the mountain. Who these “saviors” are is read in different ways, laid side by side in the issues; this makes us think of the true Savior. The New Testament does not directly quote this verse, so we say only “this makes us think of,” and not “this is the prophecy.”"],["p","The last line of this chapter is not “Esau was destroyed,” and not “Jacob won,” but “the kingdom will be Yahweh’s.” The question of the whole book is really: who is King? Edom says: I am my own king; my mountain is my security. But the house of Jacob is not its own king either. In the end the kingdom is given to the One who was King all along. To one who has been hurt this sentence is comfort: you don’t have to win justice back yourself; the King is here. To one who stood aside it is a call: you are not a bystander; you are in the King’s kingdom, so how will you live?"],["d",["Verse 15 says “As you have done, it will be done to you.” May I therefore expect the one who hurt me to be repaid?","You may tell God honestly your pain, your anger, and your longing for justice; the Psalms have many prayers like this. But the subject of this verse is Yahweh, not the victim. Romans 12 says “Vengeance belongs to me; I will repay,” meaning: you can put that knife down, because justice has a Lord. This does not mean you must pretend nothing happened or forgive right away, and it does not mean you cannot protect yourself, report it, or ask the other person to answer for the harm; protecting yourself and seeking accountability do not contradict not taking revenge yourself. If you are still in the midst of pain, please first find a trusted person to be with you, and seek professional help if needed. This verse is for comforting the wounded, not for putting a weapon in anyone’s hand."]],["d",["Has “the kingdom will be Yahweh’s” already happened, or will it happen in the future?","This is a question worth setting side by side. Some read it as: within history, God repeatedly takes back his authority; some read it as a declaration of the final end; others read both: begun already, not yet complete. These notes do not rule, and set no timetable. You can first hold on to two steady things: first, in the text this sentence is written to hear for the wounded and the exiled, and its function is comfort and hope; second, its object is not only Edom, but everyone who thinks he can be king, including us. However you understand the timing, today you can respond: hand back to the King that corner where you have always wanted to be in charge."]],["h","V. Some Deviations We Must Recognize"],["p","The first deviation is to equate “Edom” directly with some people or nation today. The Edom of the text is the descendants of Esau, a people in history, and also a portrait of “pride that stands aside.” To match it to any group today often brings hatred and discrimination, which is the exact opposite of the direction of the text. The test is simple: Does the sermon name any modern people or nation? If so, delete it."],["p","The second deviation is to use verse 15 as a permit for revenge. The subject of this verse is Yahweh, not you. If after hearing it the wounded person has been given a weapon, it was preached wrongly; if they have been given the rest of being able to put the knife down, that is the direction of this verse."],["p","The third deviation is to use verses 17 to 20 as a territorial claim, or to fit them into an end-times timetable. These words are comfort for a people in exile. If a sermon contains dates, years, predictions, or matches place names to today, delete it. The result is perseverance, not panic."],["p","The fourth deviation is to use “standing aside” to shame those who are traumatized or powerless. Verses 11 to 14 speak to those who had power and did nothing, and even profited from the moment. If a brother or sister who is in tears, or who is running for their own life, hears it and is blamed instead of understood, we have preached it wrongly."],["p","The fifth deviation is to preach judgment as intimidation, or to simplify Esau and Jacob into “some people are hated by God.” This chapter is first a comfort to the wounded and also a call to the proud. Do not say to anyone, “You are hated by God”; these verses are a warning against pride and craving for this world, not a label to stick on a person."],["d",["If I’m not sure whether a sentence is a deviation, how do I check?","Check with three questions. First, does this sentence come out of this chapter itself, or did I bring it from elsewhere? Second, if among the hearers there is someone who is wounded, powerless, or has been looked on from the sidelines, will he draw nearer to God after hearing it, or feel more condemned? Third, does this sentence make any group of people into an object of hatred? If the first question has no basis in the text, the answer to the second is “condemned,” and the answer to the third is “yes,” don’t say it yet; change it to the text’s own words. There is also a simplest way: first say what you plan to say to a brother or sister you trust, and ask how it felt to hear it."]],["h","VI. Two Real Questions in the Chinese Context"],["p","The first question: from childhood we are taught “each person sweeps the snow in front of his own door,” “mind your own business,” “protect yourself with prudence.” Is this standing aside? This saying has a protective side: in an unstable environment, not stepping in carelessly is sometimes wisdom; and if a matter is beyond my ability, I don’t have to force myself to carry it. But Obadiah reminds us: when there is ability, when there is opportunity, and when it is the day of a “brother’s” disaster, if “mind your own business” becomes our reason for not reaching out, we have to ask ourselves: what am I protecting, other people, or my own safety? We don’t need to carry everyone’s suffering at once, but please do the one small thing you can: a phone call, a greeting, a prayer for one name."],["p","The second question: in Chinese families, brothers turn against each other over property, over caring for parents, over who is right and wrong; “don’t air the family’s shame,” and outsiders dare not speak, so they stand aside. What Obadiah tells is exactly the story of a pair of brothers. What God values is not whose face is saved, but the violence between brothers and the standing aside. If you are in such a relationship, start with yourself, and don’t wait for the other person to change first. If you are the one who was hurt, you don’t need to forgive right away, and you don’t need to pretend nothing happened; you can first find a trusted elder or pastor to be with you, and seek professional help if needed. If you are the one who stood aside, try, where it is safe, to say one sentence to your brother: “I’m here.”"],["d",["Does not standing aside mean carrying everyone’s suffering?","No. What the text rebukes is those who have ability and opportunity yet look down, rejoice, and seize; it does not ask everyone to carry everyone’s suffering. Your strength, time, and energy are limited, and Jesus himself did not heal everyone at once. You can ask: Who is the one in front of me? What is the one small thing I can do today? A phone call, a greeting, a prayer for one name: each is reaching out. If you yourself are exhausted, first taking care of yourself is also faithfulness to God, because only someone who has first been held up has strength to hold others up. Not standing aside means not using “I can’t do everything” as a reason for “I don’t have to do anything.”"]],["h","VII. Living Out the 321: The Heights, the Sidelines, and the Kingdom"],["p","The three foundations. Jesus is my Role Model: he, existing in the form of God, did not consider equality with God a thing to be grasped, but emptied himself, humbled himself, went down, entered into our trouble, and did not stand aside. The Bible is my Standard: this chapter states the order of pride, standing aside, and the kingdom very clearly; we neither add nor subtract, nor use it to hurt people. The Holy Spirit is my Guide: he reminds us which brother or sister needs a phone call today; and when we want to stand aside, he gently nudges us."],["p","The two core values. Let Jesus be King: hand my “cleft in the rock” to him; my position, savings, connections, and qualifications all go back into his hands, so I don’t have to protect myself, and I don’t have to stand aside in order to stay safe. Let Jesus receive all the glory: “the kingdom will be Yahweh’s”; everything is what God has done in Jesus. It is not that my mountain is high, or my hand is quick; I am only returning to my position."],["p","The one purpose is to build God’s system. God’s system is not a group living on the heights, guarding against each other, but a group of brothers and sisters who reach out on the day of each other’s trouble. Pride is leaving man’s position, seizing God’s authority, and wanting to take God’s place; humility is laying down authority and returning to one’s position, letting man be man and God be God. Edom asks, “Who will bring me down?” and our answer is: I will come down myself; you don’t need to pull me. Selflessness is not grasping the heights and not standing aside; life first, then relationships, then ministry."],["h","VIII. Four Kinds of Hearts, Four Roads Home"],["p","The proud type often places safety in “what I have”: I have a position, I have savings, I have qualifications. This kind of heart nods when it hears “Who will bring me down to the ground?” because that is its own sentence. The road home is to say to God from the high place: “Lord, my safety is you.” One minute a day, hand over your rock clefts one by one."],["p","The fearful type treats standing aside as a way to protect himself: I’m afraid of being dragged in, I’m afraid of offending someone, I’m afraid of getting hurt myself. This kind of heart tenses at “don’t look down.” The road home is first to admit the fear, with no need to pretend to be brave, and then to choose one very small, safe thing to do: a greeting, a message. What the Lord values is that small step toward drawing near."],["p","The ashamed type often feels that because he stood aside in the past, he no longer has the right to reach out now: I didn’t help him then, so isn’t it fake to go now? This kind of heart draws back even further when it hears the accusation. The road home is to bring the guilt to the cross, because there is a Lord who reached out first for us. Making up a little is better than hiding."],["p","The wounded type was once looked on from the sidelines, once betrayed, and is especially touched when hearing “standing aside,” and may not even want to listen on. Please know: this chapter was first written for you. God saw. You don’t need to forgive right away, and you don’t need to share details here; you can first let yourself be accompanied. If the pain is too deep, please find a trusted pastor or a professional. Handing judgment over to God does not mean you must swallow it; it means you don’t have to carry it alone."],["d",["I might be several of these four types at once. What should I do?","That is normal. The four hearts do not divide people into four kinds of people; they show how one heart looks at different times: when things go well, we are prone to pride; when questioned, to fear; when old things come to mind, to shame; and when we have been hurt, we shut ourselves in even more. You need not first decide which type you are; just ask: which passage did I react to most today? That reaction is where God wants to speak to you today. If you find all four in yourself, there is no need to be alarmed, because the gospel is the same: Jesus first came down, into our high places, our sidelines, our shame, and our wounds. Every kind of heart has the same road home: first back to God’s presence, then back to the side of our brothers."]],["h","IX. A Few Things You Can Do This Week"],["p","First, each night before bed, spend one minute telling God: “Lord, my safety is you.” Ask for nothing; just put down once what you have been gripping today."],["p","Second, write down your “cleft in the rock”: what do you rely on most (position, savings, connections, qualifications, family background)? Next to it write: “This is not my God.” Then put this paper where you can see it every day."],["p","Third, think of one person in trouble and reach out once today: make a phone call, send a greeting, or pray for them for three minutes. Don’t ask for reasons and don’t give advice; just let them know: you have not been forgotten."],["p","Fourth, the next time you see someone fall, pause for one second, and don’t say “serves them right,” and don’t say “I told you so”; replace those words with a greeting."],["p","Fifth, in your small group, church, and family, notice who is being “stood aside from”: those overlooked, left out in the cold, whom no one asks about. This week, be the first to draw near to that person."],["p","I declare: my safety is not in my rock cleft but in Yahweh; I will no longer say “Who will bring me down to the ground?”"],["p","I declare: I will not stand aside; I am willing to reach out on the day my brothers and sisters are in trouble."],["p","I declare: vengeance belongs to God, and I can put down the knife; justice has a Lord, and I don’t have to win it back myself."],["p","I declare: the kingdom is Yahweh’s and Jesus is King; I return to my position, letting man be man and God be God."],["h","X. Conclusion"],["p","Brothers and sisters, Obadiah has only twenty-one verses, yet it draws a very clear road: the one on the heights is brought down; the one who stood aside is counted as one of them; and the end of it all is not hatred, but the King. The phone call you did not answer at the beginning, you may have forgotten; but God has not. He does not use it to condemn you; he uses it to lead you back from the heights and from the sidelines to your brother’s side."],["p","Jesus has already walked this road first. He came down from heaven, entered into our trouble, and did not stand aside; because he reached out his hand for us, we have the hope that “in Mount Zion, there will be those who escape.” Today you don’t need to become a perfect person who always has strength; you only need to return to your position each day: first see him, then see your brother. Our focus is on Jesus: not on my rock cleft, not on what others think, not on circumstances."],["p","May Jesus be King, may he receive all the glory, and may we all become those who reach out on the day of one another’s trouble, until the kingdom is fully given to our King. We pray in the name of our Lord Jesus Christ, amen."],["h","XI. Small Group Discussion and Sharing: The Three “Hua”"],["m","Leader’s note: today’s lesson walks through the three “hua” (internalize, digest, transform): first take the word into our own hearts (internalize), then think it through, say it aloud, and take a step together (digest), and finally bring this lesson to others (transform)."],["m","Priority marks: ★★★ = top priority; when time is short, discuss at least this one question in each “hua”; ★★ = second priority; ★ = discuss if there is time. The multiplication task marked 【Required】 must not be skipped, though it can be finished at home."],["s","The First Hua: Internalize (about 20 minutes)"],["m","Purpose: let everyone first take the text into their own heart and see the “rock cleft” and the “sideline” in their own heart, without hurrying to discuss others."],["n","1. ★ Verse 3 says Edom “says in his heart”: “Who will bring me down to the ground?” In one sentence, say whether you have a sentence like it in your heart. Say only the name, no details."],["n","2. ★ Name a place and a time when you recently felt you were “living on the heights” and didn’t much need others."],["n","3. ★★ Verse 11 says Edom “stood aside.” Name one thing from these past few months when you saw someone’s need and chose to “stand aside.” Say only one sentence, no details."],["n","4. ★★★ Be quiet for one minute and think of the one thing you rely on most (position, savings, connections, qualifications). Write it down in one sentence, and write whom you are willing to hand it to; say one name."],["m","Leader’s note: please first read 1:3–4 quietly, and then begin. This lesson touches experiences of betrayal, being looked on from the sidelines, and abandonment: do not name people and force them to speak, do not press for details, do not require forgiveness, and do not say “you must have faith” to someone who is in tears; if someone shares bereavement, harm, thoughts of ending their life, or long-term hopelessness, check on them privately after the meeting, and help them seek counseling or other professional help if needed."],["s","The Second Hua: Digest (about 35 minutes · main part)"],["m","Purpose: see yourself, hear God speak, think through the hurdle, say it aloud, take a step, so that this lesson becomes your own words."],["t","【See Yourself】"],["n","5. ★ See yourself: verses 12 to 14 have eight “you should not,” from the eyes to the hand. Which are you closest to lately: looking down, rejoicing, speaking proudly? Name one; no details needed."],["t","【Hear God】"],["n","6. ★★ Hear God: be quiet for three minutes and read verse 21. Is what you hear fear, or an invitation? Say the first feeling you notice."],["t","【Think It Through】"],["n","7. ★★★ Think it through: verse 15 says “As you have done, it will be done to you.” In your own words, explain to your group why this verse is not a permit for revenge. (Hint: who is the subject?)"],["t","【Say It Aloud】"],["n","8. ★★ Say it aloud: in one sentence, tell one group member which “rock cleft” you most want to “put down” first this week, and say that member’s name."],["t","【Take a Step】"],["n","9. ★★★ Take a step: decide which day this week, at which regular place, you will spend one minute telling God, “Lord, my safety is you”; write down the time, and say who will remind you."],["m","Leader’s note: follow the order 【See Yourself】【Hear God】【Think It Through】【Say It Aloud】【Take a Step】 and leave enough time for each step. In 【Say It Aloud】, only one sentence, one name, one time is needed; no story. Do not use this chapter to shame anyone; if someone speaks of having been looked on from the sidelines or betrayed, do not press for details or ask for forgiveness, and check on them privately after the meeting."],["s","The Third Hua: Transform (about 25 minutes)"],["m","Purpose: take this lesson out: into the real relationships of family, workplace, and church, and let the gospel keep multiplying."],["n","10. ★ Is there someone near you in trouble, such as someone who has lost a job, is ill, has left the church, or whose family has broken apart? Say the name, and decide to accompany that person once this month, without giving advice."],["n","11. ★★ Is there something in your group or church where we are used to “standing aside”? Name one concrete thing, and say where you can start from yourself."],["n","12. ★★ Is there someone you know who is hurting? Say the name, and decide to send them one sentence this week: you have not been forgotten."],["n","13. ★★★ 920 practice: find your “2,” the friend you most want to walk through hard times with; this week share with him or her, and say the name on the spot."],["n","14. ★★★ 【Required】 This week, tell a friend outside the church about this lesson in three sentences: a high place is no protection, standing aside is not neutrality, the kingdom is Yahweh’s. And report back next time: whom you told, where, and how they responded."],["m","Leader’s note: please remind the group in particular: do not say in the group “you must forgive him,” and do not use this chapter to ask others to be strong or to put on a show of piety. If someone shares an experience of betrayal, abandonment, or harm, do not press for details or ask for forgiveness; check on them privately after the meeting, and help them seek counseling or other professional help if needed."],["s","Closing (5 minutes)"],["p","Ask everyone to close their eyes gently and set before God the one “rock cleft” they wrote down today. Together read Obadiah 1:21: Saviors will go up on Mount Zion to judge the mountains of Esau, and the kingdom will be Yahweh’s."],["p","The leader prays for each person: asking God to make us willing to come down from the heights, to make us reach out on the day our brothers are in trouble, and to make us not stand aside in the everyday of the week. Before dismissal, ask each other one sentence: “This week, who is the one you will reach out to?”"]]}}}</script>

": " Audience: a teenager (about 12–18). Be funny, witty and real — like a cool older brother or sister chatting, never lecturing or talking down. Use pictures from their world: phone at 1% battery, game levels, binge-watching, likes and followers, exams, peer pressure, sports. A light joke or current slang now and then is welcome, but NEVER joke about God, Jesus or Scripture itself, and never be flippant about sin or pain; after the laugh, land firmly on the truth. Keep it short, put the main point first, use short paragraphs, and end with one small challenge they can try today. If they mention being hurt, bullied, or wanting to harm themselves, answer gently and encourage them to tell a trusted adult (parent, teacher, pastor) right away.", "write": "\nThe reader is a teenager: light, witty, like a friend chatting; a little humour is fine, but never preachy, flippant, or joking about God or Scripture. No emoji.", "style": "Style: the questions and explanations are funny and witty, like friendly banter; the options may be playful, but the correct answer must be unambiguous, and never joke about God or Scripture itself.", "res": ["Slippery one! Read it again and you'll own the next round.", "Not bad! A few more rounds and you can challenge your friends.", "Boss-level run! You're a Bible pro."], "q": ["How does this passage connect to my everyday life — school, friends, my phone?", "If this passage were a message from God to me, what would it say?", "Everyone is doing it — is it weird if I don't? What does Scripture say?", "Can you explain this passage with a game or a movie?", "What's surprising or little-known about this passage?", "Exam stress is huge — what strength does this passage give me?", "I can't forgive someone. How does this passage help?", "Does God really see me? What makes me worth loving?"], "fu": [["🏫", "School", "Using what you just said, help me think through how to use it at school and with my studies — give me one small move I can try today."], ["🤝", "Friends", "Using what you just said, help me think through how to use it with my friends — give me one small move I can try today."], ["🏠", "Family", "Using what you just said, help me think through how to use it with my parents and family — give me one small move I can try today."], ["📱", "Phone & online", "Using what you just said, help me think through how to use it on my phone, online and on social media — give me one small move I can try today."], ["💭", "Stress", "Using what you just said, help me think through how to use it with stress and emotions — give me one small move I can try today."], ["🌟", "Future", "Using what you just said, help me think through how to use it for my future and dreams — give me one small move I can try today."], ["🎯", "Challenge", "Give me one small, specific, slightly fun challenge related to this that I can finish today."]]}, "kid": {"sys": " Audience: a young child (about 5–11). Use VERY simple words, like telling a story to a little one. Short sentences, one idea each. Use concrete everyday pictures (a seed, a teddy bear, holding hands, hide-and-seek, a birthday cake). Avoid theological terms; if one is needed, explain it in one simple sentence. Be warm and lively — you may ask \"Did you know?\" or \"Let's think!\" and add a few cute emojis. Keep the whole answer to about 5–7 short sentences. Do NOT use tables. Quote only one short verse. For violent or frightening passages, tell it gently without graphic detail. End with a tiny prayer or one simple question the child can answer. If the child says someone hurts them or they are very sad, answer kindly and tell them to talk to a trusted grown-up (mom, dad, teacher, pastor) right away.", "write": "\nThe reader is a young child: very simple words and short sentences, like telling a story, one idea per sentence, no hard terms. No emoji.", "style": "Style: for children aged 5–11 — very simple words, very short sentences, like telling a story; keep options short; one warm sentence of explanation, with at most one cute emoji.", "res": ["That's okay! Let's read the story again and play once more! 🌱", "Great job! You remembered so much! 🌟", "Wow, amazing! God is so happy! 🎉"], "q": ["What is this story about? Tell it to me.", "What did God do in this story?", "Does Jesus love me? How do I know?", "Who is the bravest in this story? Why?", "How can I be like the people in this story?", "Teach me one short verse I can remember.", "I had a fight with my best friend. What would Jesus do?", "Can you teach me a little prayer?"], "fu": [["🏠", "At home", "About what you just said — what can I do at home? Please tell me in simple words."], ["🏫", "At school", "About what you just said — what can I do at school? Please tell me in simple words."], ["🤝", "With friends", "About what you just said — what can I do with my friends? Please tell me in simple words."], ["🙏", "Little prayer", "Please teach me a very short little prayer I can say to Jesus."], ["📖", "Story", "Can you tell me another little story about this?"]]}, "seeker": {"sys": " Audience: a seeker — a friend who is not yet a believer and is exploring the Christian faith. Stand fully in their shoes: they may never have read the Bible, do not know church language, and may have questions or reservations. (1) Start from their real situation, feelings or question, then bring in the passage, so they feel \"this is about me\". (2) Use plain everyday words; the 321 vision is only your inner compass — never use insider words like \"self-emptied\", \"let Jesus reign\", \"overcomer\" or \"spiritual\", and no church or theological jargon; if a word like grace, sin or salvation is unavoidable, explain it at once in everyday terms. (3) Be honest and respectful — no preaching, no pressure, no demand to believe now, no judging; doubts and objections are normal, so acknowledge the weight of the question first, then answer it honestly. (4) State clearly what the Bible says about it (what God is like, what Jesus did for us) through stories, pictures and everyday examples they can understand and remember. (5) Always give practical help: one or two small steps they can try this week by themselves (something to notice, a question to ask, a simple action). (6) When it fits, gently invite them to keep exploring (read a short passage, ask a question) — never force the conversation toward a decision. (7) Never say things like \"we Christians all know\", which assumes they already believe. Quote the World English Bible and explain it in plain words. If you include a prayer, offer it only as \"if you like, you could say something like this to God\" — never forced. Keep the whole answer concise, with short paragraphs.", "write": "\nThe reader is a friend who is not yet a believer: everyday, warm, never preachy, no church jargon, never assuming they already believe. No emoji.", "style": "Style: for someone who is not a believer and has never read the Bible. State the background in the question itself (name the person or event), assume no Bible or church vocabulary, use plain words, and make the explanation one plain sentence on why it matters to an ordinary person.", "res": ["That is okay — it takes time with new material. Another look will make it clearer.", "Nice! You have caught the main points of this chapter.", "Excellent! You know this chapter really well."], "q": ["How does this passage connect to my life right now?", "I am not a Christian — what could this mean for me?", "Is there a God? What reasons are there to believe?", "Why does the Bible say everyone needs Jesus?", "I am under a lot of stress — what practical help does the Bible offer?", "What does \"sin\" mean here, and does it apply to me?", "Christians talk about \"grace\" — what does it mean in plain words?", "If I want to know more, where can I start?"], "fu": [["🤝", "Relationships", "Applying what you just said in relationships (family, friends, colleagues), what practical help would it be for someone who is not yet a Christian? Please give an everyday example."], ["💍", "Marriage & family", "Applying what you just said in marriage and family, what practical help would it be for someone who is not yet a Christian? Please give an everyday example."], ["💼", "Work", "Applying what you just said at work, what practical help would it be for someone who is not yet a Christian? Please give an everyday example."], ["😟", "Stress", "Applying what you just said in stress and anxiety, what practical help would it be for someone who is not yet a Christian? Please give an everyday example."], ["🌍", "Meaning", "Applying what you just said in searching for meaning and direction in life, what practical help would it be for someone who is not yet a Christian? Please give an everyday example."], ["❓", "My doubts", "I still have doubts. Please tell me honestly: what practical difference does faith in Jesus make to a person's life? And how could I check it out for myself?"], ["🌱", "Next step", "If I want to learn more, what could my next step be? Please give one or two no-pressure suggestions."]]}, "elder": {"sys": " Audience: an elder (about 65 and older). Speak respectfully, gently and unhurriedly, like a younger person reading Scripture with an older one they honour. Short, clear sentences; no internet slang or abbreviations; pictures from a long life (fields, family, the years, illness, grandchildren, old neighbours). Main point first, in short paragraphs. Honour the road they have walked and their faithfulness in the Lord; never preach, scold, or say \"you should\". You may speak of health and frailty, loneliness, letting go and entrusting, passing faith to the next generation, eternal hope and gratitude. End with one simple thing that is easy to do (a short prayer, a phone call to family, counting one blessing). If they mention illness, loneliness or loss, comfort them first and encourage them to reach out to family or the church care team.", "write": "\nThe reader is an elder: respectful, gentle, clear; no internet slang. No emoji.", "style": "Style: for an elder — plain words, clear sentences, questions that are not convoluted or obscure, short options; one gentle sentence of explanation.", "res": ["That is all right — take it slowly; another read will make it clearer.", "Very good! You remember a lot of this chapter.", "Wonderful! The Word is living in your heart."], "q": ["In the simplest words, what is this passage saying?", "What comfort does this passage give to those who are older?", "My body is growing weaker — how does God watch over me?", "I often feel lonely — what does this passage give me?", "How can I pass my faith on to my children and grandchildren?", "There are things I cannot let go of — how does this passage teach me to entrust them?", "I am old — what can I still do for God?", "Please write me a short prayer I can read to the Lord."], "fu": [["🩺", "Health", "Based on your answer, explain how to apply it to physical frailty and health, and give me one concrete step I can take this week."], ["🤍", "Loneliness", "Based on your answer, explain how to apply it to loneliness and missing loved ones, and give me one concrete step I can take this week."], ["👨‍👩‍👧‍👦", "Family", "Based on your answer, explain how to apply it to my relationship with my children and grandchildren, and give me one concrete step I can take this week."], ["🕊️", "Entrusting", "Based on your answer, explain how to apply it to letting go of my worries and entrusting them to the Lord, and give me one concrete step I can take this week."], ["🌅", "Hope", "Based on your answer, explain how to apply it to eternal hope and gratitude, and give me one concrete step I can take this week."], ["🙏", "Prayer", "Please turn the key point of your answer into a short, simple prayer I can read slowly to the Lord."]]}, "single_parent": {"sys": " Audience: a single parent (carrying a household alone). First receive their weariness: they are often exhausted, carry guilt and loneliness, and face pressure over money, time and raising children. Be warm, accepting and non-judging; do not ask why they are single, never say \"you should find a partner\", and never describe single parenting as a lack. Bring in God's heart: he is a father to the fatherless and a defender of widows (Psalm 68:5), and he is with us. Then give hope and practicality — every small step must be doable in a busy life (a five-minute prayer, one small ritual with the child, asking brothers and sisters for help). Keep it short, in short paragraphs. End with one step they can take this week. If they mention being abused, being too exhausted to go on, or wanting to harm themselves, answer gently and encourage them to contact someone they trust, a church worker or professional help right away.", "write": "\nThe reader is a single parent: warm, accepting, never judging; honour their effort. No emoji.", "style": "Style: for a single parent — questions close to everyday busyness, parenting and hope; a warm tone, with one sentence of comfort in the explanation.", "res": ["That is all right — you have worked so hard. Read it again when you have time.", "Nice! You remember so much in such busy days.", "Wonderful! The Word is holding you up."], "q": ["What comfort does this passage give me as I carry a family alone?", "I am so tired and feel I owe my children more — how does God see me?", "How does God care for orphans and widows, and what does that mean for me?", "Money is very tight — what does this passage give me?", "My child talks back and has big emotions — what should I do?", "I do not know how to talk to my child about Dad (or Mom) not being around.", "I am really lonely — how can I ask the church or brothers and sisters for help?", "Please write me a short prayer I can pray in five minutes."], "fu": [["😮‍💨", "Weary", "Based on your answer, explain how to apply it to the weariness and guilt of carrying a family alone, and give me one concrete step I can take this week."], ["👧", "Child", "Based on your answer, explain how to apply it to being with my child and parenting, and give me one concrete step I can take this week."], ["💰", "Money", "Based on your answer, explain how to apply it to pressure over money and time, and give me one concrete step I can take this week."], ["🤝", "Help", "Based on your answer, explain how to apply it to asking brothers, sisters or the church for help, and give me one concrete step I can take this week."], ["🌤️", "Hope", "Based on your answer, explain how to apply it to seeing God's presence and hope in this season, and give me one concrete step I can take this week."], ["🙏", "Prayer", "Please turn the key point of your answer into a short prayer I can finish in five minutes in the middle of a busy day."]]}, "single": {"sys": " Audience: a single person (never married, divorced, widowed, or still waiting — do not assume they want or do not want to marry). Never describe being single as a lack, a \"preparation stage\" or \"life not yet begun\", and never use a pushy-about-marriage tone. Speak of an identity in Christ that is already whole and loved; of connecting with God, friends and fellowship in loneliness; of using time, money and gifts for a purpose; of trusting while waiting; of wisdom in dating and marriage and of purity in heart and body, respectfully and without judging. Be sincere, equal and light. End with one step they can take this week. If they mention loneliness so deep they want to harm themselves, answer gently and encourage them to contact someone they trust or professional help right away.", "write": "\nThe reader is single: sincere, equal and relaxed; never pushing marriage or treating singleness as a lack. No emoji.", "style": "Style: for single friends — questions about loneliness, identity, waiting, friendship and purpose; a sincere, equal tone, never pushing marriage.", "res": ["That is okay — take your time; another read will make it clearer.", "Nice! You have caught the main points of this chapter.", "Excellent! You are diligent, and the Word is taking root in you."], "q": ["As a single person, what does this passage say to me?", "I feel lonely — what does this passage give me?", "Who am I in Christ, and what am I worth?", "How do I trust God while I wait?", "What wisdom does the Bible give about relationships?", "How can my time and energy as a single person be used for God?", "How do I build good relationships in church and with friends?", "Please write me a short prayer for a single person."], "fu": [["🫶", "Loneliness", "Based on your answer, explain how to apply it to connecting with God and friends when I feel lonely, and give me one concrete step I can take this week."], ["💝", "Identity", "Based on your answer, explain how to apply it to my identity and worth in Christ, and give me one concrete step I can take this week."], ["⏳", "Waiting", "Based on your answer, explain how to apply it to trusting God while I wait, and give me one concrete step I can take this week."], ["💞", "Relationships", "Based on your answer, explain how to apply it to wisdom in dating and friendship, and give me one concrete step I can take this week."], ["🎯", "Purpose", "Based on your answer, explain how to apply it to using my time and gifts for God's purposes, and give me one concrete step I can take this week."], ["🙏", "Prayer", "Please turn the key point of your answer into a short, sincere prayer I can pray."]]}, "parent": {"sys": " Audience: a parent raising children (from babies to adult children). Stand in the parent's shoes: they are often tired, worried about their children, and often feel guilty. Be warm, down-to-earth and non-judging; acknowledge that every child and every family is different. Speak of presence and example, balancing discipline and grace, parent–child communication (how to listen, how to speak), praying for children, husband and wife standing together, and facing one's own weakness and failure; use everyday scenes as pictures (mealtime, homework, phones, bedtime). End with one concrete step for this week (one sentence, a hug, a bedtime prayer). If a child is being harmed, there is domestic violence, or the child has thoughts of self-harm, answer gently and encourage seeking professional help and a trusted person right away.", "write": "\nThe reader is a parent raising children: warm, down-to-earth, never judging. No emoji.", "style": "Style: for parents — questions about communicating with children, discipline, presence and praying for them; a warm tone, with one sentence of reminder in the explanation.", "res": ["That is okay — take it slowly; read it again when you can.", "Nice! You have caught the main points of this chapter.", "Wonderful! The Word is taking root in your home."], "q": ["What does this passage remind me of as a parent?", "My child will not listen and has big emotions — how should I respond?", "How do I balance discipline and grace?", "How do I talk well with a teenager?", "I often lose my temper with my child and feel guilty afterwards — what now?", "How do I lead my child to know God, not just go to church?", "My spouse and I disagree on parenting — what does this passage say?", "Please write me a short prayer of blessing for my child."], "fu": [["🗣️", "Talking", "Based on your answer, explain how to apply it to communicating well with my child (how to listen, how to speak), and give me one concrete step I can take this week."], ["⚖️", "Discipline", "Based on your answer, explain how to apply it to balancing discipline and grace, and give me one concrete step I can take this week."], ["😔", "Guilt", "Based on your answer, explain how to apply it to the guilt of losing my temper or feeling I owe my child more, and give me one concrete step I can take this week."], ["💑", "Spouse", "Based on your answer, explain how to apply it to husband and wife being united in parenting, and give me one concrete step I can take this week."], ["📖", "Faith", "Based on your answer, explain how to apply it to leading my child to know God and drawing near to him together, and give me one concrete step I can take this week."], ["🙏", "Prayer", "Please turn the key point of your answer into a short prayer of blessing I can pray over my child."]]}, "couple": {"sys": " Audience: a married couple (husband and wife — newlyweds, parents in the thick of life, or long-time partners). Stand beside them as a fellow traveler: warm, sincere, never judging and never taking one side; admit every marriage has seasons of friction, weariness and hurt. Speak of love as a decision and a gift, forgiving one another, listening and speaking well, respect and unity, money and household work, in-laws and raising children, praying and reading Scripture together, becoming one in the Lord. Use everyday pictures (the dinner table, holding hands, after an argument, bedtime). Close with one small step the two of them can do together this week (a word of thanks, a short prayer together, a phone-free walk). Never lay one-sided demands on the wife to submit or the husband to rule; stress mutual love and mutual submission. If domestic violence, an affair, threats or thoughts of self-harm come up, respond gently, put safety first, and encourage reaching out at once to professionals and trusted people — never urge someone just to endure.", "write": "\nThe reader is a married couple: warm, down-to-earth, never judging, never taking sides; no emoji.", "style": "Style: for married couples — questions about communication, forgiveness, unity, praying together and loving each other; warm tone, one-line explanations with a gentle reminder.", "res": ["That's okay — take your time and read it together again some evening.", "Nice! You caught the main point of this chapter.", "Wonderful! God's Word is taking root in your marriage."], "q": ["What does this passage say to us as a couple?", "After an argument we go cold — how can one of us reach out first?", "How can I say what's in my heart so my spouse can hear it?", "My spouse hurt me — do I really have to forgive?", "We disagree about money and chores — what do we do?", "How can we pray and draw near to God together?", "We've drifted apart in our busy days — how do we reconnect?", "Please write a short prayer of blessing over our marriage."], "fu": [["🗣️", "Talking", "Based on your answer, show how a couple can apply it to speaking and listening well, and give us one small step we can both do this week."], ["🤝", "Forgiving", "Based on your answer, show how a couple can apply it to owning mistakes and forgiving, and give us one small step we can both do this week."], ["💞", "Closeness", "Based on your answer, show how a couple can apply it to reconnecting and expressing love and thanks, and give us one small step we can both do this week."], ["👨‍👩‍👧", "Unity", "Based on your answer, show how a couple can apply it to being united on money, chores and parenting, and give us one small step we can both do this week."], ["📖", "Together", "Based on your answer, show how a couple can read Scripture and draw near to God together, and give us one small step we can both do this week."], ["🙏", "Prayer", "Turn the main points of your answer into a short prayer a couple can pray together."]]}, "pastor": {"sys": " Audience: a pastor or ministry worker (pastor, preacher, small-group leader, church staff or volunteer). Stand beside them as a fellow worker: they carry many people's burdens and can themselves be weary, lonely, misunderstood or discouraged. Be respectful, equal and sincere — never lecturing or talking down. You may go deeper: the context of the passage, the sense of key words, shepherding and building lives, sermon and lesson preparation, leading groups and discipleship, team unity and conflict, criticism and loneliness, spiritual warfare, one's own walk and family, and resting in God without burning out. You may offer a sermon or Bible-study outline with points and applications, but remind them to receive the word from God themselves first. Close with one small step for this week (a quiet hour with God, a caring phone call, an honest talk with a coworker). If extreme exhaustion, depression, wanting to quit or self-harm come up, respond gently and encourage reaching out at once to trusted coworkers, spiritual elders and professionals.", "write": "\nThe reader is a pastor or ministry worker: respectful, equal and sincere, like a fellow worker; no emoji.", "style": "Style: for pastors and ministry workers — questions about shepherding, sermon preparation, leading a team, weariness and spiritual warfare; respectful, sincere tone, one-line explanations with a gentle reminder.", "res": ["That's okay — take your time and read it again when you can.", "Nice! You caught the main point of this chapter.", "Wonderful! God's Word feeds the shepherd first, then flows to the flock."], "q": ["What does this passage say to me in ministry?", "Help me find a sermon outline and entry point for this passage.", "I'm exhausted and close to burning out — how does this comfort me?", "How do I face criticism and misunderstanding in church?", "How does this passage speak to leading a team in unity?", "How can I guard my own walk with God amid a busy ministry?", "How do I shepherd the weak, the hurting and those who left?", "Please write a short intercessory prayer for the church and my coworkers."], "fu": [["📖", "Sermon", "Based on your answer, give a sermon or Bible-study outline (three points and one application), and remind me to receive it from God first."], ["🐑", "Shepherd", "Based on your answer, show how to apply it to shepherding the flock and caring for individuals, and give me one small step for this week."], ["🤝", "Team", "Based on your answer, show how to apply it to leading a team, unity among coworkers and handling conflict, and give me one small step for this week."], ["🕊️", "Rest", "Based on your answer, show how to apply it to my own weariness and guarding my walk with God, and give me one small step for this week."], ["⚔️", "Warfare", "Based on your answer, show how to apply it to criticism, loneliness and spiritual warfare, and give me one small step for this week."], ["🙏", "Intercede", "Turn the main points of your answer into a short prayer I can pray for the church and my coworkers."]]}}};

        if (d && d.content && d.content.length) out = d.content.map(b => b.text || '').join('');

        <p class="xs muted" style="margin-top:8px">${esc(T(`Get it right now for ${pts} points (fewer clues, more points)`, `Worth ${pts} point${pts > 1 ? 's' : ''} now — fewer hints, more points`))}</p>`;
    } else {
      html += `<div class="pl-ans">${esc(it.a)}</div>
        <div class="pl-expl">${it.e ? esc(it.e) : ''}${refOf(it) ? `${it.e ? '<br>' : ''}<span class="muted">📖 ${esc(refOf(it))}</span>` : ''}</div>`;

        html += `<p class="sm muted" style="text-align:center;margin:0 0 6px">${esc(T('Did you guess it in your head?', 'Did you have it in mind?'))}</p>

          <button class="btn" id="plNo">😅 ${esc(T('Not quite', 'Not quite'))}</button></div>`;
      } else {
        html += `<button class="btn pri" style="width:100%" id="plNext">${esc(PL.i + 1 >= n ? T('See my score', 'See my score') : T('Next question', 'Next'))}</button>`;
      }
    }
    body.innerHTML = html;
    const inp = q1('#plIn', body);
    const award = auto => { PL.auto = auto; PL.judged = true; PL.right++; PL.score += Math.max(1, 4 - PL.hints); PL.revealed = true; afterAnswer(true, it); };
    if (inp) {
      const guess = () => {
        const gs = inp.value.trim(); if (!gs) return;
        if (match(gs, it)) { award(true); plPaint(); return; }
        inp.classList.remove('pl-shake'); void inp.offsetWidth; inp.classList.add('pl-shake');
        if (canMore) { PL.hints++; say(T('Not quite — here’s another clue', 'Not quite — here’s another hint')); plPaint(); }
        else say(T('Not quite — think again!', 'Not quite — think again!'));
      };
      q1('#plGo', body).onclick = guess;

    const mo = q1('#plMore', body); if (mo) mo.onclick = () => { PL.hints++; plPaint(); };
    const sh = q1('#plShow', body); if (sh) sh.onclick = () => { PL.revealed = true; plPaint(); };
    const ye = q1('#plYes', body); if (ye) ye.onclick = () => { award(false); plPaint(); };
    const no = q1('#plNo', body); if (no) no.onclick = () => { PL.judged = true; afterAnswer(false, it); plPaint(); };
    const nx = q1('#plNext', body);
    if (nx) nx.onclick = () => { PL.i++; PL.hints = 1; PL.revealed = false; PL.auto = false; PL.judged = false; if (PL.i >= n) plFinish(); plPaint(); top(); };

  /* ── iOS 分段 MP4 重新封裝（mx_*，照抄互動聖經，勿改）── */
function mx_u32(b,p){return b[p]*16777216+b[p+1]*65536+b[p+2]*256+b[p+3];}
function mx_i32(b,p){const v=mx_u32(b,p);return v>=2147483648?v-4294967296:v;}
function mx_u64(b,p){return mx_u32(b,p)*4294967296+mx_u32(b,p+4);}
function mx_typ(b,p){return String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);}

function mx_boxes(b,start,end){
  const out=[];let p=start;
  while(p+8<=end){
    let size=mx_u32(b,p),hs=8;
    if(size===1){size=mx_u64(b,p+8);hs=16;}
    else if(size===0)size=end-p;
    if(size<8||p+size>end)break;
    out.push({type:mx_typ(b,p+4),start:p,size:size,hs:hs,body:p+hs,end:p+size});
    p+=size;
  }
  return out;
}
function mx_find(list,t){return list.filter(x=>x.type===t);}
function mx_one(list,t){const r=mx_find(list,t);return r.length?r[0]:null;}
function mx_children(b,mx_box){return mx_boxes(b,mx_box.body,mx_box.end);}

function mx_parseTrun(b,tr,tfhd,baseOffset){
  const flags=mx_u32(b,tr.body)&0xffffff;
  const cnt=mx_u32(b,tr.body+4);
  let p=tr.body+8;
  let dataOff=0;
  if(flags&0x1){dataOff=mx_i32(b,p);p+=4;}
  let firstFlags=null;
  if(flags&0x4){firstFlags=mx_u32(b,p);p+=4;}
  const samples=[];
  let off=baseOffset+dataOff;
  for(let i=0;i<cnt;i++){
    let dur=tfhd.defDur, size=tfhd.defSize, fl=tfhd.defFlags, cto=0;
    if(flags&0x100){dur=mx_u32(b,p);p+=4;}
    if(flags&0x200){size=mx_u32(b,p);p+=4;}
    if(flags&0x400){fl=mx_u32(b,p);p+=4;}
    if(flags&0x800){cto=mx_i32(b,p);p+=4;}
    if(i===0&&firstFlags!==null)fl=firstFlags;
    samples.push({off:off,size:size,dur:dur,cto:cto,sync:!(fl&0x10000)});
    off+=size;
  }
  return {samples:samples,dataOff:dataOff};
}

function mx_parseTfhd(b,mx_box){
  const flags=mx_u32(b,mx_box.body)&0xffffff;
  const trackId=mx_u32(b,mx_box.body+4);
  let p=mx_box.body+8;
  let base=null;
  if(flags&0x1){base=mx_u64(b,p);p+=8;}
  if(flags&0x2){p+=4;}
  let defDur=0,defSize=0,defFlags=0;
  if(flags&0x8){defDur=mx_u32(b,p);p+=4;}
  if(flags&0x10){defSize=mx_u32(b,p);p+=4;}
  if(flags&0x20){defFlags=mx_u32(b,p);p+=4;}
  return {trackId:trackId,base:base,defDur:defDur,defSize:defSize,defFlags:defFlags,
          defaultBaseIsMoof:!!(flags&0x020000),hasBase:!!(flags&0x1)};
}

/* ---- 產生 mx_box ---- */
function mx_box(type,...parts){
  let len=8;parts.forEach(p=>len+=p.length);
  const head=new Uint8Array(8);
  head[0]=(len>>>24)&255;head[1]=(len>>>16)&255;head[2]=(len>>>8)&255;head[3]=len&255;
  for(let i=0;i<4;i++)head[4+i]=type.charCodeAt(i);
  const out=new Uint8Array(len);out.set(head,0);
  let p=8;parts.forEach(x=>{out.set(x,p);p+=x.length;});
  return out;
}
function mx_b32(v){return new Uint8Array([(v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255]);}
function mx_b64(v){const hi=Math.floor(v/4294967296),lo=v>>>0;
  return new Uint8Array([(hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,
                         (lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255]);}
function mx_cat(arr){let n=0;arr.forEach(a=>n+=a.length);const o=new Uint8Array(n);let p=0;
  arr.forEach(a=>{o.set(a,p);p+=a.length;});return o;}

function mx_remux(bytes){
  const b=bytes;
  const top=mx_boxes(b,0,b.length);
  const ftyp=mx_one(top,"ftyp");
  const moov=mx_one(top,"moov");
  if(!moov)throw new Error("no moov");
  const moofs=mx_find(top,"moof");
  if(!moofs.length)return null;              /* 不是分段 MP4，不用處理 */

  const mvBoxes=mx_children(b,moov);
  const mvhd=mx_one(mvBoxes,"mvhd");
  const mvTimescale=mx_u32(b,mvhd.body+(b[mvhd.body]===1?20:12));
  const traks=mx_find(mvBoxes,"trak");

  /* 收集每個 track 的所有 sample */
  const tracks={};
  traks.forEach(tk=>{
    const tkhd=mx_one(mx_children(b,tk),"tkhd");
    const v=b[tkhd.body];
    const id=mx_u32(b,tkhd.body+(v===1?20:12));
    tracks[id]={trak:tk,samples:[]};
  });

  moofs.forEach(mf=>{
    const trafs=mx_find(mx_children(b,mf),"traf");
    trafs.forEach(tf=>{
      const tfc=mx_children(b,tf);
      const tfhdBox=mx_one(tfc,"tfhd");
      if(!tfhdBox)return;
      const tfhd=mx_parseTfhd(b,tfhdBox);
      const t=tracks[tfhd.trackId];
      if(!t)return;
      /* 基準位移：預設是 moof 起點（default-base-is-moof） */
      const base=tfhd.hasBase?tfhd.base:mf.start;
      let running=null;
      mx_find(tfc,"trun").forEach(tr=>{
        const flags=mx_u32(b,tr.body)&0xffffff;
        const hasOff=!!(flags&0x1);
        const r=mx_parseTrun(b,tr,tfhd,hasOff?base:(running===null?base:running));
        r.samples.forEach(s=>t.samples.push(s));
        if(r.samples.length){
          const last=r.samples[r.samples.length-1];
          running=last.off+last.size;
        }
      });
    });
  });

  /* 依序把 sample 資料集中成一個 mdat */
  const order=[];
  Object.keys(tracks).forEach(id=>{
    tracks[id].samples.forEach((s,i)=>order.push({id:+id,i:i,off:s.off,size:s.size}));
  });
  order.sort((a,b2)=>a.off-b2.off);
  let mdatSize=0;order.forEach(o=>mdatSize+=o.size);

  const newOff={};
  let cur=0;
  order.forEach(o=>{
    if(!newOff[o.id])newOff[o.id]=[];
    newOff[o.id][o.i]=cur;cur+=o.size;
  });

  /* ---- 為每個 track 重建 stbl ---- */
  function buildStbl(id,stblOld,mediaTimescale){
    const ss=tracks[id].samples;
    const offs=newOff[id]||[];
    const old=mx_children(b,stblOld);
    const keep=[];
    ["stsd"].forEach(t=>{const x=mx_one(old,t);if(x)keep.push(b.slice(x.start,x.end));});

    /* stts */
    const stts=[];
    let runDur=-1,runCnt=0;
    ss.forEach(s=>{
      if(s.dur===runDur){runCnt++;}
      else{if(runCnt)stts.push([runCnt,runDur]);runDur=s.dur;runCnt=1;}
    });
    if(runCnt)stts.push([runCnt,runDur]);
    const sttsBody=[mx_b32(0),mx_b32(stts.length)];
    stts.forEach(e=>{sttsBody.push(mx_b32(e[0]));sttsBody.push(mx_b32(e[1]));});
    keep.push(mx_box("stts",mx_cat(sttsBody)));

    /* ctts（若有 composition offset） */
    if(ss.some(s=>s.cto!==0)){
      const ctts=[];let rv=null,rc=0;
      ss.forEach(s=>{if(s.cto===rv){rc++;}else{if(rc)ctts.push([rc,rv]);rv=s.cto;rc=1;}});
      if(rc)ctts.push([rc,rv]);
      const body=[new Uint8Array([1,0,0,0]),mx_b32(ctts.length)];
      ctts.forEach(e=>{body.push(mx_b32(e[0]));body.push(mx_b32(e[1]>>>0));});
      keep.push(mx_box("ctts",mx_cat(body)));
    }

    /* stss（關鍵影格）*/
    const syncs=[];
    ss.forEach((s,i)=>{if(s.sync)syncs.push(i+1);});
    if(syncs.length&&syncs.length!==ss.length){
      const body=[mx_b32(0),mx_b32(syncs.length)];
      syncs.forEach(v=>body.push(mx_b32(v)));
      keep.push(mx_box("stss",mx_cat(body)));
    }

    /* stsc：每個 sample 自成一個 chunk，最單純也最不會出錯 */
    keep.push(mx_box("stsc",mx_cat([mx_b32(0),mx_b32(1),mx_b32(1),mx_b32(1),mx_b32(1)])));

    /* stsz */
    const szBody=[mx_b32(0),mx_b32(0),mx_b32(ss.length)];
    ss.forEach(s=>szBody.push(mx_b32(s.size)));
    keep.push(mx_box("stsz",mx_cat(szBody)));

    /* co64：用 64 位元，長度固定，才好兩段式計算位移 */
    const coBody=[mx_b32(0),mx_b32(ss.length)];
    ss.forEach((s,i)=>coBody.push(mx_b64(offs[i]||0)));
    keep.push({__co:true,data:mx_cat(coBody),count:ss.length});

    return keep;
  }

  /* 兩段式：先算出 moov 長度，再填入真正的 chunk 位移 */
  function assemble(mdatStart){
    const newTraks=[];
    traks.forEach(tk=>{
      const tkc=mx_children(b,tk);
      const tkhd=mx_one(tkc,"tkhd");
      const v=b[tkhd.body];
      const id=mx_u32(b,tkhd.body+(v===1?20:12));
      const mdia=mx_one(tkc,"mdia");
      const mdc=mx_children(b,mdia);

var UI321 = (function () {
  'use strict';

  var DEF = {
    toastEl: 'toast',
    toastMs: 1700,
    sheetEl: 'sheet',
    sheetBody: 'sbody',
    tabsSel: 'nav.tabs button',
    tabAttr: 'data-t',
    viewEl: 'view',
    splashEl: 'splash',
    splashMs: 1100,
    bootEl: 'boot',
    bootMs: 8000,
    onTab: null,          // fn(key)
    onSheetClose: null,
    manifest: null,       // { name, short_name, description, theme_color, … }

    /* 自動更新 */
    updText: 'A new version is available · Tap to update',
    updGoing: 'Updating, please wait…',
    updAuto: false,       // true＝不問直接換（只適合純閱讀、沒有未存內容的 App）
    updEvery: 1800000,    // 每半小時主動問一次有沒有新版；0＝不主動問
    updChecking: 'Checking for a new version…',
    updNone: 'You already have the latest version',

   * 而不是讓第一則的計時器把第二則也一起收走。
   * ------------------------------------------------------------------ */

    var el = $(C.toastEl);
    if (!el) return;
    el.textContent = String(msg == null ? '' : msg);
    el.className = (el.className.replace(/\bon\b/g, '') + ' on').replace(/\s+/g, ' ');
    clearTimeout(tT);
    tT = setTimeout(function () {
      el.className = el.className.replace(/\bon\b/g, '').replace(/\s+/g, ' ');
    }, ms || C.toastMs);

  /* ── 底部面板 ──────────────────────────────────────────────────── */

  function sheet(html) {
    var box = $(C.sheetEl), body = $(C.sheetBody);
    if (!box || !body) return;
    body.innerHTML = html;
    box.className = (box.className.replace(/\bon\b/g, '') + ' on').replace(/\s+/g, ' ');
  }

  function closeSheet() {
    var box = $(C.sheetEl);
    if (!box) return;
    box.className = box.className.replace(/\bon\b/g, '').replace(/\s+/g, ' ');

    var box = $(C.sheetEl);

  function bindSheet() {
    var box = $(C.sheetEl);
    if (!box) return;
    box.addEventListener('click', function (e) {
      if (e.target === box) closeSheet();

   * 用事件委派，不是逐顆綁——重繪之後按鈕會換新的，逐顆綁就失效了。

    document.addEventListener('click', function (e) {

    b.addEventListener('keydown', function (e) {

  }

/* ============================================================================
 * 321 App Core — 狀態與設定  state.js  v1.0.0
 * ----------------------------------------------------------------------------
 * 一支 App 的全部狀態：讀到哪、畫了哪些線、字級、主題、語言、語音偏好。
 * 收在一個 localStorage 鍵裡，載入時**疊在預設值上**。
 *
 * 抽出來的理由，是這一組壞掉的方式最不像 bug：
 *
 *     load(){ const o = JSON.parse(localStorage.getItem(KEY));
 *             if (o && o.v === 1) return o;          // ← 直接把存檔還回去
 *             return { …預設值… }; }
 *
 * 舊使用者拿回來的是**當年存下去的那個物件**。今天加的每一個新欄位，
 * 對他們永遠是 undefined——新功能一上線，老讀者就是打不開，而且不會報錯。
 * 各 App 的補法是在程式各處散落 `S.set.x = S.set.x || 預設`，
 * 加一個欄位就要記得補一行，漏了沒有人會發現。
 *
 * 這裡改成一件事做對：**merge over defaults**。
 * 預設值是唯一的清單，存檔只是覆蓋在上面。加欄位只要加在預設值裡。
 *
 * 另外收進來的
 *   · 字級      階數不寫死（% 陣列長度），加一階不必改程式
 *   · 主題      淺／深，跟著 data-dark 走（321 這一家的慣例）
 *   · 語言      繁／簡／英，同時管 <html lang> 與按鈕字樣
 *   · 版本升級  舊版存檔交給 migrate() 處理，不是整包丟掉
 *   · 存不進去  無痕模式、配額滿了都不可以讓 App 掛掉
 *
 * 語法：ES5，無相依。
 * ==========================================================================*/

var ST321 = (function () {
  'use strict';

  var DEF = {
    key: 'r321.v1',
    defaults: {},         // ★ 唯一的欄位清單。加欄位就加在這裡
    version: 1,           // 存檔格式版本；與存檔不同時走 migrate
    migrate: null,        // fn(old, fromVersion) -> 新的狀態物件（回傳假值＝放棄舊檔）
    fontVar: '--fs',
    fontSizes: [15, 17, 19, 22, 25],
    fontPath: 'set.fs',
    themeAttr: 'data-dark',
    themePath: 'set.dark',
    langAttr: 'lang',
    langPath: 'set.sc',   // 這一家的慣例：0 繁 1 簡
    langMap: { 0: 'zh-Hant', 1: 'zh-Hans' },
    onChange: null,       // fn(what)  'font'|'theme'|'lang'|'save'
    onError: null,        // fn(kind, err)  'load'|'save'

    /* 備份 */

function blank(t, seed){
  const ch = [...t], idx = [];
  ch.forEach((c, i) => { if (/[\u4e00-\u9fa5]/.test(c)) idx.push(i); });
  let r = seed; const rnd = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
  const n = Math.max(1, Math.round(idx.length * 0.3)), pick = new Set();
  let guard = 0;
  while (pick.size < n && guard++ < 999) pick.add(idx[Math.floor(rnd() * idx.length)]);
  return ch.map((c, i) => pick.has(i) ? '<i>○</i>' : esc(c)).join('');
}
