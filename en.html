/* ═══════ ② highlights and reflections（321-app-core） ═══════ */
/* Sentence splitting, highlighting, seven colours, notes, no-jump redraw and export
   all live in the shared core. Only two things stay here: how a key maps back to its
   source text, and how the "my highlights" page is laid out.

   Key format (this app's own):
     v|8:1          one verse
     v|8:1|2        the 3rd sentence of that verse (when a verse holds several)
     x|8:1|exp|3    the 4th sentence of a block of exegesis
     c|8:0|card|2   the 3rd card of chapter 8
     l|8|41|t|2     lesson 8, block 41, sentence 2
                    (part: t body / q deeper question / a deeper answer) */
/* ============================================================================
 * 321 App Core — 畫線與筆記  marks.js  v1.0.0
 * ----------------------------------------------------------------------------
 * 讀到一句話，點一下畫線，再點一下寫下領受。整組收成一份，掛到任何 321 App 上。
 *
 * 抽出來的理由跟朗讀一樣實際：這一組在各 App 裡各自做過一次，而且**改進沒有回流**。
 * 啟示錄那一版停在最早的樣子——沒有顏色、刪不掉領受、刪完畫面會跳；
 * 創世記那一版四樣都補上了，但補在自己身上，別人拿不到。
 *
 * 包含的功能
 *   · 切句        依句號切句，HTML 標籤不會被切斷，句末引號跟著前一句走
 *   · 畫線        點一下就畫；七種顏色，選過的顏色記成下一次的預設
 *   · 領受        寫下、修改、單獨刪除（畫線留著）
 *   · 不跳位      改顏色、寫領受、刪除之後，畫面停在原地
 *   · 匯出        全部畫線與領受匯成 Markdown
 *
 * 語法：ES5，無相依。與 tts.js 互不相欠：兩個都掛的時候，
 * 重繪之後由宿主自己呼叫 TTS321.rebind()（見 tts.js 的坑 1）。
 *
 * 掛法：見 README.md 的「畫線與筆記」。核心不認識任何一個 App 的資料結構，
 * 「由 key 反查原文」這件事由宿主的 textFor 提供。
 * ==========================================================================*/

var MK321 = (function () {
  'use strict';

  var DEF = {
    colors: [
      { k: 'green', label: 'Emerald' }, { k: 'blue', label: 'Azure' },
      { k: 'pink', label: 'Pink' }, { k: 'purple', label: 'Violet' },
      { k: 'maroon', label: 'Burgundy' }, { k: 'brown', label: 'Earth brown' },
      { k: 'charcoal', label: 'Charcoal' }
    ],
    defaultLabel: 'Gold',
    enSentence: false,    // 英文版：句點後要接空白才算一句
    noteMax: 300,         // 面板上顯示原句的字數上限
    labels: {
      title: '✍️ This sentence', colorRow: 'Highlight colour',
      placeholder: 'What is the Holy Spirit saying to you through this sentence?',
      save: 'Save', ask: '✨ Ask Xiaozhi', del: '🗑 Delete', card: '🖼 Make a picture',
      dropNote: '🗑 Delete reflection', delMark: '🗑 Remove highlight',
      note: 'Reflection',
      tapped: 'Highlighted · tap again to change the colour or write a reflection',
      saved: 'Reflection saved', noteDropped: 'Reflection deleted', marked: 'Highlight removed',
      exportTitle: 'My highlights and reflections', exportFile: 'my-highlights-and-reflections.md',
      exported: 'Exported'
    },
    store: null,          // { get: fn -> S.mk, save: fn, pref: {get, set} }
    render: null,         // fn()  重畫畫面
    sheet: null,          // fn(html)  開底部面板
    closeSheet: null,     // fn()
    toast: null,          // fn(msg)
    textFor: null,        // fn(key) -> 原文（App 專屬，必給）
    ask: null,            // fn(text, note)  選用；沒給就不顯示「問小智」
    card: null,           // fn(text, note, key)  選用；沒給就不顯示「做一張圖」
    onChange: null        // fn(key, what)  選用；'add'|'note'|'color'|'drop'|'del'
  };

  var C = null;

  /* ── 小工具 ────────────────────────────────────────────────────────── */

  function ext(a, b) { for (var k in b) if (b.hasOwnProperty(k)) a[k] = b[k]; return a; }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  /* 要塞進 onclick="…('…')" 裡的字：引號與換行都得處理掉 */
  function escA(s) {
    return String(s == null ? '' : s).replace(/'/g, '&#39;').replace(/"/g, '&quot;')
      .replace(/\n/g, ' ').slice(0, 200);
  }
  function unesc(s) {
    return String(s == null ? '' : s).replace(/&quot;/g, '"').replace(/&#39;/g, "'")
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
  }
  function strip(html) {
    return String(html == null ? '' : html).replace(/<[^>]+>/g, '');
  }
  function toast(m) { if (C && C.toast) C.toast(m); }
  function L(k) { return (C && C.labels && C.labels[k]) || DEF.labels[k] || ''; }

  function MK() { return (C && C.store && C.store.get && C.store.get()) || {}; }
  function save() { if (C && C.store && C.store.save) C.store.save(); }
  function render() { if (C && C.render) C.render(); }
  function prefColor() {
    try { return (C.store.pref && C.store.pref.get && C.store.pref.get()) || ''; }
    catch (e) { return ''; }
  }
  function setPrefColor(c) {
    try { if (C.store.pref && C.store.pref.set) C.store.pref.set(c); } catch (e) {}
  }

  /* ── 查詢 ─────────────────────────────────────────────────────────── */

  function has(k) { return Object.prototype.hasOwnProperty.call(MK(), k); }
  function note(k) { var m = MK()[k]; return (m && m.n) || ''; }
  function color(k) { var m = MK()[k]; return (m && m.c) || ''; }
  function keys() { var o = MK(), a = [], k; for (k in o) if (o.hasOwnProperty(k)) a.push(k); return a; }
  function text(k) {
    if (!C.textFor) return '';
    try { return C.textFor(k) || ''; } catch (e) { return ''; }
  }
  function count() {
    var ks = keys(), n = 0, i;
    for (i = 0; i < ks.length; i++) if (note(ks[i])) n++;
    return { marks: ks.length, notes: n };
  }

  /* ── 切句 ──────────────────────────────────────────────────────────
   * 一句的定義：到句號為止，但
   *   · HTML 標籤裡面不切（`<span title="第一。">` 不能斷在中間）
   *   · 句末的收尾引號跟著前一句走（「……。」而不是「……。 + 」」）
   *   · 英文要句點後接空白才算（Gen. 1:1 的那個點不是句尾）
   * ------------------------------------------------------------------ */

  function splitHTML(html) {
    html = String(html == null ? '' : html);
    var out = [], cur = '', depth = 0, inTag = false, tag = '', i, ch;
    for (i = 0; i < html.length; i++) {
      ch = html.charAt(i);
      if (!inTag && ch === '<') { inTag = true; tag = '<'; cur += ch; continue; }
      if (inTag) {
        cur += ch; tag += ch;
        if (ch === '>') {
          inTag = false;
          if (/^<\//.test(tag)) depth--;
          else if (!/\/>$/.test(tag) && !/^<(br|img|hr|input|wbr)\b/i.test(tag)) depth++;
        }
        continue;
      }
      cur += ch;
      if (depth !== 0) continue;                        // 標籤內不切
      var brk = '。！？'.indexOf(ch) >= 0;
      if (!brk && C.enSentence && '.!?'.indexOf(ch) >= 0) {
        var nx = html.charAt(i + 1);
        brk = (nx === '' || nx === ' ' || nx === '\n') && !/\b[A-Z]$/.test(cur.slice(-2, -1));
      }
      if (!brk) continue;
      while (i + 1 < html.length && '」』）”"\''.indexOf(html.charAt(i + 1)) >= 0) { i++; cur += html.charAt(i); }
      while (i + 1 < html.length && html.charAt(i + 1) === ' ') { i++; cur += html.charAt(i); }
      out.push(cur); cur = '';
    }
    if (cur.replace(/<[^>]*>|\s|&nbsp;/g, '').length) out.push(cur);
    else if (cur && out.length) out[out.length - 1] += cur;
    return out.length ? out : [html];
  }

  /* 一整段 HTML（若干 <p>）裡的所有句子，順序與畫面完全一致 */
  function sentsOf(html) {
    var out = [];
    String(html == null ? '' : html).replace(/<p>([\s\S]*?)<\/p>/g, function (m, inner) {
      var a = splitHTML(inner), i;
      for (i = 0; i < a.length; i++) out.push(a[i]);
      return m;
    });
    return out;
  }

  /* ── 包成可點的一句 ────────────────────────────────────────────────── */

  /* 領受區塊。畫面上有兩種擺法：
     跟在句子後面（講義、解經），或整段句子之後一起列（經文那種一節好幾句）。
     所以拆成兩個函式，宿主想擺哪裡就擺哪裡。 */
  function noteHTML(k, opt) {
    opt = opt || {};
    var n = has(k) ? note(k) : '';
    if (!n) return '';
    var c = color(k);
    var el = opt.noteEl || 'span';
    return '<' + el + ' class="mknote"' + (c ? ' data-c="' + c + '"' : '') +
      (opt.noteStyle ? ' style="' + opt.noteStyle + '"' : '') + '>' +
      '<b>' + esc(L('note')) + '</b>　' + esc(n) +
      (C.ask ? '<button class="mkask" onclick="event.stopPropagation();MK321.askOn(\'' +
        escA(k) + '\')">' + esc(L('ask')) + '</button>' : '') +
      '<button class="mkask del" onclick="event.stopPropagation();MK321.drop(\'' +
      escA(k) + '\')">' + esc(L('del')) + '</button></' + el + '>';
  }

  /* 一句話包成「可點、可上色、可寫領受」的一句。
     opt: { el:'span'|'p', cls:'mks'|'mkp', style, note:false, noteEl, noteStyle } */
  function wrap(k, html, opt) {
    opt = opt || {};
    var on = has(k), c = color(k);
    var el = opt.el || 'span';
    var cls = (opt.cls || 'mks') + (on ? ' hl' : '');
    return '<' + el + ' class="' + cls + '"' + (c ? ' data-c="' + c + '"' : '') +
      ' data-k="' + escA(k) + '"' +
      (opt.style ? ' style="' + opt.style + '"' : '') +
      ' onclick="event.stopPropagation();MK321.tap(\'' + escA(k) + '\',this)">' +
      html + '</' + el + '>' +
      (opt.note === false ? '' : noteHTML(k, opt));
  }

  /* 一段純文字 → 逐句包起來（講義那種）*/
  function sents(keyPrefix, txt) {
    var a = splitHTML(esc(txt)), out = [], i;
    for (i = 0; i < a.length; i++) out.push(wrap(keyPrefix + '|' + i, a[i]));
    return out.join('');
  }

  /* 一段 HTML（若干 <p>）→ 每一句都可點（解經那種）*/
  function tagParas(html, keyPrefix) {
    if (!html) return '';
    var i = -1;
    return String(html).replace(/<p>([\s\S]*?)<\/p>/g, function (m, inner) {
      var a = splitHTML(inner), body = '', j;
      for (j = 0; j < a.length; j++) { i++; body += wrap(keyPrefix + '|' + i, a[j]); }
      return '<p class="mkw">' + body + '</p>';
    });
  }

  /* 由切好的句子反查純文字（textFor 常用得到）*/
  function sentText(html, idx) {
    var a = splitHTML(String(html == null ? '' : html));
    return unesc(strip(a[idx] || '')).replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
  }

  /* ── 畫面不跳位 ────────────────────────────────────────────────────
   * 改顏色、寫領受、刪除，都會整頁重繪。重繪之後那一句的高度變了
   * （領受區塊消失／出現），下一段就會跳上來，讀者的眼睛要重新找位置。
   * 解法：以那一句為錨，重繪後量它跑了多遠，把畫面挪回去。
   * ------------------------------------------------------------------ */

  function keepPlace(k, fn) {
    var sel = '[data-k="' + k + '"]';
    var before = document.querySelector(sel);
    var top = before ? before.getBoundingClientRect().top : null;
    var y = window.scrollY;
    fn();
    if (top === null) return;
    var after = document.querySelector(sel);
    if (!after) { window.scrollTo(0, y); return; }     // 那一句不見了（整個刪掉）
    var now = after.getBoundingClientRect().top;
    if (Math.abs(now - top) > 1) window.scrollBy(0, now - top);
  }

  /* ── 動作 ─────────────────────────────────────────────────────────── */

  function tap(k, el) {
    if (has(k)) return openSheet(k);
    var c = prefColor();
    MK()[k] = { n: '', at: (new Date()).getTime(), c: c };
    save();
    /* 有元素就地加 class，不必整頁重繪——畫線是最常做的動作，要快 */
    if (el && el.classList) {
      el.classList.add('hl');
      if (c) el.setAttribute('data-c', c);
    } else render();
    toast(L('tapped'));
    if (C.onChange) C.onChange(k, 'add');
  }

  function colorRow(k) {
    var cur = color(k), h = '', i;
    h += '<button class="hlsw' + (cur ? '' : ' on') + '" style="background:var(--mk-gold)"' +
      ' title="' + esc(C.defaultLabel) + '"' +
      ' onclick="MK321.setColor(\'' + escA(k) + '\',\'\')"></button>';
    for (i = 0; i < C.colors.length; i++) {
      var c = C.colors[i];
      h += '<button class="hlsw' + (cur === c.k ? ' on' : '') + '"' +
        ' style="background:var(--mk-' + c.k + ')" title="' + esc(c.label) + '"' +
        ' onclick="MK321.setColor(\'' + escA(k) + '\',\'' + c.k + '\')"></button>';
    }
    return '<div class="hlrow"><span class="lb">' + esc(L('colorRow')) + '</span>' + h + '</div>';
  }

  function openSheet(k) {
    if (!C.sheet) return;
    var cur = note(k), src = text(k);
    var h = '<h4>' + esc(L('title')) + '</h4>' +
      '<div class="mkq" id="mkq">' + esc(src).slice(0, C.noteMax) + '</div>' +
      colorRow(k) +
      '<textarea class="note" id="mkin" placeholder="' + esc(L('placeholder')) + '">' +
      esc(cur) + '</textarea>' +
      '<div class="row" style="margin-top:10px">' +
      '<button class="btn pri" onclick="MK321.save(\'' + escA(k) + '\')">' + esc(L('save')) + '</button>' +
      (C.ask ? '<button class="btn" onclick="MK321.askOn(\'' + escA(k) + '\',true)">' +
        esc(L('ask')) + '</button>' : '') +
      (C.card ? '<button class="btn" onclick="MK321.cardOn(\'' + escA(k) + '\',true)">' +
        esc(L('card')) + '</button>' : '') +
      '</div><div class="row" style="margin-top:8px">' +
      (cur ? '<button class="btn danger" onclick="MK321.drop(\'' + escA(k) + '\')">' +
        esc(L('dropNote')) + '</button>' : '') +
      '<button class="btn danger" onclick="MK321.del(\'' + escA(k) + '\')">' +
      esc(L('delMark')) + '</button></div>';
    C.sheet(h);
    setTimeout(function () {
      var i = document.getElementById('mkin'); if (i) i.focus();
    }, 60);
  }

  function closeSheet() { if (C.closeSheet) C.closeSheet(); }

  /* 問小智：live=true 表示面板開著，要拿輸入框裡「還沒存」的那一版 */
  function askOn(k, live) {
    if (!C.ask) return;
    var n = note(k);
    if (live) {
      var i = document.getElementById('mkin');
      if (i) n = i.value || '';
    }
    C.ask(text(k), n ? L('note') + '：' + n : '');
  }

  /* 做一張圖：跟問小智一樣，live=true 就拿輸入框裡還沒存的那一版領受。
     讀到一句話被扎心了，第一個反應是想分享——那一刻要在手邊，
     不是要他退出去、換一頁、再找一次那一句。 */
  function cardOn(k, live) {
    if (!C.card) return;
    var n = note(k);
    if (live) {
      var i = document.getElementById('mkin');
      if (i) n = i.value || '';
    }
    C.card(text(k), n, k);
  }

  function setColor(k, c) {
    var m = MK();
    if (!has(k)) m[k] = { n: '', at: (new Date()).getTime() };
    m[k].c = c;
    setPrefColor(c);
    save();
    /* 面板上的選中圈與畫面上的那一句，兩邊就地改，不重繪 */
    var box = document.getElementById('sheet');
    if (box) {
      var sw = box.querySelectorAll('.hlsw'), i;
      for (i = 0; i < sw.length; i++) {
        var want = i === 0 ? '' : (C.colors[i - 1] || {}).k;
        if (want === c) sw[i].className = 'hlsw on'; else sw[i].className = 'hlsw';
      }
    }
    var els = document.querySelectorAll('.mks,.mkp'), j;
    for (j = 0; j < els.length; j++) {
      if (els[j].getAttribute('data-k') !== k) continue;
      els[j].classList.add('hl');
      if (c) els[j].setAttribute('data-c', c); else els[j].removeAttribute('data-c');
    }
    if (C.onChange) C.onChange(k, 'color');
  }

  function saveNote(k) {
    var i = document.getElementById('mkin');
    var v = (i && i.value) || '';
    MK()[k] = { n: v.replace(/^\s+|\s+$/g, ''), at: (new Date()).getTime(), c: color(k) };
    save(); closeSheet();
    keepPlace(k, render);
    toast(L('saved'));
    if (C.onChange) C.onChange(k, 'note');
  }

  /* 只刪領受，畫線留著 */
  function drop(k) {
    if (!has(k)) return;
    MK()[k].n = '';
    save(); closeSheet();
    keepPlace(k, render);
    toast(L('noteDropped'));
    if (C.onChange) C.onChange(k, 'drop');
  }

  /* 刪掉整條畫線 */
  function del(k) {
    var m = MK();

/* Lesson: look up the source text behind a key */
function lesRaw(n, i, part){
  const b = (((D.lesson || {})[n] || {}).blocks || [])[i];
  if (!b) return '';
  if (b[0] === 'd') return part === 'q' ? b[1][0] : b[1][1];
  return Array.isArray(b[1]) ? b[1].join('　') : b[1];
}

/* Key -> source text. Five kinds of key, five different sources; the core cannot know them. */
function gnTextFor(k){
  const p = k.split('|');
  if (p[0] === 'v'){
    const [c, v] = p[1].split(':');
    const full = (D.txt[c] || [])[+v - 1] || '';
    if (p.length < 3) return full;
    return MK321.sentText(esc(full), +p[2]);
  }
  if (p[0] === 'c'){
    const m = meta(+p[1].split(':')[0]) || {};
    const full = (m.card || [])[+p[3]] || '';
    return p.length < 5 ? full : MK321.sentText(esc(full), +p[4]);
  }
  if (p[0] === 'l') return MK321.sentText(esc(lesRaw(+p[1], +p[2], p[3])), +p[4]);
  const b = VMAP[p[1]]; if (!b) return '';
  return MK321.strip(MK321.sentsOf(b[p[2]] || '')[+p[3]] || '').replace(/\s+/g, ' ').trim();
}

 *   兩個選擇——截圖（整個 App 的介面都在裡面，很醜），或者複製貼上
 *   （變成一段沒有溫度的純文字）。兩個都留不住那一刻的感動。

      buf = '';
      var t = paras[p];
      for (i = 0; i < t.length; i++) {
        ch = t.charAt(i);
        if (!cjk(ch) && ch !== ' ') {
          /* 英文：整個單字一起量，不要把 righteousness 折成兩半 */
          var word = ch;
          while (i + 1 < t.length && !cjk(t.charAt(i + 1)) && t.charAt(i + 1) !== ' ') {
            word += t.charAt(++i);
          }
          if (buf && g.measureText(buf + word).width > maxW) { lines.push(buf); buf = ''; }
          buf += word;
          continue;
        }
        if (g.measureText(buf + ch).width > maxW && buf) {
          next = buf.charAt(buf.length - 1);
          /* 行尾不可以是開引號——它該跟著下一個字走 */
          if (NO_TAIL.indexOf(next) >= 0 && buf.length > 1) {
            buf = buf.slice(0, -1);
            lines.push(buf); buf = next + ch;
          } else if (NO_HEAD.indexOf(ch) >= 0) {
            /* 標點掉到行首了：讓它擠在上一行的行尾（中文排版的規矩）*/
            lines.push(buf + ch); buf = '';
          } else {
            lines.push(buf); buf = ch;
          }
        } else {
          buf += ch;
        }
      }
      lines.push(buf);
    }
    return lines;
  }

  /* 「裝得下的最大字級」用二分法找。
     寫死級距的話，12 個字的短句會小得可憐，180 個字的長段會被切掉。 */
  function fit(g, text, boxW, boxH, fam, lh, hi, lo) {
    hi = hi || 200; lo = lo || 12;
    var best = lo, lines = null;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      g.font = mid + 'px ' + fam;
      var ls = wrap(g, text, boxW);
      if (ls.length * mid * lh <= boxH) { best = mid; lines = ls; lo = mid + 1; }
      else hi = mid - 1;
    }
    g.font = best + 'px ' + fam;
    return { size: best, lines: lines || wrap(g, text, boxW) };
  }

  /* ── 畫 ───────────────────────────────────────────────────────────── */

  function gradient(g, W, H, t) {
    var lg = g.createLinearGradient(0, 0, W * 0.4, H);
    lg.addColorStop(0, t.bg);
    lg.addColorStop(1, t.bg2);
    g.fillStyle = lg;
    g.fillRect(0, 0, W, H);
  }

  /* 底圖要鋪滿又不變形：算出 cover 的縮放與偏移 */
  function cover(g, img, W, H) {
    var r = Math.max(W / img.width, H / img.height);
    var w = img.width * r, h = img.height * r;
    g.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  }

  function veil(g, W, H, dark) {
    var lg = g.createLinearGradient(0, 0, 0, H);
    lg.addColorStop(0, 'rgba(0,0,0,' + (dark ? .34 : .18) + ')');
    lg.addColorStop(.45, 'rgba(0,0,0,' + (dark ? .50 : .34) + ')');
    lg.addColorStop(1, 'rgba(0,0,0,' + (dark ? .74 : .62) + ')');
    g.fillStyle = lg;
    g.fillRect(0, 0, W, H);
  }

  function drawLines(g, lines, x, y, size, lh, align) {
    g.textAlign = align || 'center';
    g.textBaseline = 'alphabetic';
    for (var i = 0; i < lines.length; i++) {
      g.fillText(lines[i], x, y + i * size * lh);
    }
  }

  /* 直排：一個字一個字往下堆，行往左走。
   *
   * 橫排早就處理了「標點不可以在行首」，直排一開始漏掉——結果
   * 「神就是愛。」排成一行「神就是愛」加上另一行孤零零的「。」。
   * 那一點看起來像是誰不小心按到的，整張圖就毀了。
   * 所以先把字分好行，分行的時候就讓標點擠在上一行的行尾。 */
  function vcols(chars, per) {
    var cols = [], cur = [], i;
    for (i = 0; i < chars.length; i++) {
      if (cur.length >= per) {
        /* 下一個字是不能在行首的標點：擠在這一行末尾，多一個字沒關係 */
        if (NO_HEAD.indexOf(chars[i]) >= 0) { cur.push(chars[i]); continue; }
        cols.push(cur); cur = [];
      }
      cur.push(chars[i]);
    }
    if (cur.length) cols.push(cur);
    return cols;
  }

  function drawVertical(g, text, boxX, boxY, boxW, boxH, fam, cap) {
    var chars = String(text).replace(/\n/g, '').split('');
    var lo = 12, hi = cap || 160, best = 24, cols = null;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      var per = Math.floor(boxH / (mid * 1.22));
      if (per < 1) { hi = mid - 1; continue; }
      var cs = vcols(chars, per);
      var tallest = 0, i;
      for (i = 0; i < cs.length; i++) if (cs[i].length > tallest) tallest = cs[i].length;
      if (cs.length * mid * 1.7 <= boxW && tallest * mid * 1.22 <= boxH) {
        best = mid; cols = cs; lo = mid + 1;
      } else hi = mid - 1;
    }
    if (!cols) cols = vcols(chars, Math.max(1, Math.floor(boxH / (best * 1.22))));
    g.font = best + 'px ' + fam;
    g.textAlign = 'center';
    g.textBaseline = 'top';
    var gap = best * 1.7;
    var totalW = cols.length * gap;
    var x0 = boxX + boxW - (boxW - totalW) / 2 - gap / 2;   // 右起
    for (var c = 0; c < cols.length; c++) {
      var x = x0 - c * gap;
      /* 每一行自己置中——最後一行只有兩三個字時，吊在上面很難看 */
      var y0 = boxY + (boxH - cols[c].length * best * 1.22) / 2;
      for (var r = 0; r < cols[c].length; r++) {
        var ch2 = cols[c][r];
        /* 直排的句讀要放在字格的**右上角**，不是正中央。
           放中央的話，「愛」下面那一點會離得老遠，看起來像誰不小心
           按到的。這是直排中文的規矩，橫排沒有這個問題。 */
        if ('。，、；：'.indexOf(ch2) >= 0) {
          g.fillText(ch2, x + best * 0.26, y0 + r * best * 1.22 - best * 0.30);
        } else {
          g.fillText(ch2, x, y0 + r * best * 1.22);
        }
      }
    }
    return best;
  }

  function sign(g, W, H, t, pad, onPhoto) {
    var bits = [];
    if (C.sign) bits.push(C.sign);
    if (C.app) bits.push(C.app);
    if (!bits.length) return;
    g.font = Math.round(Math.min(W, H) * 0.022) + 'px ' + C.sans;
    g.fillStyle = onPhoto ? 'rgba(255,255,255,.72)' : t.dim;
    g.textAlign = 'center';
    g.textBaseline = 'alphabetic';
    g.fillText(bits.join('　·　'), W / 2, H - pad * 0.52);
  }

  function paint(cv, o) {
    var t = TONE[o.tone] || TONE.dawn;
    var sz = SIZE[o.size] || SIZE.p34;
    var W = sz.w, H = sz.h;
    var dpr = 1;                              // 畫布本身已經是 1080 寬，夠了
    cv.width = W * dpr; cv.height = H * dpr;
    var g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);

    /* 一切比例都跟**短邊**走，不跟寬走。
       跟寬走的話，16:9 橫式的 pad 會大到把上下擠扁，字被壓成一小條；
       9:16 限動則反過來，左右留白少得像沒留。 */
    var M = Math.min(W, H);
    var pad = Math.round(M * 0.115);
    var photo = o.layout === 'photo' && o.bg && IMG[o.bg];
    var ink = photo ? '#FFFFFF' : t.ink;
    var dim = photo ? 'rgba(255,255,255,.80)' : t.dim;

    /* 底 */
    if (photo) {
      try { cover(g, IMG[o.bg], W, H); veil(g, W, H, true); }
      catch (e) { gradient(g, W, H, t); photo = false; ink = t.ink; dim = t.dim; }
    } else {
      gradient(g, W, H, t);
    }

    var boxX = pad, boxY = pad, boxW = W - pad * 2, boxH = H - pad * 2;
    var refH = Math.round(M * 0.05);          // 出處那一行佔掉的高度
    var noteH = o.note ? Math.round(M * 0.06) : 0;

    /* 卡片版型：先畫一張白卡，文字畫在卡裡面 */
    if (o.layout === 'card') {
      var m = Math.round(M * 0.07);
      var cy = Math.round(M * 0.10);
      var cx = m, cw = W - m * 2, chh = H - cy * 2;
      g.fillStyle = t.bg === '#FDF6E8' ? '#FFFFFF' : t.bg;
      g.globalAlpha = 0.96;
      round(g, cx, cy, cw, chh, Math.round(M * 0.035));
      g.fill();
      g.globalAlpha = 1;
      g.strokeStyle = t.acc; g.lineWidth = Math.max(1.5, M * 0.002);
      round(g, cx, cy, cw, chh, Math.round(M * 0.035));
      g.stroke();
      boxX = cx + m; boxY = cy + m; boxW = cw - m * 2; boxH = chh - m * 2;
    }

    /* 經典版型：上下兩條細線 */
    if (o.layout === 'serif') {
      g.strokeStyle = t.acc; g.lineWidth = Math.max(1, W * 0.002);
      g.beginPath();
      g.moveTo(pad, H * 0.17); g.lineTo(W - pad, H * 0.17);
      g.moveTo(pad, H * 0.83); g.lineTo(W - pad, H * 0.83);
      g.stroke();
      boxY = H * 0.17 + pad * 0.6;
      boxH = H * 0.66 - pad * 1.2;
    }

    /* 標語版型：一個大引號當背景 */
    if (o.layout === 'quote') {
      g.font = Math.round(M * 0.42) + 'px ' + C.font;
      g.fillStyle = photo ? 'rgba(255,255,255,.14)' : t.acc;
      g.globalAlpha = photo ? 1 : 0.14;
      g.textAlign = 'left'; g.textBaseline = 'top';
      g.fillText('“', pad * 0.4, pad * 0.1);
      g.globalAlpha = 1;
    }

    var textH = boxH - refH - noteH - Math.round(M * 0.06);
    var fam = C.font;
    var lh = 1.62;

    /* 字級的上限跟**字數**走。
       同樣一個框，「神就是愛。」五個字要能放得大方，
       整段創世記第一章則要收得住。上限寫死一個數字，
       短句就會小得可憐，長段就會撞邊。 */
    var n = o.text.length;
    var cap = o.layout === 'quote' ? M * 0.22
            : (n <= 18 ? M * 0.155 : (n <= 60 ? M * 0.105 : M * 0.085));

    g.fillStyle = ink;
    if (o.layout === 'vert') {
      drawVertical(g, o.text, boxX, boxY, boxW, textH, fam, Math.round(cap));
    } else {
      var maxSize = Math.round(cap);
      var f = fit(g, o.text, boxW, textH, fam, lh, maxSize, 14);
      var blockH = f.lines.length * f.size * lh;
      /* 照片版型的字靠下，其餘置中——照片上方通常是主體，壓在上面很難看 */
      var top = o.layout === 'photo'
        ? boxY + textH - blockH + f.size
        : boxY + (textH - blockH) / 2 + f.size;
      drawLines(g, f.lines, W / 2, top, f.size, lh, 'center');
    }

    /* 出處 */
    if (o.ref) {
      g.font = '600 ' + Math.round(M * 0.034) + 'px ' + C.sans;
      g.fillStyle = photo ? 'rgba(255,255,255,.92)' : t.acc;
      g.textAlign = 'center'; g.textBaseline = 'alphabetic';
      g.fillText(o.ref, W / 2, boxY + boxH - noteH - Math.round(M * 0.02));
    }

    /* 領受（畫線時寫的那一句，選填）*/
    if (o.note) {
      g.font = Math.round(M * 0.028) + 'px ' + C.sans;
      g.fillStyle = dim;
      var nl = wrap(g, o.note, boxW * 0.86);
      drawLines(g, nl.slice(0, 2), W / 2, boxY + boxH - Math.round(M * 0.01),
                Math.round(M * 0.028), 1.5, 'center');
    }

    sign(g, W, H, t, pad, photo);
    return cv;
  }

  function round(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
  }

  /* ── 底圖載入 ──────────────────────────────────────────────────────
   * crossOrigin 不設的話，畫上去之後 canvas 就被污染，toBlob 會丟
   * SecurityError——而且是在使用者按下「儲存」的那一刻才丟。
   * ------------------------------------------------------------------- */

  function loadBG(url, cb) {
    if (!url) return cb(null);
    if (IMG[url]) return cb(IMG[url]);
    var im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = function () { IMG[url] = im; cb(im); };
    im.onerror = function () { cb(null); };
    im.src = url;
  }

  /* ── 面板 ─────────────────────────────────────────────────────────── */

  function panel() {
    if (EL) return EL;
    EL = document.createElement('div');
    EL.id = 'card321';
    EL.className = 'cd321';
    document.body.appendChild(EL);
    EL.addEventListener('click', function (e) {
      var t = e.target, a = null;
      while (t && t !== EL) {
        if (t.getAttribute && t.getAttribute('data-c')) { a = t; break; }
        t = t.parentNode;
      }
      if (!a) { if (e.target === EL) close(); return; }
      var k = a.getAttribute('data-c'), v = a.getAttribute('data-v');
      if (k === 'close') return close();
      if (k === 'save') return save();
      if (k === 'share') return share();
      if (k === 'pick') return pickFile();
      if (k === 'size' || k === 'tone' || k === 'layout') {
        ST[k] = v; remember(); return refresh();
      }
      if (k === 'bg') {
        ST.bg = v || '';
        if (ST.bg && ST.layout !== 'photo') ST.layout = 'photo';
        if (!ST.bg && ST.layout === 'photo') ST.layout = 'plain';
        remember(); return refresh();
      }
    });
    return EL;
  }

  function remember() {
    var s = saved();
    s.card = { size: ST.size, tone: ST.tone, layout: ST.layout };
    keep();
  }

  /* 畫面上的名字：宿主給了就用宿主的（英文版整組換掉）。 */
  function nameOf(kind, k, map) {
    var n = C.names && C.names[kind] && C.names[kind][k];
    return n || map[k].name;
  }
  function hintOf(kind, k, map) {
    var n = C.names && C.names[kind + 'Hint'] && C.names[kind + 'Hint'][k];
    if (n) return n;
    return C.names ? '' : (map[k].hint || '');   // 換過名字就不要留中文的說明
  }

  function chips(kind, map, cur) {
    var h = '', k, hint;
    for (k in map) {
      if (!map.hasOwnProperty(k)) continue;
      hint = hintOf(kind, k, map);
      h += '<button class="cdchip' + (cur === k ? ' on' : '') +
           '" data-c="' + kind + '" data-v="' + k + '"' +
           (hint ? ' title="' + esc(hint) + '"' : '') + '>' +
           esc(nameOf(kind, k, map)) + '</button>';
    }
    return h;
  }

  function bgChips() {
    var h = '<button class="cdchip' + (ST.bg ? '' : ' on') + '" data-c="bg" data-v="">' +
            esc(L('none')) + '</button>';
    var list = C.backgrounds || [], i;
    for (i = 0; i < list.length; i++) {
      h += '<button class="cdchip cdthumb' + (ST.bg === list[i].url ? ' on' : '') +
           '" data-c="bg" data-v="' + esc(list[i].url) + '" ' +
           'style="background-image:url(' + esc(list[i].thumb || list[i].url) + ')" ' +
           'title="' + esc(list[i].name || '') + '"><span>' + esc(list[i].name || '') +
           '</span></button>';
    }
    h += '<button class="cdchip" data-c="pick">' + esc(L('pick')) + '</button>';
    return h;
  }

  function draw() {
    var el = panel();
    el.innerHTML =
      '<div class="cdbox">' +
        '<div class="cdhead"><b>' + esc(L('title')) + '</b>' +
          '<button class="cdx" data-c="close" aria-label="' + esc(L('close')) + '">✕</button></div>' +
        '<div class="cdpvwrap"><img class="cdpv" id="cd321pv" alt="' + esc(L('title')) + '"></div>' +
        '<p class="cdhold">' + esc(L('hold')) + '</p>' +
        '<div class="cdrow"><span class="cdlab">' + esc(L('layout')) + '</span>' +
          '<div class="cdchips">' + chips('layout', LAYOUT, ST.layout) + '</div></div>' +
        '<div class="cdrow"><span class="cdlab">' + esc(L('tone')) + '</span>' +
          '<div class="cdchips">' + chips('tone', TONE, ST.tone) + '</div></div>' +
        '<div class="cdrow"><span class="cdlab">' + esc(L('size')) + '</span>' +
          '<div class="cdchips">' + chips('size', SIZE, ST.size) + '</div></div>' +
        '<div class="cdrow"><span class="cdlab">' + esc(L('bg')) + '</span>' +
          '<div class="cdchips">' + bgChips() + '</div></div>' +
        '<div class="cdacts">' +
          '<button class="cdbtn" data-c="save">' + esc(L('save')) + '</button>' +
          (canShare() ? '<button class="cdbtn pri" data-c="share">' + esc(L('share')) + '</button>' : '') +
        '</div>' +
      '</div>';
    refresh();
  }

  /* 預覽用 <img>，不是 <canvas>。
     手機上「長按儲存」是最可靠的一條路——尤其 iOS Safari，
     下載按鈕常常被擋，長按永遠有效。而 canvas 長按不會跳出選單。 */
  function refresh() {
    if (!ST) return;
    var go = function () {
      if (!CV) CV = document.createElement('canvas');
      paint(CV, ST);
      var pv = $('cd321pv');
      if (!pv) return;
      var sz = SIZE[ST.size] || SIZE.p34;
      pv.style.aspectRatio = sz.w + ' / ' + sz.h;
      try { pv.src = CV.toDataURL('image/png'); } catch (e) {}
      /* 選中的晶片要跟著亮 */
      var bs = EL.querySelectorAll('[data-c]'), i, b, k, v;
      for (i = 0; i < bs.length; i++) {
        b = bs[i]; k = b.getAttribute('data-c'); v = b.getAttribute('data-v');
        if (k !== 'size' && k !== 'tone' && k !== 'layout' && k !== 'bg') continue;
        b.className = b.className.replace(/\s*\bon\b/g, '') + (ST[k] === (v || '') ? ' on' : '');
      }
    };
    if (ST.layout === 'photo' && ST.bg && !IMG[ST.bg]) loadBG(ST.bg, go);
    else go();
  }

  /* ── 存與分享 ─────────────────────────────────────────────────────── */

  function blob(cb) {
    if (!CV) return cb(null);
    try {
      if (CV.toBlob) return CV.toBlob(function (b) { cb(b); }, 'image/png');
      var d = CV.toDataURL('image/png').split(',')[1];
      var bin = atob(d), arr = new Uint8Array(bin.length), i;
      for (i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      cb(new Blob([arr], { type: 'image/png' }));
    } catch (e) { cb(null); }
  }

  function fileName() {
    var r = (ST && ST.ref ? String(ST.ref) : 'verse').replace(/[\\/:*?"<>|\s]+/g, '');
    return r + '.png';
  }

  function save() {
    blob(function (b) {
      if (!b) { toast(L('nosave')); return; }
      try {
        var u = URL.createObjectURL(b);
        var a = document.createElement('a');
        a.href = u; a.download = fileName();
        document.body.appendChild(a); a.click();
        setTimeout(function () {
          try { document.body.removeChild(a); URL.revokeObjectURL(u); } catch (e) {}
        }, 400);
        toast(L('saved'));
      } catch (e) { toast(L('holdsave')); }
    });
  }

  function canShare() {
    try {
      return !!(navigator.share && navigator.canShare &&
                navigator.canShare({ files: [new File([''], 'x.png', { type: 'image/png' })] }));
    } catch (e) { return false; }
  }

  function share() {
    blob(function (b) {
      if (!b) return save();
      try {
        var f = new File([b], fileName(), { type: 'image/png' });
        if (!navigator.canShare || !navigator.canShare({ files: [f] })) return save();
        navigator.share({
          files: [f],
          text: (ST.text || '') + (ST.ref ? '\n——' + ST.ref : '')
        })['catch'](function () {});
      } catch (e) { save(); }
    });
  }

  /* 從相簿選一張自己的圖。用 FileReader 轉成 data:，
     這樣畫上去不會污染 canvas，存得出來。 */
  function pickFile() {
    try {
      var i = document.createElement('input');
      i.type = 'file'; i.accept = 'image/*';
      i.style.position = 'fixed'; i.style.left = '-9999px';
      i.addEventListener('change', function () {
        var f = i.files && i.files[0];
        try { document.body.removeChild(i); } catch (e) {}
        if (!f) return;
        var r = new FileReader();
        r.onload = function () {
          ST.bg = String(r.result); ST.layout = 'photo';
          loadBG(ST.bg, function () { draw(); });
        };
        r.readAsDataURL(f);
      });
      document.body.appendChild(i); i.click();
    } catch (e) {}
  }

  /* ── 開關 ─────────────────────────────────────────────────────────── */

  function open(o) {
    o = o || {};
    if (!C) throw new Error('CARD321.init() has not been called');
    var last = saved().card || {};
    ST = {
      text: String(o.text || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ')
                                 .replace(/^\s+|\s+$/g, ''),
      ref: o.ref || '', note: o.note || '',

/* From the highlight panel: the sentence, the note, and the reference.
   The reference is read back out of the highlight key — it already records
   which chapter and verse. An image with no reference is just a nice line;
   nobody can look it up. */
function mkCard(text, note, key){
  let ref = 'Obadiah';
  try {
    const p = String(key || '').split('|');
    if (p[0] === 'v' || p[0] === 'x' || p[0] === 'c'){
      const cv = String(p[1] || '').split(':');
      if (cv[0]) ref = 'Obadiah ' + cv[0] + (cv[1] && cv[1] !== '0' ? ':' + cv[1] : ' ');
    } else if (p[0] === 'l' && p[1]){
      ref = 'Obadiah ' + p[1];
    }
  } catch(e){}
  GXS.open({ text, note: note || '', ref });
}

let F = null, FT = null, WAKE = null;
function fOpen(mode, n){
  F = { mode, n, i:0, run:true, left:0, tele:mode !== 'live' };
  document.documentElement.setAttribute('data-tele', F.tele ? '1' : '0');
  if (mode === 'lesson'){                       // Teaching lesson transcript
    const s = (D.lesson || {})[n];
    // Think deeper is a prepared-but-optional question and answer; it does not go on the teleprompter
    F.pages = s ? telePages(s.blocks.filter(b => b[0] !== 'd')) : outlinePages(n);
    F.total = (s ? s.min : 40) * 60;
    F.left = F.total;
    // Only the main title goes in the title bar; a long subtitle would wrap onto two lines
    $('#ftitle').textContent = (s ? s.title.split(' — ')[0] : meta(n).t);
  } else if (mode === 'tele'){
    const s = D.serm[n];
    F.pages = s ? telePages(s.blocks) : outlinePages(n);
    F.total = (s ? s.min : 35) * 60;
    F.left = F.total;
    $('#ftitle').textContent = '《' + meta(n).t + '》';
  } else {
    F.pages = livePages(n);
    F.total = F.pages.reduce((a, p) => a + p.sec, 0);
    F.left = F.pages[0].sec;
    $('#ftitle').textContent = 'Chapter ' + n + ' · Group';
  }
  $('#full').classList.add('on');
  keepAwake(true);
  fDraw(); fTick();
}
function fClose(){

  document.documentElement.setAttribute('data-tele', '0');
  $('#full').classList.remove('on'); keepAwake(false);

async function keepAwake(on){

  } catch(e){}
}
function telePages(bl){

  const push = () => { if (cur.length){ pages.push(cur); cur = []; } };
  bl.forEach(b => {
    if (b[0] === 'h' || b[0] === 's'){ push(); cur = [b]; return; }
    if (b[0] === 'w'){ cur.push(b); push(); return; }   // a pause in the script = a page break
    cur.push(b);
    const chars = cur.reduce((a, x) => a + (typeof x[1] === 'string' ? x[1].length : 0), 0);
    if (cur.length >= 6 || chars > 190) push();
  });
  push();
  return pages.map(p => ({ blocks:p }));
}
function outlinePages(n){
  const m = meta(n), ps = [{ blocks:[['h','《' + m.t + '》'], ['p', m.sub], ['q', m.mv.t + '　' + m.mv.r]] }];
  m.serm.pts.forEach(p => ps.push({ blocks:[['h', p[0]], ['p', 'Bible　' + p[1]], ['p', p[2]]] }));
  ps.push({ blocks:[['h','Conclusion'], ['p', m.truth]] });
  return ps;
}
function livePages(n){
  const m = meta(n), ps = [];
  ps.push({ sec:600, ttl:'① Icebreaker 10 min', q:m.grp[0], tip:'Let everyone say one sentence. The leader goes first.' });
  ps.push({ sec:900, ttl:'② Scripture read together - 15 minutes', q:'「' + m.mv.t + '」　' + m.mv.r,
            tip:'Read the chapter’s core verse round the group. When you finish, sit in silence for thirty seconds; do not rush to explain.' });
  m.grp.slice(1).forEach((q, i) => ps.push({
    sec:450, ttl:'③ Discussion · Q ' + (i + 2) + ' ', q,
    tip: i === 1 ? 'This is the deepest question. The leader shares first. Do not press for details; if someone cries, stop and pray for them, and do not go straight on to the next question.'
       : i === 3 ? 'Ask a group member to check in with him on day seven.' : '' }));
  ps.push({ sec:900, ttl:'④ Practice and intercession - 15 minutes', q:m.prac.main,
            tip:'One item each, and one only. Name for each other the companion who will ask on day seven, then pray for one another.' });
  return ps;
}
function fDraw(){
  if (!F) return;
  const p = F.pages[F.i], b = $('#fbody');
  if (F.tele){
    b.className = 'fbody tele';
    b.innerHTML = p.blocks.map(x =>
      x[0] === 'h' ? `<h5>${esc(x[1])}</h5>` :
      x[0] === 's' ? `<h5>${esc(x[1])}</h5>` :
      x[0] === 't' ? `<p class="qq">${esc(x[1])}</p>` :
      x[0] === 'm' ? `<p class="pause">${esc(x[1])}</p>` :
      x[0] === 'q' ? `<p class="qq">${esc(x[1])}</p>` :
      x[0] === 'w' ? `<p class="pause">Pause <b>${x[1]}</b> sec</p>` :
      `<p>${esc(x[1])}</p>`).join('');
  } else {
    b.className = 'fbody live';
    b.innerHTML = `<h5>${esc(p.ttl)}</h5><p class="qq">${esc(p.q)}</p>` +
      (p.tip ? `<div class="tipbox"><b>💡 Leader tip</b><br>${esc(p.tip)}</div>` : '');
    F.left = p.sec;
  }
  b.scrollTop = 0;
  $('#frail').style.width = ((F.i + 1) / F.pages.length * 100) + '%';
  $('#fplay').textContent = F.run ? 'Pause' : 'Resume';
  fClock();
}
function fClock(){
  const s = Math.max(0, Math.round(F.left)), over = F.left < 0;
  const t = (over ? '-' : '') + String(Math.floor(Math.abs(F.left) / 60)).padStart(2, '0') + ':' +
            String(Math.floor(Math.abs(F.left) % 60)).padStart(2, '0');
  const c = $('#fclock'); c.textContent = t; c.classList.toggle('over', F.left < 0);
}
function fTick(){
  clearInterval(FT);
  FT = setInterval(() => { if (!F) return clearInterval(FT); if (F.run) F.left--; fClock(); }, 1000);
}
function fGo(d){
  if (!F) return;
  const i = F.i + d;
  if (i < 0) return;
  if (i >= F.pages.length){ toast('That is already the last section'); return; }
  F.i = i; fDraw();
}
$('#fx').onclick = () => { if (confirm('Leave this mode?')) fClose(); };
$('#fprev').onclick = () => fGo(-1);
$('#fnext').onclick = () => fGo(1);
$('#fplay').onclick = () => { F.run = !F.run; $('#fplay').textContent = F.run ? 'Pause' : 'Resume'; };
$('#fA').onclick = () => { S.set.fs = (S.set.fs + 1) % 5; save(); applyFS(); };
if ($('#fLang')) $('#fLang').onclick = toggleSC;
document.addEventListener('keydown', e => {
  if (!F) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); fGo(1); }
  if (e.key === 'ArrowLeft') fGo(-1);
  if (e.key === 'Escape') fClose();
});

window.mkText = MK321.text; window.mkSheet = MK321.sheet; window.mkTap = MK321.tap;

/* ═══════════════════════════════════════════════════════════════════
   畫線範圍（照《321互動聖經》）：往前加一句、往後加一句／少一句、整節、整段
   一條畫線仍只記在第一句的 key 上，S.mk[k].sp = 這條畫線共幾句。
   ═══════════════════════════════════════════════════════════════════ */
(function () {
  /* 較早一代的範本（羅馬書、馬可、啟示錄）沒有顏色與定位工具，這裡補上 */
  if (typeof window.mkColor !== 'function') window.mkColor = k => (S.mk[k] && S.mk[k].c) || '';
  if (typeof window.mkKeep !== 'function') window.mkKeep = (k, fn) => {
    const sel = '[data-k="' + k + '"]', b = document.querySelector(sel), top = b ? b.getBoundingClientRect().top : null;
    fn(); if (top === null) return;
    const a = document.querySelector(sel); if (a) { const d = a.getBoundingClientRect().top - top; if (Math.abs(d) > 1) window.scrollBy(0, d); }
  };
  const TT = (zh, en) => (window.GX && GX.T) ? GX.T(zh, en) : zh;
  const MKS_TEXT = window.mkText, MKS_SHEET = window.mkSheet, MKS_TAP = window.mkTap;
  const sp = k => Math.max(1, +((S.mk[k] || {}).sp) || 1);
  /* 經文：由資料攤平整章的句子（不靠畫面，哪裡打開都算得對） */
  function seqV(c) {
    const out = [];
    (D.txt[c] || []).forEach((t, i) => {
      const ss = splitHTML(esc(t)), n = ss.length, ref = c + ':' + (i + 1);
      /* 空的節（和合本把兩節合成一節時，後一節是空的）不算一句 */
      for (let s = 0; s < n; s++) if (String(ss[s]).replace(/<[^>]+>/g, '').trim())
        out.push({ k: 'v|' + ref + (n > 1 ? '|' + s : ''), v: i + 1 });
    });
    return out;
  }
  /* 其他（講義、解經、三句話）：照畫面上的順序 */
  const grp = p => p[0] === 'l' ? 'l|' + p[1] + '|' : p.slice(0, -1).join('|') + '|';
  function seqDom(k) {
    backfill();
    const g = grp(k.split('|')), seen = {}, out = [];
    document.querySelectorAll('.mks[data-k],.mkp[data-k]').forEach(e => {
      const x = e.dataset.k;
      if (x.indexOf(g) === 0 && !seen[x]) { seen[x] = 1; out.push({ k: x }); }
    });
    if (!seen[k]) out.unshift({ k });
    return out;
  }
  function seq(k) {
    const p = k.split('|');
    return p[0] === 'v' ? seqV(p[1].split(':')[0]) : seqDom(k);
  }
  function keysOf(k) {
    const L = seq(k), i = L.findIndex(x => x.k === k);
    if (i < 0) return [k];
    return L.slice(i, i + sp(k)).map(x => x.k);
  }
  /* 整節／整段要畫幾句 */
  function spanTo(k, mode) {
    const L = seq(k), i = L.findIndex(x => x.k === k), p = k.split('|');
    if (i < 0) return 1;
    let n = 1;
    if (p[0] === 'v') {
      const c = p[1].split(':')[0], v = L[i].v;
      let z = v;
      if (mode === 'p') { const b = VMAP[c + ':' + v]; z = b && b.z ? b.z : v; }
      while (i + n < L.length && L[i + n].v <= z) n++;
    } else {
      const pre = p[0] === 'l' ? p.slice(0, 4).join('|') + '|' : grp(p);
      while (i + n < L.length && L[i + n].k.indexOf(pre) === 0) n++;
    }

  }
  /* 出處：經文算出「出埃及記 1:6-7」；其他交給美圖自己去查 */
  function refOf(k) {
    const p = k.split('|');
    if (p[0] !== 'v') return GX.chLabel(+String(p[1] || '').split(':')[0] || R.ch || S.last || 1);
    const ks = keysOf(k), a = ks[0].split('|')[1].split(':'), z = ks[ks.length - 1].split('|')[1].split(':');
    return (GX.BK ? TT(GX.BK.zh, GX.BK.en) : (GX.BOOK || '')) + ' ' + a[0] + ':' + a[1] + (z[1] !== a[1] ? '-' + z[1] : '');
  }

  window.mkText = function (k) {

    /* 中文直接接；英文（前後都是英數標點）中間補一個空格 */
    return keysOf(k).map(x => String(MKS_TEXT(x) || '').trim()).filter(Boolean).reduce((s, x) =>

  };
  /* 把多句畫線延伸到後面幾句（只改畫面，不另外存） */
  /* 較早的範本句子沒有 data-k，只把 key 寫在 onclick 裡：補上 */
  function backfill() {
    document.querySelectorAll('.mks:not([data-k]),.mkp:not([data-k])').forEach(e => {
      const mm = /mkTap\('([^']+)'/.exec(e.getAttribute('onclick') || '');
      if (mm) e.setAttribute('data-k', mm[1]);
    });
  }
  function paint() {
    backfill();
    document.querySelectorAll('[data-own]').forEach(e => {
      if (!mkHas(e.dataset.own) && !mkHas(e.dataset.k)) { e.classList.remove('hl'); e.removeAttribute('data-c'); }
      e.removeAttribute('data-own');
    });
    Object.keys(S.mk).forEach(k => {
      if (sp(k) < 2) return;
      const c = mkColor(k);
      keysOf(k).slice(1).forEach(x => document.querySelectorAll('[data-k="' + x + '"]').forEach(e => {
        if (mkHas(x)) return;
        e.classList.add('hl'); e.dataset.own = k;
        if (c) e.setAttribute('data-c', c); else e.removeAttribute('data-c');
      }));
    });
  }
  window.mkPaintSpans = paint;
  const R0 = window.render;
  window.render = function () { const r = R0.apply(this, arguments); try { paint(); } catch (e) {} return r; };
  /* 點到被別條畫線蓋住的句子，就打開那一條 */
  window.mkTap = function (k, el) {
    const own = el && el.dataset && el.dataset.own;
    if (own && mkHas(own) && !mkHas(k)) return window.mkSheet(own);
    if (mkHas(k)) return window.mkSheet(k);
    return MKS_TAP(k, el);
  };
  const SC0 = window.mkSetColor;
  if (typeof SC0 === 'function') window.mkSetColor = function (k, c) { SC0(k, c); try { paint(); } catch (e) {} };
  /* 儲存領受時保留範圍 */
  window.mkSave = function (k) {
    const v = ($('#mkin') || {}).value || '';
    const o = S.mk[k] || {};
    S.mk[k] = { n: v.trim(), at: Date.now(), c: mkColor(k) };
    if (o.sp > 1) S.mk[k].sp = o.sp;
    save();
    $('#sheet').classList.remove('on'); mkKeep(k, render); toast(TT('Reflection saved', 'Saved'));
  };
  if (window.GXS) {
    window.mkSpanCard = function (k) {
      const n = ($('#mkin') || {}).value || mkNote(k), sh = $('#sheet');
      if (sh) sh.classList.remove('on');
      GXS.open({ text: window.mkText(k), note: n, ref: refOf(k) });
    };
    if (typeof window.mkCard !== 'function') window.mkCard = window.mkSpanCard;
  } else if (typeof window.mkRef === 'function') {
    /* 自帶美圖的範本（路加福音）：沿用它自己的「做一張圖」，只把出處改成範圍 */
    const REF0 = window.mkRef;
    window.mkRef = function (k) {
      const r = REF0(k);
      if (k[0] !== 'v' || sp(k) < 2) return r;
      const ks = keysOf(k), a = ks[0].split('|')[1].split(':'), z = ks[ks.length - 1].split('|')[1].split(':');
      return r.replace(/\s\S+$/, ' ' + a[0] + ':' + a[1] + (z[1] !== a[1] ? '-' + z[1] : ''));
    };
  }
  function rowHTML(k) {
    const isV = k[0] === 'v';
    return `<div class="hlrow mkspan"><span class="lb">${TT('Range', 'Range')}</span>
      <button class="spb" data-sp="back" title="${TT('Add the sentence before', 'Add the sentence before')}">${TT('↑ Prev', '↑ Prev')}</button>
      <button class="spb" data-sp="-1">－</button>
      <span class="spn" id="mkSpn">${TT(sp(k) + ' 句', sp(k) + (sp(k) > 1 ? ' sentences' : ' sentence'))}</span>
      <button class="spb" data-sp="1">＋</button>
      ${isV ? '<button class="spb" data-sp="v">' + TT('Verse', 'Verse') + '</button>' : ''}
      <button class="spb" data-sp="p" title="${isV ? TT('The verses this exegesis covers', 'The verses this exegesis covers') : TT('This paragraph', 'This paragraph')}">${TT('Passage', 'Passage')}</button></div>
      <div class="mkspan-hint">${TT('Tap ＋ to add the next sentence or “↑ Prev” to add the one before, so one highlight can cover a whole passage.' + (isV ? ' “Passage” covers the verses of this exegesis section.' : ''), 'Tap ＋ to add the next sentence or “↑ Prev” to add the one before, so one highlight can cover a whole passage.' + (isV ? ' “Passage” covers the verses of this exegesis section.' : ''))}</div>`;
  }
  window.mkSheet = function (k) {
    MKS_SHEET(k);
    const box = $('#sheet'); if (!box) return;

/* ═══════════════════════════════════════════════════════════════════
   朗讀標示一句一句走（照《321互動聖經》）
   朗讀引擎一次把一整段（好幾句）標成 .spk-now，聲音也是整段連著唸；
   這裡只留「正在唸的那一句」亮著，依音檔播放進度（按字數比例）往下移。
   用裝置內建語音（沒有音檔）時，依語速估算。
   ═══════════════════════════════════════════════════════════════════ */
(function () {
  if (window.__spkStep) return; window.__spkStep = 1;
  let lastAudio = null;
  try {
    const P0 = HTMLMediaElement.prototype.play;
    HTMLMediaElement.prototype.play = function () {
      if (this.tagName === 'AUDIO' || !this.videoWidth) lastAudio = this;
      return P0.apply(this, arguments);
    };
  } catch (e) {}
  let G = null;            // { els, w[], tot, cur, t0, a, src }
  let hold = 0;
  ['wheel', 'touchstart', 'touchmove', 'pointerdown'].forEach(ev =>
    window.addEventListener(ev, () => { hold = Date.now() + 6000; }, { passive: true }));
  const len = el => Math.max(1, String(el.textContent || '').replace(/\s+/g, '').length);
  function show(i) {
    if (!G) return;
    i = Math.max(0, Math.min(G.els.length - 1, i));
    if (i === G.cur) return;
    G.els.forEach((e, j) => { if (j !== i) e.classList.remove('spk-now'); });
    const el = G.els[i]; el.classList.add('spk-now'); G.cur = i;
    if (Date.now() < hold) return;
    try {
      const r = el.getBoundingClientRect();
      if (r.top < 70 || r.bottom > innerHeight - 150) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } catch (e) {}
  }
  function frac() {
    const a = G.a;
    if (a && a.duration && isFinite(a.duration) && a.duration > 0 && (a.currentSrc || a.src) === G.src)
      return a.currentTime / a.duration;
    /* 裝置語音：依語速估算（中文約每秒 4.6 字，英文約每秒 14 個字母） */
    const ss = window.speechSynthesis;
    if (ss && ss.paused) { G.t0 += 250; return null; }
    const en = /[A-Za-z]{3}/.test(G.els[0].textContent || '');
    const cps = en ? 14 : 4.6;
    return ((Date.now() - G.t0) / 1000 * cps) / G.tot;
  }
  function tick() {
    if (document.hidden) return;
    const now = Array.prototype.slice.call(document.querySelectorAll('.spk-now'));
    if (G) {
      const mine = G.els[G.cur];
      /* 引擎換了下一段（或重繪）：舊的那一組結束 */
      const sameGroup = now.length === 1 && now[0] === mine;
      if (!sameGroup) G = null;
    }
    if (!G && now.length > 1) {
      const a = lastAudio && !lastAudio.paused ? lastAudio : null;
      const w = now.map(len);
      G = { els: now, w, tot: w.reduce((x, y) => x + y, 0), cur: -1, t0: Date.now(), a, src: a ? (a.currentSrc || a.src) : '' };
      if (!a && lastAudio && lastAudio.paused && lastAudio.currentTime > 0) { G.a = lastAudio; G.src = lastAudio.currentSrc || lastAudio.src; }
      show(0);
    }
    if (!G) return;
    if (!G.a && lastAudio && !lastAudio.paused) { G.a = lastAudio; G.src = lastAudio.currentSrc || lastAudio.src; }
    const f = frac();
    if (f == null) return;
    let acc = 0, i = 0;
    const target = Math.min(0.999, Math.max(0, f)) * G.tot;
    for (; i < G.w.length; i++) { acc += G.w[i]; if (acc > target) break; }
    if (i > G.cur) show(i);             // 只往前走，不倒退閃動
  }
  setInterval(tick, 200);
  /* 引擎一標上新的一段就立刻處理，不等下一次計時——不然換段那一瞬間會閃一下整段 */
  let queued = false;
  try {
    new MutationObserver(ms => {
      if (queued) return;
      for (const m of ms) if (m.attributeName === 'class' && m.target.classList && m.target.classList.contains('spk-now')) {
        queued = true; Promise.resolve().then(() => { queued = false; tick(); }); return;
      }
    }).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class'] });
  } catch (e) {}
})();

/* ═══════════════════════════════════════════════════════════════════
   PRON321 · 真人朗讀發音修正（依技能 321-reading-pronunciation）
   只改「送去語音的文字」，畫面、分享、美圖的字一個都不動。
   · SHARED：兩版共用的指定讀音（繁、简兩種寫法都列）
   · TW：臺灣版（繁體介面）卻用了大陸口音語音（zh-CN）時才套
   · CN：大陸版（简体介面）卻用了臺灣口音語音（zh-TW）時才套
   規則一律帶上下文、長詞先；每條替代字只有一個讀音，套兩次也不會變（可重複套用）。
   ═══════════════════════════════════════════════════════════════════ */
var PRON321 = (function () {
  'use strict';

  function R(s) { return new RegExp(s, 'g'); }

  var SHARED = [
    /* 重 chóng／zhòng */
    [R('重生'), '蟲生'], [R('重新'), '蟲新'], [R('重建'), '蟲建'],
    [R('重擔'), '眾擔'], [R('重担'), '众担'],
    /* 長 zhǎng：職稱、成長；長＋數字＋度量衡 cháng */
    [R('長(?=' + NUM + UNIT + ')'), '常'], [R('长(?=' + NUM + UNIT + ')'), '常'],
    [R('長(老|子|大|進|輩|執)'), '掌$1'],
    [R('长(老|子|大|进|辈|执)'), '掌$1'],
    [R('(成|生|年|家|族|官|兄|師|师|首|牧|夫|組|组|團|团|校|部|區|区|社)(長|长)(?![久遠远存期])'), '$1掌'],
    /* 差 chāi */
    [R('差(遣|派|役)'), '拆$1'],
    [R('([主神祂他我])差(?=[人你我他門门使])'), '$1拆'],
    /* 得著 dé zhuó */
    [R('得[著着](?![急涼凉迷火慌])'), '得酌'],
    /* 為 wèi：為主而活、為人禱告…（「成為」「以…為主」不在這些組合裡） */
    [R('(^|[^成作行認认稱称以視视])([為为])(?=(?:主|神|祂|基督|耶穌|耶稣)(?:而活|而死|作工|做工|擺上|摆上|受苦|犧牲|牺牲|捨命|舍命|捨己|舍己|發熱心|发热心))'), '$1衛'],
    [R('([為为])(?=(?:人|別人|别人|眾人|众人|你|你們|你们|我們|我们|他們|他们|弟兄姊妹)(?:禱告|祷告|代禱|代祷|代求|捨命|舍命))'), '衛'],
    /* 給 jǐ */
    [R('(供|補|补)[給给]'), '$1己'], [R('[給给]予'), '己予'],
    /* 應 yìng／yīng */
    [R('應許'), '映許'], [R('应许'), '映许'], [R('應驗'), '映驗'], [R('应验'), '映验'],
    [R('應當'), '英當'], [R('应当'), '英当'],
    /* 傳 chuán／zhuàn */
    [R('傳道'), '船道'], [R('传道'), '船道'],
    [R('(行|自)傳'), '$1賺'], [R('(行|自)传'), '$1赚'], [R('傳記'), '賺記'], [R('传记'), '赚记'],
    /* 專名與聖經特殊詞 */
    [R('沒藥'), '莫藥'], [R('没药'), '莫药'],
    [R('嗎哪'), '馬哪'], [R('吗哪'), '马哪'],
    [R('撒種'), '撒腫'], [R('撒种'), '撒肿'],
    [R('撒但'), '仨但'],
    [R('數一數'), '鼠一鼠'], [R('数一数'), '鼠一鼠'],
    [R('數(點|算)'), '鼠$1'], [R('数(点|算)'), '鼠$1'],
    [R('參孫'), '餐孫'], [R('参孙'), '餐孙'],
    [R('阿們'), '阿門'], [R('阿们'), '阿门'],
    [R('冠冕'), '官冕'],
    [R('朝(見|拜)'), '潮$1'], [R('朝(见|拜)'), '潮$1'],
    [R('背(起|負|负)'), '揹$1'],
    [R('看守'), '刊守'],
    [R('說客'), '稅客'], [R('说客'), '税客'],
    [R('年少'), '年紹'], [R('(^|[^多不減减缺很太至最])少年'), '$1紹年'],
    [R('盛(滿|满)'), '成$1'],
    [R('([一兩两三那這这])宿(?![舍])'), '$1朽'],
    [R('乾(?!坤)'), '甘'],
    [R('鴿'), '哥']

    [R('[說说]服'), '稅服'], [R('[遊游][說说]'), '遊稅'],
    [R('期'), '奇'], [R('企'), '器'],
    [R('[危微]'), '圍'], [R('寂'), '疾'],
    [R('(^|[^人])[質质]'), '$1直'],
    [R('[暫暂]'), '站'], [R('[攜携]'), '西'], [R('曝'), '瀑'],
    [R('垃圾'), '樂色'], [R('[蝸蜗]'), '瓜'],
    [R('[結结]果子'), '節果子']

  var CN = [
    [R('期'), '七'], [R('企'), '起'],
    [R('[危微]'), '威'], [R('寂'), '寄'],
    [R('(^|[^人])[质質]'), '$1至'],
    [R('[暂暫]'), '赞'], [R('[携攜]'), '鞋'], [R('曝光'), '爆光'],

    var v = String(voice || '');

  function fixDiff(s, std, voice) {

    if (std === 'cn' && /zh[-_]TW|zh[-_]HK/i.test(v)) return run(CN, s);

  }

})();
/* PRON321 接上創世記（TTS321 核心）：把規則放在 TTS_SAY 最前面（核心會自動產生简体那一套）。
   兩岸差異那一段依「目前介面＋目前語音」決定，開始朗讀前重新對一次；音檔快取的 key 也跟著變。 */
(function () {
  if (typeof TTS_SAY === 'undefined' || !window.TTS321 || !TTS321.rebuildSay) return;
  const std = () => { try { return (S.set && S.set.sc) ? 'cn' : 'tw'; } catch (e) { return 'tw'; } };
  const vname = () => { try { const v = TTS_VOICES[S.set.voice] || TTS_VOICES.yunfan || TTS_VOICES[Object.keys(TTS_VOICES)[0]]; return v.name; } catch (e) { return ''; } };
  let ins = 0, sig = '';
  function sync() {
    const s = std(), v = vname(), d = (s === 'tw' && /zh[-_]CN/i.test(v)) ? PRON321.TW : (s === 'cn' && /zh[-_]TW/i.test(v)) ? PRON321.CN : [];
    const k = s + '|' + (d === PRON321.TW ? 'TW' : d === PRON321.CN ? 'CN' : '');
    if (k === sig) return;
    TTS_SAY.splice.apply(TTS_SAY, [0, ins].concat(PRON321.SHARED, d));
    ins = PRON321.SHARED.length + d.length; sig = k;
    try { TTS321.rebuildSay(); } catch (e) {}
  }
  sync();
  ['play', 'playFrom', 'speak', 'say', 'resumePlay'].forEach(n => {
    const f = TTS321[n];
    if (typeof f === 'function') TTS321[n] = function () { try { sync(); } catch (e) {} return f.apply(this, arguments); };
  });
  PRON321.hookNative(std);
})();
/* 預設語音：繁體介面用臺灣口音（雲哲），简体介面用大陸口音（雲帆）。
   使用者自己在設定裡選過語音（S.set.voicePicked）就照他的選擇；選了曉辰的人不受影響。 */
(function () {
  if (typeof S === 'undefined' || !S.set || typeof TTS_VOICES === 'undefined') return;
  function apply() {
    try {
      if (S.set.voicePicked) return;
      const want = S.set.sc ? 'yunfan' : 'yunjhe';
      if (!TTS_VOICES[want]) return;
      if (S.set.voice !== want && (!S.set.voice || S.set.voice === 'yunfan' || S.set.voice === 'yunjhe')) S.set.voice = want;
    } catch (e) {}
  }
  apply(); try { save(); } catch (e) {}
  if (typeof pickVoice === 'function') {
    const P0 = pickVoice;
    window.pickVoice = function (k) { try { S.set.voicePicked = 1; } catch (e) {} return P0.apply(this, arguments); };
  }
  if (typeof ttsFetch === 'function') {
    const F0 = ttsFetch;
    window.ttsFetch = function (p) { apply(); return F0(p); };
  }
  if (window.TTS321) ['play', 'playFrom', 'speak', 'say', 'resumePlay'].forEach(n => {
    const f = TTS321[n];
    if (typeof f === 'function') TTS321[n] = function () { apply(); return f.apply(this, arguments); };
  });
  const R0 = window.render;
  if (typeof R0 === 'function') window.render = function () { apply(); return R0.apply(this, arguments); };
})();

<script id="VPICK">
/* VPICK321 v1（2026-10-23）：小智回答「做成美圖」時，從回答裡找出最合適的那一節經文

   ‧ 經文用和合本原文（繁／简／英），資料讀互動聖經站的 toc.json 與 bible.{zh|zs|en}.*.json（GitHub Pages 有 CORS）
   ‧ VPICK321.pick(回答, 語言) → Promise<{t, ref, b, ch, v, v2} 或 null>；語言省略時自動判斷 */
(function () {
  if (window.VPICK321) return;
  var BASE = 'https://spch321-sudo.github.io/bible/';
  var TOC = null, BK = {}, SH = {}, RE = null, MAP = null;
  function getJ(u) { return fetch(u).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }); }
  function toc() {
    if (TOC) return Promise.resolve(TOC);
    return getJ(BASE + 'toc.json').then(function (t) { TOC = t; for (var i = 0; i < t.length; i++) BK[t[i].id] = t[i]; return t; });
  }
  /* 依回答本身的文字判斷語言：英文字多就是英文；简体专用字比繁體專用字多就是简体 */
  var SIMP = '们这说为门国时会对发来过还后话让见语长东车书学习认识问题简体经龙马鸟鱼爱华听读写应该样么个们开关头亲给让钱进运选远连农战线现实实际义乐兴约须带币帐盖净渐'.split('');
  var TRAD = '們這說為門國時會對發來過還後話讓見語長東車書學習認識問題簡體經龍馬鳥魚愛華聽讀寫應該樣麼個們開關頭親給讓錢進運選遠連農戰線現實實際義樂興約須帶幣帳蓋淨漸'.split('');
  function detect(md) {
    var t = String(md || ''), cjk = (t.match(/[\u4e00-\u9fff]/g) || []).length, lat = (t.match(/[A-Za-z]/g) || []).length;
    if (cjk < 10 && lat > 40) return 'en';
    var a = 0, b = 0, i;
    for (i = 0; i < SIMP.length; i++) if (t.indexOf(SIMP[i]) >= 0) a++;
    for (i = 0; i < TRAD.length; i++) if (t.indexOf(TRAD[i]) >= 0) b++;
    if (a > b) return 'zs';
    if (b > a) return 'zh';
    return lang();
  }
  function lang() {
    var l = (document.documentElement.getAttribute('lang') || '').toLowerCase();
    if (/^en/.test(l)) return 'en';
    if (/hans|cn|sg/.test(l)) return 'zs';
    try { if (typeof S !== 'undefined' && S && S.set && S.set.sc) return 'zs'; } catch (e) { }
    try { var k = localStorage.getItem('k321_lang'); if (k === 'en') return 'en'; if (k === 'zh-Hans') return 'zs'; } catch (e) { }
    return 'zh';
  }
  function esc(n) { return n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '\\s*').replace(/^(\d)(?=[A-Za-z])/, '$1\\s*'); }
  function regex() {
    if (RE) return RE;
    MAP = {}; var raw = [];
    function add(n, id) { n = String(n || '').trim(); var k = n.replace(/\s+/g, '').toLowerCase(); if (k && !MAP[k]) { MAP[k] = id; raw.push(n); } }
    for (var i = 0; i < TOC.length; i++) { var b = TOC[i]; add(b.zh, b.id); add(b.zs, b.id); add(b.en, b.id); add(b.azh, b.id); add(b.azs, b.id); add(b.aen, b.id); }
    add('Psalm', 'Psalms'); add('Song of Songs', 'SongofSolomon'); add('詩', 'Psalms'); add('诗', 'Psalms');
    raw.sort(function (a, b) { return b.length - a.length; });
    var names = []; for (var j = 0; j < raw.length; j++) names.push(esc(raw[j]));
    RE = new RegExp('(' + names.join('|') + ')\\s*(\\d{1,3})\\s*(?:[:：]|[章篇]\\s*(?:第\\s*)?)\\s*(\\d{1,3})\\s*[節节]?(?:\\s*[-–—~～至到]\\s*(\\d{1,3}))?', 'gi');
    return RE;
  }
  function refs(text) {
    var re = regex(), out = [], lines = String(text || '').split('\n');
    for (var li = 0; li < lines.length; li++) {
      var line = lines[li], m; re.lastIndex = 0;
      while ((m = re.exec(line))) {
        var id = MAP[m[1].replace(/\s+/g, '').toLowerCase()], b = id && BK[id];
        if (!b) continue;
        var ch = +m[2], v = +m[3], v2 = m[4] ? +m[4] : 0;

  }

  function clean(t) {

    for (var i = 0; i < P.length; i++) {
      var o = P[i][0], c = P[i][1], no = t.split(o).length - 1, nc = t.split(c).length - 1, k;
      if (no > nc) for (k = no - nc; k > 0 && t.indexOf(o) >= 0; k--) t = t.replace(o, '');
      else if (nc > no) for (k = nc - no; k > 0 && t.lastIndexOf(c) >= 0; k--) { var x = t.lastIndexOf(c); t = t.slice(0, x) + t.slice(x + 1); }
    }
    return t.trim();
  }
  function verse(lg, r) {
    var b = BK[r.b];
    return shard(lg, b).then(function (d) {
      var arr = d[r.b] && d[r.b][r.ch - 1]; if (!arr) return '';
      var hi = r.v2 || r.v, cur = 0, parts = [];
      for (var i = 0; i < arr.length; i++) {
        var seg = arr[i]; if (!seg || !seg.length) continue;
        for (var j = 1; j + 1 < seg.length; j += 2) {
          if (+seg[j] > 0) cur = +seg[j];
          if (cur >= r.v && cur <= hi && seg[j + 1]) parts.push(String(seg[j + 1]));
        }
      }
      return clean(parts.join(lg === 'en' ? ' ' : '').replace(/〔[^〕]*〕/g, '').replace(/\s+/g, ' ').trim());
    });
  }
  function label(lg, r) {
    var b = BK[r.b], nm = lg === 'en' ? (b.en || b.zh) : (lg === 'zs' ? b.zs : b.zh);
    return nm + ' ' + r.ch + ':' + r.v + (r.v2 ? '-' + r.v2 : '');
  }
  function pick(md, lg) {
    lg = lg || (/^en/i.test(document.documentElement.getAttribute('lang') || '') ? 'en' : detect(md));
    return toc().then(function () {
      var all = refs(md), order = [], i;
      for (i = 0; i < all.length; i++) if (all[i].q) order.push(all[i]);
      for (i = 0; i < all.length; i++) if (!all[i].q) order.push(all[i]);
      var k = 0;
      function next() {
        if (k >= order.length || k >= 6) return null;
        var r = order[k++];

          if (!t) return next();
          r.t = t; r.ref = label(lg, r); return r;

      }
      return next();
    });
  }
  /* 給各 App 的「做成美圖」用：找到經文就 open({t,ref,n:''})，找不到就 open(原本的內容) */
  function card(md, open, fallback) {
    pick(md).then(function (r) { if (r) open({ t: r.t, ref: r.ref, n: '' }); else open(fallback); }, function () { open(fallback); });
  }
  /* 經文核對（-rf1105）：只認書卷全名（避免把「大約 3:2」誤判成經文），每則最多 6 處、去重 */
  var VRE = null, VMAP = null;
  function vregex() {
    if (VRE) return VRE;
    VMAP = {}; var names = [], i, j, b, ns;
    for (i = 0; i < TOC.length; i++) { b = TOC[i]; ns = [b.zh, b.zs, b.en];
      for (j = 0; j < 3; j++) if (ns[j] && !VMAP[ns[j]]) { VMAP[ns[j]] = b.id; names.push(ns[j].replace(/[.*+?^${}()|[\]\\]/g, '\\$&')); } }
    names.sort(function (a, c) { return c.length - a.length; });
    VRE = new RegExp('(' + names.join('|') + ')\\s*(\\d{1,3})\\s*(?:[:：]|章|篇)\\s*(\\d{1,3})\\s*(?:節|节)?(?:\\s*[-–—~～]\\s*(\\d{1,3}))?', 'g');
    return VRE;
  }
  function vrefs(text) {
    var re = vregex(), out = [], seen = {}, m; re.lastIndex = 0;
    while ((m = re.exec(String(text || ''))) && out.length < 6) {
      var id = VMAP[m[1]], b = id && BK[id]; if (!b) continue;
      var ch = +m[2], v = +m[3], v2 = m[4] ? +m[4] : 0;
      if (v2 && (v2 <= v || v2 - v > 12)) v2 = 0;
      var key = id + ch + ':' + v + '-' + v2; if (seen[key]) continue; seen[key] = 1;
      out.push({ b: id, ch: ch, v: v, v2: v2 });
    }
    return out;
  }
  function verify(md, lg) {
    lg = lg || lang();
    return toc().then(function () {
      var rs = vrefs(md), net = 0;
      return Promise.all(rs.map(function (r) {
        r.label = label(lg, r);
        if (!r.ch || r.ch > BK[r.b].ch) { r.t = ''; return r; }
        return verse(lg, r).then(function (t) { r.t = t || ''; return r; }, function () { net++; r.err = 1; r.t = ''; return r; });
      })).then(function (all) { return all.filter(function (r) { return !r.err; }); });
    }, function () { return []; });
  }
  window.VPICK321 = { verify: verify, pick: pick, card: card, lang: lang, detect: detect, refs: function (t) { return toc().then(function () { return refs(t); }); } };
})();
</script>

  function splitSents(t, zh) {

    var re = zh ? /[^。！？；!?]+(?:[。！？；!?]+[」』”’）)】〕]*)?/g : /[^.!?;]+(?:[.!?;]+["”’)\]]*)?(?=\s|$)|[^.!?;]+$/g;
    var out = (t.match(re) || [t]).map(function (x) { return x.trim(); }).filter(Boolean);
    var merged = [];
    out.forEach(function (x) {                          // 太短的碎句（例：「v. 3」「阿們。」）併到前一句
      if (merged.length && (x.replace(/[\s\p{P}]/gu, '').length < (zh ? 3 : 6))) merged[merged.length - 1] += (zh ? '' : ' ') + x;
      else merged.push(x);
    });
    return merged;
  }
  function plen(t, zh) { return Math.max(1, zh ? t.replace(/[\s\p{P}]/gu, '').length : t.replace(/\s+/g, ' ').length); }
  function mainBounds(block) {
    var zh = !EN, re = zh ? ZH_END : EN_END, w = document.createTreeWalker(block, NodeFilter.SHOW_TEXT, null), node, out = [], acc = '';
    while ((node = w.nextNode())) {
      var pe = node.parentElement;
      if (pe && pe.closest('.cps,.cpar,button,.flag,.mknote,svg')) continue;
      var tx = node.nodeValue, m, pos = 0, unit = pe && pe.closest('[data-k]');
      if (unit && !block.contains(unit)) unit = null;
      re.lastIndex = 0;
      while ((m = re.exec(tx))) {
        var end = m.index + m[0].length;
        acc += tx.slice(pos, end); pos = end;
        out.push({ node: node, off: end, unit: unit, text: acc }); acc = '';
      }
      acc += tx.slice(pos);
    }
    if (acc.replace(/\s/g, '')) out.push({ node: null, off: 0, unit: null, text: acc, tail: true });
    /* 同一個畫線單位裡的多個句尾，併成一個（插在單位後面） */
    var res = [];
    out.forEach(function (b) {
      var last = res[res.length - 1];
      if (last && b.unit && last.unit === b.unit) { last.text += b.text; return; }
      if (b.tail && last && !last.unit && !last.node) { last.text += b.text; return; }
      res.push(b);
    });
    return res;
  }
  function align(ma, al, zh) {
    var M = ma.map(function (t) { return plen(t, !EN); }), A2 = al.map(function (t) { return plen(t, EN); });
    var sm = M.reduce(function (a, b) { return a + b; }, 0), sa = A2.reduce(function (a, b) { return a + b; }, 0), r = sa / sm;
    var m = M.length, n = A2.length, INF = 1e9, C = [], B = [], i, j;
    for (i = 0; i <= m; i++) { C.push(new Float64Array(n + 1).fill(INF)); B.push(new Array(n + 1)); }
    C[0][0] = 0;
    var moves = [[1, 1, 0], [1, 2, .6], [2, 1, .6], [1, 3, 1.4], [3, 1, 1.4], [2, 2, 1], [1, 0, 3], [0, 1, 3]];
    for (i = 0; i <= m; i++) for (j = 0; j <= n; j++) {
      if (C[i][j] >= INF) continue;
      moves.forEach(function (mv) {
        var a = i + mv[0], b = j + mv[1]; if (a > m || b > n) return;
        var x = 0, y = 0, k; for (k = i; k < a; k++) x += M[k]; for (k = j; k < b; k++) y += A2[k];
        var c = C[i][j] + mv[2] + Math.abs(y - r * x) / Math.sqrt(r * x + y + 1);
        if (c < C[a][b]) { C[a][b] = c; B[a][b] = [i, j]; }
      });
    }
    var groups = []; i = m; j = n;
    while (i > 0 || j > 0) { var p = B[i][j]; if (!p) break; groups.unshift([p[0], i, p[1], j]); i = p[0]; j = p[1]; }
    return groups;                                      // [主起, 主迄, 譯起, 譯迄]
  }
  function mkSpan(t) { var d = document.createElement('span'); d.className = 'cps'; d.setAttribute('lang', ALT_LANG); d.textContent = t; return d; }
  function sentPair(me, altText) {
    var bounds = mainBounds(me), alts = splitSents(altText, EN);
    if (!bounds.length || !alts.length) return 0;
    var groups = bounds.length === 1 ? [[0, 1, 0, alts.length]] : align(bounds.map(function (b) { return b.text; }), alts);
    var ins = [];                                       // [主要句尾索引, 文字]
    groups.forEach(function (g) {
      var t = alts.slice(g[2], g[3]).join(EN ? '' : ' ');
      if (!t) return;
      var at = g[1] > g[0] ? g[1] - 1 : Math.max(0, g[0] - 1);
      if (ins.length && ins[ins.length - 1][0] === at) ins[ins.length - 1][1] += (EN ? '' : ' ') + t; else ins.push([at, t]);
    });
    for (var k = ins.length - 1; k >= 0; k--) {         // 從後面插回來，前面的位移不受影響
      var b = bounds[ins[k][0]], sp = mkSpan(ins[k][1]);
      if (b.unit) b.unit.parentNode.insertBefore(sp, b.unit.nextSibling);
      else if (b.node) { var rest = b.node.splitText(b.off); rest.parentNode.insertBefore(sp, rest); }
      else me.appendChild(sp);
    }
    return ins.length;
  }
  function css() {
    if (document.getElementById('cparCss')) return;
    var st = document.createElement('style'); st.id = 'cparCss';
    st.textContent = '.cpar{margin:4px 0 12px;padding:4px 0 4px 10px;border-left:3px solid color-mix(in srgb,var(--pine) 45%,transparent);font-size:.9em;line-height:1.7;color:color-mix(in srgb,currentColor 64%,transparent);font-weight:400;letter-spacing:0;text-transform:none}'
      + 'h1+.cpar,h2+.cpar,h3+.cpar,h4+.cpar{font-weight:600}li>.cpar,td>.cpar{margin:4px 0 2px}'
      + '.cps{display:block;margin:2px 0 8px;padding:1px 0 1px 9px;border-left:3px solid color-mix(in srgb,var(--pine) 40%,transparent);font-size:.88em;line-height:1.65;color:color-mix(in srgb,currentColor 62%,transparent);font-weight:400;font-style:normal;letter-spacing:0;text-transform:none;text-align:left}'
      + 'h1 .cps,h2 .cps,h3 .cps,h4 .cps{font-weight:600}'
      + '.cparbtn{border:1px solid var(--line);background:var(--card);color:inherit;border-radius:999px;padding:6px 14px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;margin-left:6px}'
      + '.cparbtn.on{border-color:var(--pine);color:var(--pine)}.cparbar{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:6px;margin:-4px 0 8px}.cpar-st{font-size:12.5px;opacity:.75;margin:0 0 8px}';
    document.head.appendChild(st);
  }
  function btnHtml() { var on = isOn(); return '<button class="cparbtn' + (on ? ' on' : '') + '" onclick="CPAR321.toggle()">🌐 ' + T('btn') + '：' + (on ? T('on') : T('off')) + '</button>'; }
  function addBtn(h) {
    if (h.indexOf('<div class="parbar">') >= 0) return h.replace('<div class="parbar">', '<div class="parbar">' + btnHtml());
    var i = h.indexOf('</div>');                        // 放在第一個區塊（章標題）之後
    return i >= 0 ? h.slice(0, i + 6) + '<div class="cparbar">' + btnHtml() + '</div>' + h.slice(i + 6) : '<div class="cparbar">' + btnHtml() + '</div>' + h;
  }
  function status(root, msg) {
    if (!root) return; var s = root.querySelector('.cpar-st');
    if (!msg) { if (s) s.parentNode.removeChild(s); return; }
    if (!s) { s = document.createElement('div'); s.className = 'cpar-st'; var bar = root.querySelector('.cparbar,.parbar'); if (bar) bar.parentNode.insertBefore(s, bar.nextSibling); else root.insertBefore(s, root.firstChild); }
    s.textContent = msg;
  }
  /* ── 畫面掛鉤 ── */
  function wrapView(name, test) {
    var orig = window[name]; if (typeof orig !== 'function') return;
    window[name] = function () {
      var args = arguments, h = orig.apply(this, args);
      if (typeof h !== 'string' || !test()) return h;
      css(); h = addBtn(h);
      if (isOn()) {
        var key = R.tab + '|' + R.ch + '|' + R.sub;
        setTimeout(function () {
          var root = document.getElementById('view'); if (!root || R.tab + '|' + R.ch + '|' + R.sub !== key) return;
          if (!ALT) { status(root, failed ? T('fail') : T('loading')); load(function (ok) { if (R.tab + '|' + R.ch + '|' + R.sub !== key) return; if (ok) render(); else status(root, T('fail')); }); return; }
          pairInto(root, altRun(orig, args));
        }, 0);
      }
      return h;
    };
  }
  wrapView('vCourse', function () { return R.tab === 'course' && !!R.ch; });
  wrapView('vText', function () { return R.tab === 'text' && !!R.ch && R.sub !== 'vpk'; });
  function wrapSheet(name) {
    var orig = window[name]; if (typeof orig !== 'function') return;
    window[name] = function () {
      var args = arguments, r = orig.apply(this, args);
      if (isOn()) {
        var go2 = function () { var sb = document.getElementById('sbody'); if (sb) { css(); pairInto(sb, altRun(orig, args)); } };
        if (ALT) setTimeout(go2, 0); else load(function (ok) { if (ok) go2(); });
      }
      return r;
    };
  }
  ['openV', 'openIssue'].forEach(wrapSheet);
  window.CPAR321 = {
    toggle: function () {
      var on = !isOn(); setOn(on); var y = window.scrollY;
      if (on && !ALT) load(function () { render(); window.scrollTo(0, y); });
      render(); window.scrollTo(0, y);
    },
    _pair: pairInto, _run: altRun, _load: load
  };
})();
